<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemon Blur - 사진 모자이크 & 개인정보 블러</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: { 950: '#09090b', 900: '#121215', 850: '#18181b', 800: '#27272a', 700: '#3f3f46' },
            lemon: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .btn-tap { transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-tap:hover { transform: translateY(-1.5px) scale(1.02); }
    .btn-tap:active { transform: scale(0.94); }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col justify-between antialiased selection:bg-lemon-500 selection:text-neutral-950">

  <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/75 dark:bg-neutral-950/75 border-b border-neutral-200/80 dark:border-neutral-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-2.5 group">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-lemon-600 to-amber-400 p-[1px] shadow-md group-hover:scale-105 transition-transform">
            <div class="w-full h-full bg-white dark:bg-neutral-900 rounded-[15px] flex items-center justify-center">
              <svg class="w-5 h-5 text-lemon-600 dark:text-lemon-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              </svg>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center space-x-1.5">
              <span class="font-black text-lg tracking-tight">Lemon Blur</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-lemon-100 dark:bg-lemon-950 text-lemon-700 dark:text-lemon-400 font-bold border border-lemon-300 dark:border-lemon-800">모자이크</span>
            </div>
            <span class="text-[10px] text-neutral-500 -mt-0.5">원터치 사진 모자이크 & 개인정보 블러</span>
          </div>
        </a>
      </div>
      <button onclick="downloadBlurred()" class="px-3.5 py-1.5 rounded-xl bg-lemon-500 hover:bg-lemon-400 text-neutral-950 font-black text-xs btn-tap">
        결과 사진 저장
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full space-y-6">
    <div id="dropzoneBlur" onclick="document.getElementById('inputBlurFile').click()" class="p-8 rounded-3xl border-2 border-dashed border-neutral-300 dark:border-neutral-800 hover:border-lemon-500 text-center cursor-pointer bg-white dark:bg-neutral-900 space-y-2">
      <input type="file" id="inputBlurFile" accept="image/*" class="hidden" onchange="loadBlurImage(event)">
      <div class="text-sm font-bold text-neutral-800 dark:text-neutral-200">사진을 클릭하거나 드래그하여 업로드</div>
      <div class="text-xs text-neutral-500">얼굴, 번호판, 계좌번호 등 민감 정보를 손쉽게 블러 처리하세요.</div>
    </div>
    <div id="canvasContainer" class="hidden flex justify-center">
      <canvas id="blurCanvas" class="max-w-full rounded-2xl border border-neutral-800 shadow-xl cursor-crosshair"></canvas>
    </div>
  </main>

  <footer class="border-t border-neutral-200/80 dark:border-neutral-800/80 py-8 bg-white/50 dark:bg-neutral-950/50 backdrop-blur-md mt-12 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-neutral-500 dark:text-neutral-400">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-neutral-800 dark:text-neutral-200">Lemon Blur</span>
        <span>·</span>
        <span>Lemon soft 22대 독립 웹 프로덕트</span>
      </div>
      <div><span>2026 Lemon soft. All rights reserved.</span></div>
    </div>
  </footer>

  <script>
    let img = new Image();
    function loadBlurImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        img.onload = () => {
          const canvas = document.getElementById('blurCanvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          document.getElementById('dropzoneBlur').classList.add('hidden');
          document.getElementById('canvasContainer').classList.remove('hidden');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function downloadBlurred() {
      const canvas = document.getElementById('blurCanvas');
      const a = document.createElement('a');
      a.download = 'lemon-blurred-image.png';
      a.href = canvas.toDataURL();
      a.click();
    }
  </script>
</body>
</html>
