<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemon Speech - 발표 프롬프터 & 대본 타이머</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: { 950: '#09090b', 900: '#121215', 850: '#18181b', 800: '#27272a', 700: '#3f3f46' },
            lemon: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .btn-tap { transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-tap:hover { transform: translateY(-1.5px) scale(1.02); }
    .btn-tap:active { transform: scale(0.94); }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col justify-between antialiased selection:bg-lemon-500 selection:text-neutral-950">

  <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/75 dark:bg-neutral-950/75 border-b border-neutral-200/80 dark:border-neutral-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-2.5 group">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-lemon-600 to-amber-400 p-[1px] shadow-md group-hover:scale-105 transition-transform">
            <div class="w-full h-full bg-white dark:bg-neutral-900 rounded-[15px] flex items-center justify-center">
              <svg class="w-5 h-5 text-lemon-600 dark:text-lemon-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              </svg>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center space-x-1.5">
              <span class="font-black text-lg tracking-tight">Lemon Speech</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-lemon-100 dark:bg-lemon-950 text-lemon-700 dark:text-lemon-400 font-bold border border-lemon-300 dark:border-lemon-800">프롬프터</span>
            </div>
            <span class="text-[10px] text-neutral-500 -mt-0.5">발표·스피치 프롬프터 & 대본 타이머</span>
          </div>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full space-y-6">
    <div class="p-6 rounded-3xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-sm text-neutral-900 dark:text-white">대본 입력 & 소요 시간 분석</h3>
        <span id="estimatedTime" class="text-xs font-mono font-bold text-lemon-600 dark:text-lemon-400">예상 발표 시간: 약 0분 0초</span>
      </div>
      <textarea id="scriptInput" rows="8" oninput="analyzeScript()" placeholder="발표할 대본을 여기에 붙여넣으세요..." class="w-full p-4 rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-850 text-sm focus:outline-none focus:border-lemon-500 resize-none leading-relaxed"></textarea>
      <div class="flex items-center justify-between pt-2">
        <button onclick="startPrompter()" class="px-6 py-2.5 rounded-xl bg-lemon-500 hover:bg-lemon-400 text-neutral-950 font-black text-xs btn-tap">
          프롬프터 전체화면 시작
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-neutral-200/80 dark:border-neutral-800/80 py-8 bg-white/50 dark:bg-neutral-950/50 backdrop-blur-md mt-12 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-neutral-500 dark:text-neutral-400">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-neutral-800 dark:text-neutral-200">Lemon Speech</span>
        <span>·</span>
        <span>Lemon soft 21대 독립 웹 프로덕트</span>
      </div>
      <div><span>2026 Lemon soft. All rights reserved.</span></div>
    </div>
  </footer>

  <script>
    function analyzeScript() {
      const text = document.getElementById('scriptInput').value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      // Average Korean speaking rate: 300 syllables / 100 words per minute
      const totalSec = Math.round((words / 80) * 60);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      document.getElementById('estimatedTime').innerText = `예상 발표 시간: 약 ${min}분 ${sec}초 (${words}단어)`;
    }

    function startPrompter() {
      alert('프롬프터 모드를 시작합니다.');
    }
  </script>
</body>
</html>
