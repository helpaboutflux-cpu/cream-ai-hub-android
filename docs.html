    .prose-custom pre { background: #18181b; color: #f4f4f5; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin-bottom: 1rem; font-size: 0.85rem; }

    .dark .prose-custom code { background: #27272a; color: #e4e4e7; }
    .prose-custom pre code { background: transparent; padding: 0; }
    .prose-custom table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.85rem; }
    .prose-custom th, .prose-custom td { border: 1px solid #d4d4d8; padding: 0.5rem 0.75rem; text-align: left; }
    .dark .prose-custom th, .dark .prose-custom td { border-color: #3f3f46; }
    .prose-custom th { background: #f4f4f5; font-weight: 600; }
    .dark .prose-custom th { background: #18181b; }
  </style>
</head>

  <!-- Script Logic -->
  <script>
    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('cream_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeToggleText').textContent = '라이트 모드';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeToggleText').textContent = '다크 모드';
      }
      localStorage.setItem('cream_theme', theme);
    }

    // Default Sample Document
    const defaultDoc = `# FLUX Docs 시작하기

FLUX Docs는 회원가입 없이 마크다운으로 문서를 작성하고 1초 만에 전 세계에 공유하는 **무계정 웹 퍼블리셔**입니다.

## 주요 특징
- **0원 인프라**: 서버 저장소 비용 없이 브라우저 압축 기술로 즉시 공유 링크를 발급합니다.
- **실시간 반응형 뷰**: 작성하는 즉시 우측에서 독자 열람 화면을 검증할 수 있습니다.
- **자유로운 내보내기**: 마크다운 파일(.md), 단일 HTML 문서, PDF 인쇄를 모두 지원합니다.

### 코드 블록 지원
\`\`\`javascript
// FLUX soft Clean Architecture
function launchDocument() {
  console.log("Published in 1 second with 0 cost.");
}
\`\`\`

> 작성한 글은 브라우저에 안전하게 자동 저장되며, 상단의 [1초 웹 발행] 버튼을 누르면 즉시 고유 주소가 생성됩니다.`;

    function initEditor() {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#doc=')) {
        // Load published doc from compressed URL hash
        try {
          const compressed = hash.replace('#doc=', '');
          const decompressed = LZString.decompressFromEncodedURIComponent(compressed);
          if (decompressed) {
            const data = JSON.parse(decompressed);
            document.getElementById('docTitleInput').value = data.title || '발행된 문서';
            document.getElementById('markdownInput').value = data.body || '';
            renderMarkdown();
            // Switch to reader only if mobile
            if (window.innerWidth < 1024) {
              setMobileView('preview');
            }
            return;
          }
        } catch (e) {
          console.warn('Failed to parse published document hash:', e);
        }
      }

      // Load from LocalStorage or default
      const saved = localStorage.getItem('flux_docs_saved_doc');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          document.getElementById('docTitleInput').value = parsed.title || '';
          document.getElementById('markdownInput').value = parsed.body || '';
        } catch (e) {
          loadDefault();
        }
      } else {
        loadDefault();
      }
      renderMarkdown();
    }

    function loadDefault() {
      document.getElementById('docTitleInput').value = 'FLUX Docs 시작하기';
      document.getElementById('markdownInput').value = defaultDoc;
    }

    function handleMarkdownInput() {
      renderMarkdown();
      autoSave();
    }

    function renderMarkdown() {
      const title = document.getElementById('docTitleInput').value.trim() || '제목 없음';
      const body = document.getElementById('markdownInput').value;

      document.getElementById('previewTitle').textContent = title;
      document.getElementById('markdownRender').innerHTML = marked.parse(body);

      // Stats
      const chars = body.length;
      const words = body.trim() ? body.trim().split(/\s+/).length : 0;
      const minutes = Math.max(1, Math.ceil(words / 200));

      document.getElementById('charCount').textContent = chars + ' 글자';
      document.getElementById('wordCount').textContent = words + ' 단어';
      document.getElementById('readTime').textContent = '예상 ' + minutes + '분';
    }

    function insertMd(prefix, suffix) {
      const textarea = document.getElementById('markdownInput');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      const replacement = prefix + selected + suffix;
      textarea.value = text.substring(0, start) + replacement + text.substring(end);
      textarea.selectionStart = start + prefix.length;
      textarea.selectionEnd = start + prefix.length + selected.length;
      textarea.focus();
      handleMarkdownInput();
    }

    let saveTimer = null;
    function autoSave() {
      clearTimeout(saveTimer);
      document.getElementById('autoSaveStatus').textContent = '저장 중...';
      saveTimer = setTimeout(() => {
        const title = document.getElementById('docTitleInput').value;
        const body = document.getElementById('markdownInput').value;
        localStorage.setItem('flux_docs_saved_doc', JSON.stringify({ title, body, updated: Date.now() }));
        document.getElementById('autoSaveStatus').textContent = '자동 저장됨';
      }, 500);
    }

    // View Toggle on Mobile
    let currentMobileView = 'editor';
    function toggleViewMode() {
      if (currentMobileView === 'editor') {
        setMobileView('preview');
      } else {
        setMobileView('editor');
      }
    }

    function setMobileView(view) {
      currentMobileView = view;
      const editor = document.getElementById('editorPane');
      const preview = document.getElementById('previewPane');
      const toggleText = document.getElementById('viewToggleText');

      if (view === 'preview') {
        editor.classList.add('hidden', 'lg:flex');
        preview.classList.remove('hidden');
        preview.classList.add('flex');
        toggleText.textContent = '편집기 보기';
      } else {
        editor.classList.remove('hidden');
        preview.classList.add('hidden', 'lg:flex');
        toggleText.textContent = '미리보기';
      }
    }

    // Publish Document
    function publishDocument() {
      const title = document.getElementById('docTitleInput').value.trim() || '제목 없음';
      const body = document.getElementById('markdownInput').value;
      if (!body.trim()) {
        alert('발행할 문서 내용을 작성해 주세요.');
        return;
      }

      const docObj = { title, body, created: Date.now() };
      const jsonStr = JSON.stringify(docObj);
      const compressed = LZString.compressToEncodedURIComponent(jsonStr);

      const liveUrl = window.location.origin + window.location.pathname + '#doc=' + compressed;
      document.getElementById('publishedLinkInput').value = liveUrl;

      // QR Code
      const qrBox = document.getElementById('docQrCode');
      qrBox.innerHTML = '';
      new QRCode(qrBox, {
        text: liveUrl,
        width: 130,
        height: 130,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById('publishModal').classList.remove('hidden');
    }

    function closePublishModal() {
      document.getElementById('publishModal').classList.add('hidden');
    }

    function copyPublishedLink() {
      const input = document.getElementById('publishedLinkInput');
      navigator.clipboard.writeText(input.value).then(() => {
        alert('발행 문서 링크가 클립보드에 복사되었습니다.');
      });
    }

    function sendToWebLauncher() {
      const title = document.getElementById('docTitleInput').value.trim() || 'FLUX Document';
      const bodyHtml = document.getElementById('markdownRender').innerHTML;
      const fullDoc = `\x3C!DOCTYPE html>
\x3Chtml lang="ko">
\x3Chead>
  \x3Cmeta charset="UTF-8">
  \x3Cmeta name="viewport" content="width=device-width, initial-scale=1.0">
  \x3Ctitle>${title}\x3C/title>
  \x3Cscript src="https://cdn.tailwindcss.com">\x3C/script>
\x3C/head>
\x3Cbody class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen p-6 sm:p-12 max-w-3xl mx-auto space-y-6 leading-relaxed">
  \x3Ch1 class="text-3xl font-extrabold pb-4 border-b border-neutral-200 dark:border-neutral-800">${title}\x3C/h1>
  ${bodyHtml}
\x3C/body>
\x3C/html>`;

      // Store in session and jump to Web Launcher
      sessionStorage.setItem('flux_launcher_prefill_code', fullDoc);
      sessionStorage.setItem('flux_launcher_prefill_name', title);
      window.location.href = 'index.html?tab=launcher';
    }

    function sendToWebToLink() {
      const link = document.getElementById('publishedLinkInput').value;
      window.location.href = 'index.html?tab=link&url=' + encodeURIComponent(link);
    }

    function exportMarkdown() {
      const title = document.getElementById('docTitleInput').value.trim() || 'flux-doc';
      const body = document.getElementById('markdownInput').value;
      const blob = new Blob([body], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = title.replace(/[^a-zA-Z0-9가-힣_-]/g, '_') + '.md';
      a.click();
    }

    function exportCleanHtml() {
      const title = document.getElementById('docTitleInput').value.trim() || 'FLUX Document';
      const bodyHtml = document.getElementById('markdownRender').innerHTML;
      const fullHtml = `\x3C!DOCTYPE html>
\x3Chtml lang="ko">
\x3Chead>
  \x3Cmeta charset="UTF-8">
  \x3Cmeta name="viewport" content="width=device-width, initial-scale=1.0">
  \x3Ctitle>${title}\x3C/title>
  \x3Cscript src="https://cdn.tailwindcss.com">\x3C/script>
\x3C/head>
\x3Cbody class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen p-6 sm:p-12 max-w-3xl mx-auto space-y-6 leading-relaxed">
  \x3Ch1 class="text-3xl font-extrabold pb-4 border-b border-neutral-200 dark:border-neutral-800">${title}\x3C/h1>
  ${bodyHtml}
\x3C/body>
\x3C/html>`;

      const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = title.replace(/[^a-zA-Z0-9가-힣_-]/g, '_') + '.html';
      a.click();
    }

    function printDoc() {
      window.print();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initEditor();
      document.getElementById('docTitleInput').addEventListener('input', () => {
        document.getElementById('previewTitle').textContent = document.getElementById('docTitleInput').value.trim() || '제목 없음';
        autoSave();
      });
    });
  </script>
</body>
</html>
