<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>dev check</title>
<style>
  body { margin: 0; background: #222; font: 12px/1.4 system-ui; color: #eee; }
  .row { display: flex; gap: 12px; padding: 8px; align-items: flex-start; }
  .cell { background: #fff; }
  iframe { display: block; border: 0; }
  .lab { padding: 4px 6px; background: #111; font-weight: 700; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get('v') || 'stats';
  var only = q.get('only') || '';
  var h = q.get('h') || '1400';
  var frames = [{ id: 'm', w: 390, t: '390' }, { id: 'd', w: 1280, t: '1280' }];
  frames.forEach(function (f) {
    if (only && only !== f.id) return;
    var cell = document.createElement('div'); cell.className = 'cell';
    var lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = f.t + ' x ' + h;
    var fr = document.createElement('iframe'); fr.id = f.id; fr.width = f.w; fr.height = h;
    var cb = q.get('cb') || String(Date.now());
    fr.src = 'builder.html?cb=' + cb + '#' + v;
    cell.appendChild(lab); cell.appendChild(fr); document.getElementById('row').appendChild(cell);
  });
</script>
</body>
</html>
