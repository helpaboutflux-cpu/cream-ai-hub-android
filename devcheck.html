<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>dev check</title>
<style>
  body { margin: 0; background: #222; font: 12px/1.4 system-ui; color: #eee; }
  .row { display: flex; gap: 12px; padding: 10px; align-items: flex-start; }
  .cell { background: #fff; }
  iframe { display: block; border: 0; }
  .lab { padding: 4px 6px; background: #111; font-weight: 700; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="lab">390 x 900</div><iframe id="m" width="390" height="900"></iframe></div>
  <div class="cell"><div class="lab">1280 x 900</div><iframe id="d" width="1280" height="900"></iframe></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get('v') || 'stats';
  document.querySelectorAll('iframe').forEach(function (f) { f.src = 'builder.html#' + v; });
</script>
</body>
</html>
