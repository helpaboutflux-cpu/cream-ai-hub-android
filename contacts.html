  function saveQRPng(svg, name) {
    try {
      var blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        var s = 640, cv = doc.createElement('canvas');
        cv.width = s; cv.height = s;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, s, s);
        ctx.drawImage(img, 0, 0, s, s);
        URL.revokeObjectURL(url);
        cv.toBlob(function (b) {
          var u = URL.createObjectURL(b);
          var a = doc.createElement('a');
          a.href = u; a.download = name;
          doc.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1200);
          toast('QR 이미지를 저장했어요');
        }, 'image/png');
      };
      img.onerror = function () { URL.revokeObjectURL(url); toast('QR 이미지를 만들지 못했어요', 'err'); };
      img.src = url;
    } catch (e) { toast('QR 이미지를 만들지 못했어요', 'err'); }
  }

      '</div></div>' +
      '<div class="field"><label>애니메이션 (모든 Lemon soft 서비스 공통)</label><div class="seg" style="width:100%">' +
        '<button class="seg-btn' + (anim === 'full' ? ' on' : '') + '" data-anim-set="full" style="width:auto;flex:1;font-size:11.5px">전체</button>' +
        '<button class="seg-btn' + (anim === 'reduced' ? ' on' : '') + '" data-anim-set="reduced" style="width:auto;flex:1;font-size:11.5px">줄이기</button>' +
        '<button class="seg-btn' + (anim === 'off' ? ' on' : '') + '" data-anim-set="off" style="width:auto;flex:1;font-size:11.5px">끄기</button>' +
      '</div></div>' +
      '<div class="field"><label>명함</label><div class="rowline">' +
        '<button class="pill" id="setMe">' + icon('i-qr', 'i-sm') + '<span>내 명함 편집·QR</span></button>' +
      '</div></div>' +
      '<div class="field"><label>예시 데이터</label><div class="rowline">' +
        '<button class="pill" id="setSample">' + icon('i-spark', 'i-sm') + '<span>예시 연락처 넣기</span></button>' +
        '<button class="pill" id="setSampleDel">' + icon('i-trash', 'i-sm') + '<span>예시 정리</span></button>' +
      '</div></div>' +
      '<div class="field"><label>저장</label>' +
        '<p class="hint">연락처 ' + liveContacts().length + '명 · 휴지통 ' + trashContacts().length + '명 · 라벨 ' + S.groups.length + '개<br>' +
        '모든 내용은 이 브라우저의 IndexedDB(flux_contacts_v1)에만 저장되고 서버로 보내지 않습니다.</p>' +
        '<div class="rowline" style="margin-top:8px">' +
          '<button class="pill" id="setExport">' + icon('i-download', 'i-sm') + '<span>JSON 백업</span></button>' +
          '<button class="pill" id="setImport">' + icon('i-upload', 'i-sm') + '<span>가져오기</span></button>' +
        '</div></div>' +
      '<div class="field"><label>위험 구역</label><div class="rowline">' +
        '<button class="pill danger" id="setWipe">' + icon('i-trash', 'i-sm') + '<span>모든 연락처 삭제</span></button>' +
      '</div><p class="hint">삭제 전에 JSON 백업을 받아 두면 언제든 되돌릴 수 있습니다.</p></div>';
    openModal({
      title: 'Flux Contacts 설정',
      size: 'narrow',
      body: body,
      foot: '<button class="pill ghost" data-close="modal"><span>닫기</span></button>',
      onMount: function (layer) {
        $('#setLight', layer).addEventListener('click', function () { setTheme('light'); closeModal(); openSettings(); });
        $('#setDark', layer).addEventListener('click', function () { setTheme('dark'); closeModal(); openSettings(); });
        $$('[data-anim-set]', layer).forEach(function (b) {
          b.addEventListener('click', function () {
            var m = b.getAttribute('data-anim-set');
            try { if (window.Lemon && Lemon.setAnimMode) Lemon.setAnimMode(m); else localStorage.setItem('lemon_anim_mode', m); } catch (e) { }
            doc.documentElement.setAttribute('data-anim', m);
            $$('[data-anim-set]', layer).forEach(function (x) { x.classList.toggle('on', x === b); });
            toast(m === 'off' ? '애니메이션을 껐어요' : m === 'reduced' ? '애니메이션을 줄였어요' : '애니메이션을 켰어요', 'info');
          });
        });
        $('#setMe', layer).addEventListener('click', function () { closeModal(); openShare(null, 'me'); });
        $('#setSample', layer).addEventListener('click', function () { closeModal(); addSample(); });
        $('#setSampleDel', layer).addEventListener('click', function () { removeSample(); });
        $('#setExport', layer).addEventListener('click', function () { closeModal(); openExport(); });
        $('#setImport', layer).addEventListener('click', function () { closeModal(); openImport('vcf'); });
        $('#setWipe', layer).addEventListener('click', function () {
          confirmModal('모든 연락처 삭제', '이 브라우저의 연락처 <b>' + S.contacts.length + '개</b>를 모두 지웁니다. 되돌릴 수 없습니다.', '모두 삭제', function () {
            var ids = S.contacts.map(function (c) { return c.id; });
            S.contacts = [];
            S.settings.sampleIds = [];
            S.selId = null;
            idbClear('contacts').catch(function () { });
            saveMeta();
            snapshot();
            closeAllModals();
            S.view = 'all';
            renderNav(); renderList(); renderDetail();
            toast(ids.length + '개 연락처를 지웠어요');
          }, { danger: true });
        });
      }
    });
  }
  function setTheme(mode) {
    try { localStorage.setItem('cream_theme', mode); } catch (e) { }
    doc.documentElement.classList.toggle('dark', mode === 'dark');
    var icon = mode === 'dark' ? 'i-sun' : 'i-moon';
    var b = $('#themeBtn');
    if (b) b.innerHTML = '<svg class="i"><use href="#' + icon + '"></use></svg>';
  }

  /* ============================================================
     이벤트
     ============================================================ */
  function toggleStar(id) {
    var c = getContact(id);
    if (!c) return;
    c.starred = !c.starred;
    c.updatedAt = Date.now();
    saveContact(c, { silent: true });
    renderNav(); renderList();
    if (S.selId === id) renderDetail();
    var btn = doc.querySelector('.row [data-act="star"][data-id="' + id + '"], .gcard [data-act="star"][data-id="' + id + '"]');
    if (btn) {
      btn.classList.remove('bounce');
      void btn.offsetWidth;
      btn.classList.add('bounce');
    }
    toast(c.starred ? '즐겨찾기에 고정했어요' : '즐겨찾기에서 뺐어요', 'info');
  }
  function cycleSort() {
    S.sort = S.sort === 'name' ? 'recent' : S.sort === 'recent' ? 'added' : 'name';
    savePrefs();
    applySortUI();
    renderList();
    toast(S.sort === 'name' ? '이름순으로 정렬' : S.sort === 'recent' ? '최근 수정순으로 정렬' : '최근 추가순으로 정렬', 'info');
  }
  function applySortUI() {
    var t = S.sort === 'name' ? '이름순 정렬' : S.sort === 'recent' ? '최근 수정순 정렬' : '최근 추가순 정렬';
    $('#sortBtn').title = t;
    $('#sortBtn').setAttribute('aria-label', t);
    $('#sortSel').value = S.sort;
  }
  function applyLayoutUI() {
    $$('.seg-btn').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-layout') === S.layout); });
  }
  var quietTimer = null;
  function setQuery(v) {
    S.query = v;
    $('#q').value = v;
    $('#qTop').value = v;
    $('#qClear').hidden = !v;
    $('#qTopClear').hidden = !v;
    S.quiet = true;
    clearTimeout(quietTimer);
    quietTimer = setTimeout(function () { S.quiet = false; }, 700);
    renderList();
  }
  function syncTopH() {
    var top = $('.top');
    if (!top) return;
    doc.documentElement.style.setProperty('--top-h', top.offsetHeight + 'px');
  }
  function bindStatic() {
    $('#newBtn').addEventListener('click', function () { toggleRail(false); openEditor(null); });
    $('#topNewBtn').addEventListener('click', function () { openEditor(null); });
    $('#menuBtn').addEventListener('click', function () { toggleRail(true); });
    $('#myCardBtn').addEventListener('click', function () { openShare(null, 'me'); });
    $('#addGroupBtn').addEventListener('click', function () { openGroupEditor(null); });
    $('#importBtn').addEventListener('click', function () { openImport('vcf'); });
    $('#exportBtn').addEventListener('click', function () { openExport(); });
    $('#sampleBtn').addEventListener('click', function () { addSample(); });
    $('#moreBtn').addEventListener('click', openSettings);
    $('#sortBtn').addEventListener('click', cycleSort);
    $('#sortSel').addEventListener('change', function () { S.sort = this.value; savePrefs(); renderList(); });

    $$('.seg-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        S.layout = b.getAttribute('data-layout');
        savePrefs();
        applyLayoutUI();
        renderList();
      });
    });

    ['#q', '#qTop'].forEach(function (sel) {
      var el = $(sel);
      el.addEventListener('input', function () { setQuery(el.value); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { setQuery(''); el.blur(); }
        if (e.key === 'Enter') {
          var first = $('#listInner .row, #listInner .gcard');
          if (first) { selectContact(first.getAttribute('data-id')); if (window.innerWidth <= 1180) toggleRail(false); }
        }
      });
    });
    ['#qClear', '#qTopClear'].forEach(function (sel) {
      $(sel).addEventListener('click', function () { setQuery(''); $('#q').focus(); });
    });

    ['#idx', '#idxH'].forEach(function (sel) {
      $(sel).addEventListener('click', function (e) {
        var b = e.target.closest('button[data-jump]');
        if (!b) return;
        var k = b.getAttribute('data-jump');
        var sec = doc.getElementById('sec-' + (k === '#' ? 'hash' : k));
        if (!sec) return;
        sec.scrollIntoView({ block: 'start', behavior: S.quiet ? 'auto' : 'smooth' });
        sec.classList.remove('flash');
        void sec.offsetWidth;
        sec.classList.add('flash');
      });
    });

    $('#nav').addEventListener('click', function (e) {
      var b = e.target.closest('.nav-item');
      if (!b) return;
      S.view = b.getAttribute('data-view');
      S.groupId = null;
      S.mergeCtx = null;
      toggleRail(false);
      renderNav(); renderList(); renderDetail();
      $('#listScroll').scrollTop = 0;
    });
    $('#groupList').addEventListener('click', function (e) {
      var ed = e.target.closest('[data-gedit]');
      if (ed) { e.stopPropagation(); openGroupEditor(ed.getAttribute('data-gedit')); return; }
      var b = e.target.closest('.group-item');
      if (!b) return;
      S.view = 'group';
      S.groupId = b.getAttribute('data-gid');
      toggleRail(false);
      renderNav(); renderList(); renderDetail();
      $('#listScroll').scrollTop = 0;
    });

    $('#scrim').addEventListener('click', function () {
      if (layerStack.length) { closeModal(); return; }
      if ($('#detail').classList.contains('open')) { deselect(); return; }
      toggleRail(false);
    });

    $('#listInner').addEventListener('click', function (e) {
      var empty = e.target.closest('[data-empty]');
      if (empty) {
        var k = empty.getAttribute('data-empty');
        if (k === 'new') openEditor(null);
        else if (k === 'sample') addSample();
        else if (k === 'import') openImport('vcf');
        return;
      }
      var act = e.target.closest('[data-act]');
      if (act) {
        var a = act.getAttribute('data-act');
        var id = act.getAttribute('data-id');
        if (a === 'star') { toggleStar(id); return; }
        if (a === 'call') { var cc = getContact(id); if (cc) location.href = 'tel:' + (normPhone(primaryPhone(cc)) || primaryPhone(cc)); return; }
        if (a === 'peek') { selectContact(id); return; }
        if (a === 'merge-dup') { openMerge(act.getAttribute('data-cid')); return; }
        if (a === 'ignore-dup') { ignoreCluster(act.getAttribute('data-cid')); return; }
      }
      var row = e.target.closest('.row, .gcard');
      if (row) selectContact(row.getAttribute('data-id'));
    });
    $('#listInner').addEventListener('keydown', function (e) {
      var row = e.target.closest('.row, .gcard');
      if (row && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        selectContact(row.getAttribute('data-id'));
      }
    });

    $('#detail').addEventListener('click', function (e) {
      var closeBtn = e.target.closest('[data-close="detail"]');
      if (closeBtn) { deselect(); return; }
      var cop = e.target.closest('[data-copy]');
      if (cop) { e.preventDefault(); e.stopPropagation(); copyText(cop.getAttribute('data-copy')); return; }
      var act = e.target.closest('[data-act]');
      if (act) {
        var a = act.getAttribute('data-act');
        var id = act.getAttribute('data-id');
        if (a === 'star-detail') { toggleStar(id); return; }
        if (a === 'edit') openEditor(id);
        else if (a === 'trash') moveToTrash(id);
        else if (a === 'restore') restoreContact(id);
        else if (a === 'purge') purgeContact(id);
        else if (a === 'vcf') { var c = getContact(id); if (c) exportVCards([c]); }
        else if (a === 'share') openShare(id);
      }
    });

    doc.addEventListener('click', function (e) {
      var layerBg = e.target.classList && e.target.classList.contains('m-layer') ? e.target : null;
      if (layerBg) {
        var top = layerStack[layerStack.length - 1];
        if (top && top.el === layerBg && top.opts.dismissible !== false) closeModal();
        return;
      }
      var cl = e.target.closest('[data-close="modal"]');
      if (cl) { e.preventDefault(); closeModal(); }
    });

    doc.addEventListener('keydown', function (e) {
      var meta = e.ctrlKey || e.metaKey;
      if (meta && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        var target = window.innerWidth <= 720 ? $('#qTop') : $('#q');
        target.focus(); target.select();
        return;
      }
      if (e.key === 'Escape') {
        if (layerStack.length) { closeModal(); return; }
        if ($('#detail').classList.contains('open')) { deselect(); return; }
        if ($('#rail').classList.contains('open')) { toggleRail(false); return; }
      }
      if (meta && (e.key === 'n' || e.key === 'N')) {
        if (/input|textarea|select/i.test((e.target.tagName || ''))) return;
        e.preventDefault();
        openEditor(null);
      }
    });

    window.addEventListener('resize', function () {
      syncTopH();
      if (window.innerWidth > 1180) {
        $('#detail').classList.remove('open');
        $('#rail').classList.remove('open');
        updateScrim();
      }
    });

    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) {
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      if (e.target.closest && e.target.closest('.dropzone')) return;
      e.preventDefault();
      var f = e.dataTransfer.files[0];
      var lower = (f.name || '').toLowerCase();
      var tab = /\.vcf$/.test(lower) ? 'vcf' : /\.csv$/.test(lower) ? 'csv' : /\.json$/.test(lower) ? 'json' : null;
      if (!tab) { toast('vCard·CSV·JSON 파일만 가져올 수 있어요', 'err'); return; }
      readFileText(f).then(function (text) {
        IMP.tab = tab; IMP.text = text; IMP.fileName = f.name; IMP.items = []; IMP.json = null;
        parseImport(null);
        openImport(tab);
      });
    });
  }
  function copyText(v) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(function () { toast('복사했어요'); }, function () { fallbackCopy(v); });
    } else fallbackCopy(v);
  }
  function fallbackCopy(v) {
    var ta = doc.createElement('textarea');
    ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
    doc.body.appendChild(ta); ta.select();
    try { doc.execCommand('copy'); toast('복사했어요'); } catch (e) { toast('복사하지 못했어요', 'err'); }
    ta.remove();
  }

  /* ---------------- init ---------------- */
  function init() {
    try {
      var prefs = JSON.parse(localStorage.getItem('flux_contacts_prefs') || '{}');
      if (prefs.layout === 'grid' || prefs.layout === 'list') S.layout = prefs.layout;
      if (prefs.sort) S.sort = prefs.sort;
    } catch (e) { }
    applyLayoutUI();
    applySortUI();
    syncTopH();
    if (doc.documentElement.classList.contains('dark')) {
      $('#themeBtn').innerHTML = '<svg class="i"><use href="#i-sun"></use></svg>';
    }
    bindStatic();
    load().then(function () {
      S.ready = true;
      renderNav();
      renderList();
      renderDetail();
      handleHash();
      window.addEventListener('hashchange', handleHash);
      if (memoryOnly) toast('브라우저 저장소를 쓸 수 없어 이번 세션에만 보관합니다', 'err');
    });
  }

  if (window.Lemon && Lemon.ready) Lemon.ready(init); else init();
})();
</script>
</body>
</html>
