<style>
/* ============================================================
   Flux Contacts · smart address book
   brand: jade teal (#0f7b6c) — mist paper / deep forest dark
   ============================================================ */
:root {
  --brand: #0f7b6c;
  --brand-2: #43b7a4;
  --brand-deep: #0a5a4f;
  --brand-rgb: 15, 123, 108;

  --bg: #eef3f2;
  --bg-2: #e6eeec;
  --card: #ffffff;
  --card-2: #f7faf9;
  --rail: #f4f8f7;
  --ink: #15201e;
  --ink-2: #47534f;
  --ink-3: #87938f;
  --line: rgba(21, 32, 30, .12);
  --line-2: rgba(21, 32, 30, .06);
  --chip: rgba(21, 32, 30, .045);
  --glass: rgba(255, 255, 255, .84);
  --shadow: 0 20px 46px -34px rgba(10, 40, 36, .42);
  --shadow-hi: 0 30px 64px -28px rgba(10, 40, 36, .34);
  --star: #dfa10c;
  --ok: #2f7d5b;
  --warn: #b2601f;
  --danger: #bf4040;
  --r: 15px;
  --rail-w: 254px;
  --detail-w: 394px;
  --top-h: 58px;
  --ease: cubic-bezier(.22, .68, .26, 1);
  --spring: cubic-bezier(.2, 1.28, .36, 1);
}
html.dark {
  --brand: #5fd3be;
  --brand-2: #2f9c8b;
  --brand-deep: #a7ecdf;
  --brand-rgb: 95, 211, 190;

  --bg: #070b0a;
  --bg-2: #0b100f;
  --card: #111715;
  --card-2: #161d1b;
  --rail: #0c1211;
  --ink: #eef2f0;
  --ink-2: #a8b3af;
  --ink-3: #74817d;
  --line: rgba(255, 255, 255, .13);
  --line-2: rgba(255, 255, 255, .07);
  --chip: rgba(255, 255, 255, .065);
  --glass: rgba(9, 14, 13, .86);
  --shadow: 0 24px 60px -36px rgba(0, 0, 0, .95);
  --shadow-hi: 0 30px 68px -30px rgba(0, 0, 0, .9);
  --star: #f2c14e;
  --ok: #66b992;
  --warn: #e0a061;
  --danger: #f08080;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
b, strong { font-weight: 700; }
h1, h2, h3, h4, p { margin: 0; }
kbd {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--chip);
  color: var(--ink-3);
}
.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; }
.i-sm { width: 16px; height: 16px; stroke-width: 1.8; }
.i-xs { width: 13px; height: 13px; stroke-width: 1.9; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------------- shell ---------------- */
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.top {
  height: var(--top-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px 0 16px;
  background: linear-gradient(100deg, var(--card) 0%, color-mix(in srgb, var(--brand) 12%, var(--card)) 58%, color-mix(in srgb, var(--brand) 26%, var(--card)) 100%);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 30;
}
html.dark .top { background: linear-gradient(100deg, var(--card) 0%, color-mix(in srgb, var(--brand) 16%, #0b1110) 62%, color-mix(in srgb, var(--brand) 30%, #0b1110) 100%); }
.brand { display: flex; align-items: center; gap: 9px; flex: none; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, var(--brand), var(--brand-2) 140%);
  color: #fff;
  box-shadow: 0 8px 20px -12px rgba(var(--brand-rgb), .9);
  transition: transform .4s var(--spring);
}
.brand:hover .brand-mark { transform: rotate(-8deg) scale(1.05); }
.brand-mark .i { width: 19px; height: 19px; stroke-width: 1.9; color: #fff; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.1; }
.brand-txt b { font-size: 15px; letter-spacing: -.02em; }
.brand-txt i { font-style: normal; font-size: 9px; letter-spacing: .16em; color: var(--brand); font-weight: 700; }
.top-search {
  flex: 1 1 auto; max-width: 560px; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 10px 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--glass);
  backdrop-filter: blur(10px);
  transition: border-color .2s, box-shadow .3s, background .2s;
}
.top-search:focus-within { border-color: color-mix(in srgb, var(--brand) 55%, transparent); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .13); background: var(--card); }
.top-search .i { color: var(--ink-3); }
.top-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; }
.top-search input::placeholder { color: var(--ink-3); }
.top-search .clear { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
.top-search .clear:hover { background: var(--chip); color: var(--ink); }
.top-right { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 11px;
  display: inline-grid; place-items: center;
  color: var(--ink-2);
  transition: background .18s, color .18s, transform .3s var(--spring);
}
.icon-btn:hover { background: var(--chip); color: var(--ink); transform: translateY(-1px); }
.icon-btn:active { transform: scale(.94); }
.icon-btn.on { color: var(--brand); background: rgba(var(--brand-rgb), .12); }
.tb-hub {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 12px;
  border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); font-size: 12px; font-weight: 600; color: var(--ink-2);
  white-space: nowrap;
  transition: all .2s var(--ease);
}
.tb-hub:hover { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); transform: translateY(-1px); box-shadow: var(--shadow); }
.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--card);
  font-size: 12.5px; font-weight: 650; color: var(--ink-2);
  transition: all .2s var(--ease);
  white-space: nowrap;
}
.pill:hover { border-color: color-mix(in srgb, var(--brand) 45%, transparent); color: var(--brand); transform: translateY(-1px); }
.pill:active { transform: scale(.97); }
.pill.primary {
  background: linear-gradient(140deg, var(--brand), color-mix(in srgb, var(--brand-2) 75%, var(--brand)));
  border-color: transparent; color: #fff;
  box-shadow: 0 10px 24px -16px rgba(var(--brand-rgb), .95);
}
.pill.primary:hover { color: #fff; filter: brightness(1.06); }
.pill.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.pill.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); border-color: var(--danger); }
.pill.ghost { background: transparent; }
.pill[disabled] { opacity: .45; pointer-events: none; }

.body { flex: 1; display: flex; min-height: 0; position: relative; }

/* ---------------- left rail ---------------- */
.rail {
  width: var(--rail-w); flex: none;
  display: flex; flex-direction: column;
  background: var(--rail);
  border-right: 1px solid var(--line);
  padding: 12px 12px 10px;
  gap: 12px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
}
.new-btn {
  width: 100%; height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 13px;
  background: linear-gradient(140deg, var(--brand), color-mix(in srgb, var(--brand-2) 80%, var(--brand)));
  color: #fff; font-weight: 700; font-size: 13.5px;
  box-shadow: 0 14px 28px -20px rgba(var(--brand-rgb), 1);
  transition: transform .3s var(--spring), filter .2s;
  position: relative; overflow: hidden;
}
.new-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
.new-btn:active { transform: scale(.98); }
.new-btn .i { width: 18px; height: 18px; stroke-width: 2.1; }

.my-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; border-radius: 13px;
  border: 1px dashed color-mix(in srgb, var(--brand) 32%, var(--line));
  background: color-mix(in srgb, var(--brand) 6%, var(--card));
  text-align: left; width: 100%;
  transition: border-color .2s, transform .3s var(--spring), background .2s;
}
.my-card:hover { border-color: var(--brand); transform: translateY(-1px); background: color-mix(in srgb, var(--brand) 10%, var(--card)); }
.my-card .ava { width: 38px; height: 38px; font-size: 13px; }
.my-card-txt { min-width: 0; display: flex; flex-direction: column; }
.my-card-txt b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.my-card-txt span { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.my-card .qr-mini { margin-left: auto; color: var(--brand); flex: none; }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 36px; padding: 0 10px; border-radius: 10px;
  color: var(--ink-2); font-size: 13px; font-weight: 550;
  text-align: left; width: 100%;
  position: relative;
  transition: background .16s, color .16s, padding-left .25s var(--ease);
}
.nav-item .i { color: var(--ink-3); transition: color .18s, transform .3s var(--spring); }
.nav-item:hover { background: var(--chip); color: var(--ink); }
.nav-item:hover .i { transform: scale(1.1); }
.nav-item.on { background: rgba(var(--brand-rgb), .13); color: var(--brand-deep); font-weight: 700; }
html.dark .nav-item.on { color: var(--brand); }
.nav-item.on .i { color: var(--brand); }
.nav-item.on::before {
  content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px;
  border-radius: 3px; background: var(--brand);
}
.nav-item span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item b { font-size: 11px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-item b.warn { color: var(--warn); }

.rail-sec { border-top: 1px solid var(--line-2); padding-top: 10px; }
.rail-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 4px; }
.rail-head h3 { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.mini {
  width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
  color: var(--ink-3); transition: background .18s, color .18s, transform .3s var(--spring);
}
.mini:hover { background: var(--chip); color: var(--brand); transform: rotate(90deg); }
.group-list { display: flex; flex-direction: column; gap: 1px; }
.group-item {
  display: flex; align-items: center; gap: 9px; height: 32px;
  padding: 0 10px; border-radius: 9px; font-size: 12.5px; color: var(--ink-2);
  width: 100%; text-align: left;
  transition: background .16s, color .16s;
}
.group-item:hover { background: var(--chip); color: var(--ink); }
.group-item.on { background: rgba(var(--brand-rgb), .12); color: var(--brand-deep); font-weight: 650; }
html.dark .group-item.on { color: var(--brand); }
.group-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
.group-item > span:not(.group-dot):not(.g-edit) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-item .group-dot { flex: 0 0 9px; width: 9px; height: 9px; }
.group-item b { font-size: 10.5px; color: var(--ink-3); font-weight: 600; }
.group-item .g-edit { opacity: 0; color: var(--ink-3); display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; }
.group-item:hover .g-edit { opacity: 1; }
.group-item .g-edit:hover { background: var(--chip); color: var(--brand); }
.group-empty { font-size: 11.5px; color: var(--ink-3); padding: 4px 10px 8px; line-height: 1.5; }

.side-link {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 9px; border-radius: 9px;
  font-size: 12px; color: var(--ink-2); width: 100%; text-align: left;
  transition: background .16s, color .16s;
}
.side-link:hover { background: var(--chip); color: var(--brand); }
.side-link .i { color: var(--ink-3); }
.side-link:hover .i { color: var(--brand); }
.rail-foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 1px; }
.rail-foot .hub { margin-top: 4px; }

/* ---------------- list column ---------------- */
.listcol {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--card);
  position: relative;
  min-height: 0;
}
.list-head {
  flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
  padding: 14px 18px 10px;
}
.lh-title { min-width: 0; display: flex; align-items: baseline; gap: 9px; }
.lh-title h1 { font-size: 19px; letter-spacing: -.03em; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font-size: 11.5px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.lh-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.seg { display: flex; padding: 2px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2); }
.seg-btn { width: 30px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); transition: all .2s var(--ease); }
.seg-btn:hover { color: var(--ink); }
.seg-btn.on { background: var(--card); color: var(--brand); box-shadow: 0 3px 8px -4px rgba(0, 0, 0, .3); }
.seg-btn .i { width: 15px; height: 15px; }

.search-wrap {
  flex: none; display: flex; align-items: center; gap: 8px;
  margin: 0 18px 8px; height: 38px; padding: 0 10px 0 12px;
  border-radius: 11px; border: 1px solid var(--line); background: var(--card-2);
  transition: border-color .2s, box-shadow .25s, background .2s;
}
.search-wrap:focus-within { border-color: color-mix(in srgb, var(--brand) 55%, transparent); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .12); background: var(--card); }
.search-wrap .i { color: var(--ink-3); }
.search-wrap input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; }
.search-wrap input::placeholder { color: var(--ink-3); }
.search-wrap .clear { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
.search-wrap .clear:hover { background: var(--chip); color: var(--ink); }

.idx {
  position: absolute; right: 6px; top: 116px; bottom: 8px;
  width: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; z-index: 5;
  opacity: .92;
  pointer-events: none;
}
.idx button {
  font-size: 8.5px; line-height: 1; font-weight: 700; letter-spacing: 0;
  color: var(--ink-3); padding: 1.8px 0; width: 100%; border-radius: 4px;
  pointer-events: auto;
  transition: color .15s, background .15s, transform .2s var(--spring);
}
.idx button.has { color: var(--brand); }
.idx button:hover { background: rgba(var(--brand-rgb), .14); transform: scale(1.35); }
.idx button.dim { opacity: .34; pointer-events: none; }
.idx-h { display: none; }

.list-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 26px 26px 18px; scroll-behavior: smooth; scrollbar-width: thin; }
.list-scroll::-webkit-scrollbar, .rail::-webkit-scrollbar, .detail::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width: 9px; }
.list-scroll::-webkit-scrollbar-thumb, .rail::-webkit-scrollbar-thumb, .detail::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }

.sec-head {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 4px 6px;
  position: sticky; top: 0; z-index: 3;
  background: linear-gradient(var(--card) 68%, color-mix(in srgb, var(--card) 0%, transparent));
}
.sec-head b { font-size: 11.5px; color: var(--brand); font-weight: 800; letter-spacing: .02em; }
.sec-head i { flex: 1; height: 1px; background: var(--line-2); font-style: normal; }
.sec-head span { font-size: 10px; color: var(--ink-3); font-weight: 600; }

.rows { display: flex; flex-direction: column; gap: 2px; }
.row {
  display: grid; grid-template-columns: 42px minmax(0, 1fr) auto;
  align-items: center; gap: 11px;
  padding: 9px 10px; border-radius: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .16s, border-color .16s, transform .3s var(--spring), box-shadow .25s;
  animation: rowIn .46s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 26ms);
}
@keyframes rowIn { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
.row:hover { background: var(--card-2); border-color: var(--line-2); transform: translateX(2px); }
.row.sel { background: rgba(var(--brand-rgb), .1); border-color: color-mix(in srgb, var(--brand) 32%, transparent); }
.row.sel .row-name { color: var(--brand-deep); }
html.dark .row.sel .row-name { color: var(--brand); }
.ava {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; flex: none;
  font-size: 13.5px; font-weight: 750; letter-spacing: -.03em;
  color: #fff; background: var(--brand);
  overflow: hidden; position: relative;
  transition: transform .38s var(--spring), box-shadow .3s;
  user-select: none;
}
.row:hover .ava, .gcard:hover .ava { transform: scale(1.07) rotate(-3deg); box-shadow: 0 10px 20px -12px rgba(0, 0, 0, .5); }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava.lg { width: 84px; height: 84px; font-size: 27px; border-radius: 26px; }
.ava.sm { width: 28px; height: 28px; font-size: 10px; }
.row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-name { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 650; color: var(--ink); white-space: nowrap; overflow: hidden; }
.row-name .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-name .star-mini { color: var(--star); flex: none; }
.row-sub { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.row-sub .dot { width: 2px; height: 2px; border-radius: 50%; background: currentColor; flex: none; opacity: .6; }
.row-acts { display: flex; align-items: center; gap: 1px; opacity: 0; transition: opacity .2s; }
.row:hover .row-acts, .row.sel .row-acts { opacity: 1; }
.row-acts .icon-btn { width: 28px; height: 28px; border-radius: 8px; }
.row-acts .icon-btn .i { width: 15px; height: 15px; }
.row-acts .star-btn.on { color: var(--star); background: transparent; }
.row-acts .star-btn.on:hover { background: color-mix(in srgb, var(--star) 16%, transparent); }
.star-btn.on .i { fill: var(--star); stroke: var(--star); }
.star-btn.bounce .i { animation: starPop .62s var(--spring); }
@keyframes starPop {
  0% { transform: scale(1) rotate(0); }
  30% { transform: scale(1.55) rotate(14deg); }
  55% { transform: scale(.86) rotate(-8deg); }
  78% { transform: scale(1.14) rotate(3deg); }
  100% { transform: scale(1) rotate(0); }
}

/* grid layout */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; padding-top: 4px; }
.gcard {
  border: 1px solid var(--line); border-radius: 16px;
  background: var(--card); padding: 15px 13px 13px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  cursor: pointer; position: relative; overflow: hidden;
  transition: transform .35s var(--spring), box-shadow .3s, border-color .2s, background .2s;
  animation: cardIn .5s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 30ms);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.gcard::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 0%, rgba(var(--brand-rgb), .12), transparent 62%);
  opacity: 0; transition: opacity .3s;
}
.gcard:hover { transform: translateY(-4px); box-shadow: var(--shadow-hi); border-color: color-mix(in srgb, var(--brand) 34%, var(--line)); }
.gcard:hover::after { opacity: 1; }
.gcard.sel { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(var(--brand-rgb), .22); }
.gcard .ava { width: 58px; height: 58px; font-size: 19px; border-radius: 20px; }
.gcard b { font-size: 13px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard small { font-size: 11px; color: var(--ink-3); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 15px; }
.gcard .g-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-height: 18px; overflow: hidden; }
.gcard .g-star { position: absolute; top: 8px; right: 8px; color: var(--star); }

/* ---------------- detail panel ---------------- */
.detail {
  width: var(--detail-w); flex: none;
  border-left: 1px solid var(--line);
  background: var(--card-2);
  overflow-y: auto; overflow-x: hidden;
  position: relative;
  display: flex; flex-direction: column;
  min-height: 0;
}
.detail.open { animation: none; }
.d-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 30px 26px; text-align: center; color: var(--ink-3);
}
.d-empty .art {
  width: 74px; height: 74px; border-radius: 24px; display: grid; place-items: center;
  background: var(--chip); color: var(--brand); margin-bottom: 4px;
}
.d-empty .art .i { width: 34px; height: 34px; stroke-width: 1.3; }
.d-empty b { font-size: 14px; color: var(--ink); font-weight: 700; }
.d-empty p { font-size: 12px; line-height: 1.65; max-width: 260px; }
.d-wrap { padding: 18px 18px 26px; display: flex; flex-direction: column; gap: 16px; animation: panelIn .44s var(--spring) both; }
@keyframes panelIn { from { opacity: 0; transform: translateX(26px) scale(.985); } to { opacity: 1; transform: none; } }
.d-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 8px 0 2px; }
.d-hero .ava.lg { box-shadow: 0 18px 34px -22px rgba(0, 0, 0, .65); }
.d-hero h2 { font-size: 20px; letter-spacing: -.03em; font-weight: 780; word-break: keep-all; }
.d-hero p { font-size: 12.5px; color: var(--ink-2); word-break: keep-all; }
.d-hero .chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.d-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.dact {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 9px 2px 8px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card);
  font-size: 10.5px; color: var(--ink-2); font-weight: 600;
  transition: all .22s var(--ease);
}
.dact .i { width: 18px; height: 18px; color: var(--brand); transition: transform .3s var(--spring); }
.dact:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); transform: translateY(-2px); box-shadow: var(--shadow); color: var(--ink); }
.dact:hover .i { transform: scale(1.12) translateY(-1px); }
.dact.warn .i { color: var(--danger); }
.d-sec { display: flex; flex-direction: column; gap: 2px; }
.d-sec h3 { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; padding: 0 2px 4px; }
.d-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 9px; border-radius: 11px;
  transition: background .16s;
}
.d-row:hover { background: var(--card); }
.d-row .ic {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: rgba(var(--brand-rgb), .1); color: var(--brand);
}
.d-row .ic .i { width: 15px; height: 15px; }
.d-row .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.d-row .txt b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-row .txt span { font-size: 10.5px; color: var(--ink-3); }
.d-row .cop {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  color: var(--ink-3); opacity: 0; transition: opacity .18s, background .18s, color .18s;
}
.d-row:hover .cop { opacity: 1; }
.d-row .cop:hover { background: var(--chip); color: var(--brand); }
.d-note {
  font-size: 12.5px; color: var(--ink-2); line-height: 1.7; white-space: pre-wrap;
  background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 12px;
  word-break: break-word;
}
.d-meta { font-size: 10.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
.d-foot { display: flex; gap: 7px; }
.d-foot .pill { flex: 1; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: 7px;
  font-size: 10.5px; font-weight: 650;
  background: var(--chip); color: var(--ink-2);
  max-width: 100%;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.chip.brand { background: rgba(var(--brand-rgb), .13); color: var(--brand-deep); }
html.dark .chip.brand { color: var(--brand); }
.chip.star { background: color-mix(in srgb, var(--star) 18%, transparent); color: color-mix(in srgb, var(--star) 75%, var(--ink)); }

/* duplicate review */
.dup-list { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.dup-card {
  border: 1px solid var(--line); border-radius: 15px; background: var(--card);
  padding: 13px 14px; display: flex; flex-direction: column; gap: 10px;
  animation: rowIn .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 34ms);
  transition: border-color .2s, box-shadow .25s, transform .3s var(--spring);
}
.dup-card:hover { border-color: color-mix(in srgb, var(--brand) 30%, var(--line)); box-shadow: var(--shadow); transform: translateY(-1px); }
.dup-card .dc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dup-card .dc-head b { font-size: 13px; font-weight: 700; }
.dup-card .dc-why { display: flex; gap: 4px; flex-wrap: wrap; }
.dup-faces { display: flex; flex-direction: column; gap: 6px; }
.dup-face { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 10px; background: var(--card-2); }
.dup-face .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.dup-face .txt b { font-size: 12.5px; }
.dup-face .txt span { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dup-face .best { font-size: 9.5px; font-weight: 700; color: var(--brand); border: 1px solid color-mix(in srgb, var(--brand) 40%, transparent); border-radius: 6px; padding: 1px 5px; }
.dc-foot { display: flex; gap: 6px; justify-content: flex-end; }
.dc-foot .pill { height: 30px; font-size: 11.5px; }

/* merge panel */
.merge-wrap { padding: 16px 16px 26px; display: flex; flex-direction: column; gap: 13px; animation: panelIn .4s var(--spring) both; }
.merge-wrap h2 { font-size: 16.5px; font-weight: 760; letter-spacing: -.02em; }
.merge-wrap > p { font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.pick-group { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--card); }
.pick-group > header {
  font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 700;
  padding: 8px 11px 4px;
}
.pick-opt {
  display: flex; align-items: center; gap: 9px; padding: 8px 11px;
  border-top: 1px solid var(--line-2); cursor: pointer;
  transition: background .15s;
}
.pick-opt:hover { background: var(--card-2); }
.pick-opt input { appearance: none; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; position: relative; transition: border-color .2s; }
.pick-opt input:checked { border-color: var(--brand); border-width: 4.5px; }
.pick-opt input[type="checkbox"] { appearance: auto; width: 15px; height: 15px; accent-color: var(--brand); border: 0; border-radius: 3px; }
.pick-opt .pv { font-size: 12.5px; min-width: 0; word-break: break-all; }
.pick-opt .from { font-size: 10px; color: var(--ink-3); margin-left: auto; flex: none; }
.pick-opt.keep-all { border-top: 1px solid var(--line-2); background: color-mix(in srgb, var(--brand) 4%, transparent); }

/* ---------------- empty state ---------------- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 13px; padding: 46px 20px 30px;
  animation: fadeUp .6s var(--ease) both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.empty-art {
  width: 104px; height: 104px; border-radius: 32px;
  display: grid; place-items: center;
  background: linear-gradient(150deg, color-mix(in srgb, var(--brand) 16%, var(--card)), color-mix(in srgb, var(--brand-2) 22%, var(--card)));
  color: var(--brand);
  border: 1px solid color-mix(in srgb, var(--brand) 18%, var(--line));
  box-shadow: 0 22px 44px -30px rgba(var(--brand-rgb), .7);
  position: relative;
  animation: floaty 6s ease-in-out infinite;
}
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1.4deg); } }
.empty-art .i { width: 46px; height: 46px; stroke-width: 1.25; }
.empty h2 { font-size: 20px; letter-spacing: -.03em; font-weight: 780; word-break: keep-all; }
.empty p { font-size: 12.8px; color: var(--ink-2); line-height: 1.7; max-width: 430px; word-break: keep-all; }
.empty-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
.empty-feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(226px, 1fr)); gap: 9px; margin-top: 22px; width: 100%; max-width: 560px; }
.empty-feat {
  border: 1px solid var(--line); border-radius: 14px; background: var(--card);
  padding: 12px 12px 13px; text-align: left;
  transition: transform .3s var(--spring), box-shadow .3s, border-color .2s;
}
.empty-feat:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--brand) 32%, var(--line)); }
.empty-feat .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: rgba(var(--brand-rgb), .1); color: var(--brand); margin-bottom: 7px; }
.empty-feat .ico .i { width: 16px; height: 16px; }
.empty-feat b { display: block; font-size: 12.5px; margin-bottom: 2px; }
.empty-feat span { font-size: 11px; color: var(--ink-3); line-height: 1.55; display: block; }

/* ---------------- modal / sheet ---------------- */
.scrim {
  position: fixed; inset: 0; background: rgba(6, 14, 12, .42);
  backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity .26s var(--ease);
  z-index: 40;
}
.scrim.show { opacity: 1; pointer-events: auto; }
.modal-root {
  position: fixed; inset: 0; z-index: 70;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  pointer-events: none;
}
.modal {
  width: min(560px, 100%); max-height: min(88vh, 900px);
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: 0 40px 90px -40px rgba(0, 0, 0, .6);
  display: flex; flex-direction: column;
  pointer-events: auto;
  animation: modalIn .42s var(--spring) both;
  overflow: hidden;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
.modal.wide { width: min(760px, 100%); }
.modal.narrow { width: min(420px, 100%); }
.modal-head {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 15px 16px 12px 20px; border-bottom: 1px solid var(--line-2);
}
.modal-head h2 { font-size: 15.5px; font-weight: 750; letter-spacing: -.02em; flex: 1; min-width: 0; }
.modal-head .sub { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.modal-body { flex: 1; overflow-y: auto; padding: 16px 20px 6px; min-height: 0; }
.modal-foot {
  flex: none; display: flex; align-items: center; gap: 7px; justify-content: flex-end;
  padding: 12px 16px 14px 20px; border-top: 1px solid var(--line-2);
  background: linear-gradient(var(--card-2), var(--card));
}
.modal-foot .left { margin-right: auto; display: flex; gap: 7px; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field > label { font-size: 11px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--line); border-radius: 10px;
  background: var(--card-2); padding: 9px 11px; font-size: 13px; outline: 0;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: color-mix(in srgb, var(--brand) 58%, transparent);
  box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .12); background: var(--card);
}
.field textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-3); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid .field { margin-bottom: 10px; }
.multi-list { display: flex; flex-direction: column; gap: 7px; }
.multi-row { display: flex; gap: 6px; align-items: center; }
.multi-row select { width: 96px; flex: none; }
.multi-row input { flex: 1; min-width: 0; }
.multi-row .del {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  color: var(--ink-3); flex: none; transition: background .16s, color .16s;
}
.multi-row .del:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.add-row {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
  font-size: 11.5px; font-weight: 650; color: var(--brand);
  padding: 5px 8px; border-radius: 8px;
}
.add-row:hover { background: rgba(var(--brand-rgb), .1); }
.photo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.photo-row .ava { width: 66px; height: 66px; font-size: 20px; border-radius: 20px; }
.photo-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.photo-btns .pill { height: 30px; font-size: 11.5px; padding: 0 10px; }
.hint { font-size: 10.8px; color: var(--ink-3); line-height: 1.55; }
.gpick { display: flex; flex-wrap: wrap; gap: 5px; }
.gpick label {
  display: inline-flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--line); font-size: 11.5px; cursor: pointer;
  transition: all .18s var(--ease);
}
.gpick input { display: none; }
.gpick label.on { border-color: var(--brand); background: rgba(var(--brand-rgb), .12); color: var(--brand-deep); font-weight: 650; }
html.dark .gpick label.on { color: var(--brand); }
.gpick .dot { width: 7px; height: 7px; border-radius: 50%; }

/* import / export */
.tabs { display: flex; gap: 3px; padding: 3px; border-radius: 11px; background: var(--card-2); border: 1px solid var(--line-2); margin-bottom: 14px; }
.tab { flex: 1; height: 31px; border-radius: 8px; font-size: 12px; font-weight: 650; color: var(--ink-3); transition: all .2s var(--ease); }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--card); color: var(--brand); box-shadow: 0 3px 10px -6px rgba(0, 0, 0, .4); }
.dropzone {
  border: 1.5px dashed var(--line); border-radius: 14px;
  padding: 22px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 7px;
  transition: border-color .2s, background .2s, transform .25s var(--ease);
  cursor: pointer;
}
.dropzone:hover, .dropzone.over { border-color: var(--brand); background: rgba(var(--brand-rgb), .06); transform: translateY(-1px); }
.dropzone .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: rgba(var(--brand-rgb), .1); color: var(--brand); }
.dropzone b { font-size: 12.5px; }
.dropzone span { font-size: 11px; color: var(--ink-3); }
.dropzone input[type=file] { display: none; }
.or { display: flex; align-items: center; gap: 10px; font-size: 10.5px; color: var(--ink-3); margin: 12px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.import-preview {
  margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  max-height: 190px; overflow-y: auto;
}
.import-preview .ip-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line-2); font-size: 12px; }
.import-preview .ip-row:last-child { border-bottom: 0; }
.import-preview .ip-row .ava { width: 26px; height: 26px; font-size: 9.5px; }
.import-preview .ip-row .meta { color: var(--ink-3); font-size: 10.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); margin-top: 10px; cursor: pointer; }
.check-line input { width: 15px; height: 15px; accent-color: var(--brand); }
.export-list { display: flex; flex-direction: column; gap: 7px; }
.export-item {
  display: flex; align-items: center; gap: 11px; padding: 11px 12px;
  border: 1px solid var(--line); border-radius: 12px; text-align: left; width: 100%;
  transition: all .2s var(--ease);
}
.export-item:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); background: var(--card-2); transform: translateY(-1px); }
.export-item .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(var(--brand-rgb), .1); color: var(--brand); flex: none; }
.export-item .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.export-item .txt b { font-size: 12.5px; }
.export-item .txt span { font-size: 10.8px; color: var(--ink-3); }

/* share / QR */
.share-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.qr-box {
  border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 12px;
  display: grid; place-items: center; position: relative; overflow: hidden;
  box-shadow: 0 14px 34px -26px rgba(0, 0, 0, .5);
}
.qr-box svg { width: 100%; height: auto; display: block; }
.qr-box .qr-cap { position: absolute; bottom: 6px; font-size: 9px; color: #4a5654; letter-spacing: .1em; font-weight: 700; }
.link-row { display: flex; gap: 6px; margin-top: 8px; }
.link-row input { flex: 1; min-width: 0; font-size: 11px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card-2); outline: 0; color: var(--ink-2); }
.share-card { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.share-card .ava { width: 46px; height: 46px; font-size: 15px; border-radius: 15px; }
.share-card .txt { min-width: 0; display: flex; flex-direction: column; }
.share-card .txt b { font-size: 14.5px; }
.share-card .txt span { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.incoming { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 6px 0 4px; }
.incoming .ava { width: 74px; height: 74px; font-size: 25px; border-radius: 24px; }
.incoming h3 { font-size: 18px; font-weight: 760; }
.incoming .meta { font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; }

/* toast host for our own quick notes */
.hint-bar {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 14px);
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 14px; font-size: 12px; color: var(--ink-2);
  box-shadow: var(--shadow-hi); opacity: 0; pointer-events: none;
  transition: all .3s var(--ease); z-index: 40;
}
.hint-bar.show { opacity: 1; transform: translate(-50%, 0); }

/* selection / misc */
.kbd-hint { font-size: 10px; color: var(--ink-3); display: flex; gap: 4px; align-items: center; }
.section-title { font-size: 12px; font-weight: 750; letter-spacing: -.01em; }
.muted { color: var(--ink-3); }
.right { margin-left: auto; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.rowline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.confirm-text { font-size: 12.8px; color: var(--ink-2); line-height: 1.65; }
.confirm-text b { color: var(--ink); }


/* modal layers */
.m-layer {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; pointer-events: none;
}
.m-layer > .modal { pointer-events: auto; }
.quiet .row, .quiet .gcard { animation: none !important; }
.merge-body { display: flex; flex-direction: column; gap: 9px; }
.d-row .txt b { word-break: keep-all; }
.d-row .txt.wrap b { white-space: normal; word-break: break-all; line-height: 1.45; }
.d-note, .confirm-text, .empty p, .empty h2, .incoming h3 { word-break: keep-all; }
.sec-head.flash b { animation: secFlash .8s var(--ease); }
@keyframes secFlash { 0% { transform: scale(1); } 35% { transform: scale(1.5); color: var(--brand); } 100% { transform: scale(1); } }
.gcard .row-acts { display: none; }
.idx button.has { position: relative; }
.idx button.has::after { content: ""; position: absolute; width: 2px; height: 2px; border-radius: 50%; background: currentColor; left: 50%; bottom: 0; transform: translateX(-50%); opacity: .55; }
@media (max-width: 720px) {
  .m-layer { padding: 0; align-items: flex-end; }
}

/* ---------------- responsive ---------------- */
@media (max-width: 1180px) {
  :root { --rail-w: 226px; }
  .detail {
    position: fixed; top: var(--top-h); right: 0; bottom: 0;
    width: min(var(--detail-w), 94vw); z-index: 46;
    transform: translateX(102%); transition: transform .4s var(--spring);
    box-shadow: -24px 0 60px -40px rgba(0, 0, 0, .6);
    border-left: 1px solid var(--line);
    background: var(--card);
  }
  .detail.open { transform: none; }
  .detail .close-detail { display: grid; }
}
.close-detail { display: none; position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 10px; place-items: center; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); z-index: 3; }
.close-detail:hover { color: var(--brand); }
.d-star {
  position: absolute; top: 12px; left: 12px; z-index: 3;
  width: 32px; height: 32px; border-radius: 10px;
  display: grid; place-items: center;
  color: var(--ink-3); background: var(--card); border: 1px solid var(--line);
  transition: color .18s, transform .3s var(--spring), background .18s;
}
.d-star:hover { color: var(--star); transform: translateY(-1px); }
.d-star.on { color: var(--star); background: color-mix(in srgb, var(--star) 14%, var(--card)); border-color: color-mix(in srgb, var(--star) 40%, transparent); }
.d-star.on .i { fill: var(--star); }
.d-star .i { width: 16px; height: 16px; }
.d-star.bounce .i { animation: starPop .62s var(--spring); }

@media (max-width: 900px) {
  :root { --top-h: 56px; }
  .rail {
    position: fixed; top: var(--top-h); bottom: 0; left: 0; z-index: 48;
    width: min(300px, 84vw);
    transform: translateX(-104%); transition: transform .38s var(--spring);
    box-shadow: 24px 0 60px -40px rgba(0, 0, 0, .55);
    background: var(--rail);
  }
  .rail.open { transform: none; }
  .only-narrow { display: inline-grid !important; }
  .tb-hub span { display: none; }
  .tb-hub { width: 36px; padding: 0; justify-content: center; }
  .idx { display: none; }
  .idx-h {
    display: flex; gap: 1px; overflow-x: auto; flex: none;
    padding: 0 12px 7px 12px; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .idx-h::-webkit-scrollbar { display: none; }
  .idx-h button {
    flex: none; min-width: 23px; height: 23px; padding: 0 4px;
    font-size: 10px; font-weight: 700; color: var(--ink-3); border-radius: 6px;
  }
  .idx-h button.has { color: var(--brand); background: rgba(var(--brand-rgb), .1); }
  .idx-h button.dim { opacity: .35; }
  .list-scroll { padding-left: 14px; padding-right: 14px; }
}
.only-narrow { display: none; }

@media (max-width: 720px) {
  .top { padding: 0 10px; gap: 8px; flex-wrap: wrap; height: auto; min-height: var(--top-h); padding-top: 8px; padding-bottom: 8px; }
  .search-wrap { display: none; }
  .detail { top: 0; border-radius: 0; width: 100%; }
  .close-detail { top: calc(12px + env(safe-area-inset-top)); }
  .top-search { order: 5; flex: 1 1 100%; max-width: none; height: 36px; }
  .top-search kbd { display: none; }
  .tb-hub { display: inline-flex; }
  #themeBtn { display: none; }
  .list-head { padding: 12px 14px 8px; }
  .lh-title h1 { font-size: 17px; }
  .search-wrap { margin: 0 14px 8px; }
  .empty { padding: 30px 14px 24px; gap: 11px; }
  .empty h2 { font-size: 18px; }
  .empty-art { width: 88px; height: 88px; border-radius: 26px; }
  .empty-art .i { width: 38px; height: 38px; }
  .empty-feats { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .empty-feat { padding: 10px; }
  .empty-feat span { font-size: 10.4px; }
  .row { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; padding: 8px; }
  .row .ava { width: 40px; height: 40px; }
  .row-acts { opacity: 1; }
  .row-acts .icon-btn:not(.star-btn) { display: none; }
  .d-row .cop { opacity: .7; }
  .detail .close-detail { display: grid; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 8px; }
  .d-hero h2 { font-size: 18px; }
  .modal-root { padding: 0; align-items: flex-end; }
  .modal { width: 100%; max-height: 92vh; border-radius: 20px 20px 0 0; }
  .modal.wide, .modal.narrow { width: 100%; }
  .modal-head { padding: 14px 14px 10px 16px; }
  .modal-body { padding: 14px 16px 4px; }
  .modal-foot { padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
  .form-grid { grid-template-columns: 1fr; gap: 0; }
  .share-grid { grid-template-columns: 1fr; }
  .qr-box { max-width: 220px; margin: 0 auto; }
  .detail .close-detail { display: grid; }
  .d-actions { grid-template-columns: repeat(4, 1fr); }
  .listcol { padding-bottom: 0; }
}
@media (max-width: 420px) {
  .brand-txt b { font-size: 14px; }
  .empty-feats { grid-template-columns: 1fr; }
  .d-wrap { padding: 16px 14px 24px; }
  .dup-card { padding: 11px 11px; }
  .dc-foot .pill { flex: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

<script>
(function () {
  'use strict';

  /* ============================================================
     Flux Contacts · 스마트 연락처
     IndexedDB flux_contacts_v1 (contacts · meta)
     ============================================================ */

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var doc = document;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function uid(prefix) {
    return (prefix || 'c') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function toast(msg, type) { try { Lemon.toast(msg, type || 'ok'); } catch (e) { } }
  function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /* ---------------- icons ---------------- */
  function icon(id, cls) { return '<svg class="i ' + (cls || '') + '" aria-hidden="true"><use href="#' + id + '"></use></svg>'; }

  /* ---------------- IndexedDB store ---------------- */
  var DB_NAME = 'flux_contacts_v1';
  var dbPromise = null;
  var memoryOnly = false;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('contacts')) db.createObjectStore('contacts', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb')); };
    });
    return dbPromise;
  }
  function idbGetAll(store) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(store, 'readonly');
        var rq = tx.objectStore(store).getAll();
        rq.onsuccess = function () { resolve(rq.result || []); };
        rq.onerror = function () { reject(rq.error); };
      });
    });
  }
  function idbPut(store, val) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function idbDel(store, key) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  /* localStorage fallback (IndexedDB를 못 쓰는 브라우저) */
  var FALLBACK_KEY = 'flux_contacts_fallback_v1';
  function fallbackRead() {
    try { return JSON.parse(localStorage.getItem(FALLBACK_KEY) || '{"contacts":[],"meta":{}}'); }
    catch (e) { return { contacts: [], meta: {} }; }
  }
  function fallbackWrite(obj) {
    try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(obj)); return true; }
    catch (e) { toast('저장 공간이 부족해 저장하지 못했어요', 'err'); return false; }
  }

  /* ---------------- state ---------------- */
  var S = {
    contacts: [],
    groups: [],
    settings: {},
    view: 'all',
    groupId: null,
    query: '',
    layout: 'list',
    sort: 'name',
    selId: null,
    ready: false,
    quiet: false,
    meAva: ''
  };

  var PALETTE = ['#0f7b6c', '#2f6f9f', '#6b5aa6', '#9a5b3d', '#3f7a4f', '#8a4a62', '#4c6b8a', '#7a6a2f', '#2d6f6f', '#5c5f8a'];
  var GROUP_COLORS = ['#0f7b6c', '#2f6f9f', '#6b5aa6', '#b2601f', '#3f7a4f', '#a03a5c', '#7a6a2f', '#4c6b8a'];

  function colorFor(str) {
    var h = 0, s = String(str || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
    return PALETTE[h % PALETTE.length];
  }
  function initials(name) {
    var n = String(name || '').trim();
    if (!n) return '?';
    if (/[가-힣]/.test(n)) return n.replace(/\s+/g, '').slice(0, 2);
    var parts = n.split(/\s+/).filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    return n.slice(0, 2).toUpperCase();
  }
  function avatarHTML(c, cls) {
    var name = c && c.name ? c.name : '?';
    var style = 'background:' + (c && c.photo ? '#dfe7e5' : colorFor(name));
    var inner = c && c.photo
      ? '<img src="' + esc(c.photo) + '" alt="">'
      : esc(initials(name));
    return '<span class="ava ' + (cls || '') + '" style="' + style + '">' + inner + '</span>';
  }

  /* ---------------- 한글 초성 ---------------- */
  var CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  var CHO_FOLD = { 'ㄲ': 'ㄱ', 'ㄸ': 'ㄷ', 'ㅃ': 'ㅂ', 'ㅆ': 'ㅅ', 'ㅉ': 'ㅈ' };
  var KO_KEYS = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  var EN_KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  var INDEX_KEYS = KO_KEYS.concat(EN_KEYS).concat(['#']);

  function choseong(ch) {
    var code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      var idx = Math.floor((code - 0xAC00) / 588);
      var c = CHO[idx] || 'ㅇ';
      return CHO_FOLD[c] || c;
    }
    return null;
  }
  function indexKey(name) {
    var n = String(name || '').trim();
    if (!n) return '#';
    var ch = n[0];
    var ko = choseong(ch);
    if (ko) return ko;
    if (/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
    if (/[0-9]/.test(ch)) return '#';
    return '#';
  }
  function indexRank(k) {
    var i = INDEX_KEYS.indexOf(k);
    return i < 0 ? INDEX_KEYS.length : i;
  }

  /* ---------------- helpers ---------------- */
  function liveContacts() { return S.contacts.filter(function (c) { return !c.deletedAt; }); }
  function trashContacts() { return S.contacts.filter(function (c) { return !!c.deletedAt; }); }
  function getContact(id) {
    for (var i = 0; i < S.contacts.length; i++) if (S.contacts[i].id === id) return S.contacts[i];
    return null;
  }
  function getGroup(id) {
    for (var i = 0; i < S.groups.length; i++) if (S.groups[i].id === id) return S.groups[i];
    return null;
  }
  function groupNames(c) {
    return (c.groups || []).map(function (g) { var x = getGroup(g); return x ? x.name : null; }).filter(Boolean);
  }
  function primaryPhone(c) {
    if (!c.phones || !c.phones.length) return '';
    for (var i = 0; i < c.phones.length; i++) if (c.phones[i].value) return c.phones[i].value;
    return '';
  }
  function primaryEmail(c) {
    if (!c.emails || !c.emails.length) return '';
    for (var i = 0; i < c.emails.length; i++) if (c.emails[i].value) return c.emails[i].value;
    return '';
  }
  function contactSummary(c) {
    var bits = [];
    if (c.org) bits.push(c.org + (c.title ? ' · ' + c.title : ''));
    var ph = primaryPhone(c);
    if (ph) bits.push(ph);
    else if (primaryEmail(c)) bits.push(primaryEmail(c));
    return bits.join(' · ');
  }
  function sortByName(a, b) {
    return String(a.name || '').localeCompare(String(b.name || ''), 'ko');
  }
  function normPhone(v) { return String(v || '').replace(/\D/g, ''); }
  function normName(v) { return String(v || '').replace(/\s+/g, '').toLowerCase(); }
  function digitsTail(v, n) { var d = normPhone(v); return d.length > n ? d.slice(-n) : d; }

  function bdayParts(str) {
    if (!str) return null;
    var s = String(str).trim();
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (m) return { y: +m[1], m: +m[2], d: +m[3] };
    m = /^(?:--)?(\d{2})-(\d{2})$/.exec(s);
    if (m) return { y: 0, m: +m[1], d: +m[2] };
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return { y: +m[3], m: +m[1], d: +m[2] };
    m = /^(\d{4})(\d{2})(\d{2})$/.exec(s);
    if (m) return { y: +m[1], m: +m[2], d: +m[3] };
    return null;
  }
  function daysUntil(str) {
    var p = bdayParts(str);
    if (!p) return null;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var target = new Date(today.getFullYear(), p.m - 1, p.d);
    if (target < today) target = new Date(today.getFullYear() + 1, p.m - 1, p.d);
    return Math.round((target - today) / 86400000);
  }
  function bdayLabel(str) {
    var p = bdayParts(str);
    if (!p) return '';
    var s = p.m + '월 ' + p.d + '일';
    if (p.y && p.y > 1900) s = p.y + '년 ' + s;
    return s;
  }
  function relTime(ts) {
    if (!ts) return '';
    var diff = Date.now() - ts;
    if (diff < 60000) return '방금';
    if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
    if (diff < 86400000 * 7) return Math.floor(diff / 86400000) + '일 전';
    var d = new Date(ts);
    return d.getFullYear() + '. ' + pad2(d.getMonth() + 1) + '. ' + pad2(d.getDate()) + '.';
  }

  /* ---------------- persistence ---------------- */
  function snapshot() {
    try {
      Lemon.store.set('flux_contacts_v1_snapshot', {
        v: 1,
        count: liveContacts().length,
        groups: S.groups.length,
        updatedAt: Date.now()
      });
      Lemon.store.set('flux_contacts_v1_meta', {
        name: (S.settings.me && S.settings.me.name) || '',
        count: liveContacts().length,
        updatedAt: Date.now()
      });
    } catch (e) { }
  }
  function saveContact(c, opts) {
    c.updatedAt = Date.now();
    if (!c.createdAt) c.createdAt = c.updatedAt;
    var i = -1;
    for (var k = 0; k < S.contacts.length; k++) if (S.contacts[k].id === c.id) { i = k; break; }
    if (i > -1) S.contacts[i] = c; else S.contacts.push(c);
    snapshot();
    if (memoryOnly) {
      var fb = fallbackRead();
      fb.contacts = S.contacts; fb.meta = { groups: S.groups, settings: S.settings };
      fallbackWrite(fb);
      if (!opts || !opts.silent) toast('브라우저 저장소를 쓸 수 없어 임시로 저장했어요', 'err');
      return Promise.resolve(true);
    }
    return idbPut('contacts', c).catch(function (err) {
      memoryOnly = true;
      toast('저장에 문제가 있어 로컬 백업으로 보관했어요', 'err');
      var fb = fallbackRead(); fb.contacts = S.contacts; fb.meta = { groups: S.groups, settings: S.settings };
      fallbackWrite(fb);
    });
  }
  function removeContactRecord(id) {
    S.contacts = S.contacts.filter(function (c) { return c.id !== id; });
    snapshot();
    if (memoryOnly) {
      var fb = fallbackRead(); fb.contacts = S.contacts; fallbackWrite(fb);
      return Promise.resolve(true);
    }
    return idbDel('contacts', id).catch(function () { });
  }
  function saveMeta() {
    snapshot();
    if (memoryOnly) {
      var fb = fallbackRead(); fb.meta = { groups: S.groups, settings: S.settings }; fb.contacts = S.contacts;
      fallbackWrite(fb);
      return Promise.resolve(true);
    }
    return idbPut('meta', { key: 'state', groups: S.groups, settings: S.settings }).catch(function () { });
  }
  function savePrefs() {
    try {
      localStorage.setItem('flux_contacts_prefs', JSON.stringify({ layout: S.layout, sort: S.sort }));
    } catch (e) { }
  }

  /* ---------------- load ---------------- */
  function normalizeContact(c) {
    c.id = c.id || uid();
    c.name = String(c.name || '').trim() || '이름 없음';
    c.phones = Array.isArray(c.phones) ? c.phones : [];
    c.emails = Array.isArray(c.emails) ? c.emails : [];
    c.sites = Array.isArray(c.sites) ? c.sites : [];
    c.groups = Array.isArray(c.groups) ? c.groups : [];
    c.starred = !!c.starred;
    c.deletedAt = c.deletedAt || null;
    c.createdAt = c.createdAt || Date.now();
    c.updatedAt = c.updatedAt || c.createdAt;
    return c;
  }
  function load() {
    return Promise.all([idbGetAll('contacts'), idbGetAll('meta')]).then(function (res) {
      S.contacts = (res[0] || []).map(normalizeContact);
      var meta = null;
      (res[1] || []).forEach(function (m) { if (m && m.key === 'state') meta = m; });
      if (meta) {
        S.groups = Array.isArray(meta.groups) ? meta.groups : [];
        S.settings = meta.settings && typeof meta.settings === 'object' ? meta.settings : {};
      }
    }).catch(function () {
      memoryOnly = true;
      var fb = fallbackRead();
      S.contacts = (fb.contacts || []).map(normalizeContact);
      S.groups = (fb.meta && fb.meta.groups) || [];
      S.settings = (fb.meta && fb.meta.settings) || {};
    });
  }

  /* ---------------- rendering: nav & groups ---------------- */
  function renderNav() {
    var live = liveContacts();
    $('#cAll').textContent = live.length;
    $('#cStar').textContent = live.filter(function (c) { return c.starred; }).length;
    $('#cTrash').textContent = trashContacts().length;
    var dups = duplicateClusters(live);
    var dupCount = dups.reduce(function (n, cl) { return n + cl.members.length - 1; }, 0);
    var cDup = $('#cDup');
    cDup.textContent = dupCount;
    cDup.className = dupCount ? 'warn' : '';
    cDup.style.color = dupCount ? 'var(--warn)' : '';

    $$('#nav .nav-item').forEach(function (b) {
      var v = b.getAttribute('data-view');
      b.classList.toggle('on', S.view === v);
    });
    renderGroups();
    renderMe();
  }
  function renderGroups() {
    var live = liveContacts();
    var box = $('#groupList');
    if (!S.groups.length) {
      box.innerHTML = '<p class="group-empty">라벨로 가족, 학교, 거래처를 나눠 보세요. 연락처 편집 화면에서 바로 붙일 수 있습니다.</p>';
      return;
    }
    var html = S.groups.map(function (g) {
      var n = live.filter(function (c) { return (c.groups || []).indexOf(g.id) > -1; }).length;
      return '<button class="group-item' + (S.view === 'group' && S.groupId === g.id ? ' on' : '') + '" data-gid="' + esc(g.id) + '">' +
        '<span class="group-dot" style="background:' + esc(g.color || '#0f7b6c') + '"></span>' +
        '<span>' + esc(g.name) + '</span><b>' + n + '</b>' +
        '<span class="g-edit" data-gedit="' + esc(g.id) + '" role="button" aria-label="라벨 편집">' + icon('i-edit', 'i-xs') + '</span>' +
        '</button>';
    }).join('');
    box.innerHTML = html;
  }
  function renderMe() {
    var me = S.settings.me || {};
    var name = me.name || '내 명함';
    $('#meName').textContent = name;
    $('#meSub').textContent = me.title || me.org || '탭해서 QR 명함 만들기';
    var ava = $('#meAva');
    if (me.photo) {
      ava.innerHTML = '<img src="' + esc(me.photo) + '" alt="">';
      ava.style.background = '#dfe7e5';
    } else {
      ava.textContent = initials(name === '내 명함' ? '나' : name);
      ava.style.background = colorFor(name);
    }
  }

  /* ---------------- rendering: list ---------------- */
  function viewBase() {
    if (S.view === 'trash') return trashContacts();
    var arr = liveContacts();
    if (S.view === 'starred') arr = arr.filter(function (c) { return c.starred; });
    if (S.view === 'group') arr = arr.filter(function (c) { return (c.groups || []).indexOf(S.groupId) > -1; });
    return arr;

  function sorted(arr) {
    var out = arr.slice();
    if (S.sort === 'recent') out.sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    else if (S.sort === 'added') out.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    else out.sort(sortByName);
    return out;
  }
  function haystack(c) {
    var parts = [c.name, c.org, c.title, c.memo, c.address, (c.birthday || '')];
    (c.phones || []).forEach(function (p) { parts.push(p.value, p.label); });
    (c.emails || []).forEach(function (e) { parts.push(e.value, e.label); });
    (c.sites || []).forEach(function (s) { parts.push(s.value, s.label); });
    groupNames(c).forEach(function (g) { parts.push(g); });
    return parts.join(' \u0001 ').toLowerCase();
  }
  function searchList(arr, q) {
    var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!tokens.length) return sorted(arr);
    var scored = [];
    arr.forEach(function (c) {
      var hay = haystack(c);
      var plain = normPhone(hay);
      var ok = tokens.every(function (t) {
        if (hay.indexOf(t) > -1) return true;
        var d = normPhone(t);
        return d.length >= 3 && plain.indexOf(d) > -1;
      });
      if (!ok) return;
      var score = 0;
      var nm = String(c.name || '').toLowerCase();
      tokens.forEach(function (t) {
        if (nm === t) score += 60;
        else if (nm.indexOf(t) === 0) score += 40;
        else if (nm.indexOf(t) > -1) score += 25;
        else score += 5;
      });
      if (c.starred) score += 3;
      scored.push({ c: c, s: score });
    });
    scored.sort(function (a, b) { return b.s - a.s || sortByName(a.c, b.c); });
    return scored.map(function (x) { return x.c; });
  }

  /* ---------------- duplicates ---------------- */
  function pairKey(a, b) { return [a, b].sort().join('|'); }
  function ignoredPairs() {
    var m = {};
    (S.settings.dupIgnore || []).forEach(function (k) { m[k] = true; });
    return m;
  }
  function duplicateClusters(list) {
    var parent = {};
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b) { var ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; }
    list.forEach(function (c) { parent[c.id] = c.id; });

    var byPhone = {}, byEmail = {}, byName = {};
    list.forEach(function (c) {
      (c.phones || []).forEach(function (p) {
        var k = digitsTail(p.value, 9);
        if (k.length >= 7) { if (byPhone[k]) union(c.id, byPhone[k]); else byPhone[k] = c.id; }
      });
      (c.emails || []).forEach(function (e) {
        var k = String(e.value || '').trim().toLowerCase();
        if (k.indexOf('@') > 0) { if (byEmail[k]) union(c.id, byEmail[k]); else byEmail[k] = c.id; }
      });
      var nk = normName(c.name);
      if (nk.length >= 2) { if (byName[nk]) union(c.id, byName[nk]); else byName[nk] = c.id; }
    });

    var buckets = {};
    list.forEach(function (c) {
      var r = find(c.id);
      (buckets[r] = buckets[r] || []).push(c);
    });

    var ign = ignoredPairs();
    var out = [];
    Object.keys(buckets).forEach(function (r) {
      var members = buckets[r];
      if (members.length < 2) return;
      var reasons = {}, pairs = 0, openPairs = 0;
      for (var i = 0; i < members.length; i++) {
        for (var j = i + 1; j < members.length; j++) {
          var A = members[i], B = members[j], why = [];
          var ap = (A.phones || []).map(function (p) { return digitsTail(p.value, 9); }).filter(function (x) { return x.length >= 7; });
          var bp = (B.phones || []).map(function (p) { return digitsTail(p.value, 9); }).filter(function (x) { return x.length >= 7; });
          if (ap.some(function (x) { return bp.indexOf(x) > -1; })) why.push('전화번호 일치');
          var ae = (A.emails || []).map(function (e) { return String(e.value || '').trim().toLowerCase(); }).filter(Boolean);
          var be = (B.emails || []).map(function (e) { return String(e.value || '').trim().toLowerCase(); }).filter(Boolean);
          if (ae.some(function (x) { return be.indexOf(x) > -1; })) why.push('이메일 일치');
          if (normName(A.name) === normName(B.name)) why.push('이름 일치');
          if (!why.length) continue;
          pairs++;
          why.forEach(function (w) { reasons[w] = true; });
          if (!ign[pairKey(A.id, B.id)]) openPairs++;
        }
      }
      if (!pairs || !openPairs) return;
      members.sort(function (a, b) { return completeness(b) - completeness(a); });
      out.push({ id: r, members: members, reasons: Object.keys(reasons) });
    });
    out.sort(function (a, b) { return b.members.length - a.members.length; });
    return out;
  }
  function completeness(c) {
    var n = 1;
    if (c.photo) n += 2;
    if (c.org) n += 1;
    if (c.title) n += 1;
    if (c.birthday) n += 1;
    if (c.address) n += 1;
    if (c.memo) n += 1;

      if (!v) return;
      if (seen[v]) { seen[v].ids.push(m.id); return; }

  function readImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('image')); return; }
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          try {
            var size = 224, cv = doc.createElement('canvas');
            var ratio = Math.min(size / img.width, size / img.height, 1);
            cv.width = Math.max(1, Math.round(img.width * ratio));
            cv.height = Math.max(1, Math.round(img.height * ratio));
            var ctx = cv.getContext('2d');
            ctx.drawImage(img, 0, 0, cv.width, cv.height);
            resolve(cv.toDataURL('image/jpeg', 0.86));
          } catch (e) { resolve(fr.result); }
        };
        img.onerror = function () { resolve(fr.result); };
        img.src = fr.result;
      };
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
  }

  /* ============================================================
     vCard · CSV · JSON
     ============================================================ */
  function splitName(name) {
    var n = String(name || '').trim();
    if (!n) return { family: '', given: '' };
    if (/[가-힣]/.test(n)) return { family: n[0], given: n.slice(1) };
    var parts = n.split(/\s+/);
    if (parts.length === 1) return { family: parts[0], given: '' };
    return { family: parts[parts.length - 1], given: parts.slice(0, -1).join(' ') };
  }
  function vEsc(s) {
    return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  }
  function unvEsc(s) {
    return String(s == null ? '' : s).replace(/\\n/gi, '\n').replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\\\/g, '\\');
  }
  function telType(label) {
    return ({ '휴대폰': 'CELL', '직장': 'WORK', '집': 'HOME', '팩스': 'FAX' })[label] || 'VOICE';
  }
  function emailType(label) {
    return ({ '개인': 'HOME', '직장': 'WORK', '학교': 'WORK' })[label] || 'INTERNET';
  }
  function byteLen(str) {
    try { return new TextEncoder().encode(str).length; } catch (e) { return unescape(encodeURIComponent(str)).length; }
  }
  function foldLine(line) {
    if (byteLen(line) <= 75) return line;
    var out = [], cur = '', bytes = 0;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i], b = byteLen(ch);
      if (bytes + b > 74) { out.push(cur); cur = ' '; bytes = 1; }
      cur += ch; bytes += b;
    }
    if (cur) out.push(cur);
    return out.join('\r\n');
  }
  function toVCard(c) {
    var nm = splitName(c.name);
    var L = ['BEGIN:VCARD', 'VERSION:3.0',
      'N:' + vEsc(nm.family) + ';' + vEsc(nm.given) + ';;;',
      'FN:' + vEsc(c.name)];
    if (c.org) L.push('ORG:' + vEsc(c.org));
    if (c.title) L.push('TITLE:' + vEsc(c.title));
    (c.phones || []).forEach(function (p) { if (p.value) L.push('TEL;TYPE=' + telType(p.label) + ':' + vEsc(p.value)); });
    (c.emails || []).forEach(function (e) { if (e.value) L.push('EMAIL;TYPE=' + emailType(e.label) + ':' + vEsc(e.value)); });
    if (c.birthday) L.push('BDAY:' + c.birthday.replace(/-/g, ''));
    if (c.anniversary && c.anniversary.date) L.push('X-FLUX-ANNIVERSARY:' + vEsc((c.anniversary.label || '') + '|' + c.anniversary.date));
    if (c.address) L.push('ADR;TYPE=HOME:;;' + vEsc(c.address) + ';;;;');
    (c.sites || []).forEach(function (s) { if (s.value) L.push('URL;TYPE=' + (s.label || 'WEBSITE') + ':' + vEsc(s.value)); });
    if (c.memo) L.push('NOTE:' + vEsc(c.memo));
    var gn = groupNames(c);
    if (gn.length) L.push('CATEGORIES:' + gn.map(vEsc).join(','));
    if (c.starred) L.push('X-FLUX-STARRED:1');
    if (c.photo && /^data:image\//.test(c.photo) && c.photo.length < 240000) {
      var m = /^data:image\/([a-z]+);base64,(.*)$/i.exec(c.photo);
      if (m) L.push('PHOTO;ENCODING=b;TYPE=' + m[1].toUpperCase() + ':' + m[2]);
    }
    L.push('REV:' + new Date(c.updatedAt || Date.now()).toISOString());
    L.push('END:VCARD');
    return L.map(foldLine).join('\r\n') + '\r\n';
  }
  function qpDecode(str, charset) {
    var bytes = [];
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch === '=') {
        var hex = str.substr(i + 1, 2);
        if (/^[0-9A-Fa-f]{2}$/.test(hex)) { bytes.push(parseInt(hex, 16)); i += 2; continue; }
        if (hex === '\r\n' || hex === '\n') { i += 2; continue; }
      }
      var enc = unescape(encodeURIComponent(ch));
      for (var k = 0; k < enc.length; k++) bytes.push(enc.charCodeAt(k));
    }
    var cs = (charset || 'utf-8').toLowerCase();
    if (cs === 'ks_c_5601-1987' || cs === 'euc-kr' || cs === 'cp949') cs = 'euc-kr';
    try { return new TextDecoder(cs).decode(new Uint8Array(bytes)); }
    catch (e) {
      try { return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }

    }
  }
  function parseVCards(text) {
    var t = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    var out = [];
    var blocks = t.split(/BEGIN:VCARD/i).slice(1);
    blocks.forEach(function (block) {
      var b = block.split(/END:VCARD/i)[0];
      b = b.replace(/=\n/g, '').replace(/\n[ \t]/g, '');
      var c = { name: '', org: '', title: '', phones: [], emails: [], sites: [], groups: [], memo: '', birthday: '', address: '', anniversary: null, photo: '' };
      var n = { family: '', given: '' };
      b.split('\n').forEach(function (raw) {
        if (!raw.trim()) return;
        var idx = raw.indexOf(':');
        if (idx < 0) return;
        var left = raw.slice(0, idx), value = raw.slice(idx + 1);
        var segs = left.split(';');
        var prop = segs[0].toUpperCase();
        if (prop.indexOf('.') > -1) prop = prop.split('.').pop();
        var params = {};
        segs.slice(1).forEach(function (p) {
          var kv = p.split('=');
          var k = kv[0].toUpperCase();
          if (k === 'TYPE') {
            var v = kv.slice(1).join('=').replace(/"/g, '').toUpperCase();
            params.TYPE = (params.TYPE ? params.TYPE + ',' : '') + v;
          } else params[k] = kv.slice(1).join('=').replace(/"/g, '').toUpperCase();
        });
        var enc = params.ENCODING || '';
        if (enc.indexOf('QUOTED') > -1) value = qpDecode(value, params.CHARSET);
        if (prop === 'PHOTO') {
          var type = (params.TYPE || 'JPEG').split(',')[0].toLowerCase();
          if (enc === 'B' || enc === 'BASE64' || /^[A-Za-z0-9+/=\s]{200,}$/.test(value)) {
            var b64 = value.replace(/\s+/g, '');

          }
          return;
        }
        value = unvEsc(value).trim();
        if (!value && prop !== 'NOTE') return;
        switch (prop) {
          case 'FN': c.name = value; break;
          case 'N':
            var np = value.split(';');
            n.family = (np[0] || '').trim(); n.given = (np[1] || '').trim();
            break;
          case 'ORG': c.org = value.split(';')[0]; break;
          case 'TITLE': c.title = value; break;
          case 'TEL':
            var tl = /CELL|MOBILE/.test(params.TYPE || '') ? '휴대폰' : /WORK/.test(params.TYPE || '') ? '직장' : /HOME/.test(params.TYPE || '') ? '집' : /FAX/.test(params.TYPE || '') ? '팩스' : '기타';
            c.phones.push({ label: tl, value: value }); break;
          case 'EMAIL':
            var el = /WORK/.test(params.TYPE || '') ? '직장' : /HOME/.test(params.TYPE || '') ? '개인' : '기타';
            c.emails.push({ label: el, value: value }); break;
          case 'BDAY':
            var m = /^(\d{4})(\d{2})(\d{2})$/.exec(value.replace(/-/g, ''));
            if (m) c.birthday = m[1] + '-' + m[2] + '-' + m[3];
            else if (/^--\d{2}-?\d{2}$/.test(value)) c.birthday = value.replace(/^--/, '').replace(/^(\d{2})(\d{2})$/, '$1-$2');
            break;
          case 'ADR':
            var ap = value.split(';').map(function (x) { return x.trim(); }).filter(Boolean);
            if (ap.length) c.address = ap.join(' ');
            break;
          case 'URL':
            c.sites.push({ label: /INSTAGRAM/.test(params.TYPE || '') ? '인스타그램' : '웹사이트', value: value }); break;
          case 'NOTE': c.memo = value; break;
          case 'CATEGORIES':
            value.split(',').forEach(function (g) { var gg = g.trim(); if (gg) c.groups.push(gg); });
            break;
          case 'X-FLUX-ANNIVERSARY':
            var ap2 = value.split('|');
            if (ap2.length === 2) c.anniversary = { label: ap2[0], date: ap2[1] };
            break;
          case 'X-FLUX-STARRED': c.starred = true; break;
        }
      });
      if (!c.name) {
        if (n.family || n.given) c.name = /[A-Za-z]/.test(n.family + n.given) ? (n.given + ' ' + n.family).trim() : (n.family + n.given);
      }
      if (c.name || c.phones.length || c.emails.length) out.push(c);
    });
    return out;
  }

  /* ---------------- CSV ---------------- */
  function parseCSV(text) {
    var t = String(text || '').replace(/^\uFEFF/, '');
    var rows = [], row = [], cur = '', q = false;
    for (var i = 0; i < t.length; i++) {
      var ch = t[i];
      if (q) {
        if (ch === '"') {
          if (t[i + 1] === '"') { cur += '"'; i++; }
          else q = false;
        } else cur += ch;
      } else {
        if (ch === '"') q = true;
        else if (ch === ',') { row.push(cur); cur = ''; }
        else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
        else if (ch === '\r') { }
        else cur += ch;
      }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ''; }); });
  }
  function csvCell(v) {
    var s = String(v == null ? '' : v);

  }
  function toCSV(list) {
    var maxPh = 2, maxEm = 2, maxSite = 1;
    list.forEach(function (c) {
      maxPh = Math.max(maxPh, (c.phones || []).length);
      maxEm = Math.max(maxEm, (c.emails || []).length);
      maxSite = Math.max(maxSite, (c.sites || []).length);
    });
    var head = ['Name', 'Given Name', 'Family Name', 'Organization 1 - Name', 'Organization 1 - Title'];
    for (var i = 1; i <= maxPh; i++) head.push('Phone ' + i + ' - Type', 'Phone ' + i + ' - Value');
    for (var j = 1; j <= maxEm; j++) head.push('E-mail ' + j + ' - Type', 'E-mail ' + j + ' - Value');
    for (var k = 1; k <= maxSite; k++) head.push('Website ' + k + ' - Type', 'Website ' + k + ' - Value');
    head.push('Birthday', 'Address 1 - Formatted', 'Notes', 'Group Membership', 'Starred');
    var lines = [head.map(csvCell).join(',')];
    list.forEach(function (c) {
      var nm = splitName(c.name);
      var row = [c.name, nm.given, nm.family, c.org || '', c.title || ''];
      for (var i = 0; i < maxPh; i++) { var p = (c.phones || [])[i]; row.push(p ? p.label : '', p ? p.value : ''); }
      for (var j = 0; j < maxEm; j++) { var e = (c.emails || [])[j]; row.push(e ? e.label : '', e ? e.value : ''); }
      for (var k = 0; k < maxSite; k++) { var s = (c.sites || [])[k]; row.push(s ? s.label : '', s ? s.value : ''); }
      row.push(c.birthday || '', c.address || '', (c.memo || '').replace(/\n/g, ' '), groupNames(c).join(' ::: '), c.starred ? '1' : '');
      lines.push(row.map(csvCell).join(','));
    });
    return lines.join('\r\n');
  }
  function csvToContacts(text) {
    var rows = parseCSV(text);
    if (rows.length < 2) return [];
    var head = rows[0].map(function (h) { return String(h).trim(); });
    function findCol(re) {
      for (var i = 0; i < head.length; i++) if (re.test(head[i])) return i;
      return -1;
    }
    function cols(re) {
      var out = [];
      head.forEach(function (h, i) { if (re.test(h)) out.push(i); });
      return out;
    }
    var iName = findCol(/^name$|^이름$|^성명$/i);
    var iGiven = findCol(/given name|^이름\(이\)$/i);
    var iFamily = findCol(/family name|^성$/i);
    var iOrg = findCol(/organization 1 - name|^회사$|^소속$|^organization$/i);
    var iTitle = findCol(/organization 1 - title|^직함$|^title$|^직책$/i);
    var iBday = findCol(/^birthday$|^생일$/i);

    var g = { id: uid('g'), name: n, color: GROUP_COLORS[S.groups.length % GROUP_COLORS.length] };

  function findExisting(c) {

    var el = (c.emails || []).map(function (e) { return String(e.value || '').trim().toLowerCase(); }).filter(Boolean);
    var list = liveContacts();
    for (var i = 0; i < list.length; i++) {
      var x = list[i];
      var xp = (x.phones || []).map(function (p) { return digitsTail(p.value, 9); }).filter(function (v) { return v.length >= 7; });
      if (pl.some(function (v) { return xp.indexOf(v) > -1; })) return x;
      var xe = (x.emails || []).map(function (e) { return String(e.value || '').trim().toLowerCase(); }).filter(Boolean);

  function utf8Bytes(str) {

  function qrModel(text) {

        model.modules = null;

          parsedData: bytes,

          write: function (buf) { for (var i = 0; i < this.parsedData.length; i++) buf.put(this.parsedData[i], 8); }

  function qrVCard(c) {
