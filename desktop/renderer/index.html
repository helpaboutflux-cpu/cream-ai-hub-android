<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Creamy Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="default-dark">

  <div id="titlebar">
    <div class="tb-left">
      <span class="tb-logo" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="18" height="18">
          <circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="6"/>
          <g transform="rotate(-28 50 50)">
            <rect x="14" y="45" width="72" height="10" rx="5" fill="none" stroke="currentColor" stroke-width="6"/>
          </g>
        </svg>
      </span>
      <span class="tb-name">Creamy Browser</span>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-btns">
      <button id="btn-min" class="win-btn" title="최소화">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
      <button id="btn-max" class="win-btn" title="최대화">
        <svg viewBox="0 0 12 12" width="12" height="12"><rect x="1.5" y="1.5" width="9" height="9" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
      <button id="btn-close" class="win-btn win-close" title="닫기">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="btn-newtab" class="icon-btn" title="새 탭">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="strip-drag"></div>
  </div>

  <div id="toolbar">
    <button id="nav-back" class="icon-btn" title="뒤로">
      <svg viewBox="0 0 20 20" width="17" height="17"><path d="M12.5 4L6 10l6.5 6" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="nav-fwd" class="icon-btn" title="앞으로">
      <svg viewBox="0 0 20 20" width="17" height="17"><path d="M7.5 4L14 10l-6.5 6" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="nav-reload" class="icon-btn" title="새로고침">
      <svg viewBox="0 0 20 20" width="16" height="16"><path d="M16 10a6 6 0 1 1-1.76-4.24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M16 2.8v3.4h-3.4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="nav-home" class="icon-btn" title="홈">
      <svg viewBox="0 0 20 20" width="17" height="17"><path d="M3.5 9.5L10 3.5l6.5 6M5 8.5V16h10V8.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="omnibox">
      <span id="ssl-icon" title="보안 연결">
        <svg id="ssl-lock" viewBox="0 0 16 16" width="13" height="13"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        <svg id="ssl-warn" viewBox="0 0 16 16" width="13" height="13"><path d="M8 2.5l6 10.5H2z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="M8 6.5v3.2" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="11.4" r="0.8" fill="currentColor"/></svg>
      </span>
      <input id="omni-input" type="text" spellcheck="false" autocomplete="off"
        placeholder="검색어를 입력하거나 주소를 입력하세요.">
      <button id="chip-translate" class="chip hidden" title="페이지 번역">번역</button>
      <button id="chip-media" class="chip hidden" title="미디어 저장">동영상</button>
      <button id="btn-star" class="icon-btn" title="북마크 추가">
        <svg viewBox="0 0 20 20" width="16" height="16"><path id="star-path" d="M10 3l2.1 4.4 4.9.7-3.5 3.4.8 4.8L10 14l-4.3 2.3.8-4.8L3 8.1l4.9-.7z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="omni-suggest" class="hidden"></div>
  </div>

  <div id="content">
    <div id="views"></div>
    <div id="rail">
      <button class="rail-btn" data-panel="creamy" title="Creamy AI">
        <svg viewBox="0 0 22 22" width="19" height="19"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" fill="none"/><g transform="rotate(-28 11 11)"><rect x="2.5" y="10" width="17" height="2.4" rx="1.2" stroke="currentColor" stroke-width="1.4" fill="none"/></g></svg>
      </button>
      <button class="rail-btn" data-panel="bag" title="My Bag">
        <svg viewBox="0 0 22 22" width="19" height="19"><path d="M6 8h10l-1 10H7z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M8.5 8V6.5a2.5 2.5 0 0 1 5 0V8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="rail-btn" data-panel="bookmarks" title="북마크">
        <svg viewBox="0 0 22 22" width="19" height="19"><path d="M6 3.5h10V18l-5-3-5 3z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
      </button>
      <button class="rail-btn" data-panel="downloads" title="다운로드">
        <svg viewBox="0 0 22 22" width="19" height="19"><path d="M11 3.5v9M7 9l4 4 4-4M4.5 17.5h13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="rail-btn" data-panel="menu" title="전체 메뉴">
        <svg viewBox="0 0 22 22" width="19" height="19"><path d="M4 6.5h14M4 11h14M4 15.5h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="rail-btn" data-panel="settings" title="설정">
        <svg viewBox="0 0 22 22" width="19" height="19"><circle cx="11" cy="11" r="2.6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M11 3.5v2.6M11 15.9v2.6M3.5 11h2.6M15.9 11h2.6M5.9 5.9l1.8 1.8M14.3 14.3l1.8 1.8M16.1 5.9l-1.8 1.8M7.7 14.3l-1.8 1.8" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="sidebar" class="hidden">
      <div class="sb-header">
        <span id="sb-title"></span>
        <button id="sb-close" class="icon-btn" title="닫기">
          <svg viewBox="0 0 12 12" width="11" height="11"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
        </button>
      </div>
      <div id="sb-body"></div>
    </div>
  </div>

  <div id="ctxmenu" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="media-menu" class="hidden">
    <button data-mode="video">동영상 (MP4)</button>
    <button data-mode="audio">음원 (M4A)</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
