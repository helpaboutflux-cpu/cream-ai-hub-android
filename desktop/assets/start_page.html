<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>새 탭</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html[data-theme="default-dark"] {
  --bg: #000000;
  --text: #ffffff;
  --text-dim: #9e9e9e;
  --search-bg: #16191e;
  --search-border: #272b33;
  --card-bg: #16191e;
  --card-border: #272b33;
  --planet: #ffffff;
  --accent-btn: #ffffff;
  --accent-btn-text: #000000;
  --shortcut-bg: #16191e;
}

html[data-theme="default-light"] {
  --bg: #f3f4f6;
  --text: #111111;
  --text-dim: #6b7280;
  --search-bg: #ffffff;
  --search-border: #222222;
  --card-bg: #ffffff;
  --card-border: #e5e7eb;
  --planet: #111111;
  --accent-btn: #111111;
  --accent-btn-text: #ffffff;
  --shortcut-bg: #ffffff;
}

html[data-theme="pink-dark"] {
  --bg: linear-gradient(180deg, #382025 0%, #201114 100%);
  --text: #ffffff;
  --text-dim: #d9a5af;
  --search-bg: #ffffff;
  --search-border: transparent;
  --card-bg: #ffffff;
  --card-border: transparent;
  --planet: #ffffff;
  --accent-btn: #b7626f;
  --accent-btn-text: #ffffff;
  --shortcut-bg: #ffffff;
}

html[data-theme="pink-light"] {
  --bg: linear-gradient(180deg, #ffe4ea 0%, #fff5f7 100%);
  --text: #2a1217;
  --text-dim: #9c6b75;
  --search-bg: #ffffff;
  --search-border: #f2c4cd;
  --card-bg: #ffffff;
  --card-border: #f7d2da;
  --planet: #6e343d;
  --accent-btn: #c86b7a;
  --accent-btn-text: #ffffff;
  --shortcut-bg: #ffffff;
}

body {
  min-height: 100vh;
  font-family: 'Pretendard', 'Malgun Gothic', 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  background-size: cover;
  background-position: center;
  padding: 48px 56px;
}

body.with-bg {
  color: #ffffff;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
}

body.with-bg .card,
body.with-bg .search-form {
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
}

.planet {
  color: var(--planet);
  display: inline-flex;
}

.greeting {
  margin-top: 18px;
  font-size: 30px;
  font-weight: 700;
}

.sub {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-dim);
}

.clock {
  margin-top: 4px;
  font-size: 13px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.search-form {
  margin-top: 26px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--search-bg);
  border: 1px solid var(--search-border);
  border-radius: 999px;
  padding: 5px 6px 5px 16px;
  max-width: 640px;
  width: 100%;
  overflow: hidden;
}

.search-form input {
  flex: 1 1 auto;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  height: 36px;
}

body[data-theme="pink-dark"] .search-form input { color: #222222; }

.search-form button {
  height: 36px;
  padding: 0 20px;
  border-radius: 999px;
  border: none;
  background: var(--accent-btn);
  color: var(--accent-btn-text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.grid {
  margin-top: 36px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  max-width: 1200px;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 18px 20px;
  min-height: 150px;
}

.card h3 {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  margin-bottom: 12px;
}

body[data-theme="pink-dark"] .card h3 { color: #6e343d; }

/* 날씨 카드의 위치(도시) 칩 */
.city-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 6px;
  padding: 2px 7px;
  border: 1px solid var(--card-border);
  border-radius: 999px;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, background 0.15s;
}

.city-chip:hover { background: rgba(128, 128, 128, 0.12); }

.city-chip:active { opacity: 0.7; }

.city-chip svg {
  width: 10px;
  height: 10px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.7;
}

body[data-theme="pink-dark"] .city-chip { color: #6e343d; }

/* 위치 변경 모달 */
.city-modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0, 0, 0, 0.6);
  z-index: 50;
}

.city-modal-card {
  width: 100%;
  max-width: 360px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: var(--text);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
}

.city-modal-title { font-size: 15px; font-weight: 700; }

.city-hint { font-size: 11.5px; font-weight: 600; color: var(--text-dim); margin-top: -4px; }

.city-input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  background: var(--search-bg);
  color: var(--text);
  padding: 0 13px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.city-status { display: none; font-size: 11.5px; color: var(--text-dim); line-height: 1.4; }

.city-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow-y: auto; }

.city-chip-opt {
  border: 1px solid var(--card-border);
  background: transparent;
  color: var(--text);
  border-radius: 999px;
  padding: 6px 11px;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.city-chip-opt.on { background: var(--accent-btn); color: var(--accent-btn-text); border-color: transparent; }

.city-results { display: none; flex-direction: column; gap: 6px; max-height: 176px; overflow-y: auto; }

.city-result {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  padding: 8px 11px;
  border: 1px solid var(--card-border);
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.city-result .cr-name { font-size: 12.5px; font-weight: 700; }
.city-result .cr-region { font-size: 10.5px; color: var(--text-dim); }

.city-btn-row { display: flex; gap: 8px; margin-top: 2px; }

.city-btn {
  flex: 1;
  height: 38px;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.city-btn.primary { background: var(--accent-btn); color: var(--accent-btn-text); border: none; }

.weather-now {
  display: flex;
  align-items: center;
  gap: 14px;
}

.weather-temp {
  font-size: 34px;
  font-weight: 700;
}

.weather-desc {
  font-size: 13px;
  color: var(--text-dim);
}

.weather-days {
  margin-top: 14px;
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: var(--text-dim);
}

.weather-days span b {
  color: var(--text);
  font-weight: 600;
}

.news-list { list-style: none; }

.news-list li {
  padding: 7px 0;
  border-bottom: 1px solid var(--card-border);
  font-size: 13px;
  line-height: 1.45;
}

.news-list li:last-child { border-bottom: none; }

.news-list a {
  color: var(--text);
  text-decoration: none;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.news-list a:hover { text-decoration: underline; }

body.with-bg .news-list a { text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }

.fxrates {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fx-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

.fx-row .fx-value { font-weight: 700; font-variant-numeric: tabular-nums; }

.quotes { display: flex; flex-direction: column; gap: 10px; }

.quote-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

.quote-row .q-value { font-weight: 700; font-variant-numeric: tabular-nums; }

.shortcuts {
  margin-top: 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 760px;
}

.shortcut {
  width: 84px;
  height: 84px;
  border-radius: 18px;
  background: var(--shortcut-bg);
  border: 1px solid var(--card-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  font-size: 11px;
  text-align: center;
  overflow: hidden;
}

body.with-bg .shortcut {
  background: rgba(0, 0, 0, 0.55);
  color: #ffffff;
  border-color: transparent;
}

.shortcut .sc-icon {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--accent-btn);
  color: var(--accent-btn-text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
}

.loading-note {
  color: var(--text-dim);
  font-size: 12px;
}

.fade-in { animation: fade 0.35s ease; }

@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
</style>
</head>
<body data-theme="default-dark">
  <div class="planet">
    <svg viewBox="0 0 100 100" width="44" height="44">
      <circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="4"/>
      <g transform="rotate(-28 50 50)">
        <rect x="14" y="45" width="72" height="10" rx="5" fill="none" stroke="currentColor" stroke-width="4"/>
      </g>
    </svg>
  </div>
  <h1 class="greeting fade-in" id="greeting"></h1>
  <div class="clock" id="clock"></div>

  <form class="search-form fade-in" id="searchForm">
    <input type="text" id="searchInput" placeholder="검색어를 입력하거나 주소를 입력하세요." autocomplete="off">
    <button type="submit">검색</button>
  </form>

  <div class="grid">
    <div class="card" id="weatherCard">
      <h3>날씨</h3>
      <div class="loading-note">불러오는 중...</div>
    </div>
    <div class="card" id="newsCard">
      <h3>주요 뉴스</h3>
      <div class="loading-note">불러오는 중...</div>
    </div>
    <div class="card" id="fxCard">
      <h3>환율</h3>
      <div class="loading-note">불러오는 중...</div>
    </div>
    <div class="card" id="quoteCard">
      <h3>증시</h3>
      <div class="loading-note">불러오는 중...</div>
    </div>
  </div>

  <div class="shortcuts" id="shortcuts"></div>

  <div class="city-modal" id="cityModal">
    <div class="city-modal-card">
      <div class="city-modal-title">날씨 위치 변경</div>
      <div class="city-hint" id="cityHint">현재 위치 · 서울</div>
      <input class="city-input" id="citySearch" placeholder="도시 검색 (예: 대전, Tokyo)" autocomplete="off">
      <div class="city-status" id="cityStatus"></div>
      <div class="city-chips" id="cityChips"></div>
      <div class="city-results" id="cityResults"></div>
      <div class="city-btn-row">
        <button class="city-btn" onclick="closeCityModal()">닫기</button>
        <button class="city-btn primary" onclick="searchCity()">검색</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var api = window.creamy || null;
    var params = new URLSearchParams(window.location.search);
    var theme = params.get('theme') || 'default-dark';
    var userName = params.get('user') || '';
    var engine = params.get('engine') || 'google';
    document.documentElement.setAttribute('data-theme', theme);
    document.body.setAttribute('data-theme', theme);

    var ENGINES = {
      google: 'https://www.google.com/search?q={q}',
      naver: 'https://search.naver.com/search.naver?query={q}',
      duckduckgo: 'https://duckduckgo.com/?q={q}'
    };

    var WEATHER_CODES = {
      0: '맑음', 1: '대체로 맑음', 2: '부분적으로 흐림', 3: '흐림',
      45: '안개', 48: '착빙 안개',
      51: '약한 이슬비', 53: '이슬비', 55: '강한 이슬비',
      61: '약한 비', 63: '비', 65: '강한 비',
      71: '약한 눈', 73: '눈', 75: '강한 눈',
      80: '소나기', 81: '소나기', 82: '강한 소나기',
      95: '뇌우', 96: '뇌우(우박)', 99: '강한 뇌우(우박)'
    };

    var SHORTCUTS = [
      { name: 'Cream ai Hub', url: 'https://doteai.base44.app' },
      { name: 'Google', url: 'https://www.google.com' },
      { name: 'Naver', url: 'https://www.naver.com' },
      { name: 'YouTube', url: 'https://www.youtube.com' },
      { name: 'GitHub', url: 'https://github.com' },
      { name: '네이버 뉴스', url: 'https://news.naver.com' }
    ];

    function tickClock() {
      var now = new Date();
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      $('#clock').textContent =
        now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' +
        '(' + dayNames[now.getDay()] + ') ' +
        pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      var hour = now.getHours();
      var greet = hour < 6 ? '고요한 새벽입니다' : (hour < 12 ? '좋은 아침입니다' : (hour < 18 ? '활기찬 오후입니다' : '편안한 저녁입니다'));
      $('#greeting').textContent = greet + (userName ? ', ' + userName + '님.' : '.');
    }

    function $(sel) { return document.querySelector(sel); }

    function renderShortcuts() {
      var wrap = $('#shortcuts');
      SHORTCUTS.forEach(function (sc) {
        var a = document.createElement('a');
        a.className = 'shortcut';
        a.href = sc.url;
        var initial = sc.name.charAt(0);
        a.innerHTML = '<span class="sc-icon">' + initial + '</span><span>' + sc.name + '</span>';
        wrap.appendChild(a);
      });
    }

    function loadWeather(fresh) {
      if (!api || !api.net) return Promise.resolve();
      if (!api.settings) return Promise.resolve();
      return api.settings.get().then(function (s) {
        s_cache = s || {};
        var local = readCityFromLocal();
        currentCity = {
          name: s_cache.city || (local && local.name) || currentCity.name,
          lat: Number(s_cache.cityLat) || (local && local.lat) || currentCity.lat,
          lon: Number(s_cache.cityLon) || (local && local.lon) || currentCity.lon
        };
        return api.net.weather(currentCity.lat, currentCity.lon);
      }).then(function (w) {
        var card = $('#weatherCard');
        if (!w || !w.current) throw new Error('no data');
        var code = w.current.weather_code;
        var desc = WEATHER_CODES[code] || '알 수 없음';
        var temp = Math.round(w.current.temperature_2m);
        var days = '';
        if (w.daily && w.daily.time) {
          var dayNames = ['일', '월', '화', '수', '목', '금', '토'];
          var parts = [];
          for (var i = 1; i < Math.min(w.daily.time.length, 4); i++) {
            var d = new Date(w.daily.time[i]);
            parts.push('<span>' + dayNames[d.getDay()] + ' <b>' +
              Math.round(w.daily.temperature_2m_max[i]) + '° / ' +
              Math.round(w.daily.temperature_2m_min[i]) + '°</b></span>');
          }
          days = '<div class="weather-days">' + parts.join('') + '</div>';
        }
        card.innerHTML = weatherHeading() +
          '<div class="weather-now"><div class="weather-temp">' + temp + '°C</div>' +
          '<div class="weather-desc">' + desc + '<br>습도 ' + w.current.relative_humidity_2m + '% / 풍속 ' + w.current.wind_speed_10m + ' km/h</div></div>' + days;
      }).catch(function () {
        $('#weatherCard').innerHTML = weatherHeading() + '<div class="loading-note">날씨 정보를 불러올 수 없습니다.</div>';
      });
    }

    var CITY_PRESETS = [
      { name: '서울', lat: 37.5665, lon: 126.9780 },
      { name: '부산', lat: 35.1796, lon: 129.0756 },
      { name: '대구', lat: 35.8714, lon: 128.6014 },
      { name: '인천', lat: 37.4563, lon: 126.7052 },
      { name: '광주', lat: 35.1595, lon: 126.8526 },
      { name: '대전', lat: 36.3504, lon: 127.3845 },
      { name: '울산', lat: 35.5384, lon: 129.3114 },
      { name: '수원', lat: 37.2636, lon: 127.0286 },
      { name: '제주', lat: 33.4996, lon: 126.5312 },
      { name: '세종', lat: 36.4800, lon: 127.2890 },
      { name: '성남', lat: 37.4200, lon: 127.1265 },
      { name: '청주', lat: 36.6424, lon: 127.4890 },
      { name: '전주', lat: 35.8242, lon: 127.1480 },
      { name: '춘천', lat: 37.8813, lon: 127.7300 },
      { name: '강릉', lat: 37.7519, lon: 128.8761 },
      { name: '포항', lat: 36.0190, lon: 129.3435 }
    ];

    var currentCity = { name: '서울', lat: 37.5665, lon: 126.9780 };

    function escHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function readCityFromLocal() {
      try {
        var raw = localStorage.getItem('creamy_weather_city');
        if (raw) {
          var o = JSON.parse(raw);
          if (o && o.name && isFinite(Number(o.lat)) && isFinite(Number(o.lon))) {
            return { name: String(o.name), lat: Number(o.lat), lon: Number(o.lon) };
          }
        }
      } catch (err) {}
      return null;
    }

    function weatherHeading() {
      return '<h3>날씨 <button class="city-chip" type="button" onclick="openCityModal()" aria-label="날씨 위치 변경">'
        + '<span>' + escHtml(currentCity.name) + '</span>'
        + '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></h3>';
    }

    function cityStatus(text) {
      var el = $('#cityStatus');
      if (!el) return;
      el.textContent = text || '';
      el.style.display = text ? 'block' : 'none';
    }

    function markCityChips() {
      var chips = document.querySelectorAll('#cityChips .city-chip-opt');
      for (var i = 0; i < chips.length; i++) {
        chips[i].classList.toggle('on', chips[i].textContent === currentCity.name);
      }
    }

    function openCityModal() {
      var wrap = $('#cityChips');
      if (wrap) {
        wrap.innerHTML = '';
        CITY_PRESETS.forEach(function (city) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'city-chip-opt';
          b.textContent = city.name;
          b.addEventListener('click', function () { applyCity(city); });
          wrap.appendChild(b);
        });
      }
      var input = $('#citySearch');
      if (input) input.value = '';
      var results = $('#cityResults');
      if (results) { results.innerHTML = ''; results.style.display = 'none'; }
      cityStatus('');
      var hint = $('#cityHint');
      if (hint) hint.textContent = '현재 위치 · ' + currentCity.name;
      markCityChips();
      $('#cityModal').style.display = 'flex';
      if (input) setTimeout(function () { input.focus(); }, 80);
    }

    function closeCityModal() {
      $('#cityModal').style.display = 'none';
    }

    function applyCity(city) {
      if (!city || !city.name) return;
      currentCity = { name: String(city.name), lat: Number(city.lat), lon: Number(city.lon) };
      try { localStorage.setItem('creamy_weather_city', JSON.stringify(currentCity)); } catch (err) {}
      closeCityModal();
      if (api && api.settings && api.settings.set) {
        Promise.resolve(api.settings.set('city', currentCity.name))
          .then(function () { return api.settings.set('cityLat', currentCity.lat); })
          .then(function () { return api.settings.set('cityLon', currentCity.lon); })
          .then(function () { s_cache = null; loadWeather(true); })
          .catch(function () { s_cache = null; loadWeather(true); });
      } else {
        loadWeather(true);
      }
    }

    function searchCity() {
      var input = $('#citySearch');
      var q = input ? input.value.trim() : '';
      if (!q) { cityStatus('도시 이름을 입력해 주세요.'); return; }
      if (!api || !api.net) { cityStatus('이 환경에서는 도시 검색을 쓸 수 없습니다.'); return; }
      var searchFn = api.net.geocodeList || api.net.geocode;
      cityStatus('도시를 찾는 중...');
      searchFn(q).then(function (res) {
        var list = [];
        if (Array.isArray(res)) {
          list = res;
        } else if (res && res.name) {
          list = [res];
        }
        var results = $('#cityResults');
        if (!list.length) {
          if (results) results.style.display = 'none';
          cityStatus('검색 결과가 없습니다. 다른 이름으로 검색해 주세요.');
          return;
        }
        cityStatus(list.length + '개 도시를 찾았습니다. 선택하면 바로 적용됩니다.');
        if (!results) return;
        results.innerHTML = '';
        results.style.display = 'flex';
        list.forEach(function (city) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'city-result';
          var nameEl = document.createElement('span');
          nameEl.className = 'cr-name';
          nameEl.textContent = city.name;
          var regionEl = document.createElement('span');
          regionEl.className = 'cr-region';
          regionEl.textContent = city.region || '';
          row.appendChild(nameEl);
          row.appendChild(regionEl);
          row.addEventListener('click', function () {
            applyCity({ name: city.name, lat: city.lat, lon: city.lon });
          });
          results.appendChild(row);
        });
      }).catch(function () {
        cityStatus('도시를 찾지 못했습니다. 잠시 후 다시 시도해 주세요.');
      });
    }

    var s_cache = null;

    function loadNews() {
      if (!api || !api.net) return;
      api.net.rss().then(function (items) {
        var card = $('#newsCard');
        if (!items || items.length === 0) throw new Error('empty');
        var html = '<h3>주요 뉴스</h3><ul class="news-list">';
        items.forEach(function (item) {
          html += '<li><a href="' + item.link + '" target="_self">' + item.title.replace(/</g, '&lt;') + '</a></li>';
        });
        html += '</ul>';
        card.innerHTML = html;
      }).catch(function () {
        $('#newsCard').innerHTML = '<h3>주요 뉴스</h3><div class="loading-note">뉴스를 불러올 수 없습니다.</div>';
      });
    }

    function loadFx() {
      if (!api || !api.net) return;
      api.net.fx().then(function (fx) {
        var card = $('#fxCard');
        var rows = [];
        if (fx.KRW) rows.push('<div class="fx-row"><span>USD / KRW</span><span class="fx-value">' + fx.KRW.toFixed(1) + ' 원</span></div>');
        if (fx.JPY) rows.push('<div class="fx-row"><span>USD / JPY</span><span class="fx-value">' + fx.JPY.toFixed(2) + ' 엔</span></div>');
        if (fx.EUR) rows.push('<div class="fx-row"><span>EUR / USD</span><span class="fx-value">' + (1 / fx.EUR).toFixed(3) + '</span></div>');
        card.innerHTML = '<h3>환율</h3><div class="fxrates">' + rows.join('') + '</div>';
      }).catch(function () {
        $('#fxCard').innerHTML = '<h3>환율</h3><div class="loading-note">환율을 불러올 수 없습니다.</div>';
      });
    }

    function loadQuotes() {
      if (!api || !api.net) return;
      api.net.quotes().then(function (quotes) {
        var card = $('#quoteCard');
        if (!quotes || quotes.length === 0) throw new Error('empty');
        var rows = quotes.map(function (q) {
          return '<div class="quote-row"><span>' + q.name + '</span><span class="q-value">' + q.close.toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + '</span></div>';
        });
        card.innerHTML = '<h3>증시 지수</h3><div class="quotes">' + rows.join('') + '</div>';
      }).catch(function () {
        $('#quoteCard').innerHTML = '<h3>증시 지수</h3><div class="loading-note">지수 정보를 불러올 수 없습니다.</div>';
      });
    }

    function loadBackground() {
      if (!api || !api.settings) return;
      api.settings.get().then(function (s) {
        s_cache = s;
        if (s.startBackground) {
          document.body.classList.add('with-bg');
          var bgUrl = 'file:///' + String(s.startBackground).replace(/\\/g, '/').replace(/^\/+/, '');
          document.body.style.backgroundImage = 'url("' + bgUrl + '")';
        }
        loadWeather();
      }).catch(function () { loadWeather(); });
    }

    document.getElementById('searchForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var q = document.getElementById('searchInput').value.trim();
      if (q.length === 0) return;
      var url;
      if (/^https?:\/\//i.test(q)) url = q;
      else if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/i.test(q) && q.indexOf(' ') === -1) url = 'https://' + q;
      else url = (ENGINES[engine] || ENGINES.google).replace('{q}', encodeURIComponent(q));
      window.location.href = url;
    });

    var citySearchInput = document.getElementById('citySearch');
    if (citySearchInput) {
      citySearchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          searchCity();
        }
      });
    }

    var cityModalEl = document.getElementById('cityModal');
    if (cityModalEl) {
      cityModalEl.addEventListener('click', function (e) {
        if (e.target === cityModalEl) closeCityModal();
      });
    }

    tickClock();
    setInterval(tickClock, 1000);
    renderShortcuts();
    loadBackground();
    loadNews();
    loadFx();
    loadQuotes();
  })();
  </script>
</body>
</html>
