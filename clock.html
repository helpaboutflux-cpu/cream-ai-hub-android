      if (fired[a.id] === stamp) return;
      fired[a.id] = stamp;
      ringBell(true);
      notify('알람 · ' + a.label, key);
      Lemon.toast('알람: ' + a.label + ' (' + key + ')', 'ok');
    });
  }

  /* ---------------- boot / loop ---------------- */
  function renderAll() {
    renderClock();
    renderCities();
    renderCityPicker();
    renderLaps();
    renderAlarms();
  }

  setInterval(function () {
    renderClock();
    renderCities();
    tickTimer();
    tickSw();
    checkAlarms();
  }, 500);

  /* ---------------- autosave ---------------- */
  function payload() {
    return {
      title: '도시 ' + state.cities.length + '곳 · 알람 ' + state.alarms.length + '개',
      sub: state.cities.map(function (id) { var c = cityById(id); return c ? c.name : id; }).join(' · '),
      thumb: '',
      data: { cities: state.cities, alarms: state.alarms, timerMin: state.timerMin }
    };
  }
  function markChanged() {
    if (!booted) return;
    AUTO.touch(payload);
  }

  function renderArchive() {
    var list = AUTO.archive.all();
    $('arcCount').textContent = list.length;
    var box = $('archiveList');
    if (!list.length) {
      box.innerHTML = '<div class="panel p-10 text-center col-span-full"><p class="text-[12px] font-bold">저장된 설정이 없어요</p><p class="text-[11px] text-neutral-500 dark:text-neutral-400 mt-1">도시나 알람을 바꾸면 자동 저장됩니다.</p></div>';
      return;
    }
    box.innerHTML = list.map(function (it) {
      return '<div class="panel p-3"><p class="text-[12px] font-bold truncate">' + Lemon.esc(it.title) + '</p>' +
        '<p class="text-[10px] text-neutral-500 dark:text-neutral-400 truncate">' + Lemon.esc(it.sub || '') + '</p>' +
        '<p class="text-[9px] text-neutral-400 mt-0.5">' + Lemon.timeAgo(it.ts) + '</p>' +
        '<div class="flex gap-1 mt-2"><button class="ghost-btn !px-2 !py-1 !text-[10px] flex-1" data-load="' + it.id + '">불러오기</button>' +
        '<button class="ghost-btn !px-2 !py-1 !text-[10px] !text-rose-500" data-del="' + it.id + '">삭제</button></div></div>';
    }).join('');
  }

  document.addEventListener('click', function (e) {
    var l = e.target.closest ? e.target.closest('[data-load]') : null;
    if (l) {
      var rec = AUTO.restore(l.getAttribute('data-load'));
      if (!rec || !rec.data) return;
      state.cities = rec.data.cities || state.cities;
      state.alarms = rec.data.alarms || state.alarms;
      AUTO.openProject(rec.id);
      renderAll();
      go('clock');
      Lemon.toast('설정을 불러왔어요', 'ok');
      return;
    }
    var del = e.target.closest ? e.target.closest('[data-del]') : null;
    if (del) {
      AUTO.archive.remove(del.getAttribute('data-del'));
      renderArchive();
      Lemon.toast('삭제했어요', 'info');
    }
  });

  $('btnClearArc').addEventListener('click', function () {
    if (!AUTO.archive.count()) { Lemon.toast('비울 기록이 없어요', 'info'); return; }
    if (window.confirm('보관함을 모두 비울까요?')) { AUTO.archive.clear(); renderArchive(); Lemon.toast('보관함을 비웠어요', 'info'); }
  });

  document.addEventListener('lemon:view', function (e) { if (e.detail.view === 'archive') renderArchive(); });
  document.addEventListener('lemon:theme', function () { renderClock(); });

  buildTicks();
  startHands();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { cancelAnimationFrame(handRaf); handRaf = 0; }
    else { startHands(); renderClock(); }
  });
  $('timerDisplay').textContent = fmtClock(300);
  setRing(0);
  renderAll();
  renderArchive();
  booted = true;
})();
</script>
</body>
</html>
