<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>QA cloud</title><meta name="robots" content="noindex"></head>
<body>
<pre id="out">loading</pre>
<script src="lemon-cloud.js?v=20261120d"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var log = [];
  function w(t) { log.push(t); out.textContent = log.join('\n'); }
  var ready = (window.LemonCloud && LemonCloud.init) ? LemonCloud.init() : Promise.resolve();
  ready.then(function () {
    w('cfg=' + JSON.stringify(LemonCloud.config()));
    return LemonCloud.getConfigRow('portal_controls');
  }).then(function (v) {
    w('rawControls=' + JSON.stringify(v));
    return LemonCloud.getPortalControls();
  }).then(function (c) {
    w('parsed=' + JSON.stringify(c));
    return LemonCloud.getConfigRow('portal_notices');
  }).then(function (v) {
    w('rawNotices=' + JSON.stringify(v));
    return LemonCloud.isSiteAdmin();
  }).then(function (a) {
    w('isAdmin=' + a);
  }).catch(function (e) { w('ERR ' + (e && e.message)); });
})();
</script>
</body></html>
