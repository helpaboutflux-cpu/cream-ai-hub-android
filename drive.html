  /* ================= modal system ================= */
  var openSheets = [];
  function openSheet(opts) {
    var root = $('#modalRoot');
    var wrap = doc.createElement('div');
    wrap.className = 'modal show';
    wrap.innerHTML =
      '<div class="sheet ' + (opts.size || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || '창') + '">' +
      '<div class="sheet-head"><div class="st"><h2>' + (opts.titleHTML || esc(opts.title || '')) + '</h2>' +
      (opts.sub ? '<p>' + esc(opts.sub) + '</p>' : '') + '</div>' +
      '<button class="modal-close" data-close aria-label="닫기">' + icon('i-x') + '</button></div>' +
      '<div class="sheet-body' + (opts.flush ? ' flush' : '') + '">' + (opts.body || '') + '</div>' +
      (opts.foot ? '<div class="sheet-foot">' + opts.foot + '</div>' : '') +
      '</div>';
    root.appendChild(wrap);
    openSheets.push(wrap);
    S.lastFocus = doc.activeElement;
    wrap.addEventListener('mousedown', function (e) {
      if (e.target === wrap && !opts.sticky) closeSheet(wrap);
    });
    $$('[data-close]', wrap).forEach(function (b) { b.addEventListener('click', function () { closeSheet(wrap); }); });
    if (opts.onMount) setTimeout(function () { opts.onMount(wrap); }, 0);
    return wrap;
  }
  function closeSheet(el) {
    var wrap = el || openSheets[openSheets.length - 1];
    if (!wrap || !wrap.parentNode) return;
    wrap.classList.add('closing');
    openSheets = openSheets.filter(function (w) { return w !== wrap; });
    if (S.previewUrl && wrap.contains($('#pvStage'))) { try { URL.revokeObjectURL(S.previewUrl); } catch (e) { } S.previewUrl = null; }
    setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 190);
    if (S.lastFocus && S.lastFocus.focus && !openSheets.length) { try { S.lastFocus.focus(); } catch (e) { } }
  }
  function closeAllSheets() { openSheets.slice().forEach(function (w) { closeSheet(w); }); }

  function askName(opt) {
    return new Promise(function (resolve) {
      var wrap = openSheet({
        title: opt.title || '이름',
        sub: opt.sub || '',
        size: 'mid',
        body: '<div class="field"><label for="nameField">' + esc(opt.label || '이름') + '</label>' +
          '<input class="input" id="nameField" value="' + esc(opt.value || '') + '" placeholder="' + esc(opt.placeholder || '') + '" autocomplete="off"></div>' +
          (opt.hint ? '<p class="hint">' + esc(opt.hint) + '</p>' : ''),
        foot: '<div class="grow"></div><button class="btn-ghost" data-close>취소</button>' +
          '<button class="btn-primary" id="nameOk">' + esc(opt.okLabel || '확인') + '</button>'
      });
      var input = $('#nameField', wrap);
      function done() {
        var v = input.value.trim();
        if (!v) { input.focus(); input.classList.add('shake'); setTimeout(function () { input.classList.remove('shake'); }, 380); return; }
        closeSheet(wrap); resolve(v);
      }
      $('#nameOk', wrap).addEventListener('click', done);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); done(); } });
      setTimeout(function () { try { input.focus(); input.select(); } catch (e) { } }, 60);
      wrap.addEventListener('modal:closed', function () { resolve(null); });
      var obs = new MutationObserver(function () {
        if (!wrap.parentNode) { obs.disconnect(); resolve(null); }
      });
      obs.observe(doc.body, { childList: true, subtree: true });
    });
  }

  function confirmSheet(opt) {
    return new Promise(function (resolve) {
      var wrap = openSheet({
        title: opt.title || '확인',
        size: 'mid',
        body: '<p style="font-size:13px;line-height:1.7;color:var(--ink-2)">' + (opt.bodyHTML || esc(opt.body || '')) + '</p>',
        foot: '<div class="grow"></div><button class="btn-ghost" data-close>취소</button>' +
          '<button class="' + (opt.danger ? 'btn-danger' : 'btn-primary') + '" id="cfmOk">' + esc(opt.okLabel || '확인') + '</button>'
      });
      var answered = false;
      $('#cfmOk', wrap).addEventListener('click', function () { answered = true; closeSheet(wrap); resolve(true); });
      var obs = new MutationObserver(function () {
        if (!wrap.parentNode) { obs.disconnect(); if (!answered) resolve(false); }
      });
      obs.observe(doc.body, { childList: true, subtree: true });
    });
  }

  /* ================= upload ================= */
  function uploadTargetFolder() { return S.view === 'drive' ? S.folderId : null; }

  function uploadFiles(fileList, parentId) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return Promise.resolve(0);
    askPersist();
    var big = files.filter(function (f) { return f.size > 120 * 1024 * 1024; });
    var go = big.length
      ? confirmSheet({
        title: '큰 파일이 있습니다',
        bodyHTML: '120MB가 넘는 파일이 ' + big.length + '개 있습니다. 브라우저 저장 공간은 기기마다 다르고, 공간이 부족하면 저장에 실패할 수 있습니다.<br><br>그래도 올릴까요?',
        okLabel: '올리기'
      })
      : Promise.resolve(true);
    return go.then(function (ok) {
      if (!ok) return 0;
      var done = 0, failed = 0;
      var bar = $('#upProgress'), fill = $('#upFill'), label = $('#upText');
      if (bar) { bar.hidden = false; fill.style.width = '4%'; }
      if (label) label.textContent = '올리는 중 0/' + files.length;
      toast(files.length + '개 파일을 올리는 중입니다', 'info');
      var chain = Promise.resolve();
      files.forEach(function (f, i) {
        chain = chain.then(function () {
          return saveFileNode(f, parentId).then(function () { done++; }, function (err) {
            failed++; console.warn('[Flux Drive] 업로드 실패', f.name, err);
          }).then(function () {
            if (fill) fill.style.width = Math.round(((i + 1) / files.length) * 100) + '%';
            if (label) label.textContent = '올리는 중 ' + (i + 1) + '/' + files.length + ' · ' + f.name.slice(0, 18);
          });
        });
      });
      return chain.then(function () {
        hap();
        if (failed) toast(done + '개 올림 · ' + failed + '개 실패 (저장 공간 확인)', 'err');
        else toast(done + '개 파일을 올렸습니다');
        if (bar) {
          setTimeout(function () { bar.hidden = true; if (fill) fill.style.width = '0%'; }, 620);
        }
        render();
        return done;
      });
    });
  }

  /* ================= preview ================= */
  function openItem(id) {
    var n = S.byId[id];
    if (!n) return;
    if (n.kind === 'folder') {
      S.view = 'drive'; S.folderId = n.id; S.filter = 'all'; S.query = '';
      $('#searchInput').value = ''; $('#searchClear').classList.remove('show');
      render();
      return;
    }
    openPreview(n);
  }

  function openPreview(node) {
    var t = typeOf(node);
    var mid = 'pv_' + node.id;
    var tools = '<div class="pv-toolbar" id="pvTools">' +
      '<button class="pill" data-pv="open">' + icon('i-external') + '새 탭에서 열기</button>' +
      '<button class="pill" data-pv="copy">' + icon('i-copy') + '내용 복사</button>' +
      '<span class="grow" style="flex:1"></span>' +
      '<div id="pvZoomBox" hidden><button class="pill" data-pv="zout" title="축소">' + icon('i-zoom-out') + '</button>' +
      '<span class="zoomval" id="pvZoomVal">100%</span>' +
      '<button class="pill" data-pv="zin" title="확대">' + icon('i-zoom-in') + '</button>' +
      '<button class="pill" data-pv="zreset" title="원래 크기">' + icon('i-reset') + '</button>' +
      '<button class="pill" data-pv="rotate" title="회전">' + icon('i-rotate') + '</button></div></div>';
    var info = '<div class="pv-info">' +
      '<div class="kv"><span>이름</span><b>' + esc(node.name) + '</b></div>' +
      '<div class="kv"><span>유형</span><b>' + esc(t.name) + (node.ext ? ' (' + esc(node.ext.toUpperCase()) + ')' : '') + '</b></div>' +
      '<div class="kv"><span>크기</span><b>' + fmtBytes(node.size) + '</b></div>' +
      '<div class="kv"><span>올린 날</span><b>' + fullDate(node.createdAt) + '</b></div>' +
      '<div class="kv"><span>수정</span><b>' + fullDate(node.updatedAt) + '</b></div>' +
      '<div class="divider"></div>' +
      '<div class="kv"><span>위치</span><b>' + esc(folderPathOf(node.parentId) || '내 드라이브') + '</b></div>' +
      '</div>';
    var wrap = openSheet({
      title: node.name,
      sub: t.name + ' · ' + fmtBytes(node.size) + ' · ' + when(node.updatedAt),
      size: 'wide', flush: true, sticky: true,
      body: tools + '<div class="pv-main"><div class="pv-stage" id="pvStage"><div class="loading-row"><span class="spinner"></span>여는 중…</div></div>' + info + '</div>',
      foot: '<button class="pill" data-pv="download">' + icon('i-download') + '내려받기</button>' +
        '<button class="pill" data-pv="rename">' + icon('i-edit') + '이름 변경</button>' +
        '<button class="pill" data-pv="move">' + icon('i-move') + '이동</button>' +
        '<button class="pill" data-pv="star">' + icon('i-star') + (node.starred ? '중요 해제' : '중요 표시') + '</button>' +
        (isTextLike(node) || t.id === 'code' ? '<button class="pill" data-pv="share">' + icon('i-share') + '링크 공유</button>' : '') +
        '<div style="flex:1"></div>' +
        '<button class="pill danger" data-pv="trash">' + icon('i-trash') + '휴지통으로</button>' +
        '<button class="btn-ghost" data-close>닫기</button>'
    });
    wrap.setAttribute('data-preview', mid);
    var stage = $('#pvStage', wrap);

    getBlob(node.id).then(function (blob) {
      if (!blob) { stage.innerHTML = '<div class="pv-note">' + icon('i-warn') + '<b>파일을 읽지 못했습니다</b><p>저장소에서 내용을 찾을 수 없습니다.</p></div>'; return; }
      var url = URL.createObjectURL(blob);
      S.previewUrl = url;
      var tid = t.id;
      if (tid === 'image') {
        stage.innerHTML = '<img id="pvImg" alt="' + esc(node.name) + '" src="' + url + '">';
        $('#pvZoomBox', wrap).hidden = false;
        S.imgZoom = 1; S.imgRot = 0;
        updateImg();
      } else if (tid === 'pdf') {
        stage.innerHTML = '<iframe id="pvFrame" title="PDF 미리보기" src="' + url + '#toolbar=1&view=FitH"></iframe>' +
          '<p class="hint" style="position:absolute;bottom:6px;left:0;right:0;text-align:center;background:var(--sheet);padding:4px">PDF가 보이지 않으면 위의 "새 탭에서 열기"를 눌러 주세요.</p>';
      } else if (tid === 'video') {
        stage.innerHTML = '<video id="pvVideo" controls playsinline preload="metadata" src="' + url + '"></video>';
      } else if (tid === 'audio') {
        stage.innerHTML = '<div class="audio-card"><span class="tile" style="--tc:#a855f7">' + icon('i-audio') + '</span>' +
          '<b>' + esc(node.name) + '</b><audio id="pvAudio" controls preload="metadata" src="' + url + '"></audio>' +
          '<span class="hint">' + fmtBytes(node.size) + ' · ' + esc(node.ext.toUpperCase()) + '</span></div>';
      } else if (isTextLike(node)) {
        blob.text().then(function (text) {
          if (!doc.body.contains(stage)) return;
          renderTextPreview(stage, text, /^(html|htm)$/i.test(node.ext || ''));
          $('#pvTools', wrap).setAttribute('data-text', '1');
        });
      } else {
        stage.innerHTML = '<div class="pv-note"><span class="tile" style="--tc:' + t.color + '">' + icon(t.icon) + '</span>' +
          '<b>이 형식은 미리보기를 지원하지 않아요</b><p>' + esc(node.ext ? node.ext.toUpperCase() + ' 파일' : '이 파일') + '은(는) 내려받아 확인해 주세요. 텍스트·이미지·PDF·오디오·동영상은 바로 볼 수 있습니다.</p>' +
          '<button class="btn-primary" data-pv="download">' + icon('i-download') + '내려받기</button></div>';
      }
    }, function () {
      stage.innerHTML = '<div class="pv-note">' + icon('i-warn') + '<b>파일을 읽지 못했습니다</b><p>저장소 접근에 실패했습니다.</p></div>';
    });

    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pv]');
      if (!b) return;
      var act = b.getAttribute('data-pv');
      if (act === 'open') {
        if (!S.previewUrl) return;
        window.open(S.previewUrl, '_blank', 'noopener');
      } else if (act === 'copy') {
        var txt = currentPreviewText(wrap);
        if (txt) L.copy ? L.copy(txt, '내용을 복사했습니다') : toast('복사했습니다');
        else toast('복사할 텍스트가 없습니다', 'err');
      } else if (act === 'zin' || act === 'zout' || act === 'zreset' || act === 'rotate') {
        if (act === 'zin') S.imgZoom = clamp(S.imgZoom + .25, .5, 4);
        if (act === 'zout') S.imgZoom = clamp(S.imgZoom - .25, .5, 4);
        if (act === 'zreset') { S.imgZoom = 1; S.imgRot = 0; }
        if (act === 'rotate') S.imgRot = (S.imgRot + 90) % 360;
        updateImg();
      } else if (act === 'download') {
        downloadNode(node.id);
      } else if (act === 'rename') {
        renameNode(node.id);
      } else if (act === 'move') {
        moveNodes([node.id]);
      } else if (act === 'star') {
        toggleStar(node.id);
        closeSheet(wrap);
      } else if (act === 'share') {
        shareNode(node);
      } else if (act === 'trash') {
        closeSheet(wrap);
        doTrash([node.id]);
      }
    });
  }

  function updateImg() {
    var img = $('#pvImg');
    if (!img) return;
    img.style.transform = 'scale(' + S.imgZoom + ') rotate(' + S.imgRot + 'deg)';
    var lbl = $('#pvZoomVal');
    if (lbl) lbl.textContent = Math.round(S.imgZoom * 100) + '%';
  }

  function renderTextPreview(stage, text, isHTML) {
    var showHTML = isHTML;
    var body = '<div class="tabs" style="margin:0 0 10px"><button class="' + (showHTML ? '' : 'on') + '" data-tmode="raw">소스</button>' +
      '<button class="' + (showHTML ? 'on' : '') + '" data-tmode="pretty">결과</button></div>' +
      '<div id="pvTextHost"></div>';
    stage.innerHTML = '<div style="width:100%;max-height:66vh;overflow:auto">' + body + '</div>';
    var host = $('#pvTextHost', stage);
    function paint(mode) {
      if (mode === 'pretty') {
        host.innerHTML = '<iframe class="pv-frame" style="width:100%;height:58vh;border:1px solid var(--line);border-radius:10px;background:#fff" sandbox="allow-same-origin" srcdoc="' + esc(text).replace(/"/g, '&quot;') + '"></iframe>';
      } else {
        var lines = text.split(/\r?\n/);
        var shown = lines.slice(0, 4000);
        host.innerHTML = '<pre class="pv-code">' + shown.map(function (l, i) {
          return '<span class="ln"><i>' + (i + 1) + '</i><code>' + esc(l) + '</code></span>';
        }).join('') + '</pre>' + (lines.length > shown.length ? '<p class="hint" style="padding:8px 12px">' + lines.length + '줄 중 4000줄만 표시했습니다. 전체 내용은 내려받아 확인하세요.</p>' : '');
      }
      stage.setAttribute('data-mode', mode);
    }
    paint(showHTML ? 'pretty' : 'raw');
    stage.addEventListener('click', function (e) {
      var b = e.target.closest('[data-tmode]');
      if (!b) return;
      $$('[data-tmode]', stage).forEach(function (x) { x.classList.toggle('on', x === b); });
      paint(b.getAttribute('data-tmode'));
    });
  }

  function currentPreviewText(wrap) {
    var code = $('.pv-code', wrap);
    if (code) return Array.prototype.map.call($$('.ln code', code), function (c) { return c.textContent; }).join('\n');
    var txt = $('.pv-text', wrap);
    return txt ? txt.textContent : '';
  }

  function downloadNode(id) {
    var n = S.byId[id];
    if (!n) return;
    if (n.kind === 'folder') { toast('폴더는 ZIP 백업으로 내려받을 수 있습니다', 'info'); exportZip([id]); return; }
    getBlob(id).then(function (blob) {
      if (!blob) { toast('파일 내용을 찾지 못했습니다', 'err'); return; }
      (L.downloadBlob || downloadBlobFallback)(n.name, blob);
      toast('내려받기를 시작했습니다');
    });
  }
  function downloadBlobFallback(name, blob) {
    var url = URL.createObjectURL(blob), a = doc.createElement('a');
    a.href = url; a.download = name; doc.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1200);
  }

  /* ================= item actions ================= */
  function toggleStar(id) {
    var n = S.byId[id];
    if (!n) return;
    updateNode(id, { starred: n.starred ? 0 : 1, keepTime: true }).then(function () {
      hap();
      render();
    });
  }
  function renameNode(id) {
    var n = S.byId[id];
    if (!n) return;
    askName({ title: '이름 변경', label: '새 이름', value: n.name, okLabel: '변경' }).then(function (v) {
      if (!v || v === n.name) return;
      updateNode(id, { name: uniqueName(v, n.parentId), ext: extOf(v) }).then(function () {
        toast('이름을 바꿨습니다'); render();
      });
    });
  }
  function doTrash(ids) {
    var folders = ids.filter(function (id) { return S.byId[id] && S.byId[id].kind === 'folder'; });
    var msg = folders.length
      ? '폴더 ' + folders.length + '개를 휴지통으로 옮깁니다. 폴더 안의 파일도 함께 들어가고, 휴지통에서 되살릴 수 있습니다.'
      : '선택한 ' + ids.length + '개 항목을 휴지통으로 옮깁니다.';
    confirmSheet({ title: '휴지통으로 옮길까요?', body: msg, okLabel: '옮기기' }).then(function (ok) {
      if (!ok) return;
      var chain = Promise.resolve();
      ids.forEach(function (id) { chain = chain.then(function () { return trashNode(id); }); });
      chain.then(function () {
        S.selected = {};
        hap();
        toast(ids.length + '개 항목을 휴지통으로 옮겼습니다');
        render();
      });
    });
  }
  function purgeNodes(ids) {
    confirmSheet({
      title: '완전히 지울까요?',
      bodyHTML: '선택한 ' + ids.length + '개 항목을 저장소에서 지웁니다.<br><br><b>되살릴 수 없습니다.</b> 남겨야 할 파일이라면 먼저 내려받으세요.',
      okLabel: '완전 삭제', danger: true
    }).then(function (ok) {
      if (!ok) return;
      var chain = Promise.resolve();
      ids.forEach(function (id) { chain = chain.then(function () { return deleteForever(id); }); });
      chain.then(function () { S.selected = {}; toast('완전히 지웠습니다'); render(); });
    });
  }
  function restoreNodes(ids) {
    var chain = Promise.resolve();
    ids.forEach(function (id) { chain = chain.then(function () { return restoreNode(id); }); });
    chain.then(function () { S.selected = {}; hap(); toast('되살렸습니다'); render(); });
  }
  function emptyTrash() {
    var ids = S.nodes.filter(function (n) { return !!n.trashed; }).map(function (n) { return n.id; });
    if (!ids.length) { toast('휴지통이 이미 비어 있습니다', 'info'); return; }
    confirmSheet({
      title: '휴지통을 비울까요?',
      bodyHTML: '휴지통의 ' + ids.length + '개 항목을 저장소에서 지웁니다.<br><br><b>되살릴 수 없습니다.</b>',
      okLabel: '비우기', danger: true
    }).then(function (ok) {
      if (!ok) return;
      var chain = Promise.resolve();
      ids.forEach(function (id) { chain = chain.then(function () { return deleteForever(id); }); });
      chain.then(function () { toast('휴지통을 비웠습니다'); render(); });
    });
  }

  function moveNodes(ids) {
    var banned = {};
    ids.forEach(function (id) {
      banned[id] = 1;
      if (S.byId[id] && S.byId[id].kind === 'folder') descendantsOf(id).forEach(function (d) { banned[d.id] = 1; });
    });
    var folders = S.nodes.filter(function (n) { return !n.trashed && n.kind === 'folder' && !banned[n.id]; });
    function depthOf(n) { return pathOf(n.id).length - 1; }
    var rows = '<button class="pick-row" data-pick="__root"><span class="i">' + icon('i-drive') + '</span>내 드라이브<span class="ind">최상위</span></button>';
    folders.sort(function (a, b) { return folderPathOf(a.id).localeCompare(folderPathOf(b.id), 'ko'); });
    rows += folders.map(function (f) {
      var pad = 10 + depthOf(f) * 14;
      return '<button class="pick-row" data-pick="' + f.id + '" style="padding-left:' + pad + 'px">' + icon('i-folder') + esc(f.name) + '</button>';
    }).join('');
    var picked = '__root';
    var wrap = openSheet({
      title: '다른 폴더로 이동',
      sub: ids.length + '개 항목',
      size: 'mid',
      body: '<div class="pick-list" id="pickList">' + rows + '</div>',
      foot: '<span class="hint">이동할 폴더를 고르세요</span><div style="flex:1"></div>' +
        '<button class="btn-ghost" data-close>취소</button><button class="btn-primary" id="moveOk">이동</button>'
    });
    $('#pickList', wrap).addEventListener('click', function (e) {
      var b = e.target.closest('[data-pick]');
      if (!b) return;
      picked = b.getAttribute('data-pick');
      $$('[data-pick]', wrap).forEach(function (x) { x.classList.toggle('on', x === b); });
    });
    $('#moveOk', wrap).addEventListener('click', function () {
      var target = picked === '__root' ? null : picked;
      var chain = Promise.resolve();
      ids.forEach(function (id) {
        chain = chain.then(function () {
          var n = S.byId[id];
          if (!n) return;
          return updateNode(id, { parentId: target, name: uniqueName(n.name, target) });
        });
      });
      chain.then(function () {
        closeSheet(wrap); S.selected = {};
        toast(ids.length + '개 항목을 옮겼습니다'); render();
      });
    });
  }

  /* ================= share ================= */
  function b64encode(str) {
    try { return btoa(unescape(encodeURIComponent(str))); } catch (e) { return ''; }
  }
  function shareNode(node) {
    getBlob(node.id).then(function (blob) {
      if (!blob) { toast('파일을 읽지 못했습니다', 'err'); return; }
      return blob.text().then(function (text) {
        if (text.length > 140000) { toast('글자가 너무 많아 링크로 만들 수 없습니다 (140KB 이하)', 'err'); return; }
        var payload = JSON.stringify({ n: node.name, t: text, m: node.mime || mimeOf(node.name) });
        var code = (window.LZString && LZString.compressToEncodedURIComponent)
          ? LZString.compressToEncodedURIComponent(payload)
          : b64encode(payload);
        var url = location.origin + location.pathname + '#file=' + code;
        var wrap = openSheet({
          title: '링크로 공유',
          sub: node.name,
          size: 'mid',
          body: '<div class="notice">' + icon('i-info') +
            '<div>이 링크에는 <b>파일 내용이 그대로 담겨</b> 있습니다. 받는 사람은 Flux Drive에서 열어 자기 드라이브에 저장할 수 있고, 링크를 아는 사람은 누구나 내용을 볼 수 있으니 개인정보가 담긴 파일은 공유하지 마세요.</div></div>' +
            '<div class="share-out" id="shareOut" style="margin-top:12px">' + esc(url) + '</div>' +
            '<p class="hint" style="margin-top:8px">텍스트 파일 ' + fmtBytes(text.length) + ' 기준 · ' + esc(url.length.toLocaleString()) + '자</p>',
          foot: '<button class="btn-ghost" data-close>닫기</button><div style="flex:1"></div>' +
            '<button class="btn-primary" id="shareCopy">' + icon('i-copy') + '링크 복사</button>'
        });
        $('#shareCopy', wrap).addEventListener('click', function () {
          if (L.copy) L.copy(url, '공유 링크를 복사했습니다');
          else { navigator.clipboard && navigator.clipboard.writeText(url); toast('복사했습니다'); }
        });
      });
    });
  }

  function checkHashImport() {
    var h = location.hash || '';
    if (h.indexOf('#file=') !== 0) return;
    var code = h.slice(6);
    var json = '';
    try {
      json = (window.LZString && LZString.decompressFromEncodedURIComponent)
        ? LZString.decompressFromEncodedURIComponent(code)
        : decodeURIComponent(escape(atob(code)));
    } catch (e) { json = ''; }
    var payload = null;
    try { payload = JSON.parse(json); } catch (e) { payload = null; }
    if (!payload || !payload.n) { toast('공유 링크를 읽지 못했습니다', 'err'); return; }
    var name = String(payload.n), text = String(payload.t || '');
    var wrap = openSheet({
      title: '공유받은 파일',
      sub: name + ' · ' + fmtBytes(text.length),
      size: 'mid',
      body: '<div class="notice">' + icon('i-share') + '<div>링크로 받은 파일입니다. 내 드라이브에 저장하면 계속 보관하고 내려받을 수 있습니다.</div></div>' +
        '<pre class="pv-text pv-json" style="margin-top:12px;max-height:34vh">' + esc(text.slice(0, 20000)) + '</pre>' +
        (text.length > 20000 ? '<p class="hint">앞부분 20000자만 보여 줍니다.</p>' : ''),
      foot: '<button class="btn-ghost" data-close>그냥 보기</button><div style="flex:1"></div>' +
        '<button class="btn-primary" id="hashSave">' + icon('i-download') + '내 드라이브에 저장</button>'
    });
    $('#hashSave', wrap).addEventListener('click', function () {
      var file = new File([text], name, { type: payload.m || mimeOf(name) });
      saveFileNode(file, null).then(function () {
        closeSheet(wrap);

  function pickStr(o, keys) {

  function walkWorks(app, value, path, out, depth, budget) {
    if (!value || depth > 6 || budget.n++ > 2500) return;
    if (Array.isArray(value)) {
      for (var i = 0; i < value.length && i < 240; i++) {
        if (!budget.n || budget.n++ > 2500) break;
        walkWorks(app, value[i], path + '[' + i + ']', out, depth + 1, budget);
      }
      return;
    }
    if (typeof value !== 'object') return;
    var item = looksLikeItem(value);
    if (item) {
      item.app = app;
      item.ref = path;
      out.push(item);
    }
    var keys = Object.keys(value);
    for (var j = 0; j < keys.length && j < 60; j++) {
      var k = keys[j], v = value[k];
      if (!v || typeof v !== 'object') continue;
      if (item && (k === 'body' || k === 'blocks' || k === 'cells' || k === 'pages' || k === 'html' || k === 'data')) continue;
      walkWorks(app, v, path + '.' + k, out, depth + 1, budget);
    }
  }

  function scanWorks() {

      if (!app) return;
      var text = null;
      try {
        text = (L.store && L.store.raw) ? L.store.raw(key, null) : localStorage.getItem(key);
      } catch (e) { text = null; }
      if (!text || text.length < 2) return;
      var val = null;
      try { val = JSON.parse(text); } catch (e) { val = null; }
      if (val === null) {
        if (text.length < 40000) val = { title: key.replace(/^flux_?/, '').replace(/_/g, ' '), text: text, updatedAt: Date.now() };
        else return;
      }
      walkWorks(app, val, key, out, 0, { n: 0 });
    });

    return Promise.all([scanIdbWorks(), scanIdbGeneric()]).then(function (res) {
      out = out.concat(res[0], res[1]);

        var key = it.app.id + '|' + it.title + '|' + (it.updated || 0) + '|' + it.snippet.slice(0, 40);

  function openIdb(name, version, storeName) {

      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };

      if (!version) rq.onupgradeneeded = function () { };

      var rq = tx.objectStore(storeName).getAll();

      rq.onerror = function () { rej(rq.error); };

      { name: 'lemon_builder_v1', store: 'projects', app: APPS[5] },
      { name: 'flux_tempmail_v1', store: 'saved', app: TEMPMAIL_APP },
      { name: 'lemon_kv_idb_v1', store: 'kv', app: null }
    ];
    var out = [];
    var chain = Promise.resolve();
    jobs.forEach(function (job) {
      chain = chain.then(function () {
        return openIdb(job.name).then(function (db) {
          return readAll(db, job.store).then(function (rows) {
            rows.forEach(function (rec) {
              var app = job.app;

                if (!rec || typeof rec.key !== 'string') return;
                if (isIgnored(rec.key)) return;
                app = appForKey(rec.key);
                if (!app) return;
              }
              var val = null;
              if (typeof rec.value === 'string') {
                try { val = JSON.parse(rec.value); } catch (e) { val = null; }
                if (val === null) val = { title: rec.key || (job.app && job.app.name) || '작업물', text: rec.value, updatedAt: rec.ts || 0 };

                return;
              } else if (rec && typeof rec === 'object') {
                val = rec;
              }
              if (val) walkWorks(app, val, job.name + '/' + (rec.key || rec.id || ''), out, 0, { n: 0 });
            });
            try { db.close(); } catch (e) { }
          }, function () { try { db.close(); } catch (e) { } });
        }, function () { /* 없는 DB는 건너뛴다 */ });
      });
    });

  }

  function scanIdbGeneric() {
    if (!indexedDB.databases) return Promise.resolve([]);
    return indexedDB.databases().then(function (list) {
      var out = [], chain = Promise.resolve();
      var handled = { flux_drive_v1: 1, lemon_kv_idb_v1: 1, flux_memo_v1: 1, flux_calendar_v1: 1, lemon_builder_v1: 1, flux_tempmail_v1: 1 };
      (list || []).forEach(function (info) {
        var name = info && info.name;
        if (!name || handled[name]) return;
        var app = appForKey(name);
        if (!app) return;
        chain = chain.then(function () {
          return openIdb(name).then(function (db) {
            var stores = Array.prototype.slice.call(db.objectStoreNames), c = Promise.resolve();
            stores.forEach(function (st) {
              c = c.then(function () {
                return readAll(db, st).then(function (rows) {
                  rows.forEach(function (rec) {
                    var val = null;
                    if (typeof rec === 'string') {
                      try { val = JSON.parse(rec); } catch (e) { val = { title: name, text: rec }; }
                    } else if (rec && typeof rec === 'object') {
                      if (rec.blob || rec instanceof Blob) return;
                      val = rec;
                      ['value', 'data', 'json', 'text', 'content', 'saved'].forEach(function (k) {
                        if (typeof rec[k] === 'string' && rec[k].length > 1) {
                          try {
                            var p = JSON.parse(rec[k]);
                            if (p && typeof p === 'object') val = p;
                          } catch (e) { }
                        }
                      });
                    }
                    if (val) walkWorks(app, val, name + '/' + st, out, 0, { n: 0 });
                  });
                }, function () { });
              });
            });
            return c.then(function () { try { db.close(); } catch (e) { } });
          }, function () { });
        });
      });
      return chain.then(function () { return out; });
    }, function () { return []; });
  }

  function exportZip(ids) {
    var chosen;
    if (ids && ids.length) chosen = ids.filter(function (id) { return S.byId[id]; });
    else chosen = S.nodes.filter(function (n) { return !n.trashed && !n.parentId; }).map(function (n) { return n.id; });
    if (!chosen.length) { toast('백업할 항목이 없습니다', 'info'); return; }
    var entries = [];
    chosen.forEach(function (id) {
      (function walkEntry(node, base) {
        var p = base ? base + '/' + node.name : node.name;
        entries.push({ node: node, path: p });
        if (node.kind === 'folder') {
          S.nodes.filter(function (x) { return x.parentId === node.id && !x.trashed; })
            .forEach(function (c) { walkEntry(c, p); });
        }
      })(S.byId[id], '');
    });
    var fileEntries = entries.filter(function (e) { return e.node.kind === 'file'; });
    toast(fileEntries.length + '개 파일을 ZIP으로 묶는 중입니다', 'info');
    var parts = [];
    entries.filter(function (e) { return e.node.kind === 'folder'; }).forEach(function (e) {
      parts.push({ path: e.path, dir: true, ts: e.node.updatedAt });
    });
    var chain = Promise.resolve(), done = 0;
    fileEntries.forEach(function (e) {
      chain = chain.then(function () {
        return getBlob(e.node.id).then(function (blob) {
          if (!blob) return;
          return blob.arrayBuffer().then(function (ab) {
            parts.push({ path: e.path, bytes: new Uint8Array(ab), ts: e.node.updatedAt });
            done++;

      });

      var manifest = {
        app: 'Flux Drive', version: 1, exportedAt: new Date().toISOString(),
        files: fileEntries.map(function (e) {
          return { path: e.path, size: e.node.size, mime: e.node.mime, updated: new Date(e.node.updatedAt).toISOString(), starred: !!e.node.starred };
        }),
        folders: entries.filter(function (e) { return e.node.kind === 'folder'; }).map(function (e) { return e.path; })
      };
      parts.push({ path: 'flux-drive-manifest.json', bytes: new TextEncoder().encode(JSON.stringify(manifest, null, 2)), deflate: true });
      if (!ids) {
        var works = { app: 'Flux Drive', kind: 'flux-works', exportedAt: new Date().toISOString(), count: S.works.length,
          works: S.works.map(function (w) { return { app: w.app.name, title: w.title, updated: w.updated ? new Date(w.updated).toISOString() : null, snippet: w.snippet, data: w.payload }; }) };
        parts.push({ path: 'flux-works.json', bytes: new TextEncoder().encode(JSON.stringify(works, null, 1)), deflate: true });
      }
      return zipBuild(parts);
    }).then(function (blob) {
      (L.downloadBlob || downloadBlobFallback)('flux-drive-' + stamp() + '.zip', blob);
      toast(done + '개 파일을 ' + fmtBytes(blob.size) + ' ZIP으로 내려받았습니다');
    }, function (err) {
      console.warn('[Flux Drive] ZIP 생성 실패', err);
      toast('ZIP을 만들지 못했습니다', 'err');
    });
  }

  function importZip(file) {
    if (!file) return;
    toast('ZIP을 읽는 중입니다', 'info');
    zipRead(file).then(function (list) {
      var folderCount = list.filter(function (e) { return e.dir; }).length;
      var fileCount = list.filter(function (e) { return !e.dir; }).length;
      return confirmSheet({
        title: 'ZIP 백업을 복원할까요?',
        bodyHTML: esc(file.name) + '<br><br>폴더 ' + folderCount + '개, 파일 ' + fileCount + '개를 찾았습니다. 내 드라이브 최상위에 같은 구조로 복원하며, 이미 있는 파일은 이름 뒤에 번호가 붙습니다.',
        okLabel: '복원'
      }).then(function (ok) {
        if (!ok) return;
        list.sort(function (a, b) { return a.path.split('/').length - b.path.split('/').length || a.path.localeCompare(b.path); });
        var map = { '': null }, done = 0, failed = 0;
        var chain = Promise.resolve();
        list.forEach(function (e) {
          var clean = e.path.replace(/\/+$/, '');
          if (!clean) return;
          var parts = clean.split('/');
          var parentPath = parts.slice(0, -1).join('/');
          chain = chain.then(function () {
            var parentId = map.hasOwnProperty(parentPath) ? map[parentPath] : null;
            if (e.dir) {
              if (map.hasOwnProperty(clean)) return;
              return createFolder(parts[parts.length - 1], parentId).then(function (n) { map[clean] = n.id; });
            }
            if (/(^|\/)(flux-drive-manifest\.json|flux-works\.json)$/i.test(clean)) return;
            if (/^\.DS_Store$/i.test(parts[parts.length - 1])) return;
            var nm = parts[parts.length - 1];
            var f = new File([e.bytes], nm, { type: mimeOf(nm) });
            return saveFileNode(f, parentId).then(function (n) { map[clean] = n.id; done++; },
              function (err) { failed++; console.warn('[Flux Drive] 복원 실패', clean, err); });
          });
        });
        return chain.then(function () {
          hap();
          toast(done + '개 파일을 복원했습니다' + (failed ? ' · ' + failed + '개 실패' : ''), failed ? 'err' : 'ok');
          S.view = 'drive'; S.folderId = null; S.selected = {}; render();
        });
      });
    }, function (err) {
      console.warn(err);
      toast(err && err.message ? err.message : 'ZIP 파일을 읽지 못했습니다', 'err');
    });
  }

  function makePng(w, h, painter) {
    var c = doc.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    painter(ctx, w, h);
    return new Promise(function (res) { c.toBlob(function (b) { res(b); }, 'image/png'); });
  }
  function makeWav(seconds, freq) {
    var rate = 22050, n = Math.floor(rate * seconds);
    var buf = new ArrayBuffer(44 + n * 2), view = new DataView(buf);
    function str(off, s) { for (var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
    str(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    str(36, 'data'); view.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) {
      var t = i / rate;
      var env = Math.sin(Math.PI * Math.min(1, t / seconds)) * Math.exp(-t * 1.2);
      view.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * t) * env * 0.5 * 32767, true);
    }
    return new Blob([buf], { type: 'audio/wav' });
  }
  function makePdf() {
    /* 아주 작은 1페이지 PDF를 직접 만든다 (외부 라이브러리 없이) */
    var lines = [
      'BT /F1 26 Tf 64 742 Td (Flux Drive sample document) Tj ET',
      'BT /F1 13 Tf 64 712 Td (This PDF was created inside your browser.) Tj ET',
      'BT /F1 13 Tf 64 692 Td (Everything stays on this device.) Tj ET',
      'BT /F1 11 Tf 64 650 Td (Try zoom, rotate, download, share, and ZIP backup in Flux Drive.) Tj ET'
    ];
    var content = lines.join('\n');
    var objs = [];
    objs.push('<< /Type /Catalog /Pages 2 0 R >>');
    objs.push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>');
    objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
    objs.push('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
    var out = '%PDF-1.4\n';
    var offsets = [];
    objs.forEach(function (o, i) {
      offsets.push(out.length);
      out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n';
    });
    var xref = out.length;
    out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    offsets.forEach(function (off) {
      out += ('0000000000' + off).slice(-10) + ' 00000 n \n';
    });
    out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    return new Blob([out], { type: 'application/pdf' });
  }

  function attachRipple() {
    doc.addEventListener('pointerdown', function (e) {
      if (doc.documentElement.getAttribute('data-anim') === 'off') return;
      var el = e.target.closest('.pill, .btn-primary, .btn-ghost, .icon-btn, .new-btn, .nav-item, .fchip, .wapp, .dock button, .check, .seg button, .pick-row, .big-row, .card-actions button, .modal-close');
      if (!el) return;
      var r = el.getBoundingClientRect();
      var span = doc.createElement('span');
      span.className = 'click-ripple';
      var size = Math.max(r.width, r.height);
      span.style.width = span.style.height = size + 'px';
      span.style.left = (e.clientX - r.left - size / 2) + 'px';
      span.style.top = (e.clientY - r.top - size / 2) + 'px';
      var prevPos = getComputedStyle(el).position;
      if (prevPos === 'static') el.style.position = 'relative';
      if (getComputedStyle(el).overflow === 'visible') el.style.overflow = 'hidden';
      el.appendChild(span);
      setTimeout(function () { span.remove(); }, 640);
    });
  }

    $('#tbSort').addEventListener('click', function () {
      S.sort = S.sort === 'name' ? 'updated' : (S.sort === 'updated' ? 'size' : 'name');
      $('#sortLabel').textContent = S.sort === 'name' ? '이름순' : (S.sort === 'updated' ? '최근 수정순' : '용량순');
      savePrefs();
      render();
    });
    $('#viewSeg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-mode]');
      if (!b) return;
      S.mode = b.getAttribute('data-mode');
      $$('#viewSeg button').forEach(function (x) { x.classList.toggle('on', x === b); });
      savePrefs(); render();
    });
    var searchTimer = null;
    $('#searchInput').addEventListener('input', function (e) {
      var v = e.target.value;
      $('#searchClear').classList.toggle('show', !!v);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        S.query = v;
        if (S.view === 'works' || S.view === 'analytics') render();
        else { animateBoard(); render(); }
      }, 120);
    });
    $('#searchClear').addEventListener('click', clearSearch);
    ['#themeBtn', '#themeBtnTop'].forEach(function (sel) {
      var b = $(sel);
      if (b) b.addEventListener('click', function () { setTimeout(syncThemeIcons, 30); });
    });

    /* drag & drop from OS */
    var dragDepth = 0;
    function showDz() {
      $('#dzTarget').textContent = (S.view === 'drive' && S.folderId && S.byId[S.folderId] ? folderPathOf(S.folderId) : '내 드라이브') + '에 저장됩니다';
      $('#dropzone').classList.add('show');
    }
    window.addEventListener('dragenter', function (e) {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
      dragDepth++; showDz();
    });
    window.addEventListener('dragover', function (e) {
      if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') > -1) e.preventDefault();
    });
    window.addEventListener('dragleave', function (e) {
      if (!e.dataTransfer) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) $('#dropzone').classList.remove('show');
    });
    window.addEventListener('drop', function (e) {
      if (!e.dataTransfer) return;
      if (Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
      e.preventDefault();
      dragDepth = 0;
      $('#dropzone').classList.remove('show');
      if (e.dataTransfer.files && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files, uploadTargetFolder());
    });

    /* internal drag: card onto folder */
    $('#board').addEventListener('dragstart', function (e) {
      var card = e.target.closest('.card[data-id]');
      if (!card) return;
      try { e.dataTransfer.setData('text/flux-drive', card.getAttribute('data-id')); e.dataTransfer.effectAllowed = 'move'; } catch (err) { }
    });
    $('#board').addEventListener('dragover', function (e) {
      var card = e.target.closest('.card[data-kind="folder"]');
      if (!card) return;
      e.preventDefault();
      $$('.card.dragover').forEach(function (x) { x.classList.remove('dragover'); });
      card.classList.add('dragover');
    });
    $('#board').addEventListener('dragleave', function (e) {
      var card = e.target.closest('.card[data-kind="folder"]');
      if (card) card.classList.remove('dragover');
    });
    $('#board').addEventListener('drop', function (e) {
      var card = e.target.closest('.card[data-kind="folder"]');
      if (!card) return;
      var srcId = '';
      try { srcId = e.dataTransfer.getData('text/flux-drive'); } catch (err) { }
      if (!srcId) return;
      e.preventDefault();
      card.classList.remove('dragover');
      var target = card.getAttribute('data-id');
      var chain = Promise.resolve(), n = 0;
      [srcId].forEach(function (id) {
        var node = S.byId[id];
        if (!node || id === target) return;
        if (node.kind === 'folder' && (descendantsOf(id).some(function (d) { return d.id === target; }) || target === id)) { toast('폴더를 자기 안으로 옮길 수 없습니다', 'err'); return; }
        chain = chain.then(function () { return updateNode(id, { parentId: target, name: uniqueName(node.name, target) }); });
        n++;
      });
      chain.then(function () { if (n) { toast('옮겼습니다'); render(); } });
    });

    window.addEventListener('hashchange', checkHashImport);

    /* OS-wide changes: theme and animation mode from Soft Hub */
    window.addEventListener('storage', function (e) {
      if (e.key === 'lemon_anim_mode') applyAnimMode(e.newValue || 'full');
      if (e.key === 'cream_theme' && e.newValue) {
        doc.documentElement.classList.toggle('dark', e.newValue === 'dark');
        syncThemeIcons();
      }
    });
  }

  var pressTimer = null, longPressed = false;
  function bindLongPress() {
    var board = $('#board');
    board.addEventListener('pointerdown', function (e) {
      var card = e.target.closest('.card[data-id], .row[data-id]');
      if (!card || e.target.closest('[data-act]')) return;
      longPressed = false;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(function () {
        longPressed = true;
        toggleSelect(card.getAttribute('data-id'));
        hap(18);
      }, 480);
    });
    ['pointerup', 'pointercancel', 'pointermove', 'pointerleave'].forEach(function (ev) {
      board.addEventListener(ev, function () { clearTimeout(pressTimer); });
    });
    board.addEventListener('contextmenu', function (e) {
      if (e.target.closest('.card[data-id], .row[data-id]')) e.preventDefault();
    });
  }

  function toggleSelect(id) {
    if (S.selected[id]) delete S.selected[id]; else S.selected[id] = 1;
    var card = $('[data-id="' + id + '"]');
    if (card) card.classList.toggle('sel', !!S.selected[id]);
    var chk = $('.check[data-id="' + id + '"]');
    if (chk) chk.classList.toggle('on', !!S.selected[id]);
    renderSelBar();
  }
  function bounceStar(btn) {
    if (!btn) return;
    btn.classList.add('star-bounce');
    setTimeout(function () { btn.classList.remove('star-bounce'); }, 520);
  }
  function clearSearch() {
    S.query = '';
    $('#searchInput').value = '';
    $('#searchClear').classList.remove('show');
    render();
  }

  /* ================= boot ================= */
  function boot() {
    loadPrefs();
    applyAnimMode(animMode());
    $('#sortLabel').textContent = S.sort === 'name' ? '이름순' : (S.sort === 'updated' ? '최근 수정순' : '용량순');
    $$('#viewSeg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === S.mode); });
    syncThemeIcons();
    wire();
    bindLongPress();
    attachRipple();
    openDB().then(loadAll).then(function () {
      render();
      scanWorks().then(function () { renderChrome(); }, function () { renderChrome(); });
      checkHashImport();
    }, function (err) {
      console.warn('[Flux Drive] 저장소 열기 실패', err);
      $('#board').innerHTML = '<div class="empty"><div class="art empty-art">' + icon('i-warn') + '</div>' +
        '<h3>브라우저 저장소를 열 수 없습니다</h3>' +
        '<p>' + esc(err && err.message ? err.message : 'IndexedDB를 사용할 수 없습니다.') + '</p>' +
        '<p class="hint">시크릿 모드나 저장소가 막힌 환경에서는 파일이 저장되지 않습니다. 일반 창에서 다시 열어 주세요. FLUX 작업물 보기는 저장소와 별개로 동작합니다.</p>' +
        '<div class="empty-actions"><button class="btn-primary" data-view="works">' + icon('i-spark') + 'FLUX 작업물 보기</button></div></div>';
      scanWorks().then(renderChrome, renderChrome);
    });
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
