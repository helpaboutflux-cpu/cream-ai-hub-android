<style>
:root {

}

  --paper: #07090d;
  --paper-2: #0d1016;
  --sheet: #12151c;
  --sheet-2: #171b23;
  --ink: #eef1f7;
  --ink-2: #b0b7c6;
  --ink-3: #7b8296;
  --line: rgba(255, 255, 255, .12);

  --glass: rgba(14, 17, 23, .82);

  --shadow-hi: 0 30px 64px -32px rgba(0, 0, 0, .9);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html, body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
body {
  margin: 0;

  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;

}
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
input, textarea { outline: none; }
ul { margin: 0; padding: 0; list-style: none; }
::selection { background: color-mix(in srgb, var(--brand) 55%, transparent); color: #fff; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.mono { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
.tabular { font-variant-numeric: tabular-nums; }

/* ---------- ambient ---------- */
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.ambient span {
  position: absolute; border-radius: 9999px; filter: blur(90px); opacity: .32;
  animation: orb 26s ease-in-out infinite;
}
html.dark .ambient span { opacity: .3; filter: blur(110px); }
.ambient span:nth-child(1) { width: 420px; height: 420px; top: -120px; left: -80px; background: color-mix(in srgb, var(--brand) 55%, transparent); }
.ambient span:nth-child(2) { width: 360px; height: 360px; top: 10%; right: -120px; background: color-mix(in srgb, var(--brand-2) 45%, transparent); animation-duration: 33s; animation-delay: -8s; }
.ambient span:nth-child(3) { width: 300px; height: 300px; bottom: -140px; left: 34%; background: color-mix(in srgb, var(--brand) 32%, transparent); animation-duration: 29s; animation-delay: -15s; }
@keyframes orb {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
  33% { transform: translate3d(26px, -30px, 0) scale(1.07); }
  66% { transform: translate3d(-22px, 20px, 0) scale(.95); }
}

/* ---------- app shell ---------- */
.app {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  min-height: 100vh;
  width: 100%;
}
.sidebar {
  position: sticky; top: 0; align-self: start;
  height: 100vh;
  display: flex; flex-direction: column;
  gap: 10px;
  padding: 14px 12px 12px;
  border-right: 1px solid var(--line-2);
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; border-radius: 14px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center; color: #fff;
  background-image: linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow: 0 14px 30px -16px rgba(var(--brand-rgb), .85);
  transition: transform .3s cubic-bezier(.3, 1.5, .5, 1);
}
.brand:hover .brand-mark { transform: rotate(-6deg) scale(1.06); }
.brand-mark .i { width: 21px; height: 21px; stroke-width: 1.8; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-txt b { font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
.brand-txt i {
  font-style: normal; font-size: 9.5px; font-weight: 800; letter-spacing: .16em;
  color: var(--ink-3); text-transform: uppercase;
}
.new-btn {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 11px 13px; margin-bottom: 4px;
  border-radius: 14px; color: #fff; font-size: 13.5px; font-weight: 800;
  background-image: linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow: 0 16px 30px -18px rgba(var(--brand-rgb), .95);
  transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), filter .2s;
  position: relative; overflow: hidden;
}
.new-btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
.new-btn:active { transform: scale(.97); }
.new-btn kbd {
  margin-left: auto; font-family: inherit; font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 6px; background: rgba(255, 255, 255, .24);
}
.side-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px 0 8px; }
.side-scroll::-webkit-scrollbar { width: 6px; }
.side-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: 11px;
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  transition: background .16s, color .16s, transform .16s;
  width: 100%; text-align: left;
}
.nav-item .i { width: 17px; height: 17px; opacity: .85; }
.nav-item:hover { background: var(--chip); color: var(--ink); }
.nav-item:active { transform: scale(.985); }
.nav-item.on {
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 12%, transparent);
  font-weight: 800;
}
html.dark .nav-item.on { color: var(--brand); background: color-mix(in srgb, var(--brand) 18%, transparent); }
.nav-item .count {
  margin-left: auto; font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums;
  color: var(--ink-3); background: var(--chip); border-radius: 999px; padding: 1px 7px;
}
.nav-item.on .count { color: var(--brand); background: color-mix(in srgb, var(--brand) 16%, transparent); }
.side-sec { margin-top: 16px; }
.side-sec-head { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 7px; }
.side-sec-head h3 { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.mini-btn {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 800; color: var(--ink-3);
  padding: 2px 6px; border-radius: 7px; transition: color .16s, background .16s;
}
.mini-btn .i { width: 13px; height: 13px; }
.mini-btn:hover { color: var(--brand); background: var(--chip); }
.folder-list { display: flex; flex-direction: column; gap: 1px; }
.folder-chip {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 11px; border-radius: 9px; font-size: 12.5px; color: var(--ink-2);
  transition: background .16s, color .16s; text-align: left;
}
.folder-chip:hover { background: var(--chip); color: var(--ink); }
.folder-chip .i { width: 15px; height: 15px; color: var(--brand); opacity: .8; }
.folder-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-chip .cnt { margin-left: auto; font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.side-foot {
  display: flex; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line-2);
}
.side-foot button, .side-foot a {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 2px; border-radius: 10px; font-size: 10px; font-weight: 700; color: var(--ink-3);
  transition: background .16s, color .16s, transform .16s;
}
.side-foot .i { width: 16px; height: 16px; }
.side-foot button:hover, .side-foot a:hover { color: var(--brand); background: var(--chip); }
.side-foot button:active { transform: scale(.94); }
.scrim {
  position: fixed; inset: 0; background: rgba(6, 8, 12, .5); z-index: 35;
  opacity: 0; pointer-events: none; transition: opacity .28s ease;
  backdrop-filter: blur(2px);
}
.scrim.show { opacity: 1; pointer-events: auto; }

/* ---------- main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  height: var(--top-h); padding: 0 20px;
  border-bottom: 1px solid var(--line-2);
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
}
.tb-title { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tb-title h1 {
  font-size: 17px; font-weight: 800; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tb-title p { font-size: 11.5px; color: var(--ink-3); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-spacer { flex: 1; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 11px;
  display: inline-grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--sheet);
  color: var(--ink-2);
  transition: transform .16s cubic-bezier(.34, 1.56, .64, 1), color .18s, border-color .18s, background .18s;
  flex-shrink: 0;
}
html.dark .icon-btn { background: rgba(23, 27, 35, .8); }
.icon-btn:hover { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.on { color: #fff; background-image: linear-gradient(135deg, var(--brand), var(--brand-2)); border-color: transparent; }
.search-wrap {
  position: relative; display: flex; align-items: center; gap: 7px;
  width: min(340px, 34vw); height: 38px; padding: 0 10px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--sheet); color: var(--ink-3);
  transition: border-color .18s, box-shadow .18s, width .25s ease;
}
.search-wrap:focus-within {
  border-color: color-mix(in srgb, var(--brand) 55%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 13%, transparent);
  width: min(420px, 40vw);
}
.search-wrap .i { width: 16px; height: 16px; }
.search-wrap input { flex: 1; min-width: 0; border: 0; background: none; font-size: 13px; color: var(--ink); }
.search-wrap input::placeholder { color: var(--ink-3); }
.search-clear {
  width: 20px; height: 20px; border-radius: 999px; display: none;
  place-items: center; color: var(--ink-3); background: var(--chip);
}
.search-clear.show { display: grid; }
.search-clear .i { width: 12px; height: 12px; }
.hub-link {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px; border-radius: 11px;
  font-size: 12px; font-weight: 800; color: var(--ink-2);
  border: 1px solid var(--line); background: var(--sheet);
  transition: color .18s, border-color .18s, transform .16s;
  white-space: nowrap;
}
.hub-link .i { width: 15px; height: 15px; }
.hub-link:hover { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); transform: translateY(-1px); }
.hub-link:active { transform: scale(.96); }
.only-mobile { display: none !important; }

.content { flex: 1; padding: 18px 22px 34px; min-width: 0; }
.crumbs {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-bottom: 14px;
}
.crumbs button { padding: 4px 7px; border-radius: 8px; transition: background .16s, color .16s; display: inline-flex; align-items: center; gap: 5px; }
.crumbs button:hover { color: var(--brand); background: var(--chip); }
.crumbs .sep { opacity: .5; }
.crumbs .cur { color: var(--ink); font-weight: 800; }
.crumbs .i { width: 14px; height: 14px; }

.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.toolbar .grow { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: 10px;
  font-size: 12.5px; font-weight: 700; color: var(--ink-2);
  border: 1px solid var(--line); background: var(--sheet);
  transition: color .16s, border-color .16s, transform .16s, background .16s;
  white-space: nowrap;
}
.pill .i { width: 15px; height: 15px; }
.pill:hover { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); transform: translateY(-1px); }
.pill:active { transform: scale(.96); }
.pill.on { color: #fff; background-image: linear-gradient(135deg, var(--brand), var(--brand-2)); border-color: transparent; box-shadow: 0 12px 24px -16px rgba(var(--brand-rgb), .9); }
.pill.danger:hover { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.fchip {
  padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
  color: var(--ink-3); background: var(--chip); border: 1px solid transparent;
  transition: color .16s, background .16s, border-color .16s, transform .16s;
}
.fchip:hover { color: var(--ink); transform: translateY(-1px); }
.fchip.on { color: var(--brand); background: color-mix(in srgb, var(--brand) 13%, transparent); border-color: color-mix(in srgb, var(--brand) 32%, transparent); }
.fchip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 3px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--chip); }
.seg button {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 9px; border-radius: 7px; font-size: 11.5px; font-weight: 700; color: var(--ink-3);
  transition: background .18s, color .18s, transform .14s;
}
.seg button .i { width: 14px; height: 14px; }
.seg button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
html.dark .seg button.on { background: rgba(255, 255, 255, .16); color: #fff; }
.seg button:active { transform: scale(.94); }

/* ---------- file grid ---------- */
.grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(174px, 1fr));
}
.card {
  position: relative; display: flex; flex-direction: column; gap: 8px;
  padding: 13px 13px 11px; min-height: 150px;
  border-radius: var(--r); border: 1px solid var(--line-2);
  background: var(--sheet);
  box-shadow: 0 1px 2px rgba(16, 20, 30, .04);
  text-align: left; cursor: pointer;
  transition: transform .26s cubic-bezier(.2, .85, .25, 1), box-shadow .26s, border-color .2s, background .2s;
  animation: cardIn .4s cubic-bezier(.22, 1, .36, 1) both;
  will-change: transform;
  overflow: hidden;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@media (hover: hover) {
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 22px 40px -26px rgba(20, 40, 90, .5);
    border-color: color-mix(in srgb, var(--brand) 32%, var(--line-2));
  }
  .card:hover .card-actions { opacity: 1; transform: none; }
}
.card:active { transform: scale(.99); }
.card.sel { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 35%, transparent); background: color-mix(in srgb, var(--brand) 5%, var(--sheet)); }
.card.dragover { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--sheet)); transform: scale(1.02); }
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.tile {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--tc, var(--brand)) 13%, transparent);
  color: var(--tc, var(--brand));
  transition: transform .26s cubic-bezier(.3, 1.5, .5, 1);
}
.card:hover .tile { transform: scale(1.07) rotate(-3deg); }
.tile .i { width: 21px; height: 21px; }
.tile.thumb { overflow: hidden; padding: 0; background: var(--chip); }
.tile.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-name {
  font-size: 13px; font-weight: 800; letter-spacing: -.01em; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  word-break: break-all;
}
.card-meta { font-size: 10.5px; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.card-bottom { margin-top: auto; display: flex; align-items: center; gap: 6px; }
.card-tag {
  font-size: 9.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 6px;
  color: var(--ink-3); background: var(--chip);
}
.card-actions {
  position: absolute; top: 8px; right: 8px; display: flex; gap: 3px;
  opacity: 0; transform: translateY(-3px); transition: opacity .2s, transform .2s;
}
.card-actions button {
  width: 25px; height: 25px; border-radius: 8px; display: grid; place-items: center;
  background: var(--sheet); color: var(--ink-2); border: 1px solid var(--line-2);
  transition: color .16s, background .16s, transform .16s;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .06);
}
.card-actions button .i { width: 13px; height: 13px; }
.card-actions button:hover { color: var(--brand); }
.card-actions button:active { transform: scale(.9); }
.card-actions button.starred { color: #eab308; }
.check {
  position: absolute; top: 8px; left: 8px; width: 19px; height: 19px; border-radius: 6px;
  border: 1.5px solid var(--line); background: var(--sheet);
  display: grid; place-items: center; color: transparent;
  transition: background .16s, border-color .16s, color .16s, transform .16s, opacity .16s;
  z-index: 2; opacity: 0;
}
.check .i { width: 12px; height: 12px; stroke-width: 3; }
.card:hover .check, .card.sel .check { opacity: 1; }
.check.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.app.selmode .check { opacity: 1; }
.app.selmode .card-actions { opacity: 0 !important; }
.app.selmode .fab { display: none !important; }
.check:hover { border-color: var(--brand); }
.check.hint { opacity: 1; }
.star-mark { position: absolute; top: 9px; left: 9px; color: #eab308; display: none; }
.star-mark.show { display: block; }
.star-mark .i { width: 15px; height: 15px; fill: currentColor; }

/* ---------- file list ---------- */
.list { display: flex; flex-direction: column; gap: 2px; }
.list-head, .row {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) 92px 78px 108px 74px;
  align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 10px;
}
.list-head {
  font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 1px solid var(--line-2); border-radius: 0;
  padding-bottom: 9px; margin-bottom: 4px;
}
.row {
  border: 1px solid transparent; cursor: pointer;
  transition: background .16s, border-color .16s, transform .16s;
  animation: cardIn .32s cubic-bezier(.22, 1, .36, 1) both;
}
.row:hover { background: var(--sheet); border-color: var(--line-2); transform: translateX(2px); }
.row.sel { background: color-mix(in srgb, var(--brand) 8%, var(--sheet)); border-color: color-mix(in srgb, var(--brand) 40%, transparent); }
.row .r-name { display: flex; align-items: center; gap: 9px; min-width: 0; }
.row .r-name .tile { width: 28px; height: 28px; border-radius: 8px; }
.row .r-name .tile .i { width: 15px; height: 15px; }
.row .r-name b { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .cell { font-size: 11.5px; color: var(--ink-3); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r-actions { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity .16s; }
.row:hover .r-actions { opacity: 1; }
.row .r-actions button {
  width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3);
  transition: color .16s, background .16s;
}
.row .r-actions button:hover { color: var(--brand); background: var(--chip); }
.row .r-actions .i { width: 13px; height: 13px; }
.row .check { position: static; opacity: 1; }

/* ---------- section headings ---------- */
.sec-head { display: flex; align-items: baseline; gap: 9px; margin: 4px 0 12px; flex-wrap: wrap; row-gap: 8px; }
.sec-head h2 { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
.sec-head p { font-size: 11.5px; color: var(--ink-3); font-weight: 600; flex: 1 1 220px; min-width: 0; }
.sec-head .grow { flex: 1; }

/* ---------- empty state ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 54px 20px 60px; text-align: center;
  border: 1px dashed var(--line); border-radius: 22px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--brand) 4%, transparent), transparent 70%);
  animation: fadeIn .5s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.empty-art {
  position: relative; width: 116px; height: 116px; display: grid; place-items: center;
  border-radius: 30px; color: var(--brand);
  background: color-mix(in srgb, var(--brand) 10%, transparent);
  animation: floaty 5s ease-in-out infinite;
}
.empty-art .i { width: 52px; height: 52px; stroke-width: 1.3; }
.empty-art::after {
  content: ''; position: absolute; inset: -7px; border-radius: 34px;
  border: 1px dashed color-mix(in srgb, var(--brand) 35%, transparent);
  animation: spinSlow 22s linear infinite;
}
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes spinSlow { to { transform: rotate(360deg); } }
.empty h3 { font-size: 16.5px; font-weight: 800; }
.empty p { font-size: 12.5px; color: var(--ink-3); max-width: 380px; line-height: 1.65; }
.empty-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 16px; border-radius: 12px; color: #fff;
  font-size: 12.5px; font-weight: 800;
  background-image: linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow: 0 14px 28px -16px rgba(var(--brand-rgb), .9);
  transition: transform .16s cubic-bezier(.3, 1.5, .5, 1), filter .2s;
}
.btn-primary .i { width: 16px; height: 16px; }
.btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn-primary:active { transform: scale(.96); }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 16px; border-radius: 12px; font-size: 12.5px; font-weight: 800;
  color: var(--ink-2); border: 1px solid var(--line); background: var(--sheet);
  transition: color .16s, border-color .16s, transform .16s;
}
.btn-ghost .i { width: 16px; height: 16px; }
.btn-ghost:hover { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); transform: translateY(-1px); }
.btn-ghost:active { transform: scale(.96); }
.btn-danger {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 16px; border-radius: 12px; font-size: 12.5px; font-weight: 800;
  color: #fff; background: var(--danger);
  transition: filter .18s, transform .16s;
}
.btn-danger:hover { filter: brightness(1.06); }
.btn-danger:active { transform: scale(.96); }

/* ---------- drop overlay ---------- */
.dropzone {
  position: fixed; inset: 0; z-index: 60; display: none;
  align-items: center; justify-content: center; padding: 24px;
  background: rgba(8, 12, 20, .55); backdrop-filter: blur(6px);
}
.dropzone.show { display: flex; animation: fadeIn .18s ease both; }
.dz-inner {
  width: min(480px, 92vw); padding: 34px 26px; border-radius: 26px; text-align: center;
  border: 2px dashed color-mix(in srgb, var(--brand) 60%, transparent);
  background: var(--sheet); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  animation: popIn .32s cubic-bezier(.2, 1.5, .4, 1) both;
  box-shadow: var(--shadow-hi);
}
.dz-inner .dz-ico {
  width: 68px; height: 68px; border-radius: 20px; display: grid; place-items: center;
  color: #fff; background-image: linear-gradient(135deg, var(--brand), var(--brand-2));
  animation: pulseGlow 1.6s ease-in-out infinite;
}
.dz-inner .dz-ico .i { width: 30px; height: 30px; }
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(var(--brand-rgb), .45); transform: scale(1); }
  50% { box-shadow: 0 0 0 16px rgba(var(--brand-rgb), 0); transform: scale(1.05); }
}
.dz-inner b { font-size: 15px; font-weight: 800; }
.dz-inner span { font-size: 12px; color: var(--ink-3); }

/* ---------- modal ---------- */
.modal {
  position: fixed; inset: 0; z-index: 70; display: none;
  padding: 22px; align-items: center; justify-content: center;
  background: rgba(6, 9, 15, .58); backdrop-filter: blur(5px);
}
.modal.show { display: flex; animation: fadeIn .18s ease both; }
.sheet {
  width: 100%; max-width: 520px; max-height: calc(100vh - 44px);
  display: flex; flex-direction: column;
  border-radius: 22px; border: 1px solid var(--line);
  background: var(--sheet); box-shadow: var(--shadow-hi);
  animation: springIn .42s cubic-bezier(.16, 1.24, .3, 1) both;
  overflow: hidden;
}
.modal.closing .sheet { animation: springOut .2s ease both; }
.sheet.wide { max-width: 1000px; }
.sheet.mid { max-width: 680px; }
@keyframes springIn {
  0% { opacity: 0; transform: translateY(18px) scale(.93); }
  60% { opacity: 1; transform: translateY(-3px) scale(1.008); }
  100% { opacity: 1; transform: none; }
}
@keyframes springOut { to { opacity: 0; transform: translateY(10px) scale(.96); } }
.sheet-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid var(--line-2);
}
.sheet-head .st { min-width: 0; flex: 1; }
.sheet-head h2 { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head p { font-size: 11px; color: var(--ink-3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { padding: 16px; overflow: auto; min-height: 0; flex: 1; }
.sheet-body.flush { padding: 0; }
.sheet-foot {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-top: 1px solid var(--line-2); background: var(--sheet-2); flex-wrap: wrap;
}
.sheet-foot .grow { flex: 1; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 800; color: var(--ink-3); margin-bottom: 5px; }
.input {
  width: 100%; padding: 9px 11px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--paper); font-size: 13px; color: var(--ink);
  transition: border-color .18s, box-shadow .18s;
}
.input:focus { border-color: color-mix(in srgb, var(--brand) 60%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 12%, transparent); }
.hint { font-size: 11px; color: var(--ink-3); line-height: 1.6; }
.modal-close { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); }
.modal-close:hover { color: var(--ink); background: var(--chip); }
.tabs { display: flex; gap: 4px; padding: 3px; border-radius: 11px; background: var(--chip); margin-bottom: 12px; }
.tabs button { flex: 1; padding: 6px 8px; border-radius: 8px; font-size: 11.5px; font-weight: 800; color: var(--ink-3); transition: background .16s, color .16s; }
.tabs button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

/* folder picker */
.pick-list { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow: auto; }
.pick-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px;
  font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-align: left; width: 100%;
  transition: background .16s, color .16s;
}
.pick-row:hover { background: var(--chip); color: var(--ink); }
.pick-row.on { background: color-mix(in srgb, var(--brand) 12%, transparent); color: var(--brand); font-weight: 800; }
.pick-row .i { width: 15px; height: 15px; color: var(--brand); }
.pick-row .ind { color: var(--ink-3); font-size: 10px; margin-left: auto; }

/* preview */
.pv-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.pv-stage {
  flex: 1; min-height: 320px; display: grid; place-items: center;
  background:
    repeating-conic-gradient(from 0deg, var(--paper-2) 0% 25%, var(--paper) 0% 50%) 50% / 22px 22px;
  overflow: auto; position: relative; padding: 14px;
}
.pv-stage img {
  max-width: 100%; max-height: 62vh; border-radius: 10px;
  box-shadow: 0 20px 50px -24px rgba(0, 0, 0, .5);
  transition: transform .3s cubic-bezier(.2, .9, .25, 1);
  transform-origin: center center;
}
.pv-stage iframe { width: 100%; height: 62vh; border: 0; border-radius: 10px; background: #fff; }
.pv-stage video, .pv-stage audio { max-width: 100%; border-radius: 12px; }
.pv-stage video { max-height: 62vh; box-shadow: 0 20px 50px -26px rgba(0, 0, 0, .6); }
.pv-stage .audio-card {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 30px 26px; border-radius: 20px; background: var(--sheet); border: 1px solid var(--line);
  box-shadow: var(--shadow); width: min(420px, 100%);
}
.pv-stage .audio-card .tile { width: 62px; height: 62px; border-radius: 18px; }
.pv-stage .audio-card .tile .i { width: 30px; height: 30px; }
.pv-stage .audio-card b { font-size: 13px; font-weight: 800; text-align: center; word-break: break-all; }
.pv-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line-2); background: var(--sheet-2); flex-wrap: wrap; }
.pv-toolbar .zoomval { font-size: 11px; font-weight: 800; color: var(--ink-3); min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.pv-info {
  width: 272px; flex-shrink: 0; padding: 16px; border-left: 1px solid var(--line-2);
  overflow: auto; display: flex; flex-direction: column; gap: 12px;
  background: var(--sheet);
}
.pv-info .kv { display: flex; flex-direction: column; gap: 2px; }
.pv-info .kv span { font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.pv-info .kv b { font-size: 12px; font-weight: 700; word-break: break-all; }
.pv-main { display: flex; min-height: 0; flex: 1; }
.pv-code {
  width: 100%; margin: 0; padding: 12px 0; overflow: auto; background: var(--sheet);
  font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 12px; line-height: 1.65; color: var(--ink); max-height: 62vh; text-align: left;
}
.pv-code .ln { display: flex; }
.pv-code .ln i {
  width: 46px; flex-shrink: 0; text-align: right; padding-right: 12px;
  color: var(--ink-3); font-style: normal; opacity: .7; user-select: none;
}
.pv-code .ln code { white-space: pre; padding-right: 14px; }
.pv-text {
  width: 100%; max-height: 62vh; overflow: auto; padding: 18px 20px;
  background: var(--sheet); border-radius: 12px; border: 1px solid var(--line-2);
  font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; text-align: left;
}
.pv-json { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; }
.pv-note {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 40px 20px; text-align: center; color: var(--ink-3);
}
.pv-note .tile { width: 58px; height: 58px; border-radius: 17px; }
.pv-note .tile .i { width: 28px; height: 28px; }
.pv-note b { color: var(--ink); font-size: 14px; }
.pv-note p { font-size: 12px; line-height: 1.7; max-width: 300px; }

/* analytics */
.an-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat {
  padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line-2);
  background: var(--sheet); display: flex; flex-direction: column; gap: 3px;
  transition: transform .22s cubic-bezier(.2, .9, .3, 1), box-shadow .22s;
}
.stat:hover { transform: translateY(-3px); box-shadow: 0 18px 34px -24px rgba(20, 40, 90, .45); }
.stat span { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.stat b { font-size: 21px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat i { font-size: 11px; font-style: normal; color: var(--ink-3); font-weight: 600; }
.bars { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--chip); margin: 6px 0 14px; }
.bars i { display: block; height: 100%; transition: width .6s cubic-bezier(.22, 1, .36, 1), filter .2s; }
.bars i:hover { filter: brightness(1.1); }
.type-list { display: flex; flex-direction: column; gap: 9px; }
.type-row { display: grid; grid-template-columns: 116px minmax(0, 1fr) 88px 56px; align-items: center; gap: 10px; font-size: 12px; }
.type-row .tn { display: flex; align-items: center; gap: 7px; font-weight: 700; color: var(--ink-2); }
.type-row .tn .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
.type-row .track { height: 7px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.type-row .track i { display: block; height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.22, 1, .36, 1); }
.type-row .tb { text-align: right; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.type-row .tc { text-align: right; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.big-list { display: flex; flex-direction: column; gap: 4px; }
.big-row { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 10px; font-size: 12px; transition: background .16s; }
.big-row:hover { background: var(--chip); }
.big-row .tile { width: 26px; height: 26px; border-radius: 8px; }
.big-row .tile .i { width: 14px; height: 14px; }
.big-row b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.big-row span { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }

/* works */
.works-apps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.wapp {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px 6px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 800;
  border: 1px solid var(--line-2); background: var(--sheet); color: var(--ink-2);
  transition: transform .16s, border-color .18s, color .18s;
}
.wapp .dot { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; color: #fff; }
.wapp .dot .i { width: 10px; height: 10px; }
.wapp .n { opacity: .6; font-size: 10px; font-variant-numeric: tabular-nums; }
.wapp:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--brand) 40%, transparent); }
.wapp.on { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); background: color-mix(in srgb, var(--brand) 9%, var(--sheet)); }
.work-card { min-height: 168px; }
.work-card .src { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.work-card .snippet {
  font-size: 11px; color: var(--ink-3); line-height: 1.6; margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.work-card .card-bottom { gap: 5px; }
.wbadge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px;
  color: color-mix(in srgb, var(--wc, var(--brand)) 75%, black);
  background: color-mix(in srgb, var(--wc, var(--brand)) 14%, transparent);
}
html.dark .wbadge { color: color-mix(in srgb, var(--wc, var(--brand)) 50%, white); }
.scan-state { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.scan-state .spin {
  width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line);
  border-top-color: var(--brand); animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* upload progress */
.upbar {
  display: flex; align-items: center; gap: 9px; margin: 0 0 12px;
  padding: 8px 12px; border-radius: 12px;
  border: 1px solid var(--line-2); background: var(--sheet);
  animation: popIn .3s cubic-bezier(.22, 1, .4, 1) both;
}
.upbar .track { flex: 1; height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.upbar .track i {
  display: block; height: 100%; width: 0%; border-radius: 999px;
  background-image: linear-gradient(90deg, var(--brand), var(--brand-2));
  transition: width .35s cubic-bezier(.22, 1, .36, 1);
  position: relative;
}
.upbar .track i::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
  animation: progShine 1.2s linear infinite;
}
@keyframes progShine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.upbar span { font-size: 11px; font-weight: 800; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* stagger + micro animations */
.card { animation-delay: var(--d, 0ms); }
.row { animation-delay: var(--d, 0ms); }
@keyframes starPop {
  0% { transform: scale(1); }
  35% { transform: scale(1.4) rotate(-14deg); }
  70% { transform: scale(.9) rotate(4deg); }
  100% { transform: scale(1) rotate(0); }
}
.star-bounce .i { animation: starPop .5s cubic-bezier(.22, 1.4, .36, 1) both; }
.crumbs { animation: crumbIn .32s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes crumbIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.tb-title h1 { animation: titleIn .4s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes titleIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* Soft Hub 전역 애니메이션 설정 */
html[data-anim="reduced"] *,
html[data-anim="reduced"] *::before,
html[data-anim="reduced"] *::after {
  animation-duration: .16s !important;
  animation-delay: 0ms !important;
  transition-duration: .16s !important;
}
html[data-anim="reduced"] .ambient span,
html[data-anim="reduced"] .empty-art,
html[data-anim="reduced"] .empty-art::after,
html[data-anim="reduced"] .dz-ico,
html[data-anim="reduced"] .upbar .track i::after,
html[data-anim="reduced"] .progress-fill::after { animation: none !important; }
html[data-anim="reduced"] .card:hover { transform: translateY(-2px); }
html[data-anim="reduced"] .card:hover .tile { transform: none; }
html[data-anim="reduced"] .btn-shimmer::after { display: none; }
html[data-anim="off"] *,
html[data-anim="off"] *::before,
html[data-anim="off"] *::after {
  animation-duration: .001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: .001ms !important;
  scroll-behavior: auto !important;
  animation-delay: 0ms !important;
}
html[data-anim="off"] .ambient span,
html[data-anim="off"] .empty-art::after { animation: none !important; }

/* misc */
.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 44px; color: var(--ink-3); font-size: 12px; font-weight: 700; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
.notice {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--brand) 25%, transparent);
  background: color-mix(in srgb, var(--brand) 7%, transparent);
  font-size: 12px; color: var(--ink-2); line-height: 1.6;
}
.notice .i { width: 16px; height: 16px; color: var(--brand); margin-top: 1px; }
.share-out {
  display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--paper);
  font-size: 11px; word-break: break-all; font-family: ui-monospace, monospace;
  color: var(--ink-2); max-height: 88px; overflow: auto;
}
.dim { color: var(--ink-3); }
.divider { height: 1px; background: var(--line-2); margin: 12px 0; }
.selbar {
  position: sticky; bottom: 14px; z-index: 18;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin: 16px auto 0; width: fit-content; max-width: 100%;
  padding: 8px 10px; border-radius: 15px;
  background: var(--sheet); border: 1px solid var(--line);
  box-shadow: var(--shadow-hi);
  animation: springIn .34s cubic-bezier(.16, 1.24, .3, 1) both;
}
.selbar b { font-size: 12px; font-weight: 800; padding: 0 4px; font-variant-numeric: tabular-nums; }
.fab {
  position: fixed; right: 18px; bottom: calc(var(--dock-h) + 18px); z-index: 25;
  width: 54px; height: 54px; border-radius: 18px; display: none; place-items: center;
  color: #fff; background-image: linear-gradient(135deg, var(--brand), var(--brand-2));
  box-shadow: 0 18px 34px -16px rgba(var(--brand-rgb), .9);
  transition: transform .18s cubic-bezier(.3, 1.6, .5, 1);
}
.fab .i { width: 24px; height: 24px; }
.fab:active { transform: scale(.93); }
.dock { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .pv-info { display: none; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 280px;
    transform: translateX(-104%); transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    box-shadow: var(--shadow-hi); background: var(--sheet); z-index: 40;
  }
  .sidebar.open { transform: none; }
  .only-mobile { display: inline-grid !important; }
  #btnNewFolder, #btnUpload, #themeBtnTop { display: none !important; }
  .hub-link .lbl { display: none; }
  .hub-link { width: 36px; padding: 0; justify-content: center; }
  .topbar { padding: 0 12px; gap: 7px; }
  .tb-title { flex: 1 1 auto; }
  .tb-title h1 { font-size: 15px; }
  .tb-title p { display: none; }
  .tb-spacer { display: none; }
  .search-wrap { width: auto; flex: 1 1 90px; min-width: 0; }
  .search-wrap:focus-within { width: auto; }
  .search-wrap input { font-size: 12px; }
  .toolbar {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    padding-bottom: 2px; margin-bottom: 10px;
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar > * { flex-shrink: 0; }
  .toolbar .grow { flex: 1 0 8px; }
  #tbExample, #tbZip { display: none; }
  .sec-head .grow { display: none; }
  .sec-head p { flex-basis: 100%; order: 4; }
  .content { padding: 14px 14px calc(var(--dock-h) + 26px); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 26;
    display: flex; align-items: stretch; justify-content: space-around;
    height: calc(var(--dock-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--glass); backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-top: 1px solid var(--line-2);
  }
  .dock button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 9.5px; font-weight: 800; color: var(--ink-3);
    transition: color .18s, transform .16s;
  }
  .dock button .i { width: 20px; height: 20px; }
  .dock button.on { color: var(--brand); }
  .dock button.on .i { filter: drop-shadow(0 4px 8px rgba(var(--brand-rgb), .5)); }
  .dock button:active { transform: scale(.92); }
  .fab { display: grid; }
  .list-head { display: none; }
  .row { grid-template-columns: 24px minmax(0, 1fr) 60px; }
  .row .cell.hide-m { display: none; }
  .row .r-actions { opacity: 1; }
  .selbar { position: fixed; left: 10px; right: 10px; width: auto; bottom: calc(var(--dock-h) + 10px); margin: 0; justify-content: center; }
  .modal { padding: 10px; align-items: flex-end; }
  .sheet { max-height: calc(100vh - 20px); border-radius: 20px; }
  .pv-stage iframe { height: 54vh; }
  .pv-stage img { max-height: 48vh; }
  .pv-code, .pv-text { max-height: 54vh; }
  .type-row { grid-template-columns: 92px minmax(0, 1fr) 74px; }
  .type-row .tc { display: none; }
}
@media (max-width: 420px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .card { min-height: 150px; padding: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  html[data-anim="full"] *,
  html:not([data-anim]) *,
  *, *::before, *::after {
    animation-duration: .001s !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001s !important;
    scroll-behavior: auto !important;
  }
  .empty-art, .ambient span { animation: none !important; }
}

<script src="lemon-ui.js"></script>
<script src="vendor/lz-string.min.js"></script>
<script>
/* =====================================================================
   Flux Drive · 로컬 드라이브 (IndexedDB flux_drive_v1)
   파일·폴더 보관함, 리치 미리보기, FLUX 작업물 통합 보기, ZIP 백업.
   서버로 아무것도 보내지 않습니다.
   ===================================================================== */
(function () {
  'use strict';

  var doc = document;
  var $ = function (s, r) { return (r || doc).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || doc).querySelectorAll(s)); };
  var L = window.Lemon || {};
  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg, type) { try { L.toast ? L.toast(msg, type || 'ok') : console.log(msg); } catch (e) { } }
  function hap(ms) { try { L.hap ? L.hap(ms) : null; } catch (e) { } }
  function fmtBytes(b) { return L.fmtBytes ? L.fmtBytes(b) : (b || 0) + ' B'; }
  function icon(id, cls) { return '<svg class="i ' + (cls || '') + '"><use href="#' + id + '"></use></svg>'; }
  function uid(p) { return (p || 'n') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function nowTs() { return Date.now(); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function when(ts) {
    if (!ts) return '-';
    var d = new Date(ts), n = new Date();
    var same = d.toDateString() === n.toDateString();
    if (same) return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var y = new Date(n.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return '어제';
    var diff = (n.getTime() - ts) / 86400000;
    if (diff < 7 && diff > 0) return Math.max(1, Math.floor(diff)) + '일 전';
    return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fullDate(ts) {
    if (!ts) return '-';
    var d = new Date(ts);
    return d.getFullYear() + '. ' + pad2(d.getMonth() + 1) + '. ' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }

  /* ---------------- file type map ---------------- */
  var TYPES = [
    { id: 'image', name: '이미지', icon: 'i-image', color: '#0ea5e9', exts: 'png jpg jpeg gif webp svg avif bmp heic ico' },
    { id: 'pdf', name: 'PDF', icon: 'i-pdf', color: '#e11d48', exts: 'pdf' },
    { id: 'doc', name: '문서', icon: 'i-doc', color: '#2563eb', exts: 'doc docx hwp hwpx odt rtf pages txt md markdown rst log' },
    { id: 'code', name: '코드·데이터', icon: 'i-code', color: '#475569', exts: 'js mjs ts jsx tsx html htm css scss json xml yml yaml py java c cs cpp go rs rb php sh sql vue svelte csv tsv' },
    { id: 'sheet', name: '스프레드시트', icon: 'i-sheet', color: '#0f9d63', exts: 'xls xlsx numbers ods' },
    { id: 'slide', name: '프레젠테이션', icon: 'i-slide', color: '#ea580c', exts: 'ppt pptx key odp' },
    { id: 'audio', name: '오디오', icon: 'i-audio', color: '#a855f7', exts: 'mp3 wav ogg m4a aac flac opus amr' },
    { id: 'video', name: '동영상', icon: 'i-video', color: '#db2777', exts: 'mp4 webm mov mkv avi m4v mpg mpeg' },
    { id: 'zip', name: '압축', icon: 'i-zip', color: '#a16207', exts: 'zip rar 7z tar gz bz2' },
    { id: 'file', name: '기타', icon: 'i-file', color: '#64748b', exts: '' }
  ];
  var TYPE_BY_ID = {};
  TYPES.forEach(function (t) {
    TYPE_BY_ID[t.id] = t;
    t.list = t.exts ? t.exts.split(' ') : [];
  });
  function extOf(name) {
    var m = String(name || '').toLowerCase().match(/\.([a-z0-9]{1,8})$/);
    return m ? m[1] : '';
  }
  function typeOf(node) {
    var e = extOf(node.name || '');
    for (var i = 0; i < TYPES.length; i++) {
      if (TYPES[i].list.indexOf(e) > -1) return TYPES[i];
    }
    var mime = node.mime || '';
    if (mime.indexOf('image/') === 0) return TYPE_BY_ID.image;
    if (mime === 'application/pdf') return TYPE_BY_ID.pdf;
    if (mime.indexOf('audio/') === 0) return TYPE_BY_ID.audio;
    if (mime.indexOf('video/') === 0) return TYPE_BY_ID.video;
    if (mime.indexOf('text/') === 0) return TYPE_BY_ID.doc;
    return TYPE_BY_ID.file;
  }
  function isTextLike(node) {
    var t = typeOf(node).id;
    if (t === 'doc' || t === 'code') return (node.size || 0) <= 900000;
    return false;
  }
  var MIME = {
    txt: 'text/plain;charset=utf-8', md: 'text/markdown;charset=utf-8', csv: 'text/csv;charset=utf-8',
    json: 'application/json', html: 'text/html;charset=utf-8', css: 'text/css;charset=utf-8',
    js: 'text/javascript;charset=utf-8', svg: 'image/svg+xml', pdf: 'application/pdf',
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp',
    mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', mp4: 'video/mp4', webm: 'video/webm',
    zip: 'application/zip'
  };
  function mimeOf(name, given) {
    if (given && given !== 'application/octet-stream') return given;
    return MIME[extOf(name)] || 'application/octet-stream';
  }

  /* ---------------- IndexedDB ---------------- */
  var DB_NAME = 'flux_drive_v1';
  var DB_VER = 1;
  var dbP = null;
  function openDB() {
    if (dbP) return dbP;
    dbP = new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('IndexedDB를 쓸 수 없는 브라우저입니다.')); return; }
      var rq;
      try { rq = indexedDB.open(DB_NAME, DB_VER); } catch (e) { rej(e); return; }
      rq.onupgradeneeded = function () {
        var db = rq.result;
        if (!db.objectStoreNames.contains('nodes')) {
          var st = db.createObjectStore('nodes', { keyPath: 'id' });
          st.createIndex('parentId', 'parentId', { unique: false });
          st.createIndex('trashed', 'trashed', { unique: false });
          st.createIndex('updatedAt', 'updatedAt', { unique: false });
        }
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      };
      rq.onsuccess = function () {
        var db = rq.result;
        db.onversionchange = function () { try { db.close(); } catch (e) { } dbP = null; };
        res(db);
      };
      rq.onerror = function () { rej(rq.error || new Error('저장소를 열지 못했습니다.')); };
      rq.onblocked = function () { rej(new Error('저장소가 다른 탭에서 사용 중입니다.')); };
    });
    dbP = dbP.then(function (db) { return db; }, function (err) { dbP = null; throw err; });
    return dbP;
  }
  function reqP(req) {
    return new Promise(function (res, rej) {
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
  }
  function store(db, name, mode) { return db.transaction(name, mode || 'readonly').objectStore(name); }
  function getAllNodes() {
    return openDB().then(function (db) { return reqP(store(db, 'nodes').getAll()); });
  }
  function putNode(node) {
    return openDB().then(function (db) { return reqP(store(db, 'nodes', 'readwrite').put(node)); });
  }
  function putManyNodes(list) {
    return openDB().then(function (db) {
      var tx = db.transaction('nodes', 'readwrite'), st = tx.objectStore('nodes');
      list.forEach(function (n) { st.put(n); });
      return new Promise(function (res, rej) { tx.oncomplete = res; tx.onerror = function () { rej(tx.error); }; });
    });
  }
  function putBlob(id, blob) {
    return openDB().then(function (db) { return reqP(store(db, 'blobs', 'readwrite').put({ id: id, blob: blob })); });
  }
  function getBlob(id) {
    return openDB().then(function (db) { return reqP(store(db, 'blobs').get(id)); })
      .then(function (rec) { return rec ? rec.blob : null; });
  }
  function deleteBlob(id) {
    return openDB().then(function (db) { return reqP(store(db, 'blobs', 'readwrite').delete(id)); });
  }
  function deleteNodeRow(id) {
    return openDB().then(function (db) { return reqP(store(db, 'nodes', 'readwrite').delete(id)); });
  }
  function clearEverything() {
    return openDB().then(function (db) {
      var tx = db.transaction(['nodes', 'blobs'], 'readwrite');
      tx.objectStore('nodes').clear();
      tx.objectStore('blobs').clear();
      return new Promise(function (res, rej) { tx.oncomplete = res; tx.onerror = function () { rej(tx.error); }; });
    });
  }
  function askPersist() {
    try {
      if (navigator.storage && navigator.storage.persist && !window.__drivePersistAsked) {
        window.__drivePersistAsked = true;
        navigator.storage.persist().catch(function () { });
      }
    } catch (e) { }
  }

  /* ---------------- state ---------------- */
  var S = {
    view: 'drive',
    folderId: null,
    query: '',
    filter: 'all',
    mode: 'grid',
    sort: 'name',
    nodes: [],
    byId: {},
    selected: {},
    works: [],
    workApps: [],
    worksScanned: false,
    worksNote: '',
    previewEl: null,
    previewUrl: null,
    imgZoom: 1,
    imgRot: 0,
    lastFocus: null
  };
  var thumbCache = {};

  function loadPrefs() {
    try {
      var m = localStorage.getItem('flux_drive_view_mode');
      if (m === 'grid' || m === 'list') S.mode = m;
      var s = localStorage.getItem('flux_drive_sort');
      if (s === 'name' || s === 'updated' || s === 'size') S.sort = s;
    } catch (e) { }
  }
  function savePrefs() {
    try {
      localStorage.setItem('flux_drive_view_mode', S.mode);
      localStorage.setItem('flux_drive_sort', S.sort);
    } catch (e) { }
  }

  function childrenOf(parentId) {
    return S.nodes.filter(function (n) { return !n.trashed && n.parentId === (parentId || null); });
  }
  function descendantsOf(id, acc) {
    acc = acc || [];
    S.nodes.forEach(function (n) {
      if (n.parentId === id) { acc.push(n); descendantsOf(n.id, acc); }
    });
    return acc;
  }
  function pathOf(id) {
    var path = [], guard = 0, cur = S.byId[id];
    while (cur && guard++ < 40) { path.unshift(cur); cur = cur.parentId ? S.byId[cur.parentId] : null; }
    return path;
  }
  function folderPathOf(id) {
    var p = [], guard = 0, cur = id;
    while (cur && S.byId[cur] && guard++ < 40) { p.unshift(S.byId[cur].name); cur = S.byId[cur].parentId; }
    return p.join('/');
  }
  function usage() {
    var bytes = 0, files = 0, folders = 0, starred = 0, trashed = 0;
    S.nodes.forEach(function (n) {
      if (n.trashed) { trashed++; return; }
      if (n.kind === 'folder') folders++;
      else { files++; bytes += (n.size || 0); }
      if (n.starred) starred++;
    });
    return { bytes: bytes, files: files, folders: folders, starred: starred, trashed: trashed };
  }

  /* ---------------- store operations ---------------- */
  function loadAll() {
    return getAllNodes().then(function (list) {
      S.nodes = list || [];
      S.byId = {};
      S.nodes.forEach(function (n) { S.byId[n.id] = n; });
    });
  }

  function createFolder(name, parentId) {
    var clean = String(name || '').trim() || '새 폴더';
    var node = {
      id: uid('f'), kind: 'folder', name: uniqueName(clean, parentId), parentId: parentId || null,
      size: 0, mime: '', ext: '', createdAt: nowTs(), updatedAt: nowTs(), starred: 0, trashed: 0, trashedAt: 0
    };
    return putNode(node).then(function () {
      S.nodes.push(node); S.byId[node.id] = node;
      return node;
    });
  }
  function uniqueName(name, parentId) {
    var siblings = S.nodes.filter(function (n) { return !n.trashed && n.parentId === (parentId || null); });
    var taken = {};
    siblings.forEach(function (n) { taken[n.name.toLowerCase()] = 1; });
    if (!taken[name.toLowerCase()]) return name;
    var base = name.replace(/(\.[a-z0-9]{1,8})$/i, '');
    var ext = name.slice(base.length);
    var i = 2;
    while (taken[(base + ' (' + i + ')' + ext).toLowerCase()]) i++;
    return base + ' (' + i + ')' + ext;
  }

  function saveFileNode(file, parentId, opts) {
    opts = opts || {};
    var name = uniqueName(opts.name || file.name || '이름 없는 파일', parentId);
    var node = {
      id: uid('d'), kind: 'file', name: name, parentId: parentId || null,
      size: file.size || 0, mime: mimeOf(name, file.type), ext: extOf(name),
      createdAt: nowTs(), updatedAt: nowTs(), starred: opts.starred ? 1 : 0, trashed: 0, trashedAt: 0,
      note: opts.note || ''
    };
    return putBlob(node.id, file).then(function () { return putNode(node); }).then(function () {
      S.nodes.push(node); S.byId[node.id] = node;
      return node;
    });
  }

  function updateNode(id, patch) {
    var n = S.byId[id];
    if (!n) return Promise.resolve(null);
    Object.keys(patch).forEach(function (k) { n[k] = patch[k]; });
    n.updatedAt = patch.keepTime ? n.updatedAt : nowTs();
    return putNode(n).then(function () { return n; });
  }

  function trashNode(id) {
    var n = S.byId[id];
    if (!n) return Promise.resolve();
    var list = [n].concat(n.kind === 'folder' ? descendantsOf(id) : []);
    var ts = nowTs();
    list.forEach(function (x) { x.trashed = 1; x.trashedAt = ts; });
    return putManyNodes(list);
  }
  function restoreNode(id) {
    var n = S.byId[id];
    if (!n) return Promise.resolve();
    var list = [n].concat(n.kind === 'folder' ? descendantsOf(id) : []);
    list.forEach(function (x) {
      if (x.trashed) { x.trashed = 0; x.trashedAt = 0; }
    });
    /* 부모가 휴지통이면 최상위로 올린다 */
    list.forEach(function (x) {
      if (x.parentId && (!S.byId[x.parentId] || S.byId[x.parentId].trashed)) x.parentId = null;
    });
    return putManyNodes(list);
  }
  function deleteForever(id) {
    var n = S.byId[id];
    if (!n) return Promise.resolve();
    var list = [n].concat(n.kind === 'folder' ? descendantsOf(id) : []);
    var chain = Promise.resolve();
    list.forEach(function (x) {
      chain = chain.then(function () { return deleteNodeRow(x.id); })
        .then(function () { return deleteBlob(x.id); })
        .then(function () { delete thumbCache[x.id]; delete S.byId[x.id]; });
    });
    return chain.then(function () {
      var gone = {};
      list.forEach(function (x) { gone[x.id] = 1; });
      S.nodes = S.nodes.filter(function (x) { return !gone[x.id]; });
    });
  }

  /* ---------------- thumbnail cache ---------------- */
  function thumbFor(node) {
    return new Promise(function (res) {
      if (thumbCache[node.id]) return res(thumbCache[node.id]);
      getBlob(node.id).then(function (b) {
        if (!b) return res(null);
        var url = URL.createObjectURL(b);
        thumbCache[node.id] = url;
        res(url);
      }, function () { res(null); });
    });
  }
  function hydrateThumbs() {
    var slots = $$('[data-thumb]').slice(0, 80);
    slots.forEach(function (el) {
      var id = el.getAttribute('data-thumb');
      thumbFor(S.byId[id] || { id: id }).then(function (url) {
        if (!url || !el.isConnected) return;
        el.classList.add('thumb');
        el.innerHTML = '<img alt="" loading="lazy" src="' + url + '">';
      });
    });
  }

  /* ---------------- view data ---------------- */
  function currentItems() {
    var q = S.query.trim().toLowerCase();
    var list;
    if (S.view === 'trash') {
      list = S.nodes.filter(function (n) { return !!n.trashed; });
    } else if (S.view === 'starred') {
      list = S.nodes.filter(function (n) { return !n.trashed && n.starred; });
    } else if (S.view === 'recent') {
      list = S.nodes.filter(function (n) { return !n.trashed; });
    } else if (S.view === 'drive') {
      list = q ? S.nodes.filter(function (n) { return !n.trashed; }) : childrenOf(S.folderId);
    } else {
      list = [];
    }
    if (q) {
      list = list.filter(function (n) {
        if (n.name.toLowerCase().indexOf(q) > -1) return true;
        var ext = (n.ext || '').toLowerCase();
        if (ext && ('.' + ext) === q) return true;
        var t = typeOf(n);
        return t.id !== 'file' && (t.name.toLowerCase().indexOf(q) > -1);
      });
    }
    if (S.filter !== 'all') {
      list = list.filter(function (n) {
        if (S.filter === 'folder') return n.kind === 'folder';
        return n.kind === 'file' && typeOf(n).id === S.filter;
      });
    }
    return list;
  }

  function sortItems(list) {
    var arr = list.slice();
    arr.sort(function (a, b) {
      if (a.kind !== b.kind) return a.kind === 'folder' ? -1 : 1;
      if (S.sort === 'updated') return (b.updatedAt || 0) - (a.updatedAt || 0);
      if (S.sort === 'size') return (b.size || 0) - (a.size || 0);
      return String(a.name).localeCompare(String(b.name), 'ko');
    });
    return arr;
  }

  function renderFilters(items) {

  /* ---------------- render ---------------- */

      board.innerHTML = '<div class="grid">' + items.map(cardHTML).join('') + '</div>';
    }

      '<button class="pill" data-sact="clear">' + icon('i-x') + '해제</button></div>';
