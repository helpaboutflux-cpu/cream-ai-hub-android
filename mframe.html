<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mobile frame</title>
<style>
  html, body { margin: 0; background: #111; font-family: system-ui, sans-serif; }
  .bar { color: #bbb; font-size: 11px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
  .bar b { color: #fff; }
  .wrap { display: flex; justify-content: center; padding: 8px; }
  iframe { width: 390px; height: 844px; border: 1px solid #333; border-radius: 18px; background: #000; }
</style>
</head>
<body>
<div class="bar"><span>390 × 844 · <b id="name">-</b></span><span id="err" style="color:#f66"></span></div>
<div class="wrap"><iframe id="f" src=""></iframe></div>
<script>
  var params = new URLSearchParams(location.search);
  var p = params.get('p') || 'ocr.html';
  document.getElementById('name').textContent = p;
  document.getElementById('f').src = p + (p.indexOf('?') > -1 ? '&' : '?') + 'm=1&v=' + Date.now();
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    try {
      var errs = f.contentWindow.__lemonErrs;
      document.getElementById('err').textContent = errs && errs.length ? errs.join(' | ') : '';
    } catch (e) { document.getElementById('err').textContent = 'cross-origin'; }
  });
</script>
</body>
</html>
