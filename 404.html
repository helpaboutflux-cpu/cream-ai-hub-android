<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>페이지를 찾을 수 없습니다 — Soft Hub</title>
<meta name="description" content="찾으려는 Soft Hub 페이지가 없거나 주소가 바뀌었습니다. 홈이나 계정 설정으로 이동하세요.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 8v16h9'/%3E%3Cpath d='M19 8v16'/%3E%3Cpath d='M29 8 22 16l7 8'/%3E%3C/g%3E%3C/svg%3E">
<script>
(function () {
  try {
    var t = localStorage.getItem('cream_theme');
    document.documentElement.classList.toggle('dark', t ? t === 'dark' : true);
  } catch (e) { }
})();
</script>
<link rel="stylesheet" href="lemon-ui.css">
<link rel="stylesheet" href="lemon-site.css">
<style>
:root {
  --brand: #2563eb;
  --bg: #f6f7f9;
  --card: #ffffff;
  --card-2: #fafafc;
  --ink: #0a0a0a;
  --ink-2: #525252;
  --ink-3: #8a8a8a;
  --line: #e6e6ea;
  --line-2: #efeff3;
  --chip: #f4f4f6;
  --shadow: 0 30px 60px -46px rgba(10, 10, 20, .5);
}
html.dark {
  --brand: #60a5fa;
  --bg: #070708;
  --card: #0f0f11;
  --card-2: #141417;
  --ink: #fafafa;
  --ink-2: #a3a3a3;
  --ink-3: #737373;
  --line: #232327;
  --line-2: #1a1a1d;
  --chip: #17171a;
  --shadow: 0 30px 60px -44px rgba(0, 0, 0, .9);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 14px; line-height: 1.6; overflow-x: hidden;
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
html.dark body { background: #070708; }
h1, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.top { border-bottom: 1px solid var(--line); background: var(--card); }
.top__in { max-width: 980px; margin: 0 auto; padding: 0 14px; height: 56px; display: flex; align-items: center; gap: 9px; }
.top__brand { display: flex; align-items: center; gap: 9px; }
.top__mark { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: var(--card); }
html.dark .top__mark { background: var(--ink); color: #0a0a0a; }
.top__mark svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.top__name { display: flex; flex-direction: column; line-height: 1.15; }
.top__name b { font-size: 13.5px; font-weight: 800; letter-spacing: -.02em; }
.top__name span { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; color: var(--ink-3); text-transform: uppercase; }
.top__spacer { flex: 1; }
.top__icon { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); cursor: pointer; }
.top__icon:hover { color: var(--ink); border-color: var(--ink-3); }
.top__icon svg { width: 15px; height: 15px; }

.wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 34px 16px 60px; }
.card {
  width: min(460px, 100%); padding: 26px 22px 22px; text-align: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: var(--shadow);
}
.code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 44px; font-weight: 800; letter-spacing: -.04em; line-height: 1;
  color: color-mix(in srgb, var(--brand) 75%, var(--ink));
}
.card h1 { margin: 12px 0 0; font-size: 19px; font-weight: 800; letter-spacing: -.025em; word-break: keep-all; }
.card p { margin: 9px auto 0; max-width: 360px; font-size: 12.5px; color: var(--ink-2); line-height: 1.8; word-break: keep-all; }
.acts { margin-top: 18px; display: grid; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 16px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font-size: 12.5px; font-weight: 800; cursor: pointer;
  transition: transform .14s ease, border-color .16s, opacity .16s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: scale(.985); }
.btn--primary { background: var(--ink); border-color: var(--ink); color: var(--card); }
html.dark .btn--primary { color: #0a0a0a; }
.btn--primary:hover { opacity: .9; }
.links { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; font-size: 10.5px; color: var(--ink-3); }
.links a { color: var(--ink-2); }
.links a:hover { color: var(--ink); text-decoration: underline; }
.path {
  margin-top: 14px; padding: 8px 10px; border-radius: 10px;
  border: 1px dashed var(--line); background: var(--card-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10.5px; color: var(--ink-3); word-break: break-all; text-align: left;
}
.foot { padding: 0 14px 30px; text-align: center; font-size: 10px; color: var(--ink-3); }
</style>
</head>
<body>

<header class="top">
  <div class="top__in">
    <a class="top__brand" href="index.html" aria-label="Soft Hub 홈">
      <span class="top__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2.6" y="3.2" width="18.8" height="14" rx="2.6"/><path d="M8.4 21h7.2"/><path d="M12 17.2V21"/></svg>
      </span>
      <span class="top__name">
        <b>Soft Hub</b>
        <span>Lemon soft</span>
      </span>
    </a>
    <span class="top__spacer"></span>
    <button class="top__icon" type="button" data-theme-toggle aria-label="라이트·다크 전환" title="라이트·다크 전환">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>
      주소가 바뀌었거나, 삭제된 도구의 링크일 수 있습니다.
      아래에서 홈으로 돌아가거나 계정 설정을 확인해 주세요.
    </p>
    <div class="path" id="pathBox">요청한 경로를 확인하는 중입니다</div>
    <div class="acts">
      <a class="btn btn--primary" href="index.html">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.2 10.2 12 3.4l8.8 6.8V20a1.4 1.4 0 0 1-1.4 1.4H4.6A1.4 1.4 0 0 1 3.2 20z"/><path d="M9.6 21.4v-6h4.8v6"/></svg>
        Soft Hub 홈으로
      </a>
      <a class="btn" href="auth.html">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
        LK ID 계정
      </a>
    </div>
    <div class="links">
      <a href="index.html?tab=community">발견 탭</a>
      <a href="portal.html">개발자 포털</a>
      <a href="guide.html">개발 가이드</a>
      <a href="privacy.html">개인정보 처리방침</a>
      <a href="terms.html">이용약관</a>
    </div>
  </div>
</main>

<footer class="foot">Soft Hub · Lemon soft — 로그인 없이 쓰는 무료 도구 모음</footer>

<script>
(function () {
  var el = document.getElementById('pathBox');
  if (!el) return;
  var p = String(location.pathname || '');
  var q = String(location.search || '');
  el.textContent = decodeURIComponent(p + q).slice(0, 160);
})();
</script>
<script src="lemon-ui.js"></script>
<script src="lemon-site.js" defer></script>
</body>
</html>
