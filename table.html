<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemon Table - 수업 시간표 & 잠금화면 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: { 950: '#09090b', 900: '#121215', 850: '#18181b', 800: '#27272a', 700: '#3f3f46' },
            lemon: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .btn-tap { transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-tap:hover { transform: translateY(-1.5px) scale(1.02); }
    .btn-tap:active { transform: scale(0.94); }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col justify-between antialiased selection:bg-lemon-500 selection:text-neutral-950">

  <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/75 dark:bg-neutral-950/75 border-b border-neutral-200/80 dark:border-neutral-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-2.5 group">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-lemon-600 to-amber-400 p-[1px] shadow-md group-hover:scale-105 transition-transform">
            <div class="w-full h-full bg-white dark:bg-neutral-900 rounded-[15px] flex items-center justify-center">
              <svg class="w-5 h-5 text-lemon-600 dark:text-lemon-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center space-x-1.5">
              <span class="font-black text-lg tracking-tight">Lemon Table</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-lemon-100 dark:bg-lemon-950 text-lemon-700 dark:text-lemon-400 font-bold border border-lemon-300 dark:border-lemon-800">시간표 메이커</span>
            </div>
            <span class="text-[10px] text-neutral-500 -mt-0.5">학교·강의 시간표 & 잠금화면 이미지 제작</span>
          </div>
        </a>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="downloadTableImage()" class="px-3.5 py-1.5 rounded-xl bg-lemon-500 hover:bg-lemon-400 text-neutral-950 font-black text-xs btn-tap">
          잠금화면 이미지 다운로드
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full space-y-6">
    <!-- Timetable Grid -->
    <div class="p-6 rounded-3xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-sm overflow-x-auto">
      <table class="w-full text-center text-xs min-w-[500px]" id="timetableGrid">
        <thead>
          <tr class="border-b border-neutral-200 dark:border-neutral-800 text-neutral-400 font-bold">
            <th class="py-3 w-16">교시/시간</th>
            <th class="py-3">월</th>
            <th class="py-3">화</th>
            <th class="py-3">수</th>
            <th class="py-3">목</th>
            <th class="py-3">금</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-neutral-100 dark:divide-neutral-850">
          <!-- 1 to 7 periods -->
          <tr class="h-16"><td class="font-bold text-neutral-400">1교시<br><span class="text-[10px] font-normal">09:00</span></td><td class="p-1"><div class="p-2 rounded-xl bg-blue-100 dark:bg-blue-950/60 text-blue-800 dark:text-blue-300 font-bold h-full flex flex-col justify-center">국어<span class="text-[9px] font-normal">301호</span></div></td><td class="p-1"></td><td class="p-1"><div class="p-2 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 font-bold h-full flex flex-col justify-center">수학<span class="text-[9px] font-normal">204호</span></div></td><td class="p-1"></td><td class="p-1"><div class="p-2 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 font-bold h-full flex flex-col justify-center">영어<span class="text-[9px] font-normal">어학실</span></div></td></tr>
          <tr class="h-16"><td class="font-bold text-neutral-400">2교시<br><span class="text-[10px] font-normal">10:00</span></td><td class="p-1"><div class="p-2 rounded-xl bg-purple-100 dark:bg-purple-950/60 text-purple-800 dark:text-purple-300 font-bold h-full flex flex-col justify-center">사회<span class="text-[9px] font-normal">301호</span></div></td><td class="p-1"><div class="p-2 rounded-xl bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300 font-bold h-full flex flex-col justify-center">과학<span class="text-[9px] font-normal">실험실</span></div></td><td class="p-1"></td><td class="p-1"><div class="p-2 rounded-xl bg-indigo-100 dark:bg-indigo-950/60 text-indigo-800 dark:text-indigo-300 font-bold h-full flex flex-col justify-center">컴퓨터<span class="text-[9px] font-normal">전산실</span></div></td><td class="p-1"></td></tr>
          <tr class="h-16"><td class="font-bold text-neutral-400">3교시<br><span class="text-[10px] font-normal">11:00</span></td><td class="p-1"></td><td class="p-1"><div class="p-2 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 font-bold h-full flex flex-col justify-center">수학<span class="text-[9px] font-normal">204호</span></div></td><td class="p-1"><div class="p-2 rounded-xl bg-blue-100 dark:bg-blue-950/60 text-blue-800 dark:text-blue-300 font-bold h-full flex flex-col justify-center">국어<span class="text-[9px] font-normal">301호</span></div></td><td class="p-1"></td><td class="p-1"><div class="p-2 rounded-xl bg-lime-100 dark:bg-lime-950/60 text-lime-800 dark:text-lime-300 font-bold h-full flex flex-col justify-center">체육<span class="text-[9px] font-normal">체육관</span></div></td></tr>
          <tr class="h-16"><td class="font-bold text-neutral-400">4교시<br><span class="text-[10px] font-normal">12:00</span></td><td class="p-1"><div class="p-2 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 font-bold h-full flex flex-col justify-center">영어<span class="text-[9px] font-normal">어학실</span></div></td><td class="p-1"></td><td class="p-1"></td><td class="p-1"><div class="p-2 rounded-xl bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300 font-bold h-full flex flex-col justify-center">과학<span class="text-[9px] font-normal">실험실</span></div></td><td class="p-1"></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="border-t border-neutral-200/80 dark:border-neutral-800/80 py-8 bg-white/50 dark:bg-neutral-950/50 backdrop-blur-md mt-12 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-neutral-500 dark:text-neutral-400">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-neutral-800 dark:text-neutral-200">Lemon Table</span>
        <span>·</span>
        <span>Lemon soft 19대 독립 웹 프로덕트</span>
      </div>
      <div><span>2026 Lemon soft. All rights reserved.</span></div>
    </div>
  </footer>

  <script>
    function downloadTableImage() {
      alert('시간표 잠금화면 렌더링 완료! 저장합니다.');
    }
  </script>
</body>
</html>
