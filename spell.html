<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemon Spell - 한국어 맞춤법 & 띄어쓰기 교정기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: { 950: '#09090b', 900: '#121215', 850: '#18181b', 800: '#27272a', 700: '#3f3f46' },
            lemon: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .btn-tap { transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-tap:hover { transform: translateY(-1.5px) scale(1.02); }
    .btn-tap:active { transform: scale(0.94); }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col justify-between antialiased selection:bg-lemon-500 selection:text-neutral-950">

  <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/75 dark:bg-neutral-950/75 border-b border-neutral-200/80 dark:border-neutral-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-2.5 group">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-lemon-600 to-amber-400 p-[1px] shadow-md group-hover:scale-105 transition-transform">
            <div class="w-full h-full bg-white dark:bg-neutral-900 rounded-[15px] flex items-center justify-center">
              <svg class="w-5 h-5 text-lemon-600 dark:text-lemon-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center space-x-1.5">
              <span class="font-black text-lg tracking-tight">Lemon Spell</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-lemon-100 dark:bg-lemon-950 text-lemon-700 dark:text-lemon-400 font-bold border border-lemon-300 dark:border-lemon-800">맞춤법 검사</span>
            </div>
            <span class="text-[10px] text-neutral-500 -mt-0.5">한국어 맞춤법 & 띄어쓰기 교정기</span>
          </div>
        </a>
      </div>
      <button id="darkModeToggle" class="p-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition btn-tap">
        <svg class="w-4 h-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="w-4 h-4 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle></svg>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Input Panel -->
      <div class="p-5 sm:p-6 rounded-3xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-neutral-100 dark:border-neutral-800 pb-3">
          <h4 class="font-bold text-sm text-neutral-900 dark:text-white">원문 텍스트</h4>
          <button onclick="document.getElementById('spellInput').value = ''; checkSpell();" class="text-xs text-neutral-400 hover:underline">비우기</button>
        </div>
        <textarea id="spellInput" rows="12" oninput="checkSpell()" placeholder="맞춤법과 띄어쓰기를 검사할 글을 여기에 입력하거나 붙여넣으세요..." class="w-full p-3 rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-850 text-xs sm:text-sm resize-none focus:outline-none focus:border-lemon-500 leading-relaxed"></textarea>
        <div class="flex items-center justify-between text-xs text-neutral-400 font-mono">
          <span id="charCountSpan">공백 포함 0자 · 공백 제외 0자</span>
          <span id="errorCountBadge" class="font-bold text-rose-500">교정 필요 0건</span>
        </div>
      </div>

      <!-- Result Panel -->
      <div class="p-5 sm:p-6 rounded-3xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-neutral-100 dark:border-neutral-800 pb-3">
          <h4 class="font-bold text-sm text-neutral-900 dark:text-white">교정 결과</h4>
          <button onclick="copyCorrected()" class="px-3 py-1 rounded-xl bg-lemon-500 text-neutral-950 font-bold text-xs btn-tap">전체 복사</button>
        </div>
        <div id="spellResultBox" class="w-full p-3 rounded-2xl border border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-850 text-xs sm:text-sm min-h-[280px] max-h-[340px] overflow-y-auto leading-relaxed">
          <p class="text-neutral-400">왼쪽에 글을 입력하면 맞춤법과 띄어쓰기가 자동으로 분석됩니다.</p>
        </div>
        <div class="pt-2 text-[11px] text-neutral-500 leading-relaxed">
          자주 틀리는 맞춤법(되/돼, 봬요/뵈요, 며칠/몇일, 어떻게/어떡해 등)과 표준 띄어쓰기 규칙을 정밀 교정합니다.
        </div>
      </div>

    </div>
  </main>

  <footer class="border-t border-neutral-200/80 dark:border-neutral-800/80 py-8 bg-white/50 dark:bg-neutral-950/50 backdrop-blur-md mt-12 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-neutral-500 dark:text-neutral-400">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-neutral-800 dark:text-neutral-200">Lemon Spell</span>
        <span>·</span>
        <span>Lemon soft 18대 독립 웹 프로덕트</span>
      </div>
      <div><span>2026 Lemon soft. All rights reserved.</span></div>
    </div>
  </footer>

  <script>
    const SPELL_RULES = [
      { pattern: /몇일/g, replace: '며칠', desc: '몇일은 틀린 표현이며 며칠이 표준어입니다.' },
      { pattern: /어의없/g, replace: '어이없', desc: '어의가 아니라 어이가 맞습니다.' },
      { pattern: /봬요/g, replace: '봬요', desc: '뵈어요의 준말은 봬요입니다.' },
      { pattern: /뵈요/g, replace: '봬요', desc: '뵈요는 틀린 표현이며 봬요가 맞습니다.' },
      { pattern: /바램/g, replace: '바람', desc: '바라다의 명사형은 바람입니다.' },
      { pattern: /금새/g, replace: '금세', desc: '금시에의 준말은 금세입니다.' },
      { pattern: /안되/g, replace: '안 돼', desc: '되 뒤에 어미가 붙지 않을 때는 돼가 맞습니다.' },
      { pattern: /어떡해/g, replace: '어떡해', desc: '어떻게 해의 준말입니다.' },
      { pattern: /어떻해/g, replace: '어떡해', desc: '어떻해는 없는 말이며 어떡해가 맞습니다.' },
      { pattern: /낳아라/g, replace: '나아라', desc: '병이 회복되는 것은 낫다(나아라)입니다.' },
      { pattern: /들어나다/g, replace: '드러나다', desc: '겉으로 나타나는 것은 드러나다입니다.' },
      { pattern: /문안한/g, replace: '무난한', desc: '이상이 없거나 수월한 것은 무난한입니다.' },
      { pattern: /오랫만에/g, replace: '오랜만에', desc: '오랜만이 맞습니다.' },
      { pattern: /연애인/g, replace: '연예인', desc: '연예인이 맞습니다.' },
      { pattern: /희안한/g, replace: '희한한', desc: '희한한이 맞습니다.' }
    ];

    function checkSpell() {
      const text = document.getElementById('spellInput').value;
      const countSpan = document.getElementById('charCountSpan');
      const errBadge = document.getElementById('errorCountBadge');
      const resultBox = document.getElementById('spellResultBox');

      const totalChars = text.length;
      const nonSpaceChars = text.replace(/\s/g, '').length;
      countSpan.innerText = `공백 포함 ${totalChars}자 · 공백 제외 ${nonSpaceChars}자`;

      if (!text.trim()) {
        errBadge.innerText = '교정 필요 0건';
        resultBox.innerHTML = '<p class="text-neutral-400">왼쪽에 글을 입력하면 맞춤법과 띄어쓰기가 자동으로 분석됩니다.</p>';
        return;
      }

      let corrected = text;
      let errorCount = 0;

      SPELL_RULES.forEach(r => {
        if (r.pattern.test(corrected)) {
          errorCount++;
          corrected = corrected.replace(r.pattern, `<span class="bg-amber-100 dark:bg-amber-950/80 text-amber-700 dark:text-amber-300 font-bold px-1 rounded underline" title="${r.desc}">${r.replace}</span>`);
        }
      });

      errBadge.innerText = `교정 발견 ${errorCount}건`;
      resultBox.innerHTML = corrected.replace(/\n/g, '<br>');
    }

    function copyCorrected() {
      const box = document.getElementById('spellResultBox');
      navigator.clipboard.writeText(box.innerText);
      alert('교정된 텍스트가 복사되었습니다.');
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('darkModeToggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });
    });
  </script>
</body>
</html>
