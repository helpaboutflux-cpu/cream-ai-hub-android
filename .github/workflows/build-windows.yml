name: Build Windows Desktop

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Targets
        run: npm run build
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED: true

      - name: Upload NSIS Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cream-ai-Hub-Windows-Setup
          path: desktop/dist/Cream-ai-Hub-Windows-Setup.exe

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cream-ai-Hub-Windows-Portable
          path: desktop/dist/Cream-ai-Hub-Windows-Portable.exe

      - name: Upload Blockmap Files
        uses: actions/upload-artifact@v4
        with:
          name: Cream-ai-Hub-Windows-Build-Log
          path: desktop/dist/builder-debug.yml
          if-no-files-found: ignore
