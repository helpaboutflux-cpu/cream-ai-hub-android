  <style>
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #27272a;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      font-size: 13px;
      color: #a1a1aa;
    }
    .brand {
      font-size: 11px;
      color: #52525b;
      margin-top: 8px;
      font-mono: monospace;
    }
  </style>
<link rel="stylesheet" href="anim-mode.css">
<script src="anim-mode.js"></script>
</head>
<body>
  <div class="spinner"></div>
  <div class="text">목적지로 이동 중입니다...</div>
  <div class="brand">Soft Hub</div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const to = params.get('to');

      if (id) {
        try {
          await fetch('https://abacus.jasoncameron.dev/hit/flux-devhub/' + encodeURIComponent(id), {
            mode: 'cors',
            cache: 'no-cache'
          });
        } catch (e) {
          console.error(e);
        }
      }

      if (to) {
        window.location.replace(decodeURIComponent(to));
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</body>
</html>
