<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creamy Browser - 보안 탭</title>
    <style>
        :root {
            --bg: #0D0F12;
            --surface: #16191E;
            --surface-card: #1D2128;
            --border: #262B34;
            --accent: #FFFFFF;
            --text-primary: #FAFAFA;
            --text-secondary: #8E95A2;
            --radius-lg: 18px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px 80px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        /* 크롬/사파리 스타일의 정갈한 미니멀 보안 마스크 & 쉴드 아이콘 */
        .shield-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
        }

        .shield-icon-wrap svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #FFFFFF;
        }

        .brand-subtitle {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 중앙 검색 옴니박스 */
        .search-box-wrap {
            width: 100%;
            max-width: 520px;
        }

        .search-form {
            width: 100%;
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 6px 6px 6px 18px;
            transition: border-color 0.2s;
        }

        .search-form:focus-within {
            border-color: #FFFFFF;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14.5px;
            color: var(--text-primary);
            font-family: inherit;
            caret-color: #000000 !important;
            padding: 6px 0;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .search-submit-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #FFFFFF;
            color: #0D0F12;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s ease, opacity 0.15s ease;
        }

        .search-submit-btn:active {
            opacity: 0.85;
        }

        .search-submit-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #0D0F12;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 보안 안내 카드 */
        .security-info-card {
            width: 100%;
            max-width: 520px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-heading {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-heading svg {
            width: 16px;
            height: 16px;
            stroke: #FFFFFF;
            fill: none;
            stroke-width: 2;
        }

        .bullet-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bullet-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .bullet-item svg {
            width: 16px;
            height: 16px;
            stroke: #A0AAB8;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .notice-box {
            background: var(--surface-card);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 11.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            border-left: 3px solid #5A6270;
        }

        .footer-note {
            font-size: 11px;
            color: #555C68;
            text-align: center;
        }

        /* 반응형 모바일 */
        @media (max-width: 500px) {
            body {
                padding: 16px 16px 40px 16px;
            }
            .brand-title {
                font-size: 22px;
            }
            .search-box-wrap, .security-info-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-section">
            <div class="shield-icon-wrap">
                <svg viewBox="0 0 24 24">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <h1 class="brand-title">보안 탭</h1>
            <p class="brand-subtitle">개인정보 보호 비공개 브라우징</p>
        </div>

        <div class="search-box-wrap">
            <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="비공개 검색 또는 웹 주소 입력..." 
                    autocomplete="off" 
                    autofocus>
                <button type="submit" class="search-submit-btn" aria-label="검색">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </form>
        </div>

        <div class="security-info-card">
            <div class="card-heading">
                <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                보안 탭을 닫으면 다음 데이터가 기기에 남지 않습니다:
            </div>
            <ul class="bullet-list">
                <li class="bullet-item">
                    <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                    <span>방문 기록 및 주소창 검색어가 기기에 저장되지 않습니다.</span>
                </li>
                <li class="bullet-item">
                    <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                    <span>쿠키 및 사이트 데이터가 탭 종료 시 즉시 삭제됩니다.</span>
                </li>
                <li class="bullet-item">
                    <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
                    <span>아이디, 비밀번호, 양식에 입력한 정보가 저장되지 않습니다.</span>
                </li>
            </ul>

            <div class="notice-box">
                방문하는 웹사이트나 인터넷 제공업체(ISP)의 네트워크 관리자에게는 사용자 활동이 보일 수 있습니다. 다운로드한 파일이나 추가한 북마크는 유지됩니다.
            </div>
        </div>

        <div class="footer-note">
            Creamy Browser · Private Browsing
        </div>
    </div>

    <script>
        function navigate(targetUrl) {
            if (window.AndroidCreamApp && window.AndroidCreamApp.loadUrl) {
                window.AndroidCreamApp.loadUrl(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('searchInput');
            const q = input.value.trim();
            if (!q) return;

            let url;
            if (q.startsWith('http://') || q.startsWith('https://')) {
                url = q;
            } else if (q.includes('.') && !q.includes(' ') && !q.startsWith('?')) {
                url = 'https://' + q;
            } else {
                // 덕덕고 비공개 검색
                url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
            }
            navigate(url);
        }
    </script>
</body>
</html>
