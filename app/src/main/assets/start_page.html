<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creamy Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* 1. 기본 다크모드 (Default Dark) */
        body.theme-default-dark {
            --bg-page: #000000;
            --text-greeting: #FFFFFF;
            --text-subtitle: #9E9E9E;
            --planet-color: #FFFFFF;
            --search-bg: #16191E;
            --search-border: #272B33;
            --search-text: #FFFFFF;
            --search-placeholder: #767C88;
            --caret-color: #000000;
            --search-btn-bg: #FFFFFF;
            --search-btn-arrow: #000000;
            --pill-bg: #242830;
            --pill-border: #2D323C;
            --pill-text: #FFFFFF;
            --card-bg: #181B20;
            --card-border: #272B33;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --site-label: #A0A0A0;
            --site-icon-bg: #FFFFFF;
            --theme-tint: rgba(255, 255, 255, 0.05);
        }

        /* 2. 기본 라이트모드 (Default Light) */
        body.theme-default-light {
            --bg-page: #F3F4F6;
            --text-greeting: #111111;
            --text-subtitle: #555555;
            --planet-color: #111111;
            --search-bg: #FFFFFF;
            --search-border: #222222;
            --search-text: #111111;
            --search-placeholder: #666666;
            --caret-color: #000000;
            --search-btn-bg: #111111;
            --search-btn-arrow: #FFFFFF;
            --pill-bg: #FFFFFF;
            --pill-border: #E5E7EB;
            --pill-text: #111111;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --site-label: #444444;
            --site-icon-bg: #FFFFFF;
            --theme-tint: rgba(17, 17, 17, 0.035);
        }

        /* 3. 핑크테마 다크모드 (Pink Dark) */
        body.theme-pink-dark {
            --bg-page: linear-gradient(180deg, #382025 0%, #201114 100%);
            --text-greeting: #FFFFFF;
            --text-subtitle: #D9A5AF;
            --planet-color: #FFFFFF;
            --search-bg: #FFFFFF;
            --search-border: transparent;
            --search-text: #222222;
            --search-placeholder: #555555;
            --caret-color: #000000;
            --search-btn-bg: #B7626F;
            --search-btn-arrow: #FFFFFF;
            --pill-bg: #FFFFFF;
            --pill-border: transparent;
            --pill-text: #2A1217;
            --card-bg: #FFFFFF;
            --card-border: transparent;
            --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            --site-label: #333333;
            --site-icon-bg: #FFFFFF;
            --theme-tint: rgba(244, 184, 196, 0.08);
        }

        /* 4. 핑크테마 라이트모드 (Pink Light) */
        body.theme-pink-light {
            --bg-page: linear-gradient(180deg, #FFEBEF 0%, #FFD6DE 100%);
            --text-greeting: #6E343D;
            --text-subtitle: #9C5D66;
            --planet-color: #6E343D;
            --search-bg: #FFFFFF;
            --search-border: #F2C4CD;
            --search-text: #4A1E25;
            --search-placeholder: #8E525C;
            --caret-color: #000000;
            --search-btn-bg: #C86B7A;
            --search-btn-arrow: #FFFFFF;
            --pill-bg: #FFFFFF;
            --pill-border: #F7D2DA;
            --pill-text: #6E343D;
            --card-bg: #FFFFFF;
            --card-border: #F7D2DA;
            --card-shadow: 0 6px 24px rgba(220, 130, 150, 0.15);
            --site-label: #6E343D;
            --site-icon-bg: #FFFFFF;
            --theme-tint: rgba(200, 107, 122, 0.07);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 20px 40px 20px;
            transition: background 0.25s ease;
        }

        /* 테마 포인트 색상이 은은하게 스며드는 틴트 레이어 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--theme-tint, transparent);
            pointer-events: none;
            z-index: 0;
            transition: background 0.25s ease;
        }

        /* 사용자 지정 배경 이미지 (cover / center) */
        body.has-custom-bg {
            background-image: var(--cream-bg-image, none);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body.has-custom-bg::before {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--cream-bg-scrim, rgba(0, 0, 0, 0.55));
            pointer-events: none;
            z-index: 0;
        }

        body.has-custom-bg .container {
            position: relative;
            z-index: 1;
        }

        .bg-controls {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            position: relative;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 0 auto;
        }

        /* 행성 로고 */
        .planet-logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            color: var(--planet-color);
            margin-bottom: 2px;
            transition: color 0.25s ease;
        }

        .planet-logo {
            width: 48px;
            height: 48px;
            display: block;
        }

        /* 상단 타이틀 & 서브타이틀 */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .greeting-title {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-greeting);
            transition: color 0.25s ease;
        }

        .briefing-link {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-subtitle);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.15s, color 0.25s ease;
            letter-spacing: -0.01em;
        }

        .briefing-link:active {
            opacity: 0.7;
        }

        /* 옴니 검색창 캡슐 */
        .search-box-wrap {
            width: 100%;
            max-width: 520px;
            margin-top: 4px;
        }

        .search-form {
            width: 100%;
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border: 1.5px solid var(--search-border);
            border-radius: 9999px;
            padding: 5px 6px 5px 16px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.25s;
        }

        .search-input {
            flex: 1 1 auto;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14.5px;
            color: var(--search-text);
            font-family: inherit;
            caret-color: #000000 !important;
            padding: 8px 0;
        }

        .search-input::placeholder {
            color: var(--search-placeholder);
            font-size: 14px;
        }

        .search-submit-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--search-btn-bg);
            color: var(--search-btn-arrow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            flex-shrink: 0;
            margin-left: 6px;
            margin-right: 2px;
        }

        .search-submit-btn:active {
            opacity: 0.8;
        }

        .search-submit-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--search-btn-arrow);
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* QR 스캐너 버튼 */
        .search-qr-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--search-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 4px;
            opacity: 0.72;
            transition: opacity 0.15s;
        }

        .search-qr-btn:active {
            opacity: 1;
        }

        .search-qr-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 4구 퀵 알약 버튼 */
        .pills-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            max-width: 520px;
        }

        .pill-btn {
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--pill-text);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), opacity 0.12s ease, background 0.25s, color 0.25s;
        }

        .pill-btn:active {
            opacity: 0.8 !important;
        }

        button, a, .site-item, .search-submit-btn, .modal-btn, .briefing-link, .add-item {
            transition: opacity 0.12s ease !important;
            user-select: none;
        }

        button:active, a:active, .site-item:active, .search-submit-btn:active, .modal-btn:active, .briefing-link:active, .add-item:active {
            opacity: 0.8 !important;
        }

        /* 즐겨찾기 카드 컨테이너 */
        .favorites-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 6px;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .site-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            width: 64px;
            position: relative;
            user-select: none;
            transition: transform 0.15s;
        }

        .site-item:active {
            opacity: 0.85;
        }

        .site-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background: var(--site-icon-bg);
        }

        .site-icon-box svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .site-favicon-img {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            object-fit: contain;
        }

        .site-fallback-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #111111;
            background: #E5E7EB;
        }

        .naver-box { background: #03C75A; }
        .youtube-box { background: #FF0000; }
        .add-box {
            background: var(--pill-bg);
            border: 1.5px dashed var(--pill-border);
            color: var(--pill-text);
        }

        .add-box svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
        }

        .site-name {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--site-label);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 64px;
            transition: color 0.25s ease;
        }

        /* 모달 오버레이 및 카드 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-card {
            width: 100%;
            max-width: 320px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-greeting);
        }

        .modal-input {
            width: 100%;
            height: 42px;
            border: 1.5px solid var(--search-border);
            background: var(--search-bg);
            border-radius: 12px;
            padding: 0 14px;
            font-size: 13.5px;
            color: var(--search-text);
            caret-color: #000000 !important;
            outline: none;
            font-family: inherit;
        }

        .modal-input::placeholder {
            color: var(--search-placeholder);
        }

        .modal-btn-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .modal-btn {
            flex: 1;
            height: 38px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--pill-bg);
            color: var(--pill-text);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .modal-btn:active {
            opacity: 0.8;
        }

        .modal-btn.primary {
            background: var(--search-btn-bg);
            color: var(--search-btn-arrow);
            border: none;
        }

        .modal-btn.danger {
            background: #EF4444;
            color: #FFFFFF;
            border: none;
        }

        /* ===== 모듈형 위젯 대시보드 (MSN / Edge 스타일) ===== */
        .widget-grid {
            width: 100%;
            max-width: 680px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-flow: dense;
            gap: 10px;
            margin-top: 4px;
        }

        .widget-card {
            position: relative;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            border-radius: 14px;
            padding: 12px 14px 13px 14px;
            min-height: 92px;
            overflow: hidden;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .widget-card.size-1x1 { grid-column: span 1; }
        .widget-card.size-2x1 { grid-column: span 2; }
        .widget-card.size-2x2 { grid-column: span 2; min-height: 206px; }

        .widget-head {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-bottom: 6px;
        }

        .widget-name {
            flex: 1;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--site-label);
        }

        .widget-tool {
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: var(--site-label);
            opacity: 0.5;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-tool:active { opacity: 1; }

        .widget-tool svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .widget-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: var(--text-greeting);
            overflow: hidden;
        }

        .w-temp { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
        .w-sub { font-size: 11px; color: var(--text-subtitle); margin-top: 3px; }
        .w-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .w-big { font-size: 25px; font-weight: 700; letter-spacing: -0.04em; }
        .w-mid { font-size: 13.5px; font-weight: 700; }
        .w-small { font-size: 11px; color: var(--text-subtitle); }
        .w-tiny { font-size: 10px; color: var(--text-subtitle); }
        .w-list { display: flex; flex-direction: column; gap: 6px; }
        .w-list-item { display: flex; gap: 7px; align-items: flex-start; font-size: 12px; line-height: 1.35; color: var(--text-greeting); }
        .w-list-item .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-subtitle); margin-top: 6px; flex-shrink: 0; }
        .w-ellipsis { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
        .w-ellipsis-2 { -webkit-line-clamp: 2; }
        .w-markets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 10px; }
        .w-market { display: flex; flex-direction: column; gap: 1px; }
        .w-market .label { font-size: 10px; color: var(--text-subtitle); }
        .w-market .value { font-size: 13.5px; font-weight: 700; }
        .w-up { color: #DC2626; }
        .w-down { color: #2563EB; }
        .w-flat { color: var(--text-subtitle); }
        .w-sports { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11.5px; }
        .w-loading { font-size: 11.5px; color: var(--text-subtitle); }
        .w-error { font-size: 11px; color: var(--text-subtitle); }

        /* ===== 컬러풀 위젯 스타일 (v2.2.1) ===== */
        .widget-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 680px;
            margin-top: 2px;
        }

        .widget-actions .widget-add-btn {
            flex: 1 1 auto;
            margin-top: 0;
            width: auto;
            max-width: none;
        }

        .widget-color-btn {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--pill-border);
            color: var(--text-subtitle);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 11.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: color 0.2s, border-color 0.2s, background 0.2s, opacity 0.15s;
        }

        .widget-color-btn:active { opacity: 0.7; }

        .widget-color-btn svg {
            width: 13px;
            height: 13px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .widget-color-btn.on {
            border-color: transparent;
            color: #FFFFFF;
            background: linear-gradient(135deg, #6366F1 0%, #EC4899 100%);
        }

        /* 컬러풀 모드: 위젯별 그라데이션 */
        body.widget-colorful .widget-card {
            background-image: var(--w-grad);
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
            color: #FFFFFF;
        }

        body.widget-colorful .widget-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 62%);
            pointer-events: none;
        }

        body.widget-colorful .widget-card .widget-body { color: #FFFFFF; }
        body.widget-colorful .widget-card .w-list-item { color: #FFFFFF; }
        body.widget-colorful .widget-card .w-list-item .dot { background: rgba(255, 255, 255, 0.72); }
        body.widget-colorful .widget-card .widget-name,
        body.widget-colorful .widget-card .w-sub,
        body.widget-colorful .widget-card .w-small,
        body.widget-colorful .widget-card .w-tiny,
        body.widget-colorful .widget-card .w-market .label,
        body.widget-colorful .widget-card .w-loading,
        body.widget-colorful .widget-card .w-error,
        body.widget-colorful .widget-card .w-flat { color: rgba(255, 255, 255, 0.78); }
        body.widget-colorful .widget-card .widget-name { color: rgba(255, 255, 255, 0.72); }
        body.widget-colorful .widget-card .widget-tool { color: #FFFFFF; opacity: 0.6; }
        body.widget-colorful .widget-card .widget-tool:active { opacity: 1; }
        body.widget-colorful .widget-card .w-up { color: #FDE68A; }
        body.widget-colorful .widget-card .w-down { color: #BFDBFE; }

        body.widget-colorful .widget-card[data-type="weather"] { --w-grad: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%); }
        body.widget-colorful .widget-card[data-type="clock"] { --w-grad: linear-gradient(135deg, #818CF8 0%, #4F46E5 100%); }
        body.widget-colorful .widget-card[data-type="commute"] { --w-grad: linear-gradient(135deg, #FBBF24 0%, #EA580C 100%); }
        body.widget-colorful .widget-card[data-type="markets"] { --w-grad: linear-gradient(135deg, #34D399 0%, #059669 100%); }
        body.widget-colorful .widget-card[data-type="news"] { --w-grad: linear-gradient(135deg, #FB7185 0%, #E11D48 100%); }
        body.widget-colorful .widget-card[data-type="sports"] { --w-grad: linear-gradient(135deg, #2DD4BF 0%, #0F766E 100%); }

    <!-- 즐겨찾기 추가 모달 -->

    <script>
        function navigate(targetUrl) {
            if (window.AndroidCreamApp && window.AndroidCreamApp.loadUrl) {
                window.AndroidCreamApp.loadUrl(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('searchInput');
            const q = input.value.trim();
            if (!q) return;

            if (q.startsWith('http://') || q.startsWith('https://')) {
                navigate(q);
                return;
            } else if (q.includes('.') && !q.includes(' ') && !q.startsWith('?')) {
                navigate('https://' + q);
                return;
            }

            let engine = 'google';
            try {
                if (window.AndroidCreamApp && window.AndroidCreamApp.getSearchEngine) {
                    engine = window.AndroidCreamApp.getSearchEngine() || 'google';
                }
            } catch(err) {}

            let searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(q);
            if (engine === 'naver') {
                searchUrl = 'https://search.naver.com/search.naver?query=' + encodeURIComponent(q);
            } else if (engine === 'daum') {
                searchUrl = 'https://search.daum.net/search?q=' + encodeURIComponent(q);
            } else if (engine === 'bing') {
                searchUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(q);
            } else if (engine === 'duckduckgo') {
                searchUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
            }
            navigate(searchUrl);
        }

        function openSecurityTab() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSecurityTab) {
                window.AndroidCreamApp.openSecurityTab();
            } else {
                navigate('start_page_security.html');
            }
        }

        function openSidebarAi() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSidebarAi) {
                window.AndroidCreamApp.openSidebarAi();
            } else {
                navigate('https://doteai.base44.app/creamy');
            }
        }

        function openSecurityDashboard() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSecurityDashboard) {
                window.AndroidCreamApp.openSecurityDashboard();
            }
        }

        function openSettings() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSettings) {
                window.AndroidCreamApp.openSettings();
            }
        }

        function openQrScanner() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openQrScanner) {
                window.AndroidCreamApp.openQrScanner();
            }
        }

        function openBriefing(e) {
            if (e) e.preventDefault();
            if (window.AndroidCreamApp && window.AndroidCreamApp.openBriefing) {
                window.AndroidCreamApp.openBriefing();
            } else {
                openSidebarAi();
            }
        }

        // 테마 설정 함수
        function contrastOn(hex) {
            try {
                const c = hex.replace('#', '');
                const r = parseInt(c.substring(0, 2), 16) / 255;
                const g = parseInt(c.substring(2, 4), 16) / 255;
                const b = parseInt(c.substring(4, 6), 16) / 255;
                const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                return l > 0.55 ? '#111111' : '#FFFFFF';
            } catch (e) {
                return '#FFFFFF';
            }
        }

        function hexToRgba(hex, alpha) {
            try {
                const c = hex.replace('#', '');
                const r = parseInt(c.substring(0, 2), 16);
                const g = parseInt(c.substring(2, 4), 16);
                const b = parseInt(c.substring(4, 6), 16);
                return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
            } catch (err) {
                return 'transparent';
            }
        }

        function applyCustomScrim() {
            const isDark = document.body.classList.contains('theme-default-dark') ||
                document.body.classList.contains('theme-pink-dark');
            document.body.style.setProperty('--cream-bg-scrim', isDark ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.55)');
        }

        function clearCustomAccent() {
            ['--search-btn-bg', '--search-btn-arrow', '--planet-color', '--cream-accent', '--theme-tint'].forEach(function (name) {
                document.body.style.removeProperty(name);
            });
        }

        window.setTheme = function(themeName) {
            const hadCustomBg = document.body.classList.contains('has-custom-bg');
            const hadColorful = document.body.classList.contains('widget-colorful');
            document.body.className = '';
            const valid = ['theme-default-dark', 'theme-default-light', 'theme-pink-dark', 'theme-pink-light'];
            const target = themeName.startsWith('theme-') ? themeName : 'theme-' + themeName.replace('_', '-');
            if (valid.includes(target)) {
                document.body.classList.add(target);
            } else {
                document.body.classList.add('theme-default-dark');
            }
            if (hadCustomBg) document.body.classList.add('has-custom-bg');
            if (hadColorful) document.body.classList.add('widget-colorful');
            clearCustomAccent();
            applyCustomScrim();
            try {
                localStorage.setItem('creamy_theme_mode', target);
            } catch (err) {}
        };

        // 사용자 지정 색상 테마 (라이트/다크 + 포인트 색상)
        window.setCustomTheme = function(accent, isDark) {
            const hadCustomBg = document.body.classList.contains('has-custom-bg');
            const hadColorful = document.body.classList.contains('widget-colorful');
            document.body.className = '';
            document.body.classList.add(isDark ? 'theme-default-dark' : 'theme-default-light');
            if (hadCustomBg) document.body.classList.add('has-custom-bg');
            if (hadColorful) document.body.classList.add('widget-colorful');
            clearCustomAccent();
            document.body.style.setProperty('--cream-accent', accent);
            document.body.style.setProperty('--search-btn-bg', accent);
            document.body.style.setProperty('--search-btn-arrow', contrastOn(accent));
            document.body.style.setProperty('--planet-color', accent);
            document.body.style.setProperty('--theme-tint', hexToRgba(accent, isDark ? 0.07 : 0.05));
            applyCustomScrim();
            try {
                localStorage.setItem('creamy_theme_mode', isDark ? 'theme-custom-dark' : 'theme-custom-light');
            } catch (err) {}
        };

        // 사용자 지정 시작페이지 배경 이미지
        window.setCustomBackground = function(dataUrl) {
            if (!dataUrl) {
                window.clearCustomBackground();
                return;
            }
            document.body.style.setProperty('--cream-bg-image', 'url("' + dataUrl + '")');
            document.body.classList.add('has-custom-bg');
            applyCustomScrim();
        };

        window.clearCustomBackground = function() {
            document.body.classList.remove('has-custom-bg');
            document.body.style.removeProperty('--cream-bg-image');
        };

        function pickStartBackground() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.pickCustomBackgroundImage) {
                window.AndroidCreamApp.pickCustomBackgroundImage();
            }
        }

        function resetStartBackground() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.clearCustomBackgroundImage) {
                window.AndroidCreamApp.clearCustomBackgroundImage();
            } else {
                window.clearCustomBackground();
            }
        }

        let currentUserName = "민중";

        window.setUserName = function(name) {
            if (name && name.trim()) {
                currentUserName = name.trim();
                try {
                    localStorage.setItem('creamy_user_nickname', currentUserName);
                } catch(e){}
                updateGreeting();
            }
        };

        // 시간대별 인사말 자동 갱신 함수 (사용자 이름 동적 연동)
        function updateGreeting() {
            try {
                if (window.AndroidCreamApp && window.AndroidCreamApp.getUserName) {
                    const n = window.AndroidCreamApp.getUserName();
                    if (n && n.trim()) currentUserName = n.trim();
                } else {
                    const saved = localStorage.getItem('creamy_user_nickname');
                    if (saved && saved.trim()) currentUserName = saved.trim();
                }
            } catch(e){}

            const hour = new Date().getHours();
            const el = document.getElementById('greetingTitle');
            if (el) {
                if (hour >= 5 && hour < 12) {
                    el.textContent = "좋은 아침입니다, " + currentUserName + "님.";
                } else if (hour >= 12 && hour < 18) {
                    el.textContent = "좋은 오후입니다, " + currentUserName + "님.";
                } else {
                    el.textContent = "좋은 저녁입니다, " + currentUserName + "님.";
                }
            }
        }

        // ==================== 즐겨찾기 시스템 (기본: 다음 제외 / 롱클릭 수정 / 추가 / 파비콘) ====================
        const DEFAULT_FAVORITES = [
            { id: "naver", name: "Naver", url: "https://www.naver.com", preset: "naver" },
            { id: "google", name: "Google", url: "https://www.google.com", preset: "google" },
            { id: "youtube", name: "Youtube", url: "https://www.youtube.com", preset: "youtube" }
        ];

        let favoritesList = [];
        let editingIndex = -1;

        function loadFavorites() {
            try {
                const raw = localStorage.getItem('creamy_custom_favorites');
                if (raw) {
                    favoritesList = JSON.parse(raw);
                } else {
                    favoritesList = JSON.parse(JSON.stringify(DEFAULT_FAVORITES));
                }
            } catch (err) {
                favoritesList = JSON.parse(JSON.stringify(DEFAULT_FAVORITES));
            }
            renderFavorites();
        }

        function saveFavorites() {
            try {
                localStorage.setItem('creamy_custom_favorites', JSON.stringify(favoritesList));
            } catch (err) {}
        }

        function renderFavorites() {
            const container = document.getElementById('favoritesCard');
            if (!container) return;
            container.innerHTML = '';

            favoritesList.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'site-item';

                let iconHtml = '';
                if (item.preset === 'naver') {
                    iconHtml = `
                        <div class="site-icon-box naver-box">
                            <svg viewBox="0 0 24 24">
                                <path fill="#FFFFFF" d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z"/>
                            </svg>
                        </div>`;
                } else if (item.preset === 'google') {
                    iconHtml = `
                        <div class="site-icon-box google-box">
                            <svg viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                            </svg>
                        </div>`;
                } else if (item.preset === 'youtube') {
                    iconHtml = `
                        <div class="site-icon-box youtube-box">
                            <svg viewBox="0 0 24 24">
                                <polygon fill="#FFFFFF" points="9.5,7.5 16.5,12 9.5,16.5"/>
                            </svg>
                        </div>`;
                } else {
                    // 추가된 커스텀 링크: 파비콘 연동
                    const faviconUrl = 'https://www.google.com/s2/favicons?sz=64&domain_url=' + encodeURIComponent(item.url);
                    const initialChar = (item.name || 'W').charAt(0).toUpperCase();
                    iconHtml = `
                        <div class="site-icon-box">
                            <img class="site-favicon-img" src="${faviconUrl}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                            <div class="site-fallback-icon" style="display:none;">${initialChar}</div>
                        </div>`;
                }

                itemEl.innerHTML = iconHtml + `<span class="site-name">${item.name}</span>`;

                // 롱클릭 수정 및 일반 클릭 이동 리스너 등록
                setupItemInteractions(itemEl, item, index);
                container.appendChild(itemEl);
            });

            // 추가 (+) 버튼
            const addBtn = document.createElement('div');
            addBtn.className = 'site-item add-item';
            addBtn.innerHTML = `
                <div class="site-icon-box add-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </div>
                <span class="site-name">추가</span>`;
            addBtn.onclick = openAddModal;
            container.appendChild(addBtn);
        }

        function setupItemInteractions(el, item, index) {
            let timer = null;
            let longPressed = false;

            el.addEventListener('touchstart', (e) => {
                longPressed = false;
                timer = setTimeout(() => {
                    longPressed = true;
                    if (navigator.vibrate) navigator.vibrate(35);
                    openEditModal(index);
                }, 480);
            }, { passive: true });

            el.addEventListener('touchend', () => {
                clearTimeout(timer);
            });

            el.addEventListener('touchmove', () => {
                clearTimeout(timer);
            });

            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                openEditModal(index);
            });

            el.addEventListener('click', (e) => {
                if (longPressed) {
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }
                navigate(item.url);
            });
        }

        // 추가 모달
        function openAddModal() {
            document.getElementById('addNameInput').value = '';
            document.getElementById('addUrlInput').value = '';
            document.getElementById('addModal').style.display = 'flex';
            setTimeout(() => document.getElementById('addNameInput').focus(), 80);
        }

        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function submitAddFavorite() {
            const name = document.getElementById('addNameInput').value.trim();
            let url = document.getElementById('addUrlInput').value.trim();
            if (!name || !url) return;

        // ---------- 네이티브 HTTP 브리지 (CORS 우회) ----------
        let creamyFetchSeq = 0;
        const creamyFetchCallbacks = {};
        window.__creamyFetch = function (id, status, body) {
            const cb = creamyFetchCallbacks[id];
            if (!cb) return;
            delete creamyFetchCallbacks[id];
            cb(status === 200 ? body : null);
        };

        function nativeFetch(url, timeoutMs) {
            return new Promise(function (resolve) {
                let settled = false;
                const finish = function (value) {
                    if (settled) return;
                    settled = true;
                    resolve(value);
                };
                if (window.AndroidCreamApp && window.AndroidCreamApp.fetchUrl) {
                    const id = 'w' + (++creamyFetchSeq);
                    creamyFetchCallbacks[id] = finish;
                    try {
                        window.AndroidCreamApp.fetchUrl(url, id);
                    } catch (err) {
                        delete creamyFetchCallbacks[id];
                        finish(null);
                    }
                    setTimeout(function () {
                        delete creamyFetchCallbacks[id];
                        finish(null);
                    }, timeoutMs || 12000);
                } else if (typeof fetch === 'function') {
                    fetch(url).then(function (r) { return r.ok ? r.text() : null; })
                        .then(finish).catch(function () { finish(null); });
                } else {
                    finish(null);
                }
            });
        }

                        title = rawTitle.substring(0, idx).trim();
                    }
                    return { title: title, source: source, link: link };

                    if (!d) return;
                    list.push({
                        label: label,
                        value: d.closePrice,
                        ratio: parseFloat(d.fluctuationsRatio),
                        dir: (d.compareToPreviousPrice || {}).name || ''
                    });
                } catch (err) {}
            };
            pushIndex(results[0], '코스피');
            pushIndex(results[1], '코스닥');
            pushIndex(results[2], '나스닥');
            if (results[3]) {
                try {

        // ---------- 이동 시간 ----------
        function getCommuteConfig() {
            try {
                const raw = localStorage.getItem(COMMUTE_STORAGE_KEY);
                if (raw) {
                    const o = JSON.parse(raw);
                    if (o && o.origin && o.dest) return o;
                }

        async function geocodePlace(name) {
            const body = await nativeFetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q='
                + encodeURIComponent(name));
            if (!body) return null;
            try {
                const arr = JSON.parse(body);
                if (!arr || !arr.length) return null;
                return { lat: parseFloat(arr[0].lat), lon: parseFloat(arr[0].lon) };
            } catch (err) {
                return null;
            }
        }

        async function fetchCommute() {
            const cfg = getCommuteConfig();
            const a = await geocodePlace(cfg.origin);
            const b = await geocodePlace(cfg.dest);
            if (!a || !b) {
                widgetData.commute = { error: true, cfg: cfg };
                refreshWidget('commute');
                return;
            }
            const route = await nativeFetch('https://router.project-osrm.org/route/v1/driving/'
                + a.lon + ',' + a.lat + ';' + b.lon + ',' + b.lat + '?overview=false');
            let minutes = null;
            let km = null;
            if (route) {
                try {
                    const o = JSON.parse(route);
                    const r = (o.routes || [])[0];
                    if (r) {
                        minutes = Math.round(r.duration / 60);
                        km = Math.round(r.distance / 100) / 10;
                    }
                } catch (err) {}
            }
            widgetData.commute = { minutes: minutes, km: km, cfg: cfg, error: minutes == null };
            refreshWidget('commute');
        }

        // ---------- 스포츠 ----------
        function parseEspn(raw, league) {
            const games = [];
            try {
                const o = JSON.parse(raw);
                const events = o.events || [];
                for (let i = 0; i < events.length; i++) {
                    const e = events[i];
                    const comp = (e.competitions || [])[0];
                    if (!comp) continue;
                    const sides = (comp.competitors || []).map(function (c) {
                        return {
                            name: (c.team || {}).shortDisplayName || (c.team || {}).name || '',
                            score: c.score,
                            home: c.homeAway === 'home'
                        };
                    });
                    if (sides.length < 2) continue;
                    const home = sides.filter(function (s) { return s.home; })[0] || sides[0];
                    const away = sides.filter(function (s) { return !s.home; })[0] || sides[1];
                    games.push({
                        league: league,
                        home: home.name,
                        homeScore: home.score,
                        away: away.name,
                        awayScore: away.score,
                        status: ((e.status || {}).type || {}).detail || ((e.status || {}).type || {}).description || ''
                    });
                }
            } catch (err) {}
            return games;
        }

        async function fetchSports() {
            let games = [];
            let league = 'KBO';
            const kbo = await nativeFetch('https://site.api.espn.com/apis/site/v2/sports/baseball/kbo/scoreboard');
            if (kbo) games = parseEspn(kbo, 'KBO');
            if (!games.length) {
                const epl = await nativeFetch('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard');
                if (epl) { games = parseEspn(epl, 'EPL'); league = 'EPL'; }
            }
            if (!games.length) {
                const nba = await nativeFetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard');
                if (nba) { games = parseEspn(nba, 'NBA'); league = 'NBA'; }
            }
            widgetData.sports = games;
            if (!games.length) widgetData.sports = { error: true, league: league };
            refreshWidget('sports');
        }

        function sportsBody(size) {
            const d = widgetData.sports;
            if (!d) return '<span class="w-loading">경기 결과를 불러오는 중...</span>';
            if (d.error || !d.length) return '<span class="w-error">최근 경기 정보를 찾지 못했습니다</span>';
            const count = size === '1x1' ? 1 : (size === '2x1' ? 2 : 4);
            let html = '<div class="w-list">';
            for (let i = 0; i < Math.min(count, d.length); i++) {
                const g = d[i];
                html += '<div class="w-sports"><span class="w-tiny" style="min-width:28px">' + esc(g.league) + '</span>'
                    + '<span class="w-ellipsis" style="flex:1">' + esc(g.away) + '</span>'
                    + '<span class="w-mid">' + esc(g.awayScore != null ? g.awayScore : '-') + ' : '
                    + esc(g.homeScore != null ? g.homeScore : '-') + '</span>'
                    + '<span class="w-ellipsis" style="flex:1;text-align:right">' + esc(g.home) + '</span></div>';
            }
            html += '</div>';
            if (size !== '1x1' && d[0] && d[0].status) {
                html += '<div class="w-tiny" style="margin-top:8px">' + esc(d[0].status) + ' · ESPN</div>';
            }
            return html;
        }

        // ---------- 위젯 렌더링 ----------
        function widgetBodyHTML(widget) {
            switch (widget.type) {
                case 'weather': return weatherBody(widget.size);
                case 'clock': return clockBody(widget.size);
                case 'news': return newsBody(widget.size);
                case 'markets': return marketsBody(widget.size);
                case 'commute': return commuteBody(widget.size);
                case 'sports': return sportsBody(widget.size);
                default: return '';
            }
        }

        function renderWidgets() {
            const grid = document.getElementById('widgetGrid');
            if (!grid) return;
            grid.innerHTML = '';
            widgetState.forEach(function (widget, index) {
                const card = document.createElement('div');
                card.className = 'widget-card size-' + widget.size;
                card.dataset.type = widget.type;
                card.dataset.index = String(index);
                const def = WIDGET_DEFS[widget.type] || { name: widget.type };
                let tools = '';
                if (widget.type === 'commute') {
                    tools += '<button class="widget-tool" aria-label="이동 시간 설정" onclick="openCommuteModal()">' + ICON_GEAR + '</button>';
                }
                tools += '<button class="widget-tool" aria-label="크기 변경" onclick="cycleWidgetSize(' + index + ')">' + ICON_SIZE + '</button>';
                tools += '<button class="widget-tool" aria-label="위젯 삭제" onclick="removeWidget(' + index + ')">' + ICON_CLOSE + '</button>';
                card.innerHTML = '<div class="widget-head"><span class="widget-name">' + esc(def.name) + '</span>' + tools + '</div>'
                    + '<div class="widget-body">' + widgetBodyHTML(widget) + '</div>';
                grid.appendChild(card);
            });
        }

        function refreshWidget(type) {
            const card = document.querySelector('.widget-card[data-type="' + type + '"]');
            if (!card) return;
            const index = Number(card.dataset.index);
            const widget = widgetState[index];
            if (!widget || widget.type !== type) return;
            const body = card.querySelector('.widget-body');
            if (body) body.innerHTML = widgetBodyHTML(widget);
        }

        function refreshWidgets() {
            renderWidgets();
        }

        function cycleWidgetSize(index) {
            const widget = widgetState[index];
            if (!widget) return;
            const next = (WIDGET_SIZES.indexOf(widget.size) + 1) % WIDGET_SIZES.length;
            widget.size = WIDGET_SIZES[next];
            saveWidgetState();
            renderWidgets();
            refreshWidget(widget.type);
        }

        function removeWidget(index) {
            if (index < 0 || index >= widgetState.length) return;
            widgetState.splice(index, 1);
            saveWidgetState();
            renderWidgets();
        }

        function addWidget(type) {
            if (!WIDGET_DEFS[type] || hasWidget(type)) return;
            widgetState.push({ type: type, size: type === 'news' ? '2x2' : '2x1' });
            saveWidgetState();
            renderWidgets();
            loadWidgetData(type);
            closeWidgetPicker();
        }

        function openWidgetPicker() {
            const list = document.getElementById('widgetPickerList');
            if (!list) return;
            list.innerHTML = '';
            Object.keys(WIDGET_DEFS).forEach(function (type) {
                const def = WIDGET_DEFS[type];
                const added = hasWidget(type);
                const row = document.createElement('div');
                row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(128,128,128,0.25);border-radius:10px;';
                row.innerHTML = '<div style="flex:1"><div style="font-size:12.5px;font-weight:700">' + esc(def.name) + '</div>'
                    + '<div style="font-size:10.5px;opacity:.7">' + esc(def.desc) + '</div></div>';
                const btn = document.createElement('button');
                btn.className = 'modal-btn';
                btn.style.cssText = 'flex:0 0 auto;width:auto;padding:0 12px;height:30px;font-size:11px;';
                btn.textContent = added ? '추가됨' : '추가';
                btn.disabled = added;
                btn.style.opacity = added ? '0.45' : '1';
                btn.onclick = function () { addWidget(type); };
                row.appendChild(btn);
                list.appendChild(row);
            });
            document.getElementById('widgetPickerModal').style.display = 'flex';
        }

        function closeWidgetPicker() {
            document.getElementById('widgetPickerModal').style.display = 'none';
        }

        // ---------- 이동 시간 설정 ----------
        function openCommuteModal() {
            const cfg = getCommuteConfig();
            document.getElementById('commuteOrigin').value = cfg.origin;
            document.getElementById('commuteDest').value = cfg.dest;
            document.getElementById('commuteModal').style.display = 'flex';
        }

        function closeCommuteModal() {
            document.getElementById('commuteModal').style.display = 'none';
        }

        function saveCommute() {
            const origin = document.getElementById('commuteOrigin').value.trim();
            const dest = document.getElementById('commuteDest').value.trim();
            if (!origin || !dest) return;
            try { localStorage.setItem(COMMUTE_STORAGE_KEY, JSON.stringify({ origin: origin, dest: dest })); } catch (err) {}
            widgetData.commute = null;
            refreshWidget('commute');
            closeCommuteModal();
            fetchCommute();
        }

        // ---------- 데이터 로딩 및 주기 갱신 ----------
        function loadWidgetData(type) {
            if (type === 'weather') fetchWeather();
            else if (type === 'news') fetchNews();
            else if (type === 'markets') fetchMarkets();
            else if (type === 'commute') fetchCommute();
            else if (type === 'sports') fetchSports();
            else if (type === 'clock') refreshWidget('clock');
        }

        function initWidgets() {
            loadWidgetState();
            window.setWidgetColorful(readWidgetColorful());
            renderWidgets();
            Object.keys(WIDGET_DEFS).forEach(function (type) {
                if (hasWidget(type)) loadWidgetData(type);
            });
            setInterval(function () { if (hasWidget('clock')) refreshWidget('clock'); }, 1000);
            setInterval(function () { if (hasWidget('markets')) fetchMarkets(); }, 180000);
            setInterval(function () { if (hasWidget('weather')) fetchWeather(); }, 600000);
            setInterval(function () { if (hasWidget('news')) fetchNews(); }, 600000);
            setInterval(function () { if (hasWidget('sports')) fetchSports(); }, 900000);
            setInterval(function () { if (hasWidget('commute')) fetchCommute(); }, 600000);
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) {
                    Object.keys(WIDGET_DEFS).forEach(function (type) {
                        if (hasWidget(type)) loadWidgetData(type);
                    });
                }
            });
        }

        initWidgets();

    </script>
</body>
</html>
