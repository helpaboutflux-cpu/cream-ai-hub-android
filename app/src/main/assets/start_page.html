<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cream Browser</title>
    <style>
        :root {
            --bg: #FFFFFF;
            --surface: #FAFAFA;
            --surface-hover: #F4F4F5;
            --border: #E4E4E7;
            --text-primary: #09090B;
            --text-secondary: #71717A;
            --accent: #09090B;
            --accent-text: #FFFFFF;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #09090B;
                --surface: #18181B;
                --surface-hover: #27272A;
                --border: #27272A;
                --text-primary: #FAFAFA;
                --text-secondary: #A1A1AA;
                --accent: #FAFAFA;
                --accent-text: #09090B;
                --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px 80px 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* 브랜딩 헤더 */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            box-shadow: var(--shadow);
        }

        .brand-logo svg {
            width: 32px;
            height: 32px;
            fill: var(--bg);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: -0.01em;
        }

        /* 중앙 검색 옴니박스 */
        .search-box-wrap {
            width: 100%;
            position: relative;
        }

        .search-form {
            width: 100%;
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 6px 14px 6px 18px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
        }

        .search-form:focus-within {
            border-color: var(--text-primary);
            transform: translateY(-1px);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
            margin-right: 12px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: var(--text-primary);
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-submit-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--text-primary);
            color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .search-submit-btn:active {
            transform: scale(0.92);
        }

        .search-submit-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--bg);
        }

        /* 바로가기 그리드 (Shortcuts) */
        .shortcuts-section {
            width: 100%;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        @media (max-width: 440px) {
            .shortcuts-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
        }

        .shortcut-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--text-primary);
            transition: background 0.15s, transform 0.15s, border-color 0.15s;
            cursor: pointer;
        }

        .shortcut-card:active {
            transform: scale(0.95);
            background: var(--surface-hover);
        }

        .shortcut-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .shortcut-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        .shortcut-label {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* Creamy AI 빠른 제안 카드 섹션 */
        .ai-section {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-header-title {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .ai-header-title svg {
            width: 15px;
            height: 15px;
            fill: var(--text-primary);
        }

        .ai-chips-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ai-chip {
            padding: 8px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-primary);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .ai-chip:active {
            transform: scale(0.96);
            background: var(--surface-hover);
            border-color: var(--text-primary);
        }

        /* 하단 푸터 미니멀 라벨 */
        .footer-note {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- 브랜딩 헤더 -->
        <div class="brand-section">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <!-- Swirl Minimal Icon -->
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>
            <h1 class="brand-title">Cream Browser</h1>
            <p class="brand-subtitle">빠르고 미니멀한 AI 인텔리전트 웹 브라우저</p>
        </div>

        <!-- 중앙 옴니 검색창 -->
        <div class="search-box-wrap">
            <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
                <svg class="search-icon" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="웹 주소 또는 검색어 입력..." 
                    autocomplete="off" 
                    autofocus>
                <button type="submit" class="search-submit-btn" aria-label="검색">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div>

        <!-- 바로가기 그리드 -->
        <div class="shortcuts-section">
            <div class="shortcuts-grid">
                <!-- Cream ai Hub -->
                <a href="https://doteai.base44.app" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <span class="shortcut-label">Cream Hub</span>
                </a>

                <!-- Creamy Chat -->
                <a href="https://doteai.base44.app/creamy" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    </div>
                    <span class="shortcut-label">Creamy</span>
                </a>

                <!-- Google -->
                <a href="https://www.google.com" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h2v2h-2zm0-12h2v10h-2z"/></svg>
                    </div>
                    <span class="shortcut-label">Google</span>
                </a>

                <!-- Naver -->
                <a href="https://www.naver.com" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M16.27 3h-4.42l-4.57 6.64V3H3.5v18h4.42l4.57-6.64V21h3.78V3z"/></svg>
                    </div>
                    <span class="shortcut-label">Naver</span>
                </a>

                <!-- GitHub -->
                <a href="https://github.com" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
                    </div>
                    <span class="shortcut-label">GitHub</span>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
                    </div>
                    <span class="shortcut-label">YouTube</span>
                </a>

                <!-- X (Twitter) -->
                <a href="https://x.com" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </div>
                    <span class="shortcut-label">X</span>
                </a>

                <!-- Wikipedia -->
                <a href="https://ko.wikipedia.org" class="shortcut-card">
                    <div class="shortcut-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.84L19.5 19H4.5L12 5.84zM11 10h2v5h-2zm0 6h2v2h-2z"/></svg>
                    </div>
                    <span class="shortcut-label">Wikipedia</span>
                </a>
            </div>
        </div>

        <!-- Creamy AI 퀵 추천 프롬프트 -->
        <div class="ai-section">
            <div class="ai-header">
                <div class="ai-header-title">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
                    </svg>
                    Creamy AI 빠른 탐색
                </div>
            </div>
            <div class="ai-chips-list">
                <div class="ai-chip" onclick="searchAi('오늘 주요 뉴스 핵심 3가지 요약해줘')">
                    📰 오늘 주요 뉴스 요약
                </div>
                <div class="ai-chip" onclick="searchAi('최신 IT 및 AI 트렌드 브리핑')">
                    🤖 최신 AI 트렌드
                </div>
                <div class="ai-chip" onclick="searchAi('서울 오늘 날씨와 이번 주 기온 변화')">
                    🌦️ 날씨와 주간 예보
                </div>
                <div class="ai-chip" onclick="searchAi('생산성을 높이는 브라우저 활용 팁')">
                    💡 스마트 생산성 팁
                </div>
            </div>
        </div>

        <div class="footer-note">
            Cream Browser · Powered by Cream ai Hub
        </div>

    </div>

    <script>
        function navigate(targetUrl) {
            if (window.AndroidCreamApp && window.AndroidCreamApp.loadUrl) {
                window.AndroidCreamApp.loadUrl(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('searchInput');
            const q = input.value.trim();
            if (!q) return;

            let url;
            if (q.startsWith('http://') || q.startsWith('https://')) {
                url = q;
            } else if (q.includes('.') && !q.includes(' ') && !q.startsWith('?')) {
                url = 'https://' + q;
            } else {
                url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
            }
            navigate(url);
        }

        function searchAi(promptText) {
            const creamyUrl = 'https://doteai.base44.app/creamy?q=' + encodeURIComponent(promptText);
            navigate(creamyUrl);
        }
    </script>
</body>
</html>
