<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creamy Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* 1. 기본 다크모드 (Default Dark) */
        body.theme-default-dark {
            --bg-page: #000000;
            --text-greeting: #FFFFFF;
            --text-subtitle: #9E9E9E;
            --planet-color: #FFFFFF;
            --search-bg: #16191E;
            --search-border: #272B33;
            --search-text: #FFFFFF;
            --search-placeholder: #767C88;
            --caret-color: #000000;
            --search-btn-bg: #FFFFFF;
            --search-btn-arrow: #000000;
            --pill-bg: #242830;
            --pill-border: #2D323C;
            --pill-text: #FFFFFF;
            --card-bg: #181B20;
            --card-border: #272B33;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --site-label: #A0A0A0;
            --site-icon-bg: #FFFFFF;
        }

        /* 2. 기본 라이트모드 (Default Light) */
        body.theme-default-light {
            --bg-page: #F3F4F6;
            --text-greeting: #111111;
            --text-subtitle: #555555;
            --planet-color: #111111;
            --search-bg: #FFFFFF;
            --search-border: #222222;
            --search-text: #111111;
            --search-placeholder: #666666;
            --caret-color: #000000;
            --search-btn-bg: #111111;
            --search-btn-arrow: #FFFFFF;
            --pill-bg: #FFFFFF;
            --pill-border: #E5E7EB;
            --pill-text: #111111;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --site-label: #444444;
            --site-icon-bg: #FFFFFF;
        }

        /* 3. 핑크테마 다크모드 (Pink Dark) */
        body.theme-pink-dark {
            --bg-page: linear-gradient(180deg, #382025 0%, #201114 100%);
            --text-greeting: #FFFFFF;
            --text-subtitle: #D9A5AF;
            --planet-color: #FFFFFF;
            --search-bg: #FFFFFF;
            --search-border: transparent;
            --search-text: #222222;
            --search-placeholder: #555555;
            --caret-color: #000000;
            --search-btn-bg: #B7626F;
            --search-btn-arrow: #FFFFFF;
            --pill-bg: #FFFFFF;
            --pill-border: transparent;
            --pill-text: #2A1217;
            --card-bg: #FFFFFF;
            --card-border: transparent;
            --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            --site-label: #333333;
            --site-icon-bg: #FFFFFF;
        }

        /* 4. 핑크테마 라이트모드 (Pink Light) */
        body.theme-pink-light {
            --bg-page: linear-gradient(180deg, #FFEBEF 0%, #FFD6DE 100%);
            --text-greeting: #6E343D;
            --text-subtitle: #9C5D66;
            --planet-color: #6E343D;
            --search-bg: #FFFFFF;
            --search-border: #F2C4CD;
            --search-text: #4A1E25;
            --search-placeholder: #8E525C;
            --caret-color: #000000;
            --search-btn-bg: #C86B7A;
            --search-btn-arrow: #FFFFFF;
            --pill-bg: #FFFFFF;
            --pill-border: #F7D2DA;
            --pill-text: #6E343D;
            --card-bg: #FFFFFF;
            --card-border: #F7D2DA;
            --card-shadow: 0 6px 24px rgba(220, 130, 150, 0.15);
            --site-label: #6E343D;
            --site-icon-bg: #FFFFFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px 40px 20px;
            transition: background 0.25s ease;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 0 auto;
        }

        /* 행성 로고 (Photo 1 기반 라인 아트 SVG) */
        .planet-logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            color: var(--planet-color);
            margin-bottom: 2px;
            transition: color 0.25s ease;
        }

        .planet-logo {
            width: 48px;
            height: 48px;
            display: block;
        }

        /* 상단 타이틀 & 서브타이틀 */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .greeting-title {
            font-size: 27px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-greeting);
            transition: color 0.25s ease;
        }

        .briefing-link {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-subtitle);
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.15s, color 0.25s ease;
            letter-spacing: -0.01em;
        }

        .briefing-link:active {
            opacity: 0.7;
        }

        /* 옴니 검색창 캡슐 */
        .search-box-wrap {
            width: 100%;
            max-width: 520px;
            margin-top: 4px;
        }

        .search-form {
            width: 100%;
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border: 1.5px solid var(--search-border);
            border-radius: 30px;
            padding: 6px 6px 6px 20px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.25s;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14.5px;
            color: var(--search-text);
            font-family: inherit;
            caret-color: #000000 !important;
            padding: 8px 0;
        }

        .search-input::placeholder {
            color: var(--search-placeholder);
            font-size: 14px;
        }

        .search-submit-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--search-btn-bg);
            color: var(--search-btn-arrow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .search-submit-btn:active {
            transform: scale(0.92);
        }

        .search-submit-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--search-btn-arrow);
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 4구 퀵 알약 버튼 */
        .pills-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            max-width: 520px;
        }

        .pill-btn {
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--pill-text);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: transform 0.1s, opacity 0.15s, background 0.25s, color 0.25s;
        }

        .pill-btn:active {
            transform: scale(0.96);
            opacity: 0.85;
        }

        /* 바로가기 사이트 카드 컨테이너 */
        .favorites-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 16px 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 6px;
            transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .site-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .site-item:active {
            transform: scale(0.94);
        }

        .site-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background: var(--site-icon-bg);
        }

        .site-icon-box svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        /* 네이버: 그린 배경 */
        .naver-box {
            background: #03C75A;
        }

        /* 유튜브: 레드 배경 */
        .youtube-box {
            background: #FF0000;
        }

        .site-name {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--site-label);
            text-align: center;
            transition: color 0.25s ease;
        }

        /* 모바일 최적화 반응형 뷰 */
        @media (max-width: 500px) {
            body {
                padding: 16px 16px 36px 16px;
            }
            .greeting-title {
                font-size: 22px;
            }
            .briefing-link {
                font-size: 12.5px;
            }
            .search-box-wrap {
                max-width: 100%;
            }
            .pills-row {
                gap: 7px;
            }
            .pill-btn {
                padding: 7px 12px;
                font-size: 11px;
            }
            .favorites-card {
                max-width: 100%;
                padding: 14px 12px;
                gap: 8px;
            }
            .site-icon-box {
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }
            .site-icon-box svg {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body class="theme-default-dark">

    <div class="container">

        <!-- 행성 로고 (Photo 1 기반 벡터) -->
        <div class="planet-logo-wrap">
            <svg viewBox="0 0 100 100" class="planet-logo">
                <circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="3.2" />
                <g transform="rotate(-28 50 50)">
                    <rect x="16" y="46" width="68" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="3.2" />
                </g>
            </svg>
        </div>

        <!-- 인사말 및 서브타이틀 -->
        <div class="header-section">
            <h1 class="greeting-title" id="greetingTitle">좋은 아침입니다, 민중님.</h1>
            <a class="briefing-link" href="javascript:void(0)" onclick="openBriefing(event)">오늘의 브리핑 보기</a>
        </div>

        <!-- 옴니 검색창 캡슐 -->
        <div class="search-box-wrap">
            <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="검색어를 입력하거나 질문하세요." 
                    autocomplete="off" 
                    autofocus>
                <button type="submit" class="search-submit-btn" aria-label="검색">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </form>
        </div>

        <!-- 4구 퀵 알약 버튼 -->
        <div class="pills-row">
            <button class="pill-btn" onclick="openSecurityTab()">새 보안 탭</button>
            <button class="pill-btn" onclick="openSidebarAi()">Creamy에게 물어보기</button>
            <button class="pill-btn" onclick="openSecurityDashboard()">보안 대시보드</button>
            <button class="pill-btn" onclick="openSettings()">설정</button>
        </div>

        <!-- 바로가기 4개 사이트 카드 -->
        <div class="favorites-card">
            <!-- Naver -->
            <a href="https://www.naver.com" class="site-item" onclick="navigate('https://www.naver.com'); return false;">
                <div class="site-icon-box naver-box">
                    <svg viewBox="0 0 24 24">
                        <path fill="#FFFFFF" d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z"/>
                    </svg>
                </div>
                <span class="site-name">Naver</span>
            </a>

            <!-- Daum -->
            <a href="https://www.daum.net" class="site-item" onclick="navigate('https://www.daum.net'); return false;">
                <div class="site-icon-box daum-box">
                    <svg viewBox="0 0 24 24">
                        <path fill="#2E85FF" d="M4 4h7a8 8 0 0 1 8 8 8 8 0 0 1-8 8H4V4z" fill-opacity="0.12"/>
                        <path fill="#FF4B4B" d="M4 4h7a8 8 0 0 1 8 8h-4a4 4 0 0 0-4-4H4V4z"/>
                        <path fill="#FFB703" d="M19 12a8 8 0 0 1-8 8H4v-4h7a4 4 0 0 0 4-4h4z"/>
                        <path fill="#2E85FF" d="M4 10h4v4H4z"/>
                    </svg>
                </div>
                <span class="site-name">Daum</span>
            </a>

            <!-- Google -->
            <a href="https://www.google.com" class="site-item" onclick="navigate('https://www.google.com'); return false;">
                <div class="site-icon-box google-box">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                </div>
                <span class="site-name">Google</span>
            </a>

            <!-- Youtube -->
            <a href="https://www.youtube.com" class="site-item" onclick="navigate('https://www.youtube.com'); return false;">
                <div class="site-icon-box youtube-box">
                    <svg viewBox="0 0 24 24">
                        <polygon fill="#FFFFFF" points="9.5,7.5 16.5,12 9.5,16.5"/>
                    </svg>
                </div>
                <span class="site-name">Youtube</span>
            </a>
        </div>

    </div>

    <script>
        function navigate(targetUrl) {
            if (window.AndroidCreamApp && window.AndroidCreamApp.loadUrl) {
                window.AndroidCreamApp.loadUrl(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('searchInput');
            const q = input.value.trim();
            if (!q) return;

            let url;
            if (q.startsWith('http://') || q.startsWith('https://')) {
                url = q;
            } else if (q.includes('.') && !q.includes(' ') && !q.startsWith('?')) {
                url = 'https://' + q;
            } else {
                url = 'https://www.google.com/search?q=' + encodeURIComponent(q);
            }
            navigate(url);
        }

        function openSecurityTab() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSecurityTab) {
                window.AndroidCreamApp.openSecurityTab();
            } else {
                navigate('start_page_security.html');
            }
        }

        function openSidebarAi() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSidebarAi) {
                window.AndroidCreamApp.openSidebarAi();
            } else {
                navigate('https://doteai.base44.app/creamy');
            }
        }

        function openSecurityDashboard() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSecurityDashboard) {
                window.AndroidCreamApp.openSecurityDashboard();
            }
        }

        function openSettings() {
            if (window.AndroidCreamApp && window.AndroidCreamApp.openSettings) {
                window.AndroidCreamApp.openSettings();
            }
        }

        function openBriefing(e) {
            if (e) e.preventDefault();
            if (window.AndroidCreamApp && window.AndroidCreamApp.openBriefing) {
                window.AndroidCreamApp.openBriefing();
            } else {
                openSidebarAi();
            }
        }

        // 테마 설정 함수 (Android에서 호출하거나 localStorage에서 로드)
        window.setTheme = function(themeName) {
            document.body.className = '';
            const valid = ['theme-default-dark', 'theme-default-light', 'theme-pink-dark', 'theme-pink-light'];
            const target = themeName.startsWith('theme-') ? themeName : 'theme-' + themeName.replace('_', '-');
            if (valid.includes(target)) {
                document.body.classList.add(target);
            } else {
                document.body.classList.add('theme-default-dark');
            }
            try {
                localStorage.setItem('creamy_theme_mode', target);
            } catch (err) {}
        };

        // 초기 테마 로드
        (function initTheme() {
            let saved = null;
            try {
                if (window.AndroidCreamApp && window.AndroidCreamApp.getTheme) {
                    saved = window.AndroidCreamApp.getTheme();
                } else {
                    saved = localStorage.getItem('creamy_theme_mode');
                }
            } catch (err) {}
            if (saved) {
                window.setTheme(saved);
            } else {
                window.setTheme('theme-default-dark');
            }

            // 시간대별 인사말 설정 (기본: "좋은 아침입니다, 민중님.")
            const hour = new Date().getHours();
            const el = document.getElementById('greetingTitle');
            if (el) {
                if (hour >= 5 && hour < 12) {
                    el.textContent = "좋은 아침입니다, 민중님.";
                } else if (hour >= 12 && hour < 18) {
                    el.textContent = "좋은 오후입니다, 민중님.";
                } else {
                    el.textContent = "좋은 저녁입니다, 민중님.";
                }
            }
        })();
    </script>
</body>
</html>
