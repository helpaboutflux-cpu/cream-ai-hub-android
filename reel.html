<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cream ai Hub — "Cook for Cream ai" Official Reel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070504;
      --card-bg: rgba(26, 20, 16, 0.75);
      --card-border: rgba(217, 119, 6, 0.2);
      --terracotta: #c26d45;
      --terracotta-glow: rgba(194, 109, 69, 0.35);
      --text: #f5f3f0;
      --text-muted: #9c9288;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 24px;
    }

    .reel-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Top Brand Bar */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(18, 14, 12, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--terracotta);
      background: rgba(194, 109, 69, 0.15);
      border: 1px solid rgba(194, 109, 69, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
      outline: none;
    }

    .btn-export {
      background: var(--terracotta);
      color: #ffffff;
      box-shadow: 0 4px 18px var(--terracotta-glow);
    }
    .btn-export:hover {
      background: #d47a50;
      transform: scale(1.02);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Video Frame */
    .viewport-box {
      width: 100%;
      display: flex;
      justify-content: center;
      position: relative;
    }

    #reelCanvas {
      width: 100%;
      max-width: 1040px;
      aspect-ratio: 16 / 9;
      background: #070504;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(194, 109, 69, 0.2);
    }

    /* Player Controls */
    .controls-panel {
      width: 100%;
      background: rgba(18, 14, 12, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .timeline-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #2a221c;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--terracotta);
      box-shadow: 0 0 12px rgba(194, 109, 69, 0.8);
      cursor: pointer;
    }

    .time-badge {
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-weight: 700;
      min-width: 90px;
      text-align: right;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .play-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #000000;
    }

    .scene-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--terracotta);
      margin-left: 12px;
    }

    .export-status {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--terracotta);
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="reel-container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand-group">
        <span class="brand-badge">Instagram Reel Clone</span>
        <div class="brand-title">Pov : You cook for @CreamAIHub</div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="export-status" id="exportStatus">
          <span style="display:inline-block; animation: spin 0.8s linear infinite;">⏳</span>
          <span id="exportText">렌더링 중... (0%)</span>
        </div>
        <button class="btn btn-export" id="btnExport">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          릴스 비디오 파일 다운로드 (MP4/WebM)
        </button>
      </div>
    </div>

    <!-- Canvas Viewport -->
    <div class="viewport-box">
      <canvas id="reelCanvas" width="1920" height="1080"></canvas>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="slider-row">
        <input type="range" class="timeline-slider" id="timelineSlider" min="0" max="11.5" value="0" step="0.05">
        <div class="time-badge" id="timeBadge">00:00 / 00:11</div>
      </div>

      <div class="btn-row">
        <div class="play-group">
          <button class="btn btn-circle" id="btnPlay">
            <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="pauseIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
          <button class="btn btn-secondary" id="btnReplay">
            ↺ 처음부터
          </button>
          <span class="scene-indicator" id="sceneIndicator">Scene 1: Greeting & Prompt</span>
        </div>

        <button class="btn btn-secondary" id="btnSound">
          [소리] BGM & SFX 켜짐
        </button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('reelCanvas');
    const ctx = canvas.getContext('2d');

    const TOTAL_DURATION = 11.5;
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = null;
    let soundEnabled = true;

    // --- Audio Synthesis Engine ---
    let audioCtx = null;
    let bgmOsc1 = null, bgmOsc2 = null, bgmGain = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'type') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420 + Math.random() * 80, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.04);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } else if (type === 'click') {
        // Deep satisfying mechanical click
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);

        // Low thud
        const thud = audioCtx.createOscillator();
        const thudGain = audioCtx.createGain();
        thud.type = 'sine';
        thud.frequency.setValueAtTime(110, now);
        thud.frequency.exponentialRampToValueAtTime(30, now + 0.18);
        thudGain.gain.setValueAtTime(0.35, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        thud.connect(thudGain);
        thudGain.connect(audioCtx.destination);
        thud.start(now);
        thud.stop(now + 0.18);
      } else if (type === 'stream') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600 + Math.random() * 200, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.03);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      } else if (type === 'reveal') {
        // Warm resonant copper chord
        const freqs = [220, 277.18, 329.63, 440]; // A major
        freqs.forEach(f => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 1.8);
        });
      }
    }

    function startDrone() {
      if (!soundEnabled || bgmOsc1) return;
      initAudio();
      const now = audioCtx.currentTime;

      bgmOsc1 = audioCtx.createOscillator();
      bgmOsc2 = audioCtx.createOscillator();
      bgmGain = audioCtx.createGain();

      bgmOsc1.type = 'sine';
      bgmOsc2.type = 'sine';
      bgmOsc1.frequency.setValueAtTime(55, now); // Low A1
      bgmOsc2.frequency.setValueAtTime(110, now); // A2

      bgmGain.gain.setValueAtTime(0.08, now);

      bgmOsc1.connect(bgmGain);
      bgmOsc2.connect(bgmGain);
      bgmGain.connect(audioCtx.destination);

      bgmOsc1.start();
      bgmOsc2.start();
    }

    function stopDrone() {
      if (bgmOsc1) {
        bgmOsc1.stop();
        bgmOsc2.stop();
        bgmOsc1 = null;
        bgmOsc2 = null;
        bgmGain = null;
      }
    }

    // --- Math Easing ---
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }
    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    // --- Sound Triggers ---
    let typedCount = 0;
    let sendClicked = false;
    let streamSoundTime = 0;
    let revealPlayed = false;

    function resetTriggers() {
      typedCount = 0;
      sendClicked = false;
      streamSoundTime = 0;
      revealPlayed = false;
    }

    // --- Drawing Utilities ---
    function drawStarburst(cx, cy, radius, spokes, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (let i = 0; i < spokes; i++) {
        const angle = (i * Math.PI * 2) / spokes;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * (radius * 0.35), Math.sin(angle) * (radius * 0.35));
        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPointerHand(x, y, isClicking, waveProg) {
      ctx.save();
      ctx.translate(x, y);

      if (waveProg > 0 && waveProg < 1) {
        ctx.strokeStyle = `rgba(194, 109, 69, ${0.8 * (1 - waveProg)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, waveProg * 45, 0, Math.PI * 2);
        ctx.stroke();
      }

      const s = isClicking ? 0.88 : 1.0;
      ctx.scale(s, s);

      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 6;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.5;

      // Stylized Pointer Hand
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -22);
      ctx.arc(4, -22, 4, Math.PI, 0, false);
      ctx.lineTo(8, -10);
      ctx.lineTo(12, -10);
      ctx.lineTo(16, -10);
      ctx.lineTo(18, 0);
      ctx.lineTo(16, 12);
      ctx.lineTo(4, 16);
      ctx.lineTo(-4, 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // --- Master Render Engine (1:1 with Reference Reel) ---
    function renderFrame(time) {
      const W = canvas.width;
      const H = canvas.height;

      // 1. Cinematic Vignette Background
      ctx.fillStyle = '#060404';
      ctx.fillRect(0, 0, W, H);

      // Warm Copper / Orange Ambient Backlight (center-shifted)
      const glowGrad = ctx.createRadialGradient(W / 2, H * 0.46, 30, W / 2, H * 0.46, W * 0.6);
      glowGrad.addColorStop(0, 'rgba(194, 109, 69, 0.28)');
      glowGrad.addColorStop(0.45, 'rgba(140, 70, 40, 0.12)');
      glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, W, H);

      // ==========================================================
      // SCENE 1: GREETING & FLOATING PROMPT BOX (0.0s - 4.5s)
      // ==========================================================
      if (time < 5.0) {
        document.getElementById('sceneIndicator').textContent = 'Scene 1: Greeting & Prompt';

        const scene1Exit = time > 4.2 ? (time - 4.2) / 0.8 : 0;
        const scene1Alpha = Math.max(0, 1 - scene1Exit);

        ctx.save();
        ctx.globalAlpha = scene1Alpha;

        // Header: Starburst Icon + "Good evening, Minjung" (Serif)
        const headerProg = easeOutBack(Math.min(1, time / 0.8));
        ctx.save();
        ctx.translate(W / 2, H * 0.36);
        ctx.scale(headerProg, headerProg);

        // Warm Orange Starburst
        drawStarburst(-210, 0, 18, 12, '#d97706');

        // Elegant Serif Greeting
        ctx.font = `400 48px 'Newsreader', serif`;
        ctx.fillStyle = '#f5f3f0';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('Good evening, Minjung', -180, 0);
        ctx.restore();

        // Floating Dark Input Box
        const boxProg = easeOutBack(Math.min(1, Math.max(0, (time - 0.4) / 0.7)));
        const boxW = 820;
        const boxH = 92;

        ctx.save();
        ctx.translate(W / 2, H * 0.54);
        ctx.scale(boxProg, boxProg);

        // Dark Translucent Card
        ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 15;

        ctx.fillStyle = 'rgba(24, 18, 15, 0.82)';
        ctx.beginPath();
        ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 24);
        ctx.fill();

        ctx.strokeStyle = 'rgba(194, 109, 69, 0.28)';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        // Left "+" Icon
        ctx.strokeStyle = '#8c827a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-boxW / 2 + 36, -7);
        ctx.lineTo(-boxW / 2 + 36, 7);
        ctx.moveTo(-boxW / 2 + 29, 0);
        ctx.lineTo(-boxW / 2 + 43, 0);
        ctx.stroke();

        // Typing Prompt
        const promptText = 'Help me build Cream ai Hub superapp';
        let typed = '';
        if (time >= 1.0) {
          const typeProg = Math.min(1, (time - 1.0) / 2.6);
          const chars = Math.floor(promptText.length * typeProg);
          typed = promptText.substring(0, chars);

          if (chars !== typedCount && isPlaying) {
            typedCount = chars;
            playSound('type');
          }
        }

        const showCaret = Math.floor(time * 3.5) % 2 === 0;
        const displayPrompt = typed + (time < 4.2 && showCaret ? '|' : '');

        ctx.font = `500 24px 'Pretendard', sans-serif`;
        ctx.fillStyle = '#f5f3f0';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayPrompt, -boxW / 2 + 64, 0);

        // Right Model Badge: "floraChat v3.2"
        const badgeW = 140;
        const badgeH = 36;
        const badgeX = boxW / 2 - badgeW - 20;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.beginPath();
        ctx.roundRect(badgeX, -badgeH / 2, badgeW, badgeH, 999);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.font = `600 13px 'Plus Jakarta Sans', sans-serif`;
        ctx.fillStyle = '#d47a50';
        ctx.textAlign = 'center';
        ctx.fillText('floraChat v3.2', badgeX + badgeW / 2, 0);

        ctx.restore();
        ctx.restore();
      }

      // ==========================================================
      // SCENE 2: CLOSE-UP SEND BUTTON CLICK (4.5s - 6.8s)
      // ==========================================================
      if (time >= 4.5 && time < 7.0) {
        document.getElementById('sceneIndicator').textContent = 'Scene 2: Send Button Click';

        const scene2Enter = easeOutBack(Math.min(1, (time - 4.5) / 0.5));
        const scene2Exit = time > 6.4 ? (time - 6.4) / 0.6 : 0;
        const scene2Alpha = Math.max(0, 1 - scene2Exit);

        ctx.save();
        ctx.globalAlpha = scene2Alpha;
        ctx.translate(W / 2, H / 2);
        ctx.scale(scene2Enter, scene2Enter);

        // Terracotta Rounded Square Button (Exact 1:1 match with reference)
        const btnSize = 130;
        const isClicking = time >= 5.5 && time <= 5.85;

        if (isClicking && !sendClicked && isPlaying) {
          sendClicked = true;
          playSound('click');
        }

        const clickWave = isClicking ? (time - 5.5) / 0.35 : 0;
        const btnScale = isClicking ? 0.90 : 1.0;

        ctx.save();
        ctx.scale(btnScale, btnScale);

        // Warm Ambient Button Glow
        ctx.shadowColor = 'rgba(194, 109, 69, 0.65)';
        ctx.shadowBlur = 55;
        ctx.shadowOffsetY = 12;

        ctx.fillStyle = '#c26d45'; // Reference terracotta color
        ctx.beginPath();
        ctx.roundRect(-btnSize / 2, -btnSize / 2, btnSize, btnSize, 36);
        ctx.fill();

        // Upward Arrow Icon "↑"
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(0, 24);
        ctx.lineTo(0, -22);
        ctx.moveTo(-16, -6);
        ctx.lineTo(0, -22);
        ctx.lineTo(16, -6);
        ctx.stroke();

        ctx.restore();

        // Pointer Hand Cursor Moving In & Clicking
        const cursorMove = easeInOutCubic(Math.min(1, Math.max(0, (time - 4.7) / 0.8)));
        const startX = 140;
        const startY = 160;
        const curX = startX + (0 - startX) * cursorMove;
        const curY = startY + (10 - startY) * cursorMove;

        drawPointerHand(curX, curY, isClicking, clickWave);

        ctx.restore();
      }

      // ==========================================================
      // SCENE 3: GLOWING CODE GENERATION STREAM (6.6s - 9.2s)
      // ==========================================================
      if (time >= 6.6 && time < 9.5) {
        document.getElementById('sceneIndicator').textContent = 'Scene 3: Autonomous Code Stream';

        const scene3Enter = Math.min(1, (time - 6.6) / 0.4);
        const scene3Exit = time > 8.8 ? (time - 8.8) / 0.7 : 0;
        const scene3Alpha = Math.max(0, 1 - scene3Exit);

        ctx.save();
        ctx.globalAlpha = scene3Alpha;
        ctx.translate(W / 2, H / 2);

        // Code Box (Center Focused with Warm Light)
        const codeLines = [
          'struct CreamSuperApp {',
          '    var modules[8]: Module;',
          '    let engine = floraChat(v3.2);',
          '};',
          '',
          'void buildAutonomousHub() {',
          '    initWebEngine(floraChat);',
          '    syncUserCredits("kimminjung");',
          '    compileAndroidAPK(v1.8);',
          '    printf("[OK] Cream ai Hub Online");',
          '}'
        ];

        const lineDelay = 0.18;
        const startStream = 6.8;

        ctx.font = `500 24px 'JetBrains Mono', monospace`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        const boxStartX = -320;
        const boxStartY = -140;

        codeLines.forEach((line, idx) => {
          const lineAppearTime = startStream + idx * lineDelay;
          if (time >= lineAppearTime) {
            const lineAlpha = Math.min(1, (time - lineAppearTime) / 0.2);

            if (time - streamSoundTime > 0.18 && isPlaying) {
              streamSoundTime = time;
              playSound('stream');
            }

            // Warm Glowing Code Glow
            ctx.shadowColor = 'rgba(217, 119, 6, 0.4)';
            ctx.shadowBlur = 18;

            ctx.fillStyle = `rgba(245, 243, 240, ${lineAlpha})`;
            ctx.fillText(line, boxStartX, boxStartY + idx * 30);
          }
        });

        ctx.restore();
      }

      // ==========================================================
      // SCENE 4: CINEMATIC LOGO ASSEMBLY & OUTRO (9.0s - 11.5s)
      // ==========================================================
      if (time >= 9.0) {
        document.getElementById('sceneIndicator').textContent = 'Scene 4: Brand Reveal & Outro';

        if (!revealPlayed && isPlaying) {
          revealPlayed = true;
          playSound('reveal');
        }

        const tOutro = easeOutBack(Math.min(1, (time - 9.0) / 0.8));

        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.scale(tOutro, tOutro);

        // Pulsing Radial Rays
        const pulseR = 120 + Math.sin(time * 4) * 15;
        const rayGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, pulseR);
        rayGrad.addColorStop(0, 'rgba(194, 109, 69, 0.45)');
        rayGrad.addColorStop(0.7, 'rgba(194, 109, 69, 0.12)');
        rayGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
        ctx.fill();

        // Center Signature Swirl / Starburst (Claude & Cream Fusion)
        drawStarburst(0, -30, 48, 16, '#c26d45');

        // Brand Title
        ctx.shadowColor = 'rgba(194, 109, 69, 0.5)';
        ctx.shadowBlur = 24;

        ctx.font = `900 52px 'Pretendard', sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Cream ai Hub', 0, 50);

        ctx.font = `400 22px 'Newsreader', serif`;
        ctx.fillStyle = '#c26d45';
        ctx.fillText('Build Everything with Words.', 0, 95);

        ctx.restore();
      }

      // Top Red Line Progress Bar
      const totalWidth = W * (time / TOTAL_DURATION);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.fillRect(0, 0, W, 4);
      ctx.fillStyle = '#c26d45';
      ctx.fillRect(0, 0, totalWidth, 4);
    }

    // --- Animation Loop ---
    function step(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= TOTAL_DURATION) {
          currentTime = 0;
          resetTriggers();
        }
        updateTime();
        renderFrame(currentTime);
      }

      requestAnimationFrame(step);
    }

    function updateTime() {
      const curM = Math.floor(currentTime / 60).toString().padStart(2, '0');
      const curS = Math.floor(currentTime % 60).toString().padStart(2, '0');
      const totM = Math.floor(TOTAL_DURATION / 60).toString().padStart(2, '0');
      const totS = Math.floor(TOTAL_DURATION % 60).toString().padStart(2, '0');
      document.getElementById('timeBadge').textContent = `${curM}:${curS} / ${totM}:${totS}`;
      document.getElementById('timelineSlider').value = currentTime;
    }

    function play() {
      isPlaying = true;
      lastTimestamp = null;
      document.getElementById('playIcon').style.display = 'none';
      document.getElementById('pauseIcon').style.display = 'block';
      startDrone();
    }

    function pause() {
      isPlaying = false;
      document.getElementById('playIcon').style.display = 'block';
      document.getElementById('pauseIcon').style.display = 'none';
      stopDrone();
    }

    // --- Controls ---
    document.getElementById('btnPlay').addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    document.getElementById('btnReplay').addEventListener('click', () => {
      currentTime = 0;
      resetTriggers();
      updateTime();
      renderFrame(0);
      play();
    });

    document.getElementById('timelineSlider').addEventListener('input', (e) => {
      pause();
      currentTime = parseFloat(e.target.value);
      updateTime();
      renderFrame(currentTime);
    });

    document.getElementById('btnSound').addEventListener('click', (e) => {
      soundEnabled = !soundEnabled;
      e.target.textContent = soundEnabled ? '[소리] BGM & SFX 켜짐' : '[음소거] 소리 꺼짐';
      if (!soundEnabled) stopDrone();
      else if (isPlaying) startDrone();
    });

    // --- Video Exporter ---
    document.getElementById('btnExport').addEventListener('click', async () => {
      pause();
      const statusBox = document.getElementById('exportStatus');
      const statusText = document.getElementById('exportText');
      statusBox.style.display = 'inline-flex';
      statusText.textContent = '인코딩 준비 중...';

      currentTime = 0;
      resetTriggers();
      renderFrame(0);

      const stream = canvas.captureStream(60);
      let mimeType = 'video/webm;codecs=vp9';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4';

      const recorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 16000000 // 16Mbps High Bitrate
      });

      const chunks = [];
      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        statusText.textContent = '인코딩 완료! 다운로드 중...';
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cook-for-cream-ai-hub-reel-${Date.now()}.webm`;
        a.click();

        setTimeout(() => {
          statusBox.style.display = 'none';
        }, 3000);
      };

      recorder.start();

      const startTime = performance.now();
      const exportInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        currentTime = elapsed;
        const progressPercent = Math.min(100, Math.round((currentTime / TOTAL_DURATION) * 100));
        statusText.textContent = `렌더링 중... (${progressPercent}%)`;
        updateTime();
        renderFrame(currentTime);

        if (currentTime >= TOTAL_DURATION) {
          clearInterval(exportInterval);
          recorder.stop();
        }
      }, 1000 / 60);
    });

    // Initial Render
    renderFrame(0);
    requestAnimationFrame(step);
  </script>
</body>
</html>
