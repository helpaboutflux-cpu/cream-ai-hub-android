<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLUX Frame - 앱 & 웹 런칭 쇼케이스 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: {
              950: '#09090b',
              900: '#121215',
              850: '#18181b',
              800: '#27272a',
              700: '#3f3f46',
              200: '#e4e4e7',
              100: '#f4f4f5'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen transition-colors duration-200 flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-neutral-900/80 backdrop-blur-md border-b border-neutral-200 dark:border-neutral-800">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="w-9 h-9 rounded-xl bg-violet-600 text-white font-black flex items-center justify-center text-sm shadow-md shadow-violet-500/20">F</a>
        <div>
          <div class="flex items-center space-x-2">
            <span class="font-bold text-base tracking-tight">FLUX Frame</span>
            <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-violet-100 dark:bg-violet-950/70 text-violet-600 dark:text-violet-400 font-semibold border border-violet-200 dark:border-violet-800/60">Frame v1.0</span>
          </div>
          <p class="text-[11px] text-neutral-500 dark:text-neutral-400">FLUX soft가 만든 서비스</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="downloadShowcasePng()" class="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold shadow-md shadow-violet-500/20 transition">
          <div class="flex items-center space-x-1.5"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg><span>고화질 PNG 다운로드</span></div>
        </button>
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 text-xs font-medium text-neutral-700 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
          <span id="themeToggleText">다크 모드</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- Left Controls Panel (5 cols) -->
    <div class="lg:col-span-5 space-y-6 bg-gradient-to-b from-white via-violet-50/40 to-purple-50/20 dark:from-neutral-900 dark:to-violet-950/40 p-6 rounded-3xl border border-violet-200/80 dark:border-violet-900/60 shadow-xl shadow-violet-500/5">
      <div class="space-y-1">
        <h2 class="text-base font-bold">쇼케이스 설정</h2>
        <p class="text-xs text-neutral-500">앱 스크린샷을 넣어 홍보용 쇼케이스 카드를 만듭니다.</p>
      </div>

      <!-- 1. Image Upload -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-neutral-700 dark:text-neutral-300">스크린샷 이미지</label>
        <div onclick="document.getElementById('frameImageInput').click()" class="border-2 border-dashed border-neutral-300 dark:border-neutral-700 hover:border-neutral-900 dark:hover:border-white p-4 rounded-2xl text-center cursor-pointer transition bg-neutral-50 dark:bg-neutral-950 flex flex-col items-center justify-center space-y-1">
          <span id="uploadLabel" class="text-xs font-medium text-neutral-700 dark:text-neutral-300">이미지 선택 또는 드래그 (.png, .jpg)</span>
          <span id="uploadSubtext" class="text-[10px] text-neutral-500">현재 기본 샘플 화면 로드됨</span>
          <input type="file" id="frameImageInput" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
        </div>
      </div>

      <!-- 2. Device Frame -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-neutral-700 dark:text-neutral-300">디바이스 프레임</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setDevice('galaxy')" id="btnDevGalaxy" class="py-2.5 px-3 rounded-xl border-2 border-violet-600 dark:border-violet-400 text-xs font-bold bg-violet-50 dark:bg-violet-950/40 text-violet-600 dark:text-violet-400 transition text-center shadow-sm">
            갤럭시 스마트폰
          </button>
          <button type="button" onclick="setDevice('browser')" id="btnDevBrowser" class="py-2.5 px-3 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition text-center">
            데스크톱 브라우저
          </button>
          <button type="button" onclick="setDevice('tablet')" id="btnDevTablet" class="py-2.5 px-3 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition text-center">
            태블릿 (16:10)
          </button>
          <button type="button" onclick="setDevice('none')" id="btnDevNone" class="py-2.5 px-3 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition text-center">
            프레임 없음 (클린)
          </button>
        </div>
      </div>

      <!-- 3. Social Preset Ratio -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-neutral-700 dark:text-neutral-300">캔버스 비율 & 플랫폼</label>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="setRatio('16:9')" id="btnRatio169" class="py-2 rounded-xl border-2 border-violet-600 dark:border-violet-400 text-xs font-bold bg-violet-50 dark:bg-violet-950/40 text-violet-600 dark:text-violet-400 transition shadow-sm">
            16:9 (X/트위터)
          </button>
          <button type="button" onclick="setRatio('1:1')" id="btnRatio11" class="py-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
            1:1 (정사각형)
          </button>
          <button type="button" onclick="setRatio('9:16')" id="btnRatio916" class="py-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
            9:16 (릴스/스토리)
          </button>
        </div>
      </div>

      <!-- 4. Text Customization -->
      <div class="space-y-3">
        <label class="text-xs font-semibold text-neutral-700 dark:text-neutral-300">텍스트 오버레이 (선택)</label>
        <input type="text" id="frameTitle" placeholder="메인 타이틀 (예: Creamy Browser v2.4)" value="Creamy Browser" oninput="drawFrame()" class="w-full px-3.5 py-2.5 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-950 text-xs outline-none">
        <input type="text" id="frameSubtitle" placeholder="서브 카피 (예: 가장 가볍고 빠른 안드로이드 AI 브라우저)" value="FLUX soft의 차세대 올인원 웹 브라우저" oninput="drawFrame()" class="w-full px-3.5 py-2.5 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-950 text-xs outline-none">
      </div>

      <!-- 5. Background Theme & Shadow -->
      <div class="space-y-3">
        <label class="text-xs font-semibold text-neutral-700 dark:text-neutral-300">배경 스타일</label>
        <div class="grid grid-cols-4 gap-2">
          <button type="button" onclick="setBg('black')" id="btnBgBlack" class="py-2 rounded-xl border border-neutral-900 dark:border-white text-xs font-semibold bg-neutral-900 text-white dark:bg-white dark:text-neutral-900">블랙</button>
          <button type="button" onclick="setBg('darkgray')" id="btnBgDarkgray" class="py-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium bg-neutral-800 text-neutral-200">다크그레이</button>
          <button type="button" onclick="setBg('light')" id="btnBgLight" class="py-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium bg-neutral-100 text-neutral-800">화이트</button>
          <button type="button" onclick="setBg('transparent')" id="btnBgTransparent" class="py-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-500">투명</button>
        </div>
      </div>

      <!-- 6. Shadow & Perspective -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs font-semibold text-neutral-700 dark:text-neutral-300">
          <span>그림자 깊이</span>
          <span id="shadowValText" class="font-mono text-neutral-500">40px</span>
        </div>
        <input type="range" id="shadowSlider" min="0" max="80" value="40" oninput="updateShadow(this.value)" class="w-full accent-violet-600">
      </div>
    </div>

    <!-- Right Live Canvas (7 cols) -->
    <div class="lg:col-span-7 flex flex-col items-center justify-center bg-white dark:bg-neutral-900 p-6 rounded-3xl border border-neutral-200 dark:border-neutral-800 shadow-sm space-y-4">
      <div class="w-full flex items-center justify-between text-xs text-neutral-500">
        <span class="font-semibold text-neutral-700 dark:text-neutral-300">실시간 렌더링 미리보기</span>
        <button onclick="copyCanvasImage()" class="hover:text-neutral-900 dark:hover:text-white transition">클립보드 이미지 복사</button>
      </div>

      <!-- Canvas Wrapper -->
      <div class="w-full flex items-center justify-center p-2 rounded-2xl bg-neutral-100 dark:bg-neutral-950 border border-neutral-200 dark:border-neutral-800 overflow-hidden">
        <canvas id="showcaseCanvas" class="max-w-full h-auto rounded-xl shadow-lg border border-neutral-300 dark:border-neutral-800"></canvas>
      </div>

      <div class="w-full flex items-center justify-between text-[11px] font-mono text-neutral-500">
        <span id="canvasDimText">1200 x 675 px</span>
        <span>고화질 2x Retina PNG</span>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="py-6 border-t border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 text-center text-xs text-neutral-500">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>FLUX Frame — FLUX soft가 만든 서비스</p>
      <div class="flex items-center space-x-3 text-neutral-400 text-xs">
        <a href="index.html" class="hover:underline">Developer Hub</a>
        <span>·</span>
        <a href="drop.html" class="hover:underline">Drop</a>
        <span>·</span>
        <a href="docs.html" class="hover:underline">Docs</a>
        <span>·</span>
        <a href="form.html" class="hover:underline">Form</a>
      </div>
    </div>
  </footer>

  <!-- Script Logic -->
  <script>
    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('cream_theme') || 'dark';
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
      drawFrame();
    }

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeToggleText').textContent = '라이트 모드';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeToggleText').textContent = '다크 모드';
      }
      localStorage.setItem('cream_theme', theme);
    }

    // State
    let currentDevice = 'galaxy';
    let currentRatio = '16:9';
    let currentBg = 'black';
    let currentShadow = 40;
    let uploadedImage = null;

    function setDevice(dev) {
      currentDevice = dev;
      ['galaxy', 'browser', 'tablet', 'none'].forEach(d => {
        const btn = document.getElementById('btnDev' + capitalize(d));
        if (d === dev) {
          btn.className = 'py-2.5 px-3 rounded-xl border-2 border-violet-600 dark:border-violet-400 text-xs font-bold bg-violet-50 dark:bg-violet-950/40 text-violet-600 dark:text-violet-400 transition text-center shadow-sm';
        } else {
          btn.className = 'py-2.5 px-3 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition text-center';
        }
      });
      drawFrame();
    }

    function setRatio(ratio) {
      currentRatio = ratio;
      const map = { '16:9': '169', '1:1': '11', '9:16': '916' };
      Object.keys(map).forEach(r => {
        const btn = document.getElementById('btnRatio' + map[r]);
        if (r === ratio) {
          btn.className = 'py-2 rounded-xl border-2 border-violet-600 dark:border-violet-400 text-xs font-bold bg-violet-50 dark:bg-violet-950/40 text-violet-600 dark:text-violet-400 transition shadow-sm';
        } else {
          btn.className = 'py-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-xs font-medium text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition';
        }
      });
      drawFrame();
    }

    function setBg(bg) {
      currentBg = bg;
      ['black', 'darkgray', 'light', 'transparent'].forEach(b => {
        const btn = document.getElementById('btnBg' + capitalize(b));
        if (b === bg) {
          btn.classList.add('ring-2', 'ring-neutral-400');
        } else {
          btn.classList.remove('ring-2', 'ring-neutral-400');
        }
      });
      drawFrame();
    }

    function updateShadow(val) {
      currentShadow = parseInt(val, 10);
      document.getElementById('shadowValText').textContent = val + 'px';
      drawFrame();
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('uploadLabel').textContent = file.name;
      document.getElementById('uploadSubtext').textContent = Math.round(file.size / 1024) + ' KB 이미지 로드 완료';

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          uploadedImage = img;
          drawFrame();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Default Sample Mock Screen Generator
    function createDefaultMockImage() {
      const canvas = document.createElement('canvas');
      canvas.width = 600;
      canvas.height = 1200;
      const ctx = canvas.getContext('2d');

      // Dark minimalist UI background
      ctx.fillStyle = '#121215';
      ctx.fillRect(0, 0, 600, 1200);

      // Top status bar simulation
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px monospace';
      ctx.fillText('09:41', 40, 50);

      // App Header card
      ctx.fillStyle = '#1c1c20';
      ctx.beginPath();
      ctx.roundRect(40, 100, 520, 200, 24);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px sans-serif';
      ctx.fillText('FLUX soft App', 70, 170);

      ctx.fillStyle = '#a1a1aa';
      ctx.font = '20px sans-serif';
      ctx.fillText('Minimal, Fast & 0-Cost Suite', 70, 220);

      // Content Cards
      for (let i = 0; i < 3; i++) {
        const y = 330 + i * 160;
        ctx.fillStyle = '#18181b';
        ctx.beginPath();
        ctx.roundRect(40, y, 520, 130, 20);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('Feature Module 0' + (i + 1), 70, y + 55);

        ctx.fillStyle = '#71717a';
        ctx.font = '16px monospace';
        ctx.fillText('WebRTC · P2P · Zero Server Latency', 70, y + 95);
      }

      const img = new Image();
      img.onload = () => {
        if (!uploadedImage) {
          uploadedImage = img;
          drawFrame();
        }
      };
      img.src = canvas.toDataURL();
    }

    // Main Canvas Render
    function drawFrame() {
      const canvas = document.getElementById('showcaseCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      // Determine Canvas Size based on ratio
      let W = 1200;
      let H = 675;
      if (currentRatio === '1:1') {
        W = 1080;
        H = 1080;
      } else if (currentRatio === '9:16') {
        W = 1080;
        H = 1920;
      }
      canvas.width = W;
      canvas.height = H;
      document.getElementById('canvasDimText').textContent = W + ' x ' + H + ' px';

      // 1. Background
      ctx.clearRect(0, 0, W, H);
      if (currentBg === 'black') {
        ctx.fillStyle = '#09090b';
        ctx.fillRect(0, 0, W, H);
      } else if (currentBg === 'darkgray') {
        ctx.fillStyle = '#18181b';
        ctx.fillRect(0, 0, W, H);
      } else if (currentBg === 'light') {
        ctx.fillStyle = '#f4f4f5';
        ctx.fillRect(0, 0, W, H);
      }

      // 2. Titles Overlay
      const title = document.getElementById('frameTitle').value.trim();
      const subtitle = document.getElementById('frameSubtitle').value.trim();
      const isLightBg = currentBg === 'light';

      if (title || subtitle) {
        ctx.textAlign = 'center';
        if (title) {
          ctx.fillStyle = isLightBg ? '#09090b' : '#ffffff';
          ctx.font = 'bold ' + (W > 1080 ? 44 : 38) + 'px sans-serif';
          ctx.fillText(title, W / 2, currentRatio === '9:16' ? 140 : 80);
        }
        if (subtitle) {
          ctx.fillStyle = isLightBg ? '#52525b' : '#a1a1aa';
          ctx.font = (W > 1080 ? 20 : 18) + 'px sans-serif';
          ctx.fillText(subtitle, W / 2, currentRatio === '9:16' ? 190 : 120);
        }
      }

      if (!uploadedImage) return;

      // 3. Render Device Frame
      const contentYOffset = (title || subtitle) ? (currentRatio === '9:16' ? 240 : 150) : 60;
      const availableH = H - contentYOffset - 60;

      if (currentDevice === 'galaxy') {
        renderGalaxyDevice(ctx, W, contentYOffset, availableH);
      } else if (currentDevice === 'browser') {
        renderBrowserDevice(ctx, W, contentYOffset, availableH);
      } else if (currentDevice === 'tablet') {
        renderTabletDevice(ctx, W, contentYOffset, availableH);
      } else {
        renderNoneDevice(ctx, W, contentYOffset, availableH);
      }

      // Watermark in corner
      ctx.textAlign = 'right';
      ctx.fillStyle = isLightBg ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)';
      ctx.font = '12px font-mono';
      ctx.fillText('Made with FLUX Frame', W - 30, H - 25);
    }

    function renderGalaxyDevice(ctx, W, topY, availH) {
      const devW = Math.min(W * 0.45, 380);
      const devH = Math.min(devW * 2.15, availH);
      const x = (W - devW) / 2;
      const y = topY + (availH - devH) / 2;

      ctx.save();
      // Drop Shadow
      if (currentShadow > 0) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = currentShadow;
        ctx.shadowOffsetY = currentShadow / 2;
      }

      // Outer bezel (Galaxy style sharp minimal corner)
      ctx.fillStyle = '#050507';
      ctx.beginPath();
      ctx.roundRect(x, y, devW, devH, 32);
      ctx.fill();

      ctx.shadowColor = 'transparent';

      // Inner screen border
      const screenMargin = 10;
      const screenX = x + screenMargin;
      const screenY = y + screenMargin;
      const screenW = devW - screenMargin * 2;
      const screenH = devH - screenMargin * 2;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(screenX, screenY, screenW, screenH, 24);
      ctx.clip();
      ctx.drawImage(uploadedImage, screenX, screenY, screenW, screenH);
      ctx.restore();

      // Punch hole camera
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(x + devW / 2, screenY + 16, 7, 0, Math.PI * 2);
      ctx.fill();

      // Speaker slit
      ctx.fillStyle = '#1c1c20';
      ctx.beginPath();
      ctx.roundRect(x + devW / 2 - 25, y + 4, 50, 3, 2);
      ctx.fill();

      ctx.restore();
    }

    function renderBrowserDevice(ctx, W, topY, availH) {
      const devW = Math.min(W * 0.85, 960);
      const devH = Math.min(devW * 0.62, availH);
      const x = (W - devW) / 2;
      const y = topY + (availH - devH) / 2;

      ctx.save();
      if (currentShadow > 0) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = currentShadow;
        ctx.shadowOffsetY = currentShadow / 2;
      }

      // Window shell
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.roundRect(x, y, devW, devH, 16);
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // Browser Header Bar
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.roundRect(x, y, devW, 42, [16, 16, 0, 0]);
      ctx.fill();

      // Window dots (Traffic lights)
      const dotColors = ['#ef4444', '#eab308', '#22c55e'];
      dotColors.forEach((color, i) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x + 22 + i * 18, y + 21, 5.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // URL bar
      ctx.fillStyle = '#121215';
      ctx.beginPath();
      ctx.roundRect(x + 100, y + 8, devW - 200, 26, 8);
      ctx.fill();

      ctx.fillStyle = '#71717a';
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      const mockUrl = document.getElementById('frameSubtitle').value.trim() || 'https://my-service.com';
      ctx.fillText(mockUrl.startsWith('http') ? mockUrl : 'https://' + mockUrl.toLowerCase().replace(/[^a-z0-9.-]/g, '') + '.com', x + devW / 2, y + 25);

      // Inner screen content
      const screenY = y + 42;
      const screenH = devH - 42;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(x, screenY, devW, screenH, [0, 0, 16, 16]);
      ctx.clip();
      ctx.drawImage(uploadedImage, x, screenY, devW, screenH);
      ctx.restore();

      ctx.restore();
    }

    function renderTabletDevice(ctx, W, topY, availH) {
      const devW = Math.min(W * 0.75, 780);
      const devH = Math.min(devW * 0.68, availH);
      const x = (W - devW) / 2;
      const y = topY + (availH - devH) / 2;

      ctx.save();
      if (currentShadow > 0) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = currentShadow;
        ctx.shadowOffsetY = currentShadow / 2;
      }

      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.roundRect(x, y, devW, devH, 24);
      ctx.fill();
      ctx.shadowColor = 'transparent';

      const m = 14;
      const screenX = x + m;
      const screenY = y + m;
      const screenW = devW - m * 2;
      const screenH = devH - m * 2;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(screenX, screenY, screenW, screenH, 14);
      ctx.clip();
      ctx.drawImage(uploadedImage, screenX, screenY, screenW, screenH);
      ctx.restore();

      ctx.restore();
    }

    function renderNoneDevice(ctx, W, topY, availH) {
      const devW = Math.min(W * 0.75, 720);
      const devH = Math.min(devW * 0.65, availH);
      const x = (W - devW) / 2;
      const y = topY + (availH - devH) / 2;

      ctx.save();
      if (currentShadow > 0) {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = currentShadow;
        ctx.shadowOffsetY = currentShadow / 2;
      }

      ctx.beginPath();
      ctx.roundRect(x, y, devW, devH, 16);
      ctx.clip();
      ctx.drawImage(uploadedImage, x, y, devW, devH);
      ctx.restore();
    }

    function downloadShowcasePng() {
      const canvas = document.getElementById('showcaseCanvas');
      const a = document.createElement('a');
      a.download = 'flux-showcase-frame.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    function copyCanvasImage() {
      const canvas = document.getElementById('showcaseCanvas');
      canvas.toBlob(blob => {
        const item = new ClipboardItem({ 'image/png': blob });
        navigator.clipboard.write([item]).then(() => {
          alert('쇼케이스 이미지가 클립보드에 복사되었습니다.');
        }).catch(() => {
          alert('브라우저 권한으로 인해 클립보드 복사에 실패했습니다. PNG 다운로드 버튼을 이용해 주세요.');
        });
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      createDefaultMockImage();
    });
  </script>
</body>
</html>
