    }, { icon: 'i-db' });
  }

  /* ---------------- PNG 캡처 ---------------- */
  function palette() {
    var dark = document.documentElement.classList.contains('dark');
    return dark
      ? { bg: '#0b0b11', sheet: '#101017', ink: '#f2f2f7', ink2: '#a5a5b8', ink3: '#6f6f83', line: 'rgba(255,255,255,.13)', brand: '#8b86ff', brand2: '#c1a4ff' }
      : { bg: '#f4f5fa', sheet: '#ffffff', ink: '#101018', ink2: '#4c4c5a', ink3: '#85859a', line: 'rgba(16,16,24,.12)', brand: '#4f46e5', brand2: '#8b5cf6' };
  }
  var FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Liberation Sans",system-ui,sans-serif';
  function rrect(ctx, x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function tint(hex, alpha) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  function exportPNG() {
    var view = UI.getView();
    var C = palette();
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    var scale = 2;
    if (view === 'month' || view === 'year') {
      var y = UI.getCur().getFullYear(), m = UI.getCur().getMonth();
      var first = new Date(y, m, 1);
      var start = F.startOfWeek(first);
      var rows = Math.ceil(((first.getDay() - S().settings.firstDay + 7) % 7 + F.daysInMonth(y, m)) / 7);
      var W = 1180, pad = 26, headH = 92, dowH = 34, cellH = 124, gridW = W - pad * 2, colW = gridW / 7;
      var H = pad * 2 + headH + dowH + rows * cellH + 26;
      canvas.width = W * scale; canvas.height = H * scale;
      ctx.scale(scale, scale);
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C.sheet; rrect(ctx, pad, pad, gridW, H - pad * 2, 18); ctx.fill();
      ctx.fillStyle = C.ink; ctx.font = '800 30px ' + FONT;
      ctx.fillText(y + '년 ' + (m + 1) + '월', pad + 18, pad + 46);
      ctx.fillStyle = C.ink3; ctx.font = '700 13px ' + FONT;
      var head = F.monthStats(y, m);
      ctx.fillText('FLUX CALENDAR · 일정 ' + head.count + '개 · ' + F.ymd(new Date()), pad + 18, pad + 70);
      var dows = [];
      for (var i = 0; i < 7; i++) dows.push((i + S().settings.firstDay) % 7);
      ctx.font = '800 12px ' + FONT;
      dows.forEach(function (dw, ci) {
        ctx.fillStyle = dw === 0 ? '#d6464a' : dw === 6 ? '#3f6fd8' : C.ink3;
        ctx.textAlign = 'center';
        ctx.fillText(WEEK_KO[dw], pad + colW * ci + colW / 2, pad + headH + dowH - 10);
      });
      ctx.textAlign = 'left';
      var byDay = {};
      F.occurrencesBetween(start, F.addDays(start, rows * 7)).forEach(function (o) {
        F.daySegments(o).forEach(function (sg) { (byDay[sg.date] = byDay[sg.date] || []).push({ o: o, sg: sg }); });
      });
      var todayK = F.ymd(new Date());
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < 7; c++) {
          var d = F.addDays(start, r * 7 + c), k = F.ymd(d);
          var x = pad + c * colW, yy = pad + headH + dowH + r * cellH;
          ctx.strokeStyle = C.line; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + colW, yy); ctx.moveTo(x, yy); ctx.lineTo(x, yy + cellH); ctx.stroke();
          var num = d.getDate();
          ctx.font = '700 13px ' + FONT;
          ctx.fillStyle = d.getMonth() !== m ? C.ink3 : (d.getDay() === 0 ? '#d6464a' : d.getDay() === 6 ? '#3f6fd8' : C.ink2);
          ctx.fillText(String(num), x + 10, yy + 22);
          if (k === todayK) {
            ctx.fillStyle = C.brand; rrect(ctx, x + 6, yy + 8, 24, 20, 7); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '800 12px ' + FONT; ctx.fillText(String(num), x + 13, yy + 22);
          }
          var hol = S().settings.showHolidays ? F.holidayName(k) : '';
          if (hol) { ctx.fillStyle = '#d6464a'; ctx.font = '700 9px ' + FONT; ctx.fillText(hol, x + 36, yy + 21); }
          var list = (byDay[k] || []).slice(0, 3);
          list.forEach(function (it, ii) {
            var col = F.eventColor(it.o.ev);
            var cy = yy + 30 + ii * 21;
            ctx.fillStyle = tint(col, .16); rrect(ctx, x + 6, cy, colW - 14, 18, 5); ctx.fill();
            ctx.fillStyle = col; ctx.fillRect(x + 6, cy, 3, 18);
            ctx.fillStyle = C.ink; ctx.font = '700 10px ' + FONT;
            var txt = it.o.ev.title || '제목 없음';
            if (txt.length > 16) txt = txt.slice(0, 16) + '…';
            ctx.fillText(txt, x + 13, cy + 13);
          });
          if ((byDay[k] || []).length > 3) {
            ctx.fillStyle = C.ink3; ctx.font = '800 9px ' + FONT;
            ctx.fillText('+' + ((byDay[k].length) - 3) + '개', x + 8, yy + 30 + 3 * 21 + 6);
          }
        }
      }
      ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(pad, pad + headH + dowH); ctx.lineTo(pad + gridW, pad + headH + dowH); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillStyle = C.ink3; ctx.font = '700 11px ' + FONT;
      ctx.fillText('Flux Calendar · FLUX', W - pad - 16, H - pad - 12);
      ctx.textAlign = 'left';
    } else {
      /* 주간 · 일간 */
      var days = view === 'week' ? 7 : 1;
      var startD = view === 'week' ? F.startOfWeek(UI.getCur()) : F.sod(UI.getCur());
      var W2 = days === 7 ? 1400 : 720, pad2 = 24, headH2 = 92, dowH2 = 40, gutter = 64, hourH2 = 48;
      var H2 = pad2 * 2 + headH2 + dowH2 + 30 + 24 * hourH2 + 30;
      var colW2 = (W2 - pad2 * 2 - gutter) / days;
      canvas.width = W2 * scale; canvas.height = H2 * scale;
      ctx.scale(scale, scale);
      ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W2, H2);
      ctx.fillStyle = C.sheet; rrect(ctx, pad2, pad2, W2 - pad2 * 2, H2 - pad2 * 2, 18); ctx.fill();
      ctx.fillStyle = C.ink; ctx.font = '800 26px ' + FONT;
      var ttl = view === 'week' ? F.fmtRangeKo(startD, F.addDays(startD, 6)) : (startD.getMonth() + 1) + '월 ' + startD.getDate() + '일 ' + WEEK_KO[startD.getDay()] + '요일';
      ctx.fillText(ttl, pad2 + 18, pad2 + 42);
      ctx.fillStyle = C.ink3; ctx.font = '700 12px ' + FONT;
      ctx.fillText('FLUX CALENDAR · ' + (view === 'week' ? F.isoWeek(startD) + '주차' : startD.getFullYear() + '년'), pad2 + 18, pad2 + 64);
      var adH = 30;
      var ady = pad2 + headH2 + dowH2;
      var gy = ady + adH;
      ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(pad2 + gutter, ady); ctx.lineTo(pad2 + gutter + colW2 * days, ady); ctx.stroke();
      ctx.fillStyle = C.ink3; ctx.font = '700 9px ' + FONT; ctx.textAlign = 'right';
      ctx.fillText('종일', pad2 + gutter - 8, ady + 18);
      ctx.textAlign = 'center';
      for (var dd = 0; dd < days; dd++) {
        var day = F.addDays(startD, dd);
        var cx = pad2 + gutter + dd * colW2;
        ctx.fillStyle = day.getDay() === 0 ? '#d6464a' : day.getDay() === 6 ? '#3f6fd8' : C.ink2;
        ctx.font = '800 12px ' + FONT; ctx.textAlign = 'center';
        ctx.fillText(WEEK_KO[day.getDay()] + ' ' + day.getDate(), cx + colW2 / 2, pad2 + headH2 + 20);
        ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(cx, gy); ctx.lineTo(cx, gy + 24 * hourH2); ctx.stroke();
        if (F.ymd(day) === F.ymd(new Date())) {
          ctx.fillStyle = C.brand; rrect(ctx, cx + colW2 / 2 - 16, pad2 + headH2 + 4, 32, 22, 7); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.fillText(WEEK_KO[day.getDay()] + ' ' + day.getDate(), cx + colW2 / 2, pad2 + headH2 + 20);
        }
      }
      ctx.textAlign = 'right';
      for (var hh = 0; hh <= 24; hh++) {
        var ly = gy + hh * hourH2;
        ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(pad2 + gutter, ly); ctx.lineTo(pad2 + gutter + colW2 * days, ly); ctx.stroke();
        if (hh < 24) {
          ctx.fillStyle = C.ink3; ctx.font = '700 10px ' + FONT;
          ctx.fillText(F.pad(hh) + ':00', pad2 + gutter - 8, ly + 12);
        }
      }
      ctx.textAlign = 'left';
      var occW = F.occurrencesBetween(startD, F.addDays(startD, days));
      var byDayW = {}, byDayA = {};
      occW.forEach(function (o) {
        F.daySegments(o).forEach(function (sg) {
          var idx = F.dayDiff(F.parseYMD(sg.date), startD);
          if (idx < 0 || idx >= days) return;
          if (sg.allDay) { (byDayA[sg.date] = byDayA[sg.date] || []).push(o); return; }
          (byDayW[sg.date] = byDayW[sg.date] || []).push({ o: o, sg: sg });
        });
      });
      /* 종일 줄 */
      Object.keys(byDayA).forEach(function (k) {
        var idx = F.dayDiff(F.parseYMD(k), startD);
        if (idx < 0 || idx >= days) return;
        byDayA[k].forEach(function (o, i) {
          if (i > 1) return;
          var x = pad2 + gutter + idx * colW2 + 2;
          var yy = ady + 2 + i * 13;
          var col = F.eventColor(o.ev);
          ctx.fillStyle = tint(col, .85); rrect(ctx, x, yy, colW2 - 5, 12, 4); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '800 8.5px ' + FONT;
          var tt = o.ev.title || '제목 없음';
          if (tt.length > 12) tt = tt.slice(0, 12) + '…';
          ctx.fillText(tt, x + 4, yy + 9);
        });
      });
      /* 시간 일정: 겹치면 폭을 나눠 그린다 */
      Object.keys(byDayW).forEach(function (k) {
        var idx = F.dayDiff(F.parseYMD(k), startD);
        if (idx < 0 || idx >= days) return;
        var list = byDayW[k].sort(function (a, b) { return a.sg.startMin - b.sg.startMin; });
        var groups = [], curG = null, curEnd = -1;
        list.forEach(function (it) {
          if (!curG || it.sg.startMin >= curEnd) { curG = [it]; groups.push(curG); curEnd = it.sg.endMin; }
          else { curG.push(it); curEnd = Math.max(curEnd, it.sg.endMin); }
        });
        groups.forEach(function (g) {
          var cols = [];
          g.forEach(function (it) {
            var placed = false;
            for (var ci = 0; ci < cols.length; ci++) {
              if (cols[ci] <= it.sg.startMin) { cols[ci] = it.sg.endMin; it._c = ci; placed = true; break; }
            }
            if (!placed) { it._c = cols.length; cols.push(it.sg.endMin); }
          });
          var n = Math.max(1, cols.length);
          g.forEach(function (it) {
            var o = it.o, sg = it.sg;
            var wUnit = (colW2 - 5) / n;
            var x = pad2 + gutter + idx * colW2 + 2 + it._c * wUnit;
            var top = gy + sg.startMin / 60 * hourH2;
            var hgt = Math.max(16, (sg.endMin - sg.startMin) / 60 * hourH2 - 2);
            var col = F.eventColor(o.ev);
            ctx.fillStyle = tint(col, .22); rrect(ctx, x, top, wUnit - 2, hgt, 6); ctx.fill();
            ctx.fillStyle = col; ctx.fillRect(x, top, 2.5, hgt);
            ctx.fillStyle = C.ink; ctx.font = '800 10px ' + FONT;
            var t2 = o.ev.title || '제목 없음';
            var maxCh = Math.max(5, Math.floor((wUnit - 14) / 9.5));
            if (t2.length > maxCh) t2 = t2.slice(0, maxCh) + '…';
            ctx.fillText(t2, x + 6, top + 12);
            if (hgt > 26) {
              ctx.fillStyle = C.ink3; ctx.font = '700 9px ' + FONT;
              ctx.fillText(F.fmtHM(o.start) + ' - ' + F.fmtHM(o.end), x + 6, top + 24);
            }
          });
        });
      });
      ctx.fillStyle = C.ink3; ctx.font = '700 11px ' + FONT; ctx.textAlign = 'right';
      ctx.fillText('Flux Calendar · FLUX', W2 - pad2 - 16, H2 - pad2 - 12);
      ctx.textAlign = 'left';
    }
    var name = 'flux-calendar-' + (new Date().getMonth() + 1) + '월-' + F.ymd(new Date()) + '.png';
    canvas.toBlob(function (blob) {
      if (!blob) { toast('이미지를 만들지 못했습니다.', 'err'); return; }
      if (window.Lemon && Lemon.downloadBlob) Lemon.downloadBlob(name, blob);
      else { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }
      toast('달력 이미지(PNG)를 저장했습니다.');
    }, 'image/png');
  }

  /* ---------------- 내보내기 모달 ---------------- */

        return '<option value="' + c.id + '">' + esc(c.name) + ' (' + n + ')</option>';

      '<div class="fld"><label>백업 · 복원</label><div style="display:flex;gap:6px;flex-wrap:wrap">' +
      '<button class="btn-line" data-act="json">' + icon('i-db') + 'JSON 백업</button>' +
      '<button class="btn-line" data-act="jsonRestore">' + icon('i-import') + 'JSON 복원</button></div></div>' +
      '<div class="fld"><label>이미지 · 인쇄</label><div style="display:flex;gap:6px;flex-wrap:wrap">' +
      '<button class="btn-line" data-act="png">' + icon('i-image') + 'PNG 캡처</button>' +
      '<button class="btn-line" data-act="print">' + icon('i-print') + '인쇄 / PDF</button></div>' +
      '<p class="hint" style="margin-top:6px">PNG는 지금 보고 있는 달력(월/주/일)을 그대로 이미지로 만듭니다. 인쇄는 브라우저 인쇄 창에서 "PDF로 저장"을 고르세요.</p></div>' +
      '</div>' +
      '<div class="modal-foot"><span class="grow"></span><button class="btn-line" data-close="1">닫기</button></div>';
    var back = App.openModal(html, { label: '내보내기' });
    $all('[data-close]', back).forEach(function (b) { b.addEventListener('click', function () { App.closeModal(back); }); });
    var scopeSel = $s('#expScope', back);
    $s('[data-act="ics"]', back).addEventListener('click', function () { exportICS(scopeSel.value); });
    $s('[data-act="imp"]', back).addEventListener('click', function () { $s('#icsFile').click(); });
    $s('[data-act="json"]', back).addEventListener('click', function () { exportJSON(); });
    $s('[data-act="jsonRestore"]', back).addEventListener('click', function () { $s('#jsonFile').click(); });
    $s('[data-act="png"]', back).addEventListener('click', function () { App.closeModal(back); setTimeout(exportPNG, 160); });
    $s('[data-act="print"]', back).addEventListener('click', function () { App.closeModal(back); setTimeout(function () { window.print(); }, 220); });
    return back;
  }

  /* ---------------- 드래그 앤 드롭 ---------------- */
  var drag = null;
  var suppressUntil = 0;
  function clearDropClasses() {
    $all('.drop-on').forEach(function (el) { el.classList.remove('drop-on'); });
  }
  function onDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    var el = e.target.closest ? e.target.closest('[data-drag]') : null;
    if (!el) return;
    var evId = el.getAttribute('data-ev-id');
    var occKey = el.getAttribute('data-occ-key');
    if (!evId) return;
    var ev = null;
    S().events.forEach(function (x) { if (x.id === evId) ev = x; });
    if (!ev) return;
    var approx = el.getBoundingClientRect();
    drag = {
      ev: ev, el: el, active: false, resize: !!e.target.closest('[data-resize]'),
      sx: e.clientX, sy: e.clientY, occKey: occKey,
      rect: approx, pointerId: e.pointerId
    };
  }
  function onMove(e) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 6) return;
      drag.active = true;
      drag.el.classList.add('dragging');
      document.body.style.userSelect = 'none';
    }
    e.preventDefault();
    clearDropClasses();
    var t = document.elementFromPoint(e.clientX, e.clientY);
    if (!t || !t.closest) return;
    var cell = t.closest('[data-slot-date]') || t.closest('[data-cell-date]');
    if (cell) cell.classList.add('drop-on');
  }
  function onUp(e) {
    if (!drag) return;
    var d = drag;
    drag = null;
    document.body.style.userSelect = '';
    clearDropClasses();
    if (!d.active) return;
    suppressUntil = Date.now() + 400;
    d.el.classList.remove('dragging');
    var t = document.elementFromPoint(e.clientX, e.clientY);
    if (!t || !t.closest) return;
    var ev = d.ev;
    var oldStart = F.parseDT(ev.start), oldEnd = F.parseDT(ev.end);
    var occDate = d.occKey ? F.parseYMD(d.occKey.slice(0, 10)) : F.sod(oldStart);

    /* 크기 조절 */
    if (d.resize) {
      var col = t.closest('.tg-col');
      if (!col) return;
      var rc = col.getBoundingClientRect();
      var H = UI.hourH();
      var mins = Math.round(((e.clientY - rc.top) / H * 60) / 15) * 15;
      if (mins < 15) mins = 15;
      var startMin = occDate.getHours() * 60 + occDate.getMinutes();
      var endDate = new Date(occDate), newEnd;
      if (mins > 1440) { endDate = F.addDays(occDate, 1); newEnd = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate(), 0, mins - 1440); }
      else newEnd = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate(), 0, mins);
      if (newEnd <= occDate) newEnd = new Date(occDate.getTime() + 15 * 60000);
      var deltaDur = newEnd - oldEnd;
      ev.end = F.dtStr(new Date(oldEnd.getTime() + deltaDur));
      if (F.parseDT(ev.end) <= F.parseDT(ev.start)) ev.end = F.dtStr(new Date(F.parseDT(ev.start).getTime() + 15 * 60000));
      ev.updated = Date.now();
      F.save(true); UI.render();
      toast('일정 길이를 조절했습니다.');
      return;
    }

    var slot = t.closest('[data-slot-date]');
    var cellm = t.closest('[data-cell-date]');
    if (slot) {
      var dateK = slot.getAttribute('data-slot-date');
      var isAllDayCell = slot.hasAttribute('data-slot-allday');
      var targetD = F.parseYMD(dateK);
      if (isAllDayCell) {
        var dur = F.durationDays(ev);
        ev.allDay = true;
        ev.start = dateK;
        ev.end = F.ymd(F.addDays(targetD, dur));
        ev.updated = Date.now();
        F.save(true); UI.render();
        toast('종일 일정으로 옮겼습니다.');
        return;
      }
      var colEl = t.closest('.tg-col');
      var rc2 = (colEl || slot).getBoundingClientRect();
      var H2 = UI.hourH();
      var m2 = Math.round((((e.clientY - rc2.top) / H2) * 60) / 15) * 15;
      m2 = F.clamp(m2, 0, 1425);
      var newStart = new Date(targetD.getFullYear(), targetD.getMonth(), targetD.getDate(), Math.floor(m2 / 60), m2 % 60);
      var durMs = Math.max(15 * 60000, oldEnd - oldStart);
      var shift = newStart - occDate;
      ev.allDay = false;
      ev.start = F.dtStr(new Date(oldStart.getTime() + shift));
      ev.end = F.dtStr(new Date(ev.start ? F.parseDT(ev.start).getTime() + durMs : newStart.getTime() + durMs));
      ev.updated = Date.now();
      F.save(true); UI.render();
      toast('일정을 옮겼습니다.');
      return;
    }
    if (cellm) {
      var k2 = cellm.getAttribute('data-cell-date');
      var dayDelta = F.dayDiff(F.parseYMD(k2), occDate);
      if (!dayDelta) return;
      if (ev.allDay) {
        ev.start = F.ymd(F.addDays(F.parseYMD(ev.start), dayDelta));
        ev.end = F.ymd(F.addDays(F.parseYMD(ev.end), dayDelta));
      } else {
        ev.start = F.dtStr(F.addDays(oldStart, dayDelta));
        ev.end = F.dtStr(F.addDays(oldEnd, dayDelta));
      }
      ev.updated = Date.now();
      F.save(true); UI.render();
      toast('일정을 ' + k2.slice(5).replace('-', '/') + '(으)로 옮겼습니다.');
    }
  }
  document.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', function () {
    if (drag && drag.el) drag.el.classList.remove('dragging');
    drag = null; clearDropClasses(); document.body.style.userSelect = '';
  });

  /* ---------------- 알림 ---------------- */
  var fired = {};
  function notify(ev, occ) {
    var body = (ev.allDay ? '종일' : F.fmtHM(occ.start) + ' 시작') + (ev.location ? ' · ' + ev.location : '');
    if (S().settings.notify && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(ev.title, { body: body, tag: ev.id }); } catch (e) { }
    }
    toast(ev.title + ' · ' + body, 'info');
  }
  function checkReminders() {
    var now = new Date();
    var occs = F.occurrencesBetween(F.sod(now), F.addDays(F.sod(now), 2));
    occs.forEach(function (o) {
      var ev = o.ev;
      if (ev.allDay || typeof ev.remind !== 'number' || ev.remind < 0) return;
      var at = o.start.getTime() - ev.remind * 60000;
      var k = ev.id + '|' + o.key;
      if (fired[k]) return;
      if (at <= now.getTime() && now.getTime() < at + 95000) {
        fired[k] = true;
        notify(ev, o);
      }
    });
  }
  setInterval(checkReminders, 30000);

  /* ---------------- 키보드 ---------------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var mods = $all('#modalRoot .modal-back');
      if (mods.length) { App.closeModal(); e.preventDefault(); return; }
      var sb = $s('#sidebar');
      if (sb && sb.classList.contains('open')) closeDrawer();
      return;
    }
    var mods2 = $all('#modalRoot .modal-back');
    if (mods2.length) return;
    var t = e.target;
    if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === 'm') UI.setView('month');
    else if (k === 'w') UI.setView('week');
    else if (k === 'd') UI.setView('day');
    else if (k === 'a') UI.setView('agenda');
    else if (k === 'y') UI.setView('year');
    else if (k === 't') UI.goToday();
    else if (k === 'c') { e.preventDefault(); App.openEventModal({ date: F.ymd(UI.getCur()) }); }
    else if (k === '/') { e.preventDefault(); var si = $s('#searchInput'); if (si) { si.focus(); si.select(); } }
    else if (e.key === 'ArrowLeft') UI.shift(-1);
    else if (e.key === 'ArrowRight') UI.shift(1);
    else return;
    e.preventDefault();
  });

  /* ---------------- 서랍 · 테마 ---------------- */
  function openDrawer() {
    $s('#sidebar').classList.add('open');
    $s('#scrim').classList.add('on');
    document.body.classList.add('drawer-open');
  }
  function closeDrawer() {
    $s('#sidebar').classList.remove('open');
    $s('#scrim').classList.remove('on');
    document.body.classList.remove('drawer-open');
  }
  function toggleTheme() {
    var dark = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('cream_theme', dark ? 'dark' : 'light'); } catch (e) { }
    UI.syncToolbar();
    UI.render();
    hap(8);
  }

  /* ---------------- 초기화 ---------------- */
  function bindAll() {
    App = window.FluxCalApp;
    var click = function (sel, fn) {
      var el = $s(sel);
      if (el) el.addEventListener('click', fn);
    };
    click('#newEventBtn', function () { App.openEventModal({}); });
    click('#fab', function () { App.openEventModal({}); });
    click('#prevBtn', function () { UI.shift(-1); });
    click('#nextBtn', function () { UI.shift(1); });
    click('#todayBtn', UI.goToday);
    click('#menuBtn', openDrawer);
    click('#sideClose', closeDrawer);
    click('#scrim', closeDrawer);
    click('#themeBtn', toggleTheme);
    click('#addCalBtn', function () { App.openCalModal(null); });
    click('#shareCalBtn', function () { openShare('calendar', 'all', true); });
    click('#mobileShareBtn', function () { openShare('calendar', 'all', true); });
    click('#exportBtn', openExport);
    click('#settingsBtn', App.openSettings);
    click('#miniPrev', function () {
      var m = UI.getMiniCur(); UI.setMiniCur(F.addMonths(m, -1)); UI.render();
    });
    click('#miniNext', function () {
      var m = UI.getMiniCur(); UI.setMiniCur(F.addMonths(m, 1)); UI.render();
    });
    click('#miniToday', function () { UI.setMiniCur(new Date()); UI.goToday(); });

    $all('#viewSeg button, #dock button').forEach(function (b) {
      b.addEventListener('click', function () { UI.setView(b.getAttribute('data-view')); });
    });

    /* 검색 */
    var si = $s('#searchInput');
    if (si) {
      si.addEventListener('input', function () { UI.setSearch(this.value); });
      si.addEventListener('focus', function () { if (this.value) UI.renderSearchResults(); });
    }
    click('#searchClear', function () {
      if (si) si.value = '';
      UI.setSearch('');
      var box = $s('#searchResults'); if (box) box.hidden = true;
    });
    document.addEventListener('click', function (e) {
      var box = $s('#searchResults');
      if (box && !box.hidden) {
        if (!e.target.closest('#searchWrap')) box.hidden = true;
      }
    });
    click('#mobileSearchBtn', openMobileSearch);

    /* 파일 입력 */
    var icsInput = $s('#icsFile'), jsonInput = $s('#jsonFile');
    if (icsInput) icsInput.addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var evs = [];
        try { evs = parseICS(String(rd.result)); } catch (err) { toast('파일을 해석하지 못했습니다.', 'err'); }
        App.closeAll();
        setTimeout(function () { openImportPreview(evs, f.name); }, 60);
      };
      rd.readAsText(f, 'utf-8');
      this.value = '';
    });
    if (jsonInput) jsonInput.addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        var text = String(rd.result);
        App.closeAll();
        setTimeout(function () { openJsonRestore(text, f.name); }, 60);
      };
      rd.readAsText(f, 'utf-8');
      this.value = '';
    });

    /* 문서 클릭 위임 */
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      if (Date.now() < suppressUntil) { e.preventDefault(); e.stopPropagation(); return; }
      var occBtn = t.closest('[data-open-occ]');
      if (occBtn && !t.closest('.modal-back')) {
        var parts = occBtn.getAttribute('data-open-occ').split('|');
        App.openOccurrence(parts[0], parts[1]);
        return;
      }
      var addBtn = t.closest('[data-add-date]');
      if (addBtn) { App.openEventModal({ date: addBtn.getAttribute('data-add-date') }); return; }
      var moreBtn = t.closest('[data-day-more]');
      if (moreBtn) { openDayFor(moreBtn.getAttribute('data-day-more')); return; }
      var numBtn = t.closest('[data-day-num]');
      if (numBtn) { openDayFor(numBtn.getAttribute('data-day-num')); return; }
      var dotsBtn = t.closest('[data-day-dots]');
      if (dotsBtn) { openDayFor(dotsBtn.getAttribute('data-day-dots')); return; }
      var miniDay = t.closest('[data-mini-date]');
      if (miniDay) {
        UI.go(F.parseYMD(miniDay.getAttribute('data-mini-date')));
        if (UI.isMobile()) closeDrawer();
        return;
      }
      var yearDay = t.closest('[data-year-day]');
      if (yearDay) { openDayFor(yearDay.getAttribute('data-year-day')); return; }
      var jumpM = t.closest('[data-jump-month]');
      if (jumpM) {
        var y = UI.getCur().getFullYear();
        UI.setCur(new Date(y, +jumpM.getAttribute('data-jump-month'), 1));
        UI.setView('month');
        return;
      }
      var calToggle = t.closest('[data-cal-toggle]');
      if (calToggle) {
        var id = calToggle.getAttribute('data-cal-toggle');
        S().calendars.forEach(function (c) { if (c.id === id) c.visible = !c.visible; });
        F.save(true); UI.render(); hap(6);
        return;
      }
      var calEdit = t.closest('[data-cal-edit]');
      if (calEdit) {
        var cid = calEdit.getAttribute('data-cal-edit');
        var cal = S().calendars.filter(function (c) { return c.id === cid; })[0];
        if (cal) App.openCalModal(cal);
        return;
      }
      if (t.closest('#holidayInfo')) { openHolidayInfo(); return; }
      if (t.closest('#holidayRow')) {
        S().settings.showHolidays = !S().settings.showHolidays;
        F.save(true); UI.render();
        toast(S().settings.showHolidays ? '공휴일을 표시합니다.' : '공휴일 표시를 껐습니다.', 'info');
        return;
      }
      if (t.closest('#ddayHelp')) {
        App.openChoice('D-Day 고정', '일정 상세 화면에서 별표(D-Day로 고정)를 켜면 사이드바에 남은 날짜가 크게 표시됩니다.', [
          { label: '일정 추가하기', run: function () { App.openEventModal({}); } }
        ], function (p) { if (p && p.run) p.run(); }, { icon: 'i-star' });
        return;
      }
      var qs = t.closest('[data-quick-start]');
      if (qs) { App.quickStart(); return; }
      var cs = t.closest('[data-clear-search]');
      if (cs) {
        if (si) si.value = '';
        UI.setSearch('');
        return;
      }
      /* 빈 셀 클릭 → 새 일정 */
      var slotCol = t.closest('.tg-col');
      if (slotCol && !t.closest('[data-drag]')) {
        var dk = slotCol.getAttribute('data-slot-date');
        var rc = slotCol.getBoundingClientRect();
        var mins = ((e.clientY - rc.top) / UI.hourH()) * 60;
        var hour = F.clamp(Math.floor(mins / 60), 0, 23);
        App.openEventModal({ date: dk, hour: hour });
        return;
      }
      var alldayCell = t.closest('[data-slot-allday]');
      if (alldayCell && !t.closest('[data-drag]')) {
        App.openEventModal({ date: alldayCell.getAttribute('data-slot-date'), allDay: true });
        return;
      }
      var cell = t.closest('[data-cell-date]');
      if (cell && !t.closest('[data-drag]') && !t.closest('button')) {
        App.openEventModal({ date: cell.getAttribute('data-cell-date') });
        return;
      }
    });
  }
  function openDayFor(dateKey) {
    UI.setCur(F.parseYMD(dateKey));
    UI.setView('day');
  }
  function openHolidayInfo() {
    var keys = Object.keys(F.HOLIDAYS).sort();
    var byYear = {};
    keys.forEach(function (k) { var y = k.slice(0, 4); (byYear[y] = byYear[y] || []).push(k); });
    var body = Object.keys(byYear).map(function (y) {
      return '<div class="fld"><label>' + y + '년</label><div class="mini-list">' +
        byYear[y].map(function (k) {
          var d = F.parseYMD(k);
          return '<div class="mini-item"><b>' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK_KO[d.getDay()] + ')</b><span>' + esc(F.HOLIDAYS[k]) + '</span></div>';
        }).join('') + '</div></div>';
    }).join('');
    App.openModal('<div class="modal-head"><span class="mh-ico">' + icon('i-globe') + '</span><h2>대한민국 공휴일</h2>' +
      '<button class="close-x" data-close="1" aria-label="닫기">' + icon('i-x') + '</button></div>' +
      '<div class="modal-body">' + body + '<p class="hint">관공서 공휴일 기준입니다. 임시공휴일·선거일은 바뀔 수 있습니다.</p></div>' +
      '<div class="modal-foot"><span class="grow"></span><button class="btn-line" data-close="1">닫기</button></div>', { label: '공휴일' });
  }
  function openMobileSearch() {
    var html = '<div class="modal-head"><span class="mh-ico">' + icon('i-search') + '</span><h2>일정 검색</h2>' +
      '<button class="close-x" data-close="1" aria-label="닫기">' + icon('i-x') + '</button></div>' +
      '<div class="modal-body"><input class="inp" id="mSearch" placeholder="제목·장소·메모 검색" autofocus>' +
      '<div class="mini-list" id="mResults" style="margin-top:10px"></div></div>';
    var back = App.openModal(html, { label: '검색' });
    $all('[data-close]', back).forEach(function (b) { b.addEventListener('click', function () { App.closeModal(back); }); });
    var input = $s('#mSearch', back), box = $s('#mResults', back);
    function draw() {
      var q = input.value.trim().toLowerCase();
      var list = S().events.filter(function (e) {
        return !q || [e.title, e.location, e.memo].concat(e.attendees || []).join(' ').toLowerCase().indexOf(q) >= 0;
      }).slice(0, 20);
      box.innerHTML = list.length ? list.map(function (e) {
        var d = F.parseDT(e.start), c = F.eventColor(e);
        return '<button class="mini-item" data-mhit="' + e.id + '" style="text-align:left"><span class="dot" style="--c:' + c + '"></span>' +
          '<b>' + esc(e.title) + '</b><span>' + (d.getMonth() + 1) + '/' + d.getDate() + '</span></button>';
      }).join('') : '<p class="hint">검색 결과가 없습니다.</p>';
    }
    input.addEventListener('input', draw);
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-mhit]');
      if (!b) return;
      var id = b.getAttribute('data-mhit');
      App.closeModal(back);
      App.openOccurrence(id, null);
    });
    draw();
  }

  function init() {
    bindAll();
    F.boot(function () {
      var v = S().view || 'month';
      if (['month', 'week', 'day', 'agenda', 'year'].indexOf(v) < 0) v = 'month';
      UI.setView(v, true);
      UI.setCur(new Date());
      UI.setMiniCur(new Date());
      UI.render();
      handleIncomingShare();
      setTimeout(checkReminders, 1500);
    });
    window.addEventListener('hashchange', handleIncomingShare);
    var rt = null;
    window.addEventListener('resize', function () {
      if (rt) clearTimeout(rt);
      rt = setTimeout(function () { rt = null; UI.render(); }, 160);
    });
  }

  window.FluxCalData = {
    openShare: openShare, exportICS: exportICS, buildICS: buildICS, parseICS: parseICS,
    exportJSON: exportJSON, exportPNG: exportPNG, openExport: openExport,
    handleIncomingShare: handleIncomingShare, checkReminders: checkReminders
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
