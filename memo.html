    $('#fab').addEventListener('click', startNewNote);
    $('#emptyStart').addEventListener('click', startNewNote);
    $('#emptyExample').addEventListener('click', loadExamples);
    $('#menuBtn').addEventListener('click', openSidebar);
    $('#scrim').addEventListener('click', closeSidebar);
    $('#mobileMoreBtn').addEventListener('click', function () { openMobileMenu(this); });

    $('#navGroup').addEventListener('click', function (e) {
      var b = e.target.closest('[data-view]');
      if (!b) return;
      state.label = null;
      setView(b.dataset.view);
    });
    $('#dock').addEventListener('click', function (e) {
      var b = e.target.closest('[data-view]');
      if (!b) return;
      if (b.dataset.view === 'labels') { openLabelsSheet(); return; }
      state.label = null;
      setView(b.dataset.view);
    });

    $('#labelList').addEventListener('click', function (e) {
      var edit = e.target.closest('[data-act="editLabel"]');
      if (edit) {
        e.stopPropagation();
        openLabelMenu(edit, edit.dataset.label);
        return;
      }
      var row = e.target.closest('[data-label]');
      if (!row) return;
      state.label = (state.label === row.dataset.label) ? null : row.dataset.label;
      state.view = 'notes'; state.query = ''; $('#searchInput').value = ''; $('#searchClear').classList.remove('show');
      renderAll(); closeSidebar(); scrollTop();
    });
    $('#newLabelBtn').addEventListener('click', function () {
      showPop(this, '<div class="pop-title">새 라벨</div><div class="pop-field"><input id="popNewLabel" placeholder="라벨 이름" maxlength="24" data-autofocus><button id="popNewLabelAdd">만들기</button></div>', function (el) {
        var inp = el.querySelector('#popNewLabel');
        function add() {
          var v = (inp.value || '').trim();
          if (!v) { inp.focus(); return; }
          if (state.labels.indexOf(v) < 0) state.labels.push(v);
          save(true); renderSidebar();
          state.label = v; state.view = 'notes';
          closePop(); renderAll(); scrollTop();
          if (window.Lemon) Lemon.toast('라벨을 만들었어요', 'ok');
        }
        el.querySelector('#popNewLabelAdd').addEventListener('click', add);
        inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') add(); });
        setTimeout(function () { inp.focus(); }, 40);
      });
    });
    $('#sideColors').addEventListener('click', function (e) {
      var b = e.target.closest('[data-color]');
      if (!b) return;
      state.color = (state.color === b.dataset.color) ? null : b.dataset.color;
      if (state.color) { state.view = state.view === 'archive' || state.view === 'trash' ? state.view : 'notes'; }
      renderAll();
    });

    var searchInput = $('#searchInput');
    var searchTimer = null;
    searchInput.addEventListener('input', function () {
      var v = this.value;
      $('#searchClear').classList.toggle('show', !!v);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.query = v.trim();
        if (state.query && state.view !== 'archive' && state.view !== 'trash') state.view = 'notes';
        renderAll();
      }, 90);
    });
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { this.value = ''; state.query = ''; $('#searchClear').classList.remove('show'); renderAll(); this.blur(); }
    });
    $('#searchClear').addEventListener('click', function () {
      searchInput.value = ''; state.query = ''; this.classList.remove('show'); renderAll(); searchInput.focus();
    });

    $('#viewSeg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-mode]');
      if (!b) return;
      state.mode = b.dataset.mode;
      try { localStorage.setItem('flux_memo_mode', state.mode); } catch (err) { }
      renderAll();
    });

    $('#colorFilterBtn').addEventListener('click', function () {
      openColorPop(this, state.color, function (c) {
        state.color = (state.color === c) ? null : c;
        if (state.color && state.view !== 'archive' && state.view !== 'trash') state.view = 'notes';
        renderAll();
      });
    });
    $('#filterColorOpen').addEventListener('click', function () {
      openColorPop(this, state.color, function (c) {
        state.color = (state.color === c) ? null : c;
        if (state.color && state.view !== 'archive' && state.view !== 'trash') state.view = 'notes';
        renderAll();
      });
    });
    $('#filterAll').addEventListener('click', function () {
      state.onlyPinned = false; state.color = null; state.label = null; state.query = '';
      searchInput.value = ''; $('#searchClear').classList.remove('show');
      renderAll();
    });
    $('#filterPinned').addEventListener('click', function () {
      state.onlyPinned = !state.onlyPinned;
      if (state.onlyPinned && state.view !== 'notes') state.view = 'notes';
      renderAll();
    });
    $('#filterColorChip').addEventListener('click', function () { state.color = null; renderAll(); });
    $('#filterLabelChip').addEventListener('click', function () { state.label = null; renderAll(); });
    $('#filterReset').addEventListener('click', function () {
      state.onlyPinned = false; state.color = null; state.label = null;
      renderAll();
    });
    $('#emptyTrashBtn').addEventListener('click', function () {
      var count = state.notes.filter(function (n) { return n.trashed; }).length;
      if (!count) return;
      confirmModal('휴지통을 비울까요?', '휴지통의 메모 ' + count + '개가 완전히 삭제됩니다. 이 작업은 되돌릴 수 없습니다.', '모두 삭제', function () {
        state.notes = state.notes.filter(function (n) { return !n.trashed; });
        save(true); renderAll();
        if (window.Lemon) Lemon.toast('휴지통을 비웠어요', 'ok');
      });
    });
    $('#exportBtn').addEventListener('click', function () { openExportMenu(this); });
    $('#importBtn').addEventListener('click', function () { $('#importInput').click(); });

    $('#scrollArea').addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      var card = e.target.closest('.note');
      if (act && card && !act.closest('.cmp-thumb')) {
        if (act.dataset.act === 'grip') return;
        e.stopPropagation();
        if (act.tagName === 'INPUT') return;
        handleNoteAct(act.dataset.act, card.dataset.id, act, e);
        return;
      }
      if (card) {
        if (e.target.closest('button') || e.target.closest('.chk')) return;
        openEditor(card.dataset.id);
      }
    });
    $('#scrollArea').addEventListener('change', function (e) {
      var box = e.target.closest('input.chk[data-act="toggleItem"]');
      if (!box) return;
      var card = box.closest('.note');
      if (card) handleNoteAct('toggleItem', card.dataset.id, box, e);
    });
    $('#scrollArea').addEventListener('keydown', function (e) {
      var card = e.target.closest('.note');
      if (!card) return;
      if (e.key === 'Enter' && !e.target.closest('button') && !e.target.closest('input')) {
        e.preventDefault();
        openEditor(card.dataset.id);
      }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (e.target.closest('input')) return;
      }
    });

    $('#modalClose').addEventListener('click', closeModal);
    $('#modalScrim').addEventListener('click', closeModal);
    $('#shareClose').addEventListener('click', closeShareView);

    var themeBtn = $('#themeBtn');
    if (themeBtn) themeBtn.addEventListener('click', function () { setTimeout(syncThemeIcon, 30); });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
      if (e.key === 'Escape') {
        if ($('#shareView').classList.contains('show')) { closeShareView(); return; }
        if (modalRoot.classList.contains('show')) { closeModal(); return; }
        if (popEl) { closePop(); return; }
        if ($('#sidebar').classList.contains('open')) { closeSidebar(); return; }
        if (composer.classList.contains('open') && !typing) { saveComposer(false); return; }
        if (typing) { e.target.blur(); return; }
        if (state.query) { state.query = ''; $('#searchInput').value = ''; $('#searchClear').classList.remove('show'); renderAll(); }
        return;
      }
      if (typing) return;
      if (modalRoot.classList.contains('show')) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'c' || e.key === 'C') { e.preventDefault(); startNewNote(); }
      if (e.key === '/') { e.preventDefault(); $('#searchInput').focus(); }
    });

    window.addEventListener('hashchange', handleHash);
    window.addEventListener('beforeunload', function () {
      if (state.draft && !isDraftEmpty(state.draft)) {
        try { saveComposer(true); persist(true); } catch (err) { }
      }
    });
    bindPopDismiss();
    bindDrag();
  }

  function openLabelMenu(anchor, name) {
    showPop(anchor, '<div class="pop-title">라벨</div>' +
      '<button class="menu-item" data-lm="rename"><svg class="i"><use href="#i-edit"></use></svg>이름 변경</button>' +
      '<button class="menu-item danger" data-lm="delete"><svg class="i"><use href="#i-trash"></use></svg>라벨 삭제</button>', function (el) {
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-lm]');
        if (!b) return;
        closePop();
        if (b.dataset.lm === 'rename') {
          openModal({
            title: '라벨 이름 변경',
            sub: '이 라벨이 붙은 메모에도 새 이름이 함께 적용됩니다',
            body: '<div class="pop-field" style="padding:0"><input id="renameInput" maxlength="24" autocomplete="off" value="' + esc(name).replace(/"/g, '&quot;') + '" data-autofocus><button id="renameGo">변경</button></div>',
            foot: '<div class="grow"></div><button class="cmp-done" data-cancel>취소</button>',
            after: function (body, foot) {
              var inp = body.querySelector('#renameInput');
              foot.querySelector('[data-cancel]').addEventListener('click', closeModal);
              function go() {
                var v = (inp.value || '').trim();
                if (!v || v === name) { closeModal(); return; }
                state.labels = state.labels.map(function (l) { return l === name ? v : l; });
                state.notes.forEach(function (n) {
                  n.labels = n.labels.map(function (l) { return l === name ? v : l; });
                });
                if (state.label === name) state.label = v;
                save(true); renderAll(); closeModal();
                if (window.Lemon) Lemon.toast('라벨 이름을 바꿨어요', 'ok');
              }
              body.querySelector('#renameGo').addEventListener('click', go);
              inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
            }
          });
          return;
        }
        if (b.dataset.lm === 'delete') {
          confirmModal('라벨을 삭제할까요?', '"' + name + '" 라벨이 메모에서 떨어져 나갑니다. 메모 자체는 삭제되지 않습니다.', '라벨 삭제', function () {
            state.labels = state.labels.filter(function (l) { return l !== name; });
            state.notes.forEach(function (n) {
              n.labels = n.labels.filter(function (l) { return l !== name; });
            });
            if (state.label === name) state.label = null;
            save(true); renderAll();
          });
        }
      });
    });
  }

  function syncThemeIcon() {
    var dark = document.documentElement.classList.contains('dark');
    var use = $('#themeBtn use');
    if (use) use.setAttribute('href', dark ? '#i-sun' : '#i-moon');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#08080a' : '#f0a500');
  }

  /* ---------------- boot ---------------- */
  function boot() {
    try {
      var mode = localStorage.getItem('flux_memo_mode');
      if (mode === 'list' || mode === 'grid') state.mode = mode;
    } catch (e) { }

    var mirror = readMirror();
    if (mirror) {
      state.notes = mirror.notes;
      state.labels = mirror.labels;
    }
    state.draft = blankDraft();
    resetComposer();
    renderAll();
    syncThemeIcon();
    bindEvents();
    bindComposer();

    idbGet().then(function (text) {
      if (lastSaved) return; /* 이미 사용자가 편집하기 시작했으면 덮어쓰지 않는다 */
      if (!text) { if (state.notes.length) persist(true); return; }
      var data = null;
      try { data = sanitize(JSON.parse(text)); } catch (e) { data = null; }
      if (!data) return;
      state.dbReady = true;
      if (!mirror || (data.savedAt || 0) > (mirror.savedAt || 0) || !state.notes.length) {
        state.notes = data.notes;
        state.labels = data.labels;
        renderAll();
      }
    }).catch(function (err) {
      console.warn('[Flux Memo] IndexedDB를 열지 못해 브라우저 저장소에 저장합니다.', err);
    });

    setTimeout(function () { checkReminders(); }, 1200);
    setInterval(checkReminders, 15000);
    setTimeout(handleHash, 120);
    setTimeout(syncThemeIcon, 200);

    var mo = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if (mo && mo.addEventListener) {
      mo.addEventListener('change', function () { setTimeout(syncThemeIcon, 20); });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
