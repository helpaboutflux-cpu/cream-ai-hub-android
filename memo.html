.cmp-add-item { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 13px; font-weight: 600; padding: 7px 4px; border: 0; background: transparent; cursor: pointer; border-radius: 8px; }
.cmp-add-item:hover { color: var(--ink); background: var(--chip); }
.cmp-add-item .i { width: 18px; height: 18px; }

.cmp-images { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 8px; }
.cmp-thumb { position: relative; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); animation: thumbIn .3s cubic-bezier(.2, .9, .24, 1.2); }
@keyframes thumbIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
.cmp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cmp-thumb button {
  position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; padding: 0;
}
.cmp-thumb button .i { width: 13px; height: 13px; }
.cmp-thumb.draw::after {
  content: '그림'; position: absolute; left: 4px; bottom: 4px; font-size: 9.5px; font-weight: 700;
  color: #fff; background: rgba(0, 0, 0, .55); border-radius: 5px; padding: 1px 5px;
}
.cmp-labels { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 8px; }
.cmp-label-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 9px;
  border-radius: 999px; background: var(--chip); color: var(--ink-2); font-size: 11.5px; font-weight: 700;
}
.cmp-label-chip button { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; display: grid; place-items: center; padding: 2px; border-radius: 50%; }
.cmp-label-chip button:hover { color: var(--ink); }
.cmp-label-chip .i { width: 12px; height: 12px; }
.cmp-remind-chip {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; margin: 0 0 8px;
  border-radius: 999px; background: color-mix(in srgb, var(--brand) 20%, transparent); color: var(--ink);
  font-size: 11.5px; font-weight: 700; border: 0; cursor: pointer;
}
.cmp-remind-chip .i { width: 13px; height: 13px; }

.cmp-foot { display: flex; align-items: center; gap: 2px; padding: 6px 8px 8px; }
.composer.open .cmp-foot { border-top: 1px solid var(--line-2); margin-top: 4px; padding-top: 8px; }
.cmp-tool {
  width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-2); cursor: pointer;
  transition: background .16s ease, color .16s ease, transform .16s ease;
}
.cmp-tool:hover { background: var(--chip); color: var(--ink); transform: translateY(-1px); }
.cmp-tool.on { background: color-mix(in srgb, var(--brand) 20%, transparent); color: var(--ink); }
.cmp-tool .i { width: 18px; height: 18px; }
.cmp-foot .grow { flex: 1; }
.cmp-done, .cmp-close {
  height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--ink-2); font-size: 12.5px; font-weight: 700; cursor: pointer;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.cmp-done:hover { background: var(--chip); color: var(--ink); }
.cmp-done.primary { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #22190a; border-color: transparent; box-shadow: 0 10px 22px -14px rgba(var(--brand-rgb), .95); }
.cmp-done.primary:hover { transform: translateY(-1px); }
.cmp-pop-anchor { position: relative; }
.composer[data-color="coral"] { background: var(--c-coral); border-color: var(--c-coral-edge); }
.composer[data-color="amber"] { background: var(--c-amber); border-color: var(--c-amber-edge); }
.composer[data-color="lime"] { background: var(--c-lime); border-color: var(--c-lime-edge); }
.composer[data-color="mint"] { background: var(--c-mint); border-color: var(--c-mint-edge); }
.composer[data-color="sky"] { background: var(--c-sky); border-color: var(--c-sky-edge); }
.composer[data-color="lilac"] { background: var(--c-lilac); border-color: var(--c-lilac-edge); }
.composer[data-color="rose"] { background: var(--c-rose); border-color: var(--c-rose-edge); }

/* ---------------- notes ---------------- */
.notes-head { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; }
.notes-head h2 { margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.notes-head .cnt { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.notes-head .line { flex: 1; height: 1px; background: var(--line-2); }
.notes-head .hact { display: inline-flex; align-items: center; gap: 4px; }

.masonry { columns: 236px; column-gap: 12px; }
.masonry.list-view { columns: 1; max-width: 720px; }
.note {
  break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
  display: block; width: 100%; margin: 0 0 12px; position: relative;
  border-radius: 12px; border: 1px solid var(--c-default-edge);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 6px -4px rgba(0, 0, 0, .18);
  overflow: hidden; cursor: default;
  animation: noteIn .34s cubic-bezier(.2, .9, .24, 1.05) backwards;
  transition: box-shadow .22s ease, transform .22s cubic-bezier(.2, .9, .24, 1.1), border-color .22s ease;
}
@keyframes noteIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.note:hover { box-shadow: 0 16px 34px -20px rgba(0, 0, 0, .55); transform: translateY(-2px); z-index: 2; }
.note.dragging { opacity: .45; transform: scale(.98) rotate(-.6deg); }
.note.drop-before { box-shadow: 0 -3px 0 0 var(--brand), 0 16px 34px -20px rgba(0, 0, 0, .5); }
.note.drop-after { box-shadow: 0 3px 0 0 var(--brand), 0 16px 34px -20px rgba(0, 0, 0, .5); }
.note.pin-pop { animation: pinPop .46s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes pinPop { 0% { transform: scale(1); } 45% { transform: scale(.965) translateY(3px); } 100% { transform: none; } }

.note[data-color="default"] { background: var(--c-default); border-color: var(--c-default-edge); }
.note[data-color="coral"] { background: var(--c-coral); border-color: var(--c-coral-edge); }
.note[data-color="amber"] { background: var(--c-amber); border-color: var(--c-amber-edge); }
.note[data-color="lime"] { background: var(--c-lime); border-color: var(--c-lime-edge); }
.note[data-color="mint"] { background: var(--c-mint); border-color: var(--c-mint-edge); }
.note[data-color="sky"] { background: var(--c-sky); border-color: var(--c-sky-edge); }
.note[data-color="lilac"] { background: var(--c-lilac); border-color: var(--c-lilac-edge); }
.note[data-color="rose"] { background: var(--c-rose); border-color: var(--c-rose-edge); }

.note-body { padding: 12px 13px 8px; }
.note-title { margin: 0 0 5px; font-size: 14px; font-weight: 800; line-height: 1.4; letter-spacing: -.01em; word-break: break-word; }
.note-text { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; word-break: break-word; max-height: 16em; overflow: hidden; }
.note-img { display: block; width: 100%; max-height: 320px; object-fit: cover; border-bottom: 1px solid rgba(0, 0, 0, .06); }
.note-imgs { display: grid; grid-template-columns: 1fr; gap: 1px; }
.note-imgs.two { grid-template-columns: 1fr 1fr; }
.note-imgs img { width: 100%; height: 100%; max-height: 220px; object-fit: cover; display: block; }
.note-draw { width: 100%; max-height: 260px; object-fit: contain; display: block; background: rgba(255, 255, 255, .55); }
html.dark .note-draw { background: rgba(255, 255, 255, .06); }

.chk-list { display: flex; flex-direction: column; gap: 3px; margin: 2px 0 0; }
.chk-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.55; padding: 1px 0; border-radius: 6px; }
.chk-row .chk { margin-top: 2px; }
.chk-row span { flex: 1; min-width: 0; word-break: break-word; }
.chk-row.done span { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.chk-row label { cursor: pointer; }
.chk-more { border: 0; background: transparent; color: var(--ink-3); font-size: 11.5px; font-weight: 700; padding: 4px 2px; cursor: pointer; text-align: left; border-radius: 6px; }
.chk-more:hover { color: var(--ink); }
.progress { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; }
.progress-bar { flex: 1; height: 5px; border-radius: 5px; background: rgba(0, 0, 0, .1); overflow: hidden; }
html.dark .progress-bar { background: rgba(255, 255, 255, .12); }
.progress-bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width .45s cubic-bezier(.2, .9, .24, 1); }
.progress span { font-size: 10.5px; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.chk, .note .chk {
  appearance: none; -webkit-appearance: none; width: 17px; height: 17px; flex: none; margin: 0;
  border: 1.5px solid var(--ink-3); border-radius: 4px; background: transparent; cursor: pointer;
  position: relative; transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.chk:hover { border-color: var(--brand-deep); transform: scale(1.08); }
.chk:checked { background: var(--brand-deep); border-color: var(--brand-deep); }
html.dark .chk:checked { background: var(--brand); border-color: var(--brand); }
.chk:checked::after {
  content: ''; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  animation: chkIn .22s cubic-bezier(.2, 1.3, .5, 1);
}
html.dark .chk:checked::after { border-color: #1d1608; }
@keyframes chkIn { from { transform: rotate(45deg) scale(.2); opacity: 0; } to { transform: rotate(45deg) scale(1); opacity: 1; } }

.note-labels { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 13px 8px; }
.note-label {
  display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px;
  background: rgba(0, 0, 0, .07); color: var(--ink-2); font-size: 10.5px; font-weight: 700; cursor: pointer;
  border: 0; transition: background .16s ease, color .16s ease;
}
html.dark .note-label { background: rgba(255, 255, 255, .1); }
.note-label:hover { background: rgba(0, 0, 0, .14); color: var(--ink); }
html.dark .note-label:hover { background: rgba(255, 255, 255, .18); }

.note-remind {
  display: inline-flex; align-items: center; gap: 5px; margin: 0 13px 8px;
  height: 22px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
  background: rgba(0, 0, 0, .07); color: var(--ink-2);
}
html.dark .note-remind { background: rgba(255, 255, 255, .1); }
.note-remind.due { background: rgba(217, 83, 79, .18); color: #b03a34; }
html.dark .note-remind.due { color: #ff9b95; }
.note-remind .i { width: 12px; height: 12px; }

.note-tools {
  display: flex; align-items: center; gap: 0; padding: 2px 6px 4px;
  opacity: 0; transform: translateY(3px); transition: opacity .18s ease, transform .18s ease;
}
.note:hover .note-tools, .note:focus-within .note-tools { opacity: 1; transform: none; }
@media (hover: none) { .note-tools { opacity: .62; transform: none; } }
.note-tool {
  width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-2); cursor: pointer; padding: 0;
  transition: background .16s ease, color .16s ease, transform .16s ease;
}
.note-tool:hover { background: rgba(0, 0, 0, .08); color: var(--ink); transform: translateY(-1px); }
html.dark .note-tool:hover { background: rgba(255, 255, 255, .1); }
.note-tool.on { color: var(--brand-deep); }
html.dark .note-tool.on { color: var(--brand); }
.note-tool .i { width: 16px; height: 16px; }
.note-tool.spacer { flex: 1; visibility: hidden; }
.note-grip { cursor: grab; }
.note-grip:active { cursor: grabbing; }

.note-foot-meta { display: flex; align-items: center; gap: 6px; padding: 0 13px 10px; font-size: 10.5px; color: var(--ink-3); }
.note-trash-actions { display: flex; gap: 6px; padding: 0 10px 10px; }
.tbtn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  height: 30px; border: 1px solid var(--line); border-radius: 8px; background: transparent;
  color: var(--ink-2); font-size: 11.5px; font-weight: 700; cursor: pointer;
  transition: background .16s ease, color .16s ease, border-color .16s ease;
}
.tbtn:hover { background: var(--chip); color: var(--ink); }
.tbtn.danger:hover { border-color: rgba(217, 83, 79, .5); color: #c9463f; }
.tbtn .i { width: 14px; height: 14px; }

/* ---------------- empty state ---------------- */
.empty { max-width: 520px; margin: 8vh auto 0; text-align: center; padding: 0 20px; animation: noteIn .5s ease; }
.empty-art { width: 132px; height: 132px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 32px; background: linear-gradient(140deg, rgba(var(--brand-rgb), .18), rgba(255, 138, 61, .1)); border: 1px solid color-mix(in srgb, var(--brand) 26%, transparent); color: var(--brand-deep); }
html.dark .empty-art { color: var(--brand); }
.empty-art .i { width: 58px; height: 58px; stroke-width: 1.4; }
.empty h2 { margin: 0 0 8px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.empty p { margin: 0 auto 18px; font-size: 13.5px; color: var(--ink-2); line-height: 1.7; max-width: 400px; }
.empty-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.empty-hint { margin-top: 22px; font-size: 11.5px; color: var(--ink-3); line-height: 1.8; }
.empty-hint b { color: var(--ink-2); font-weight: 700; }

/* ---------------- popover / menu ---------------- */
.pop {
  position: fixed; z-index: 120; min-width: 190px; padding: 8px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--sheet);
  box-shadow: 0 26px 60px -24px rgba(0, 0, 0, .6);
  animation: popIn .18s cubic-bezier(.2, .9, .24, 1.1); transform-origin: top center;
}
@keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }
.pop-colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px; min-width: 186px; }
.pop-color { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; position: relative; transition: transform .16s ease, box-shadow .16s ease; }
.pop-color:hover { transform: scale(1.1); }
.pop-color.on::after {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  border: 2px solid var(--brand-deep); animation: chkIn .2s ease;
}
html.dark .pop-color.on::after { border-color: var(--brand); }
.pop-color[data-color="default"] { background: var(--c-default); }
.pop-color[data-color="coral"] { background: var(--c-coral-edge); }
.pop-color[data-color="amber"] { background: var(--c-amber-edge); }
.pop-color[data-color="lime"] { background: var(--c-lime-edge); }
.pop-color[data-color="mint"] { background: var(--c-mint-edge); }
.pop-color[data-color="sky"] { background: var(--c-sky-edge); }
.pop-color[data-color="lilac"] { background: var(--c-lilac-edge); }
.pop-color[data-color="rose"] { background: var(--c-rose-edge); }
.pop-title { padding: 4px 8px 8px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
  border: 0; border-radius: 9px; background: transparent; color: var(--ink-2);
  font-size: 12.8px; font-weight: 600; cursor: pointer; text-align: left;
  transition: background .14s ease, color .14s ease;
}
.menu-item:hover { background: var(--chip); color: var(--ink); }
.menu-item .i { width: 17px; height: 17px; }
.menu-item.danger { color: #c9463f; }
.menu-item.danger:hover { background: rgba(217, 83, 79, .12); }
.menu-sep { height: 1px; margin: 6px 4px; background: var(--line-2); }
.pop-field { display: flex; gap: 6px; padding: 4px 4px 2px; }
.pop-field input {
  flex: 1; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--paper-2); color: var(--ink); font-size: 12.5px; padding: 0 9px; outline: none;
}
.pop-field input:focus { border-color: rgba(var(--brand-rgb), .7); box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .14); }
.pop-field button {
  height: 32px; padding: 0 11px; border: 0; border-radius: 9px; cursor: pointer;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #22190a; font-size: 12px; font-weight: 800;
}
.pop-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
.pop-check { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 12.8px; font-weight: 600; color: var(--ink-2); }
.pop-check:hover { background: var(--chip); color: var(--ink); }
.pop-check input { margin: 0; }
.pop-empty { padding: 8px 9px 10px; font-size: 12px; color: var(--ink-3); }
.rem-form { display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 4px; min-width: 236px; }
.rem-form input[type="datetime-local"] {
  height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper-2);
  color: var(--ink); font-size: 12.5px; padding: 0 8px; outline: none;
}
.rem-quick { display: flex; flex-wrap: wrap; gap: 5px; }
.rem-quick button {
  height: 27px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent;
  color: var(--ink-2); font-size: 11.5px; font-weight: 700; cursor: pointer; transition: background .15s ease, color .15s ease;
}
.rem-quick button:hover { background: var(--chip); color: var(--ink); }
.rem-actions { display: flex; gap: 6px; margin-top: 2px; }
.rem-actions button { flex: 1; height: 32px; border-radius: 9px; font-size: 12px; font-weight: 800; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink-2); }
.rem-actions button.save { border: 0; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #22190a; }
.rem-actions button:hover { filter: brightness(1.04); }

/* ---------------- modal (editor/sketch/share) ---------------- */
.modal-root { position: fixed; inset: 0; z-index: 130; display: none; }
.modal-root.show { display: block; }
.modal-scrim { position: absolute; inset: 0; background: rgba(8, 8, 10, .5); backdrop-filter: blur(3px); opacity: 0; transition: opacity .22s ease; }
.modal-root.show .modal-scrim { opacity: 1; }
.modal-card {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); opacity: 0;
  width: min(640px, calc(100vw - 32px)); max-height: min(86vh, 900px); display: flex; flex-direction: column;
  border-radius: 18px; border: 1px solid var(--line); background: var(--sheet); box-shadow: 0 40px 100px -40px rgba(0, 0, 0, .8);
  transition: transform .26s cubic-bezier(.2, .9, .24, 1.1), opacity .2s ease;
}
.modal-root.show .modal-card { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.modal-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
.modal-head p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-3); }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 16px; overflow-y: auto; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line-2); }
.modal-foot .grow { flex: 1; }

/* sketch */
.sketch-wrap { padding: 12px; }
.sketch-canvas { width: 100%; display: block; border-radius: 12px; background: #fff; touch-action: none; cursor: crosshair; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.sketch-tools { display: flex; align-items: center; gap: 8px; padding: 10px 4px 0; flex-wrap: wrap; }
.sketch-colors { display: flex; gap: 5px; }
.sketch-colors button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .18); cursor: pointer; padding: 0; transition: transform .15s ease; }
.sketch-colors button:hover { transform: scale(1.12); }
.sketch-colors button.on { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--ink-2); }
.sketch-sizes { display: flex; align-items: center; gap: 4px; }
.sketch-sizes button { width: 30px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; }
.sketch-sizes button i { display: block; border-radius: 50%; background: currentColor; }
.sketch-sizes button.on { background: var(--chip); border-color: var(--ink-3); }
.sketch-tools .grow { flex: 1; }

/* share view */
.share-view { position: fixed; inset: 0; z-index: 140; display: none; overflow-y: auto; background: var(--paper); }
.share-view.show { display: block; }
.share-top { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-2); z-index: 2; }
.share-top .brand-mark { width: 30px; height: 30px; border-radius: 9px; }
.share-top .brand-mark .i { width: 18px; height: 18px; }
.share-top b { font-size: 14px; font-weight: 800; }
.share-top span.tag { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.share-inner { max-width: 560px; margin: 26px auto 60px; padding: 0 16px; }
.share-note {
  border-radius: 16px; border: 1px solid var(--c-default-edge); background: var(--c-default);
  box-shadow: var(--shadow-hi); overflow: hidden; animation: noteIn .4s ease;
}
.share-note[data-color="coral"] { background: var(--c-coral); border-color: var(--c-coral-edge); }
.share-note[data-color="amber"] { background: var(--c-amber); border-color: var(--c-amber-edge); }
.share-note[data-color="lime"] { background: var(--c-lime); border-color: var(--c-lime-edge); }
.share-note[data-color="mint"] { background: var(--c-mint); border-color: var(--c-mint-edge); }
.share-note[data-color="sky"] { background: var(--c-sky); border-color: var(--c-sky-edge); }
.share-note[data-color="lilac"] { background: var(--c-lilac); border-color: var(--c-lilac-edge); }
.share-note[data-color="rose"] { background: var(--c-rose); border-color: var(--c-rose-edge); }
.share-note .note-body { padding: 18px 18px 12px; }
.share-note .note-title { font-size: 17px; }
.share-note .note-text { font-size: 14px; }
.share-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.share-actions .primary {
  flex: 1; min-width: 180px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 46px; border: 0; border-radius: 13px; cursor: pointer;
  background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #22190a; font-size: 14px; font-weight: 800;
  box-shadow: 0 16px 30px -18px rgba(var(--brand-rgb), .95);
  transition: transform .18s ease, box-shadow .22s ease;
}
.share-actions .primary:hover { transform: translateY(-2px); box-shadow: 0 22px 36px -18px rgba(var(--brand-rgb), .95); }
.share-actions .ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 13px; background: var(--sheet); color: var(--ink-2);
  font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer;
}
.share-hint { margin-top: 14px; font-size: 12px; color: var(--ink-3); line-height: 1.7; text-align: center; }

/* ---------------- mobile ---------------- */
.only-mobile { display: none; }
.scrim { display: none; }
.dock { display: none; }
.fab { display: none; }

@media (max-width: 940px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-104%);
    transition: transform .28s cubic-bezier(.2, .9, .24, 1.05); box-shadow: 0 0 60px rgba(0, 0, 0, .5);
    width: min(292px, 84vw); background: var(--paper); z-index: 60;
  }
  .sidebar.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(6, 6, 8, .48); backdrop-filter: blur(2px); z-index: 55; }
  .scrim.show { display: block; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .only-mobile { display: grid; }
  .only-desk { display: none !important; }
  .topbar { padding: 0 10px; gap: 6px; height: 56px; }
  .tb-title { min-width: 0; flex: 0 1 auto; }
  .tb-title h1 { font-size: 15.5px; }
  .tb-title p { display: none; }
  .search-wrap { flex: 1 1 78px; }
  .tb-btn .lbl { display: none; }
  .tb-btn { padding: 0 9px; }
  #colorFilterBtn { display: none; }
  .scroll { padding: 10px 12px calc(var(--dock-h) + 74px); }
  .composer-zone { margin-bottom: 12px; }
  .filterbar { padding: 8px 12px 0; overflow-x: auto; flex-wrap: nowrap; }
  .filterbar::-webkit-scrollbar { display: none; }
  .fbar-reset { margin-left: 0; }
  .masonry { columns: 2; column-gap: 10px; }
  .note { margin-bottom: 10px; }
  .note-body { padding: 10px 11px 7px; }
  .note-title { font-size: 13.5px; }
  .note-text { font-size: 12.5px; }
  .note-tools { opacity: .6; transform: none; }
  .dock {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
    height: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line-2);
  }
  .dock button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: 0; background: transparent; color: var(--ink-3); font-size: 10px; font-weight: 700; cursor: pointer;
    transition: color .18s ease, transform .18s ease;
  }
  .dock button.on { color: var(--brand-deep); }
  html.dark .dock button.on { color: var(--brand); }
  .dock button.on .i { animation: dockPop .3s cubic-bezier(.2, 1.3, .5, 1); }
  @keyframes dockPop { 0% { transform: none; } 45% { transform: translateY(-3px) scale(1.12); } 100% { transform: none; } }
  .dock .i { width: 21px; height: 21px; }
  .fab {
    display: grid; position: fixed; right: 16px; bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 46;
    width: 54px; height: 54px; border: 0; border-radius: 18px; place-items: center; cursor: pointer;
    background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #22190a;
    box-shadow: 0 18px 34px -14px rgba(var(--brand-rgb), .9);
    transition: transform .18s ease, box-shadow .2s ease;
  }
  .fab:active { transform: scale(.94); }
  .fab .i { width: 25px; height: 25px; stroke-width: 2.2; }
  .seg.desktop-seg { display: none; }
  .search-wrap { min-width: 0; }
  .empty { margin-top: 5vh; }
  .empty-art { width: 104px; height: 104px; border-radius: 26px; }
  .empty-art .i { width: 46px; height: 46px; }
  .pop { min-width: 200px; }
  .modal-card { width: calc(100vw - 20px); max-height: 90vh; }
  .share-inner { margin-top: 16px; }
}

@media (max-width: 520px) {
  .masonry { columns: 1; }
  .tb-btn .lbl { display: none; }
  .tb-btn { padding: 0 10px; }
  .search-wrap { max-width: none; }
}

/* search-only mode: hide composer */
body.searching .composer-zone { display: none; }

/* ---------------- motion preferences ---------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important;
    transition-duration: .001ms !important; scroll-behavior: auto !important;
  }
}

/* ---------------- toast polish ---------------- */
.ltoast { z-index: 300; }
</style>

<script src="lemon-ui.js"></script>
<script src="vendor/lz-string.min.js"></script>
<script>
/* =====================================================================
   Flux Memo · core
   저장(IndexedDB flux_memo_v1 + 즉시 부팅용 localStorage 미러),
   상태, 렌더링, 카드 구성.
   ===================================================================== */
(function () {
  'use strict';

  var DB_NAME = 'flux_memo_v1';
  var DB_STORE = 'kv';
  var DB_KEY = 'main';
  var MIRROR = 'flux_memo_v1_snapshot';
  var SCHEMA = 1;

  var COLORS = [
    { key: 'default', name: '기본' },
    { key: 'coral', name: '코랄' },
    { key: 'amber', name: '앰버' },
    { key: 'lime', name: '라임' },
    { key: 'mint', name: '민트' },
    { key: 'sky', name: '스카이' },
    { key: 'lilac', name: '라일락' },
    { key: 'rose', name: '로즈' }
  ];
  var COLOR_NAME = {};
  COLORS.forEach(function (c) { COLOR_NAME[c.key] = c.name; });

  var state = {
    notes: [],
    labels: [],
    view: 'notes',
    label: null,
    query: '',
    color: null,
    onlyPinned: false,
    mode: 'grid',
    editing: null,
    draft: null,
    dbReady: false,
    dbWarned: false,
    expandedDone: {}
  };

  /* ---------------- helpers ---------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function uid(prefix) { return (prefix || 'n') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); }
  function fmtDT(ts) {
    var d = new Date(ts), h = d.getHours(), ap = h < 12 ? '오전' : '오후', hh = h % 12 || 12;
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + ap + ' ' + hh + ':' + pad2(d.getMinutes());
  }
  function fmtClock(ts) {
    var d = new Date(ts), h = d.getHours(), ap = h < 12 ? '오전' : '오후', hh = h % 12 || 12;
    return ap + ' ' + hh + ':' + pad2(d.getMinutes());
  }
  function remLabel(ts) {
    if (!ts) return '';
    var today = startOfDay(Date.now()), day = startOfDay(ts), diff = Math.round((day - today) / 86400000);
    if (diff === 0) return '오늘 ' + fmtClock(ts);
    if (diff === 1) return '내일 ' + fmtClock(ts);
    if (diff === -1) return '어제 ' + fmtClock(ts);
    return (new Date(ts).getMonth() + 1) + '월 ' + new Date(ts).getDate() + '일 ' + fmtClock(ts);
  }
  function agoLabel(ts) {
    var diff = Date.now() - ts;
    if (diff < 60000) return '방금';
    if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '일 전';
    return (new Date(ts).getMonth() + 1) + '월 ' + new Date(ts).getDate() + '일';
  }
  function toLocalInput(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ---------------- storage ---------------- */
  function normalizeNote(raw) {
    var n = raw && typeof raw === 'object' ? raw : {};
    n.id = n.id || uid();
    n.title = typeof n.title === 'string' ? n.title : '';
    n.body = typeof n.body === 'string' ? n.body : '';
    n.items = Array.isArray(n.items) ? n.items.map(function (it) {
      return { id: it && it.id ? it.id : uid('i'), text: it && typeof it.text === 'string' ? it.text : String(it || ''), done: !!(it && it.done) };
    }) : [];
    n.images = Array.isArray(n.images) ? n.images.filter(function (im) { return im && typeof im.src === 'string'; }).map(function (im) {
      return { id: im.id || uid('im'), src: im.src, kind: im.kind === 'draw' ? 'draw' : 'photo' };
    }) : [];
    n.color = COLOR_NAME[n.color] ? n.color : 'default';
    n.labels = Array.isArray(n.labels) ? n.labels.filter(function (l) { return typeof l === 'string' && l.trim(); }) : [];
    n.pinned = !!n.pinned;
    n.archived = !!n.archived;
    n.trashed = !!n.trashed;
    n.trashedAt = n.trashedAt || 0;
    n.created = n.created || Date.now();
    n.updated = n.updated || n.created;
    n.reminder = typeof n.reminder === 'number' && n.reminder > 0 ? n.reminder : null;
    n.firedAt = n.firedAt || 0;
    return n;
  }

  function readMirror() {
    try {
      var text = window.Lemon && Lemon.store ? Lemon.store.raw(MIRROR, null) : null;
      if (!text) text = localStorage.getItem(MIRROR);
      if (!text) return null;
      var data = JSON.parse(text);
      return sanitize(data);
    } catch (e) { return null; }
  }
  function sanitize(data) {
    if (!data || typeof data !== 'object') return null;
    var notes = Array.isArray(data.notes) ? data.notes.map(normalizeNote) : [];
    var labels = Array.isArray(data.labels) ? data.labels.filter(function (l) { return typeof l === 'string' && l.trim(); }) : [];
    return { v: SCHEMA, notes: notes, labels: labels, savedAt: data.savedAt || 0 };
  }

  var dbP = null, db = null;
  function openDB() {
    if (dbP) return dbP;
    dbP = new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('no-indexeddb')); return; }
      var rq;
      try { rq = indexedDB.open(DB_NAME, 1); } catch (e) { rej(e); return; }
      rq.onupgradeneeded = function () {
        var d = rq.result;
        if (!d.objectStoreNames.contains(DB_STORE)) d.createObjectStore(DB_STORE, { keyPath: 'key' });
      };
      rq.onsuccess = function () { db = rq.result; res(db); };
      rq.onerror = function () { rej(rq.error || new Error('idb-open')); };
      rq.onblocked = function () { rej(new Error('idb-blocked')); };
    });
    return dbP;
  }
  function idbGet() {
    return openDB().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction(DB_STORE, 'readonly');
        var rq = tx.objectStore(DB_STORE).get(DB_KEY);
        rq.onsuccess = function () { res(rq.result ? rq.result.value : null); };
        rq.onerror = function () { rej(rq.error || new Error('idb-read')); };
      });
    });
  }
  function idbPut(text) {
    return openDB().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put({ key: DB_KEY, value: text, ts: Date.now() });
        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error || new Error('idb-write')); };
        tx.onabort = function () { rej(tx.error || new Error('idb-abort')); };
      });
    });
  }

  var saveTimer = null, lastSaved = 0;
  function serialize() {
    return JSON.stringify({ v: SCHEMA, notes: state.notes, labels: state.labels, savedAt: Date.now() });
  }
  function persist(now) {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    var text = serialize();
    lastSaved = Date.now();
    try {
      if (window.Lemon && Lemon.store) Lemon.store.rawSet(MIRROR, text);
      else localStorage.setItem(MIRROR, text);
    } catch (e) {
      try { localStorage.setItem(MIRROR, text); } catch (e2) { }
    }
    idbPut(text).then(function () {
      state.dbReady = true;
    }, function (err) {
      state.dbReady = false;
      if (!state.dbWarned) {
        state.dbWarned = true;
        console.warn('[Flux Memo] IndexedDB 저장 실패, 브라우저 저장소로 대체합니다.', err);
        if (window.Lemon && Lemon.toast) Lemon.toast('저장 공간이 부족해 일부만 저장됐어요', 'warn');
      }
    });
  }
  function save(immediate) {
    if (immediate) { persist(true); return; }
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveTimer = null; persist(false); }, 320);
  }

  /* ---------------- queries ---------------- */
  function hasReminder(n) { return !!n.reminder; }
  function noteMatches(n, q) {
    if (!q) return true;
    var s = q.toLowerCase();
    if (n.title.toLowerCase().indexOf(s) > -1) return true;
    if (n.body.toLowerCase().indexOf(s) > -1) return true;
    for (var i = 0; i < n.items.length; i++) if (n.items[i].text.toLowerCase().indexOf(s) > -1) return true;
    for (var j = 0; j < n.labels.length; j++) if (n.labels[j].toLowerCase().indexOf(s) > -1) return true;
    if (COLOR_NAME[n.color] && COLOR_NAME[n.color].toLowerCase().indexOf(s) > -1) return true;
    return false;
  }
  function baseList() {
    return state.notes.filter(function (n) {
      if (state.view === 'trash') return n.trashed;
      if (state.view === 'archive') return n.archived && !n.trashed;
      if (n.trashed) return false;
      if (n.archived) return false;
      if (state.view === 'reminders') return hasReminder(n);
      return true;
    });
  }
  function visibleList() {
    var list = baseList();
    if (state.label) list = list.filter(function (n) { return n.labels.indexOf(state.label) > -1; });
    if (state.color) list = list.filter(function (n) { return n.color === state.color; });
    if (state.onlyPinned) list = list.filter(function (n) { return n.pinned; });
    if (state.query) list = list.filter(function (n) { return noteMatches(n, state.query); });
    if (state.view === 'reminders') {
      list = list.slice().sort(function (a, b) { return (a.reminder || 0) - (b.reminder || 0); });
    }
    return list;
  }
  function labelCount(name) {
    return state.notes.filter(function (n) {
      return !n.trashed && !n.archived && n.labels.indexOf(name) > -1;
    }).length;
  }
  function allLabels() {
    var set = {};
    state.labels.forEach(function (l) { set[l] = 1; });
    state.notes.forEach(function (n) {
      if (n.trashed) return;
      n.labels.forEach(function (l) { set[l] = 1; });
    });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'ko'); });
  }

  /* ---------------- rendering ---------------- */
  var VIEW_META = {
    notes: { title: '메모', sub: '생각나는 대로 적어 두세요' },
    reminders: { title: '리마인더', sub: '알림을 걸어 둔 메모' },
    archive: { title: '보관함', sub: '치워 두었지만 지우지 않은 메모' },
    trash: { title: '휴지통', sub: '복원하거나 영구 삭제할 수 있어요' },
    labels: { title: '라벨', sub: '라벨로 묶어 보기' }
  };

  function renderAll() {
    renderSidebar();
    renderHead();
    renderFilters();
    renderList();
  }

  function renderSidebar() {
    var c = { notes: 0, reminders: 0, archive: 0, trash: 0 };
    state.notes.forEach(function (n) {
      if (n.trashed) { c.trash++; return; }
      if (n.archived) { c.archive++; return; }
      c.notes++;
      if (n.reminder) c.reminders++;
    });
    var map = { notes: '#cntNotes', reminders: '#cntReminders', archive: '#cntArchive', trash: '#cntTrash' };
    Object.keys(map).forEach(function (k) { var el = $(map[k]); if (el) el.textContent = c[k]; });

    $$('#navGroup .nav-item').forEach(function (b) { b.classList.toggle('on', b.dataset.view === state.view); });
    $$('#dock button').forEach(function (b) { b.classList.toggle('on', b.dataset.view === state.view); });

    var list = $('#labelList');
    var names = allLabels();
    if (!names.length) {
      list.innerHTML = '<div class="label-empty">라벨을 만들면 사이드바에 모여요. 메모에서 태그처럼 붙일 수 있습니다.</div>';
    } else {
      list.innerHTML = names.map(function (name) {
        return '<button class="label-row' + (state.label === name ? ' on' : '') + '" data-label="' + esc(name) + '">' +
          '<span class="label-dot"></span><span class="lname">' + esc(name) + '</span>' +
          '<span class="lcount">' + labelCount(name) + '</span>' +
          '<span class="ledit" data-act="editLabel" data-label="' + esc(name) + '" role="button" tabindex="0" aria-label="라벨 편집"><svg class="i i-sm"><use href="#i-more"></use></svg></span>' +
          '</button>';
      }).join('');
    }

    var sw = $('#sideColors');
    sw.innerHTML = COLORS.map(function (col) {
      return '<button class="pop-color' + (state.color === col.key ? ' on' : '') + '" data-color="' + col.key + '" aria-label="' + col.name + ' 메모" title="' + col.name + '"></button>';
    }).join('');
  }

  function renderHead() {
    var meta = VIEW_META[state.view] || VIEW_META.notes;
    if (state.label) {
      $('#pageTitle').textContent = state.label;
      $('#pageSub').textContent = '라벨이 붙은 메모';
    } else {
      $('#pageTitle').textContent = meta.title;
      $('#pageSub').textContent = meta.sub;
    }
    var list = visibleList();
    var title = state.label ? state.label : meta.title;
    document.title = title + ' · Flux Memo';
    $('#composerZone').hidden = state.view === 'archive' || state.view === 'trash' || !!state.query;
    document.body.classList.toggle('searching', !!state.query);
  }

  function renderFilters() {
    $('#filterAll').classList.toggle('on', !state.onlyPinned && !state.color && !state.label);
    $('#filterPinned').classList.toggle('on', state.onlyPinned);
    var cc = $('#filterColorChip');
    cc.hidden = !state.color;
    if (state.color) $('#filterColorName').textContent = COLOR_NAME[state.color] + ' 메모';
    var lc = $('#filterLabelChip');
    lc.hidden = !state.label;
    if (state.label) $('#filterLabelName').textContent = state.label;
    $('#filterReset').hidden = !(state.onlyPinned || state.color || state.label);
    $$('#viewSeg button').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === state.mode); });
    $('#colorFilterBtn').classList.toggle('on', !!state.color);
  }

  function cardNote(n, idx) {
    var photos = n.images.filter(function (i) { return i.kind === 'photo'; });
    var draws = n.images.filter(function (i) { return i.kind === 'draw'; });
    var h = '';
    h += '<article class="note" data-id="' + n.id + '" data-color="' + n.color + '" style="animation-delay:' + Math.min(idx * 18, 220) + 'ms" tabindex="0">';

    if (photos.length) {
      h += '<div class="note-imgs' + (photos.length > 1 ? ' two' : '') + '">';
      photos.slice(0, 2).forEach(function (im) {
        h += '<img src="' + im.src + '" alt="" loading="lazy">';
      });
      h += '</div>';
    }

    h += '<div class="note-body">';
    if (n.title) h += '<h3 class="note-title">' + esc(n.title) + '</h3>';
    if (n.body) h += '<p class="note-text">' + esc(n.body) + '</p>';
    if (n.items.length) {
      var done = n.items.filter(function (i) { return i.done; }).length;
      var showDone = !!state.expandedDone[n.id];
      var undone = n.items.filter(function (i) { return !i.done; });
      var doneItems = n.items.filter(function (i) { return i.done; });
      var shown = showDone ? n.items : undone;
      h += '<div class="chk-list">';
      shown.forEach(function (it) {
        h += '<div class="chk-row' + (it.done ? ' done' : '') + '">' +
          '<input class="chk" type="checkbox" data-act="toggleItem" data-item="' + it.id + '"' + (it.done ? ' checked' : '') + ' aria-label="' + esc(it.text || '항목') + '">' +
          '<span>' + (it.text ? esc(it.text) : '<span style="opacity:.5">빈 항목</span>') + '</span></div>';
      });

        h += '<button class="chk-more" data-act="toggleDone">' + (showDone ? '완료된 항목 숨기기' : '완료된 항목 ' + doneItems.length + '개 보기') + '</button>';
      }
      h += '<div class="progress"><div class="progress-bar"><i style="width:' + Math.round(done / n.items.length * 100) + '%"></i></div><span>' + done + '/' + n.items.length + '</span></div>';
    }
    h += '</div>';

    draws.forEach(function (im) {
      h += '<img class="note-draw" src="' + im.src + '" alt="손그림">';
    });

    if (n.labels.length) {
      h += '<div class="note-labels">' + n.labels.map(function (l) {
        return '<button class="note-label" data-act="filterLabel" data-label="' + esc(l) + '">' + esc(l) + '</button>';
      }).join('') + '</div>';
    }

    if (n.reminder) {
      var due = n.reminder <= Date.now();
      h += '<span class="note-remind' + (due ? ' due' : '') + '"><svg class="i"><use href="#i-bell"></use></svg>' + esc(remLabel(n.reminder)) + '</span>';
    }

    if (state.view === 'trash') {
      h += '<div class="note-trash-actions">' +
        '<button class="tbtn" data-act="restore"><svg class="i"><use href="#i-restore"></use></svg>복원</button>' +
        '<button class="tbtn danger" data-act="purge"><svg class="i"><use href="#i-trash"></use></svg>영구 삭제</button>' +
        '</div>';
    } else {
      h += '<div class="note-tools">';
      if (state.view === 'archive') {
        h += '<button class="note-tool" data-act="unarchive" title="보관 해제" aria-label="보관 해제"><svg class="i"><use href="#i-archive-out"></use></svg></button>';
      } else {
        h += '<button class="note-tool' + (n.pinned ? ' on' : '') + '" data-act="pin" title="' + (n.pinned ? '고정 해제' : '핀 고정') + '" aria-label="핀 고정"><svg class="i"><use href="#' + (n.pinned ? 'i-pin' : 'i-pin') + '"></use></svg></button>';
      }
      h += '<button class="note-tool" data-act="color" title="배경색" aria-label="배경색"><svg class="i"><use href="#i-palette"></use></svg></button>';
      h += '<button class="note-tool" data-act="label" title="라벨" aria-label="라벨"><svg class="i"><use href="#i-tag"></use></svg></button>';
      h += '<button class="note-tool' + (n.reminder ? ' on' : '') + '" data-act="remind" title="리마인더" aria-label="리마인더"><svg class="i"><use href="#i-bell"></use></svg></button>';
      h += '<span style="flex:1"></span>';
      h += '<button class="note-tool note-grip" data-act="grip" title="끌어서 순서 바꾸기" aria-label="순서 이동"><svg class="i"><use href="#i-grip"></use></svg></button>';
      h += '<button class="note-tool" data-act="more" title="더보기" aria-label="더보기"><svg class="i"><use href="#i-more"></use></svg></button>';
      h += '</div>';
    }

    if (state.view === 'trash') {
      h += '<div class="note-foot-meta">' + (n.trashedAt ? esc(fmtDT(n.trashedAt)) + ' 삭제' : '') + '</div>';
    } else if (n.updated) {
      h += '<div class="note-foot-meta">' + esc(agoLabel(n.updated)) + ' 편집</div>';
    }
    h += '</article>';
    return h;
  }

  function emptyFor(view, hasFilter, q, label) {
    if (view === 'trash') return { t: '휴지통이 비어 있어요', d: '삭제한 메모는 여기 모입니다. 영구 삭제하기 전까지는 언제든 복원할 수 있어요.', start: false, ex: false };
    if (view === 'archive') return { t: '보관한 메모가 없어요', d: '자주 쓰지 않는 메모는 보관함으로 옮겨 두면 메모 목록이 가벼워집니다.', start: false, ex: false };
    if (view === 'reminders') return { t: '예정된 리마인더가 없어요', d: '메모에서 종 아이콘을 눌러 날짜와 시간을 정하면 이곳에서 모아 볼 수 있고, 시간이 되면 알려드려요.', start: true, ex: false };
    if (q) return { t: '검색 결과가 없어요', d: '다른 낱말로 찾아보거나 필터를 풀어 보세요. 제목·본문·체크리스트·라벨·색상 이름까지 모두 검색합니다.', start: false, ex: false };
    if (hasFilter) return { t: '조건에 맞는 메모가 없어요', d: label ? '이 라벨이 붙은 메모가 아직 없습니다.' : '다른 라벨이나 색상을 골라 보세요.', start: false, ex: false };
    return { t: '첫 메모를 남겨보세요', d: '위 입력창을 누르면 바로 쓸 수 있어요. 체크리스트·사진·손그림까지 붙이고, 색과 라벨로 정리하고, 핀으로 위에 고정할 수 있습니다.', start: true, ex: true };
  }

  function renderList() {
    var list = visibleList();
    var pinned = [], others = [];
    if (state.view === 'notes' && !state.onlyPinned) {
      list.forEach(function (n) { (n.pinned ? pinned : others).push(n); });

      others = list;
    }
    var pinnedGrid = $('#pinnedGrid');
    var notesGrid = $('#notesGrid');

    notesGrid.innerHTML = others.map(function (n, i) { return cardNote(n, i); }).join('');

    $('#othersHead').hidden = !others.length;

    }

    var et = $('#emptyTrashBtn');
    if (et) et.hidden = !(state.view === 'trash' && others.length > 0);
    renderSidebar();
  }


  /* ---------------- popovers ---------------- */
  var popEl = null, popAnchor = null, popAfter = null;

  function closePop() {
    if (!popEl) return;
    var el = popEl;
    popEl = null; popAnchor = null; popAfter = null;
    el.style.animation = 'popIn .12s reverse';
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 90);
  }
  function placePop(el, anchor) {
    var r = anchor.getBoundingClientRect();
    var w = el.offsetWidth, h = el.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = r.left + r.width / 2 - w / 2;
    left = clamp(left, 8, vw - w - 8);
    var top = r.bottom + 8;
    if (top + h > vh - 8) {
      top = r.top - h - 8;
      if (top < 8) top = Math.max(8, vh - h - 8);
    }
    el.style.left = Math.round(left) + 'px';
    el.style.top = Math.round(top) + 'px';
  }
  function showPop(anchor, html, after, cls) {
    closePop();
    var el = document.createElement('div');
    el.className = 'pop' + (cls ? ' ' + cls : '');
    el.innerHTML = html;
    document.body.appendChild(el);
    popEl = el; popAnchor = anchor; popAfter = after;
    placePop(el, anchor);
    if (after) after(el);
    return el;
  }
  function bindPopDismiss() {
    document.addEventListener('pointerdown', function (e) {
      if (!popEl) return;
      if (popEl.contains(e.target)) return;
      if (popAnchor && popAnchor.contains(e.target)) return;
      closePop();
    }, true);
    window.addEventListener('resize', closePop);
    document.addEventListener('scroll', function (e) {
      if (!popEl) return;
      if (popEl.contains(e.target)) return;
      closePop();
    }, true);
  }

  function colorSwatchHTML(current, withTitle) {
    return (withTitle ? '<div class="pop-title">배경색</div>' : '') +
      '<div class="pop-colors">' + COLORS.map(function (c) {
        return '<button class="pop-color' + (current === c.key ? ' on' : '') + '" data-color="' + c.key + '" title="' + c.name + '" aria-label="' + c.name + '"></button>';
      }).join('') + '</div>';
  }
  function openColorPop(anchor, current, onPick) {
    showPop(anchor, colorSwatchHTML(current, true), function (el) {
      el.addEventListener('click', function (e) {
        var b = e.target.closest('.pop-color');
        if (!b) return;
        onPick(b.dataset.color);
        closePop();
      });
    });
  }

  function openLabelPop(anchor, noteLabels, onApply) {
    var selected = noteLabels.slice();
    function body() {
      var names = allLabels();
      var h = '<div class="pop-title">라벨</div><div class="pop-list" id="popLabelList">';
      if (!names.length) h += '<div class="pop-empty">아직 라벨이 없어요. 아래에서 바로 만들 수 있습니다.</div>';
      names.forEach(function (name) {
        h += '<label class="pop-check"><input type="checkbox" value="' + esc(name) + '"' + (selected.indexOf(name) > -1 ? ' checked' : '') + '><span>' + esc(name) + '</span></label>';
      });
      h += '</div><div class="menu-sep"></div><div class="pop-field"><input id="popLabelNew" placeholder="새 라벨 이름" maxlength="24" autocomplete="off"><button id="popLabelAdd">추가</button></div>';
      return h;
    }
    function apply() { onApply(selected.slice()); save(); }
    showPop(anchor, body(), function (el) {
      el.addEventListener('change', function (e) {
        var cb = e.target.closest('input[type="checkbox"]');
        if (!cb) return;
        var v = cb.value;
        var i = selected.indexOf(v);
        if (cb.checked && i < 0) selected.push(v);
        if (!cb.checked && i > -1) selected.splice(i, 1);
        apply();
      });
      var add = function () {
        var input = el.querySelector('#popLabelNew');
        var v = (input.value || '').trim();
        if (!v) { input.focus(); return; }
        if (state.labels.indexOf(v) < 0) state.labels.push(v);
        if (selected.indexOf(v) < 0) selected.push(v);
        input.value = '';
        apply();
        el.querySelector('#popLabelList').insertAdjacentHTML('beforeend',
          '<label class="pop-check"><input type="checkbox" value="' + esc(v) + '" checked><span>' + esc(v) + '</span></label>');
        renderSidebar();
      };
      el.querySelector('#popLabelAdd').addEventListener('click', add);
      el.querySelector('#popLabelNew').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); add(); }
      });
    });
  }

  function openRemindPop(anchor, current, onSet) {
    var v = current ? toLocalInput(current) : toLocalInput(Date.now() + 3600000);
    var h = '<div class="pop-title">리마인더</div><div class="rem-form">' +
      '<input type="datetime-local" id="remInput" value="' + v + '">' +
      '<div class="rem-quick"><button data-q="tonight">오늘 저녁 8시</button><button data-q="tomorrow">내일 아침 8시</button><button data-q="week">다음 주 월요일</button></div>' +
      '<div class="rem-actions"><button id="remSave" class="save">' + (current ? '시간 변경' : '알림 설정') + '</button>' +
      (current ? '<button id="remClear">알림 삭제</button>' : '') + '</div></div>';
    showPop(anchor, h, function (el) {
      function setTs(ts) {
        var input = el.querySelector('#remInput');
        input.value = toLocalInput(ts);
      }
      el.querySelectorAll('.rem-quick button').forEach(function (b) {
        b.addEventListener('click', function () {
          var now = new Date(), d = new Date();
          if (b.dataset.q === 'tonight') { d.setHours(20, 0, 0, 0); if (d.getTime() <= now.getTime()) d.setDate(d.getDate() + 1); }
          if (b.dataset.q === 'tomorrow') { d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); }
          if (b.dataset.q === 'week') {
            var add = ((8 - d.getDay()) % 7) || 7;
            d.setDate(d.getDate() + add); d.setHours(9, 0, 0, 0);
          }
          setTs(d.getTime());
        });
      });
      el.querySelector('#remSave').addEventListener('click', function () {
        var input = el.querySelector('#remInput');
        var ts = input.value ? new Date(input.value).getTime() : 0;
        if (!ts || isNaN(ts)) { if (window.Lemon) Lemon.toast('날짜와 시간을 선택해 주세요', 'warn'); return; }
        onSet(ts);
        closePop();
        ensureNotifyPermission();
      });
      var clr = el.querySelector('#remClear');
      if (clr) clr.addEventListener('click', function () { onSet(null); closePop(); });
    });
  }

  function ensureNotifyPermission() {
    try {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        Notification.requestPermission().catch(function () { });
      }
    } catch (e) { }
  }

  /* ---------------- note card actions ---------------- */
  function findNote(id) {
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === id) return state.notes[i];
    return null;
  }
  function touch(n) { n.updated = Date.now(); }

  function handleNoteAct(act, id, el, evt) {
    var n = findNote(id);
    if (!n) return;
    if (act === 'pin') {
      n.pinned = !n.pinned; touch(n); save(); renderAll();
      var card = document.querySelector('.note[data-id="' + id + '"]');
      if (card) { card.classList.add('pin-pop'); }
      if (window.Lemon) { Lemon.hap(8); Lemon.toast(n.pinned ? '위에 고정했어요' : '고정을 풀었어요', 'ok'); }
      return;
    }
    if (act === 'color') {
      openColorPop(el, n.color, function (c) { n.color = c; touch(n); save(); renderAll(); });
      return;
    }
    if (act === 'label') {
      openLabelPop(el, n.labels, function (list) { n.labels = list; touch(n); renderAll(); });
      return;
    }
    if (act === 'remind') {
      openRemindPop(el, n.reminder, function (ts) {
        n.reminder = ts; n.firedAt = 0; touch(n); save(); renderAll();
        if (window.Lemon) Lemon.toast(ts ? remLabel(ts) + '에 알려드릴게요' : '리마인더를 지웠어요', 'ok');
      });
      return;
    }
    if (act === 'toggleItem') {
      var it = null;
      n.items.forEach(function (x) { if (x.id === el.dataset.item) it = x; });
      if (it) { it.done = !!el.checked; touch(n); save(); renderList(); }
      return;
    }
    if (act === 'toggleDone') {
      state.expandedDone[id] = !state.expandedDone[id];
      renderList();
      return;
    }
    if (act === 'filterLabel') {
      state.label = el.dataset.label; state.query = ''; $('#searchInput').value = '';
      renderAll(); scrollTop();
      return;
    }
    if (act === 'unarchive') {
      n.archived = false; touch(n); save(); renderAll();
      if (window.Lemon) Lemon.toast('보관함에서 꺼냈어요', 'ok');
      return;
    }
    if (act === 'restore') {
      n.trashed = false; n.trashedAt = 0; touch(n); save(); renderAll();
      if (window.Lemon) Lemon.toast('메모를 복원했어요', 'ok');
      return;
    }
    if (act === 'purge') {
      confirmModal('메모를 영구 삭제할까요?', '이 메모는 휴지통에서도 사라지고 되돌릴 수 없습니다.', '영구 삭제', function () {
        state.notes = state.notes.filter(function (x) { return x.id !== id; });
        save(); renderAll();
        if (window.Lemon) Lemon.toast('영구 삭제했어요', 'ok');
      });
      return;
    }
    if (act === 'more') {
      openMorePop(el, n);
      return;
    }
  }

  function openMorePop(anchor, n) {
    var h = '<div class="pop-title">' + (n.title ? esc(n.title).slice(0, 26) : '메모') + '</div>' +
      '<button class="menu-item" data-m="edit"><svg class="i"><use href="#i-edit"></use></svg>편집</button>' +
      '<button class="menu-item" data-m="copy"><svg class="i"><use href="#i-copy"></use></svg>복제</button>' +
      '<button class="menu-item" data-m="share"><svg class="i"><use href="#i-link"></use></svg>공유 링크 복사</button>' +
      '<div class="menu-sep"></div>' +
      '<button class="menu-item" data-m="up"><svg class="i"><use href="#i-up"></use></svg>위로 이동</button>' +
      '<button class="menu-item" data-m="down"><svg class="i"><use href="#i-down"></use></svg>아래로 이동</button>' +
      '<div class="menu-sep"></div>' +
      (n.archived
        ? '<button class="menu-item" data-m="unarchive"><svg class="i"><use href="#i-archive-out"></use></svg>보관 해제</button>'
        : '<button class="menu-item" data-m="archive"><svg class="i"><use href="#i-archive"></use></svg>보관함으로</button>') +
      '<button class="menu-item danger" data-m="trash"><svg class="i"><use href="#i-trash"></use></svg>삭제</button>';
    showPop(anchor, h, function (el) {
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-m]');
        if (!b) return;
        var m = b.dataset.m;
        closePop();
        if (m === 'edit') { openEditor(n.id); return; }
        if (m === 'copy') {
          var clone = normalizeNote(JSON.parse(JSON.stringify(n)));
          clone.id = uid(); clone.created = Date.now(); clone.updated = Date.now();
          clone.pinned = false; clone.reminder = null; clone.firedAt = 0;
          clone.title = n.title ? n.title + ' (사본)' : '사본';
          state.notes.unshift(clone); save(); renderAll();
          if (window.Lemon) Lemon.toast('메모를 복제했어요', 'ok');
          return;
        }
        if (m === 'share') { copyShareLink(n); return; }
        if (m === 'up' || m === 'down') { moveNote(n.id, m === 'up' ? -1 : 1); return; }
        if (m === 'archive') { n.archived = true; n.pinned = false; touch(n); save(); renderAll(); if (window.Lemon) Lemon.toast('보관함으로 옮겼어요', 'ok'); return; }
        if (m === 'unarchive') { n.archived = false; touch(n); save(); renderAll(); return; }
        if (m === 'trash') {
          n.trashed = true; n.trashedAt = Date.now(); n.pinned = false; touch(n); save(); renderAll();
          if (window.Lemon) Lemon.toast('휴지통으로 옮겼어요', 'ok');
          return;
        }
      });
    });
  }

  function moveNote(id, dir) {
    var i = state.notes.findIndex(function (n) { return n.id === id; });
    if (i < 0) return;
    var note = state.notes[i];
    var group = state.notes.filter(function (n) {
      return n.pinned === note.pinned && !n.trashed && !n.archived;
    });
    var gi = group.indexOf(note);
    var target = group[gi + dir];
    if (!target) { if (window.Lemon) Lemon.toast('더 옮길 곳이 없어요', 'warn'); return; }
    var ti = state.notes.indexOf(target);
    state.notes.splice(i, 1);
    state.notes.splice(ti, 0, note);
    save(); renderAll();
    var card = document.querySelector('.note[data-id="' + id + '"]');
    if (card) card.classList.add('pin-pop');
  }

  /* ---------------- composer ---------------- */
  var composer = $('#composer'), cmpTitle = $('#cmpTitle'), cmpBody = $('#cmpBody');
  var cmpList = $('#cmpList'), cmpAddItem = $('#cmpAddItem'), cmpImages = $('#cmpImages'), cmpLabels = $('#cmpLabels');

  function blankDraft() {
    return { id: null, title: '', body: '', items: [], images: [], color: 'default', labels: [], pinned: false, reminder: null, firedAt: 0, created: 0 };
  }
  function isDraftEmpty(d) {
    return !d.title.trim() && !d.body.trim() && !d.items.length && !d.images.length && !d.labels.length;
  }
  function expandComposer() {
    if (composer.classList.contains('open')) return;
    composer.classList.add('open');
    autoGrow(cmpBody);
    if (state.draft && state.draft.items.length) { cmpList.hidden = false; cmpAddItem.hidden = false; }
  }
  function autoGrow(el) {
    el.style.height = 'auto';

  /* ---------------- image intake ---------------- */
  function readImage(file, cb) {
    if (!file || !/^image\//.test(file.type)) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1400;
        var w = img.width, h = img.height;
        var scale = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        var out = cv.toDataURL('image/jpeg', 0.82);
        cb({ id: uid('im'), src: out, kind: 'photo' });
      };
      img.onerror = function () { if (window.Lemon) Lemon.toast('이미지를 읽지 못했어요', 'warn'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function addFiles(files) {
    if (!files || !files.length) return;
    var d = state.draft;
    if (!d) { state.draft = blankDraft(); d = state.draft; }
    openComposer({ focus: false });
    var list = Array.prototype.slice.call(files);
    var done = 0;
    list.forEach(function (f) {
      readImage(f, function (im) {
        d.images.push(im); done++;
        renderCmpImages();
        if (done === list.length && window.Lemon) Lemont('사진 ' + done + '장을 붙였어요');
      });
    });
  }

  /* ---------------- sketch ---------------- */
  var sketchCleanup = null;
  function openSketch(cb) {
    openModal({
      title: '손그림 메모',
      sub: '펜으로 그리고 첨부를 누르면 메모에 그림이 붙습니다',
      width: 700,
      body: '<div class="sketch-wrap"><canvas class="sketch-canvas" id="sketchCv"></canvas>' +
        '<div class="sketch-tools">' +
        '<div class="sketch-colors" id="skColors"></div>' +
        '<div class="sketch-sizes" id="skSizes"></div>' +
        '<div class="grow"></div>' +
        '<button class="cmp-done" id="skUndo">실행취소</button>' +
        '<button class="cmp-done" id="skClear">지우기</button>' +
        '</div></div>',
      foot: '<div class="grow"></div><button class="cmp-done" data-cancel>취소</button><button class="cmp-done primary" id="skSave">그림 첨부</button>'
    });
    var cv = $('#sketchCv');
    var wrapW = cv.parentElement.clientWidth;
    var cssW = Math.max(240, wrapW);
    var cssH = Math.round(cssW * 0.6);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.height = cssH + 'px';
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var penColors = ['#1f1f23', '#c9463f', '#e08d00', '#2f8f6b', '#2b6fd0', '#7a4dd6', '#c2418b', '#8a8a94'];
    var curColor = penColors[0], curSize = 4, erasing = false;
    var undoStack = [];
    var drawing = false, lastX = 0, lastY = 0;

    var colorsEl = $('#skColors'), sizesEl = $('#skSizes');
    colorsEl.innerHTML = penColors.map(function (c, i) {
      return '<button data-c="' + c + '" class="' + (i === 0 ? 'on' : '') + '" style="background:' + c + '" aria-label="펜 색"></button>';
    }).join('') + '<button data-erase="1" style="background:repeating-linear-gradient(45deg,#fff,#fff 4px,#ddd 4px,#ddd 8px)" aria-label="지우개"></button>';
    sizesEl.innerHTML = [[2, '가는 펜'], [4, '보통 펜'], [9, '굵은 펜']].map(function (s, i) {
      return '<button data-s="' + s[0] + '" class="' + (i === 1 ? 'on' : '') + '" title="' + s[1] + '"><i style="width:' + (s[0] + 2) + 'px;height:' + (s[0] + 2) + 'px"></i></button>';
    }).join('');

    colorsEl.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      colorsEl.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      if (b.dataset.erase) { erasing = true; }
      else { erasing = false; curColor = b.dataset.c; }
    });
    sizesEl.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      sizesEl.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      curSize = parseInt(b.dataset.s, 10) || 4;
    });

    function snapshot() {
      undoStack.push(cv.toDataURL('image/png'));
      if (undoStack.length > 14) undoStack.shift();
    }
    function pos(e) {
      var r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left), y: (e.clientY - r.top) };
    }
    function down(e) {
      e.preventDefault();
      snapshot();
      drawing = true;
      var p = pos(e);
      lastX = p.x; lastY = p.y;
      ctx.beginPath();
      ctx.arc(p.x, p.y, curSize / 2, 0, Math.PI * 2);
      ctx.fillStyle = erasing ? '#ffffff' : curColor;
      ctx.fill();
      try { cv.setPointerCapture(e.pointerId); } catch (err) { }
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.strokeStyle = erasing ? '#ffffff' : curColor;
      ctx.lineWidth = erasing ? curSize * 2.4 : curSize;
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    }
    function up() { drawing = false; }
    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointerleave', up);
    cv.addEventListener('pointercancel', up);

    function redraw(dataUrl) {
      var img = new Image();
      img.onload = function () {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cssW, cssH);
        ctx.drawImage(img, 0, 0, cssW, cssH);
      };
      img.src = dataUrl;
    }
    $('#skUndo').addEventListener('click', function () {
      var prev = undoStack.pop();
      if (!prev) { if (window.Lemon) Lemon.toast('되돌릴 그림이 없어요', 'warn'); return; }
      redraw(prev);
    });
    $('#skClear').addEventListener('click', function () {
      snapshot();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cssW, cssH);
    });
    $('#skSave').addEventListener('click', function () {
      var data = cv.toDataURL('image/png');
      closeModal();
      cb({ id: uid('im'), src: data, kind: 'draw' });
    });
    sketchCleanup = function () {
      cv.removeEventListener('pointerdown', down);
      cv.removeEventListener('pointermove', move);
    };
  }

  /* ---------------- share ---------------- */
  function sharePayload(n, withImages) {
    return {
      t: n.title, b: n.body, c: n.color, l: n.labels,
      it: n.items.map(function (i) { return [i.text, i.done ? 1 : 0]; }),
      im: withImages ? n.images.map(function (i) { return [i.kind, i.src]; }) : [],
      ts: n.updated || Date.now()
    };
  }
  function encodeShare(n, withImages) {
    if (typeof LZString === 'undefined') return null;
    return LZString.compressToEncodedURIComponent(JSON.stringify(sharePayload(n, withImages)));
  }
  function buildShareLink(n) {
    var enc = encodeShare(n, true);
    var base = location.origin + location.pathname;
    if (!enc) return base + '#memo=';
    var url = base + '#memo=' + enc;
    if (url.length > 16000) {
      enc = encodeShare(n, false);
      url = base + '#memo=' + enc;
      return { url: url, images: false };
    }
    return { url: url, images: true };
  }
  function copyShareLink(n) {
    var r = buildShareLink(n);
    var url = typeof r === 'string' ? r : r.url;
    if (window.Lemon) {
      Lemon.copy(url, (r.images === false) ? '링크를 복사했어요 (용량 때문에 사진은 빠졌어요)' : '공유 링크를 복사했어요');
    }
    return url;
  }
  function decodeShare(str) {
    try {
      var json = null;
      if (typeof LZString !== 'undefined') json = LZString.decompressFromEncodedURIComponent(str);
      if (!json) json = decodeURIComponent(str);
      var p = JSON.parse(json);
      if (!p || typeof p !== 'object') return null;
      return normalizeNote({
        id: uid(),
        title: p.t || '',
        body: p.b || '',
        color: p.c || 'default',
        labels: Array.isArray(p.l) ? p.l : [],
        items: Array.isArray(p.it) ? p.it.map(function (a) { return { id: uid('i'), text: a[0], done: !!a[1] }; }) : [],
        images: Array.isArray(p.im) ? p.im.map(function (a) { return { id: uid('im'), kind: a[0], src: a[1] }; }) : [],
        created: p.ts || Date.now(),
        updated: p.ts || Date.now()
      });
    } catch (e) { return null; }
  }

  /* ---------------- export / import ---------------- */
  function dateStamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function exportNotes() {
    return state.notes.filter(function (n) { return !n.trashed; });
  }
  function noteToMarkdown(n) {
    var out = '';
    out += '## ' + (n.title || '(제목 없음)') + '\n\n';
    if (n.reminder) out += '> 리마인더: ' + fmtDT(n.reminder) + '\n\n';
    if (n.body) out += n.body + '\n\n';
    if (n.items.length) {
      n.items.forEach(function (it) { out += '- [' + (it.done ? 'x' : ' ') + '] ' + it.text + '\n'; });
      out += '\n';
    }
    if (n.images.length) {
      out += n.images.map(function (im) { return '- ' + (im.kind === 'draw' ? '손그림' : '사진') + ' 1장'; }).join('\n') + '\n\n';
    }
    if (n.labels.length) out += '라벨: ' + n.labels.join(', ') + '\n\n';
    out += '<sub>' + fmtDT(n.updated) + ' · ' + COLOR_NAME[n.color] + '</sub>\n\n---\n\n';
    return out;
  }
  function exportAs(kind) {
    var notes = exportNotes();
    if (!notes.length) { if (window.Lemon) Lemon.toast('내보낼 메모가 없어요', 'warn'); return; }
    var name = 'flux-memo-' + dateStamp();
    if (kind === 'json') {
      var data = { app: 'flux-memo', v: 1, exportedAt: new Date().toISOString(), labels: state.labels, notes: notes };
      if (window.Lemon) Lemon.download(name + '.json', JSON.stringify(data, null, 2), 'application/json;charset=utf-8');
      return;
    }
    if (kind === 'md') {
      var md = '# Flux Memo 백업\n\n' + fmtDT(Date.now()) + ' 기준 메모 ' + notes.length + '개\n\n---\n\n' + notes.map(noteToMarkdown).join('');
      if (window.Lemon) Lemon.download(name + '.md', md, 'text/markdown;charset=utf-8');
      return;
    }
    var txt = notes.map(function (n) {
      var line = [];
      if (n.title) line.push(n.title);
      if (n.body) line.push(n.body);
      if (n.items.length) line.push(n.items.map(function (it) { return (it.done ? '[x] ' : '[ ] ') + it.text; }).join('\n'));
      if (n.labels.length) line.push('#' + n.labels.join(' #'));
      return line.join('\n');
    }).join('\n\n----------------\n\n');
    if (window.Lemon) Lemon.download(name + '.txt', txt, 'text/plain;charset=utf-8');
  }
  function importData(text) {
    var data = null;
    try { data = JSON.parse(text); } catch (e) { data = null; }
    if (!data) { if (window.Lemon) Lemon.toast('JSON 파일을 읽지 못했어요', 'err'); return; }
    var rawNotes = Array.isArray(data) ? data : (data.notes || []);
    if (!rawNotes.length) { if (window.Lemon) Lemon.toast('가져올 메모가 없어요', 'warn'); return; }
    var notes = rawNotes.map(normalizeNote);
    var labels = Array.isArray(data.labels) ? data.labels : [];
    function doImport(replace) {
      if (replace) state.notes = notes;
      else state.notes = notes.concat(state.notes);
      labels.forEach(function (l) { if (state.labels.indexOf(l) < 0) state.labels.push(l); });
      state.notes.forEach(function (n) {
        n.labels.forEach(function (l) { if (state.labels.indexOf(l) < 0) state.labels.push(l); });
      });
      save(true); renderAll();
      if (window.Lemon) { Lemon.toast('메모 ' + notes.length + '개를 가져왔어요', 'ok'); Lemon.confetti && Lemon.confetti(); }
    }
    openModal({
      title: '메모 가져오기',
      sub: notes.length + '개 메모를 찾았습니다',
      body: '<p style="margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)">기존 메모 뒤에 이어 붙이거나, 지금 메모장을 이 백업으로 교체할 수 있어요. 교체는 되돌릴 수 없으니 먼저 내보내기로 백업해 두세요.</p>',
      foot: '<div class="grow"></div><button class="cmp-done" data-cancel>취소</button><button class="cmp-done" data-merge>이어 붙이기</button><button class="cmp-done primary" data-replace>전체 교체</button>',
      after: function (body, foot) {
        foot.querySelector('[data-cancel]').addEventListener('click', closeModal);
        foot.querySelector('[data-merge]').addEventListener('click', function () { closeModal(); doImport(false); });
        foot.querySelector('[data-replace]').addEventListener('click', function () { closeModal(); doImport(true); });
      }
    });
  }

  /* ---------------- drag reorder ---------------- */
  var dragId = null;
  function bindDrag() {
    ['#pinnedGrid', '#notesGrid'].forEach(function (sel) {
      var grid = $(sel);
      grid.addEventListener('pointerdown', function (e) {
        var card = e.target.closest('.note');
        if (!card) return;
        var grip = e.target.closest('[data-act="grip"]');
        card.draggable = !!grip;
      });
      grid.addEventListener('dragstart', function (e) {
        var card = e.target.closest('.note');
        if (!card || !card.draggable) { e.preventDefault(); return; }
        dragId = card.dataset.id;
        card.classList.add('dragging');
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); } catch (err) { }
      });
      grid.addEventListener('dragend', function () {
        dragId = null;
        $$('.note').forEach(function (c) { c.classList.remove('dragging', 'drop-before', 'drop-after'); c.draggable = false; });
      });
      grid.addEventListener('dragover', function (e) {
        if (!dragId) return;
        e.preventDefault();
        var card = e.target.closest('.note');
        $$('.note').forEach(function (c) { c.classList.remove('drop-before', 'drop-after'); });
        if (!card || card.dataset.id === dragId) return;
        var r = card.getBoundingClientRect();
        card.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
      });
      grid.addEventListener('drop', function (e) {
        if (!dragId) return;
        e.preventDefault();
        var card = e.target.closest('.note');
        var from = state.notes.findIndex(function (n) { return n.id === dragId; });
        if (from < 0) return;
        var moving = state.notes[from];
        if (!card || card.dataset.id === dragId) { renderList(); return; }
        var target = findNote(card.dataset.id);
        if (!target) return;
        var r = card.getBoundingClientRect();
        var before = e.clientY < r.top + r.height / 2;
        var notes = state.notes.slice();
        notes.splice(from, 1);
        var ti = notes.indexOf(target);
        notes.splice(before ? ti : ti + 1, 0, moving);
        state.notes = notes;
        moving.pinned = target.pinned && !moving.pinned ? true : moving.pinned;
        dragId = null;
        save(); renderAll();
        if (window.Lemon) Lemon.hap(10);
      });
    });
  }

  function fireReminder(n) {
    var text = n.title || (n.items.length ? n.items[0].text : (n.body || '').slice(0, 70)) || '메모';
    if (window.Lemon) { Lemon.toast('리마인더 · ' + text, 'ok'); Lemon.hap(30); }
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        var nt = new Notification('Flux Memo 리마인더', { body: text, tag: 'flux-memo-' + n.id, icon: undefined });
        nt.onclick = function () { try { window.focus(); } catch (e) { } openEditor(n.id); nt.close(); };
      }
    } catch (e) { }
  }
  function checkReminders() {
    var now = Date.now(), changed = false;
    state.notes.forEach(function (n) {
      if (!n.reminder || n.trashed || n.archived || n.firedAt) return;
      if (n.reminder <= now) {
        n.firedAt = now;
        changed = true;
        fireReminder(n);
      }
    });
    if (changed) { save(); renderList(); }
  }

    composer.addEventListener('drop', function (e) {
      e.preventDefault();
      composer.classList.remove('drag-over');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        addFiles(e.dataTransfer.files);
      }
    });

    document.addEventListener('paste', function (e) {
      if (document.activeElement !== cmpBody && document.activeElement !== cmpTitle) return;
      var items = (e.clipboardData && e.clipboardData.items) || [];
      var files = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf('image/') === 0) {
          var f = items[i].getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) { e.preventDefault(); addFiles(files); }
    });
  }
