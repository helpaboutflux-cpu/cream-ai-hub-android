<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SEO:META -->
<title>공유된 페이지 — Soft Hub | Lemon soft</title>
<meta name="description" content="Soft Hub에서 짧은 링크로 공유된 페이지입니다. Lemon Bio·Flux Builder·메모·퀴즈·캘린더 공유 결과를 읽기 전용으로 엽니다.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://helpaboutflux-cpu.github.io/cream-ai-hub-android/view.html">
<!-- /SEO:META -->
<meta name="theme-color" content="#0b0b0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111827'/%3E%3Cpath d='M13 19l6-6M11.5 16.5l-2 2a3.5 3.5 0 0 0 5 5l2-2M20.5 15.5l2-2a3.5 3.5 0 0 0-5-5l-2 2' stroke='%23ffffff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="lemon-ui.css">
<link rel="stylesheet" href="lemon-site.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e4e4e9; --line2: #d4d4dc;
    --fg: #101014; --fg2: #52525b; --fg3: #8b8b96;
    --accent: #4f46e5; --accent2: #6366f1; --soft: rgba(79,70,229,.10);
    --ok: #16a34a;
  }
  html.dark {
    --bg: #08080a; --panel: #0f0f13; --line: #24242c; --line2: #2f2f39;
    --fg: #f4f4f5; --fg2: #a1a1aa; --fg3: #71717a;
    --accent: #6366f1; --accent2: #818cf8; --soft: rgba(99,102,241,.16);
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .bgwrap {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(680px 400px at 10% -8%, rgba(99,102,241,.14), transparent 62%),
      radial-gradient(600px 380px at 96% 100%, rgba(56,189,248,.09), transparent 60%);
  }
  .wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 22px 18px 60px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--fg); }
  .brand__mark { width: 32px; height: 32px; border-radius: 10px; background: #111827; display: grid; place-items: center; color: #fff; }
  .brand__mark svg { width: 17px; height: 17px; }
  .brand__name { font-size: 14px; font-weight: 800; letter-spacing: -.02em; }
  .brand__sub { font-size: 10px; color: var(--fg3); font-weight: 600; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--fg2); font-size: 11.5px; font-weight: 700; text-decoration: none;
  }
  .back:hover { color: var(--fg); }
  .back svg { width: 13px; height: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 24px 60px -46px rgba(0,0,0,.55); overflow: hidden;
  }
  .card__head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .vchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .vchip {
    display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 999px;
    font-size: 10px; font-weight: 800; letter-spacing: .02em;
    background: color-mix(in srgb, var(--line) 45%, transparent); color: var(--fg2);
    border: 1px solid var(--line);
  }
  .vchip--ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  h1 { font-size: 19px; font-weight: 800; letter-spacing: -.03em; margin: 0; overflow-wrap: anywhere; }
  .meta { font-size: 11px; color: var(--fg3); font-weight: 600; margin-top: 4px; }
  .actions { display: flex; gap: 6px; flex: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2);
    background: transparent; color: var(--fg); font-size: 11.5px; font-weight: 800; cursor: pointer;
    text-decoration: none; transition: background-color .16s ease, border-color .16s ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn svg { width: 13px; height: 13px; }
  .btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .body { padding: 20px; }
  .frame { width: 100%; height: 74vh; min-height: 420px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
  .text {
    white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 1.75;
    border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: color-mix(in srgb, var(--line) 18%, transparent);
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 11px; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 12px; text-decoration: none; color: inherit;
  }
  .item:hover { border-color: var(--accent2); }
  .item__main { flex: 1; min-width: 0; }
  .item__t { font-size: 13px; font-weight: 800; letter-spacing: -.02em; overflow-wrap: anywhere; }
  .item__d { font-size: 11.5px; color: var(--fg3); font-weight: 500; overflow-wrap: anywhere; }
  .item__ico { width: 34px; height: 34px; border-radius: 10px; background: var(--soft); color: var(--accent2); display: grid; place-items: center; flex: none; }
  .item__ico svg { width: 16px; height: 16px; }
  .kv { display: flex; flex-direction: column; }
  .kv__row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .kv__row:last-child { border-bottom: 0; }
  .kv__k { width: 108px; flex: none; color: var(--fg3); font-weight: 700; font-size: 11px; }
  .kv__v { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  details { margin-top: 14px; }
  summary { cursor: pointer; font-size: 11.5px; font-weight: 800; color: var(--fg2); }
  pre {
    margin: 8px 0 0; padding: 13px; border-radius: 11px; border: 1px solid var(--line);
    background: color-mix(in srgb, var(--line) 18%, transparent); overflow: auto; max-height: 340px;
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.6;
  }
  .state { padding: 54px 20px; text-align: center; }
  .state__ico { width: 46px; height: 46px; border-radius: 14px; background: var(--soft); color: var(--accent2); display: grid; place-items: center; margin: 0 auto 14px; }
  .state__ico svg { width: 22px; height: 22px; }
  .state__t { font-size: 15px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 5px; }
  .state__d { font-size: 12px; color: var(--fg3); font-weight: 500; max-width: 380px; margin: 0 auto 16px; line-height: 1.6; }
  .spin { width: 16px; height: 16px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 999px; animation: sp .7s linear infinite; margin: 0 auto; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  @media (max-width: 620px) {
    .card__head { padding: 15px 15px 12px; }
    .body { padding: 15px; }
    .frame { height: 68vh; }
    .actions { width: 100%; }
    .actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="bgwrap"></div>
<div class="wrap">
  <div class="top">
    <a class="brand" href="index.html">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>
      </span>
      <span>
        <span class="brand__name">Soft Hub</span><br>
        <span class="brand__sub">Lemon soft</span>
      </span>
    </a>
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      허브로
    </a>
  </div>

  <div class="card" id="card">
    <div id="loading" class="state">
      <div class="spin" style="margin-bottom:14px"></div>
      <div class="state__t">공유 페이지를 불러오는 중</div>
      <div class="state__d">잠시만 기다려 주세요.</div>
    </div>

    <div id="error" class="state hidden">
      <div class="state__ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><circle cx="12" cy="16.3" r=".9" fill="currentColor" stroke="none"></circle></svg>
      </div>
      <div class="state__t" id="errorTitle">공유 페이지를 찾을 수 없습니다</div>
      <div class="state__d" id="errorDesc">링크가 만료되었거나 주소가 잘못되었습니다.</div>
      <a class="btn btn--primary" href="index.html" style="text-decoration:none">Soft Hub 열기</a>
    </div>

    <div id="content" class="hidden">
      <div class="card__head">
        <div style="min-width:0">
          <div class="vchips" id="chips"></div>
          <h1 id="title">공유된 페이지</h1>
          <div class="meta" id="meta"></div>
        </div>
        <div class="actions">
          <button class="btn" type="button" id="copyBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            링크 복사
          </button>
          <a class="btn btn--primary" id="openBtn" href="#" target="_blank" rel="noopener" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            원본 열기
          </a>
        </div>
      </div>
      <div class="body" id="viewer"></div>
    </div>
  </div>
</div>

<script src="lemon-cloud.js"></script>
<script src="lemon-site.js"></script>
<script src="lemon-ui.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KIND_LABEL = {
    page: '공유 페이지', bio: 'Lemon Bio', builder: 'Flux Builder', memo: 'Flux Memo',
    notes: 'Flux Notes', quiz: 'Lemon Quiz', calendar: 'Flux Calendar', docs: 'Flux Docs',
    slides: 'Flux Slides', text: '텍스트', link: '링크'
  };
  var ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg>';
  var ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function safeUrl(u) {
    var s = String(u || '').trim();
    if (!s) return '';
    if (/^(javascript|vbscript|data:text\/html):/i.test(s)) return '';
    return s;
  }
  function getId() {
    var q = new URLSearchParams(location.search);
    var id = q.get('id') || q.get('s') || '';
    if (!id && location.hash) {
      var m = location.hash.match(/id=([A-Za-z0-9]+)/);
      if (m) id = m[1];
      else if (/^#[A-Za-z0-9]{4,24}$/.test(location.hash)) id = location.hash.slice(1);
    }
    return String(id || '').trim();
  }

  function showError(title, desc) {
    $('loading').classList.add('hidden');
    $('content').classList.add('hidden');
    $('error').classList.remove('hidden');
    if (title) $('errorTitle').textContent = title;
    if (desc) $('errorDesc').textContent = desc;
  }

  function renderItems(list) {
    return '<div class="list">' + list.map(function (it) {
      it = it || {};
      var url = safeUrl(it.url || it.href);
      var tag = url ? 'a' : 'div';
      return '<' + tag + ' class="item"' + (url ? ' href="' + esc(url) + '" target="_blank" rel="noopener"' : '') + '>' +
        '<span class="item__ico">' + (url ? ICON_LINK : ICON_SHARE) + '</span>' +
        '<span class="item__main">' +
        '<span class="item__t">' + esc(it.title || it.label || it.name || it.text || '항목') + '</span>' +
        (it.desc || it.description || it.subtitle ? '<span class="item__d">' + esc(it.desc || it.description || it.subtitle) + '</span>' : '') +
        '</span></' + tag + '>';
    }).join('') + '</div>';
  }

  function renderViewer(share) {
    var p = share.payload;
    var viewer = $('viewer');
    var openBtn = $('openBtn');
    var openUrl = '';

    if (typeof p === 'string') {
      if (/<(!doctype|html|body|div|section|style)/i.test(p)) {
        viewer.innerHTML = '<iframe class="frame" sandbox="allow-scripts allow-popups allow-forms allow-modals" src="' + esc('data:text/html;charset=utf-8,' + encodeURIComponent(p)) + '" title="공유된 페이지"></iframe>';
      } else {
        viewer.innerHTML = '<div class="text">' + esc(p) + '</div>';
      }
      return;
    }
    p = p || {};

    if (p.url && !p.html) openUrl = p.url;

    if (p.app && p.hash) openUrl = p.app + p.hash;

    if (p.app && p.hash) {
      /* Bio · Builder 같은 빌더 페이지의 공유 상태를 그대로 띄운다. */
      viewer.innerHTML = '<iframe class="frame" sandbox="allow-scripts allow-popups allow-forms allow-modals" src="' +
        esc(p.app + p.hash) + '" title="공유된 페이지"></iframe>';
    } else if (p.html && typeof p.html === 'string') {
      viewer.innerHTML = '<iframe class="frame" sandbox="allow-scripts allow-popups allow-forms allow-modals" src="' +
        esc('data:text/html;charset=utf-8,' + encodeURIComponent(p.html)) + '" title="공유된 페이지"></iframe>';
    } else if (Array.isArray(p.items) || Array.isArray(p.links)) {
      viewer.innerHTML = renderItems(p.items || p.links);
    } else if (p.url) {
      viewer.innerHTML = '<div class="list"><a class="item" href="' + esc(safeUrl(p.url) || '#') + '" target="_blank" rel="noopener">' +
        '<span class="item__ico">' + ICON_LINK + '</span><span class="item__main">' +
        '<span class="item__t">' + esc(p.title || p.url) + '</span>' +
        '<span class="item__d">' + esc(p.url) + '</span></span></a></div>';
    } else if (p.text || p.body || p.content) {
      viewer.innerHTML = '<div class="text">' + esc(p.text || p.body || p.content) + '</div>';
    } else {
      var rows = Object.keys(p).filter(function (k) {
        var v = p[k];
        return v !== null && v !== undefined && typeof v !== 'object';
      }).slice(0, 14).map(function (k) {
        return '<div class="kv__row"><span class="kv__k">' + esc(k) + '</span><span class="kv__v">' + esc(p[k]) + '</span></div>';
      }).join('');
      viewer.innerHTML = rows ? '<div class="kv">' + rows + '</div>' : '<div class="text">표시할 내용이 없습니다.</div>';
    }

    if (openUrl) {
      openBtn.href = safeUrl(openUrl) || '#';
      openBtn.style.display = '';
      var openB = openBtn;
      openB.target = '_blank';
    }

    var pretty = '';
    try { pretty = JSON.stringify(p, null, 2); } catch (e) { pretty = ''; }
    if (pretty && pretty.length < 120000) {
      var det = document.createElement('details');
      det.innerHTML = '<summary>원본 데이터 보기 (JSON)</summary><pre>' + esc(pretty) + '</pre>';
      viewer.appendChild(det);
    }
  }

  function renderShare(share, source) {
    $('loading').classList.add('hidden');
    $('error').classList.add('hidden');
    $('content').classList.remove('hidden');

    var kind = share.kind || 'page';
    $('chips').innerHTML =
      '<span class="vchip">' + esc(KIND_LABEL[kind] || kind) + '</span>' +
      '<span class="vchip vchip--ok">' + (source === 'cloud' ? '클라우드' : '이 기기') + '</span>' +
      '<span class="vchip">id ' + esc(share.id || getId()) + '</span>';

    $('title').textContent = share.title || (share.payload && (share.payload.title || share.payload.name)) || '공유된 페이지';
    var when = share.created_at || share.ts;
    $('meta').textContent = when ? new Date(when).toLocaleString('ko-KR') : '공유된 페이지';

    renderViewer(share);
  }

  function copyLink() {
    var url = location.origin + location.pathname + '?id=' + encodeURIComponent(getId());
    var done = function (ok) {
      if (window.Lemon && Lemon.toast) Lemon.toast(ok ? '링크를 복사했습니다.' : '복사에 실패했습니다.', ok ? 'ok' : 'err');
      else alert(ok ? '링크를 복사했습니다.' : '복사에 실패했습니다.');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(false); });
    } else {
      try {
        var ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(ok);
      } catch (e) { done(false); }
    }
  }

  function boot() {
    $('copyBtn').addEventListener('click', copyLink);
    var id = getId();
    if (!id) { showError('공유 코드가 없습니다', '주소에 ?id=짧은코드 형태로 붙여 주세요.'); return; }

    if (!window.LemonCloud) { showError('불러올 수 없습니다', '클라우드 모듈을 읽지 못했습니다.'); return; }
    LemonCloud.init().then(function () {
      LemonCloud.getShare(id).then(function (r) {
        if (!r.ok) { showError('공유 페이지를 찾을 수 없습니다', r.error === 'invalid-id' ? '공유 코드 형식이 올바르지 않습니다.' : '링크가 만료되었거나 삭제된 페이지입니다.'); return; }
        renderShare(r.share, r.source);
        if (r.source === 'cloud' && LemonCloud.hitShare) LemonCloud.hitShare(id);
      }, function () {
        showError('불러오지 못했습니다', '네트워크 상태를 확인한 뒤 다시 시도하세요.');
      });
    }, function () {
      showError('불러오지 못했습니다', '클라우드 모듈 초기화에 실패했습니다.');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
