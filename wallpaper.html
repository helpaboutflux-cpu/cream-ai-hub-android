<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemon Wallpaper - 잠금화면 달력 & 디데이 배경화면 메이커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neutral: { 950: '#09090b', 900: '#121215', 850: '#18181b', 800: '#27272a', 700: '#3f3f46' },
            lemon: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .btn-tap { transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-tap:hover { transform: translateY(-1.5px) scale(1.02); }
    .btn-tap:active { transform: scale(0.94); }
    #wallpaperCanvas { max-height: 580px; width: auto; aspect-ratio: 9/19.5; border-radius: 36px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col justify-between antialiased selection:bg-lemon-500 selection:text-neutral-950">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-xl bg-white/75 dark:bg-neutral-950/75 border-b border-neutral-200/80 dark:border-neutral-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-2.5 group">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-lemon-600 to-amber-400 p-[1px] shadow-md group-hover:scale-105 transition-transform">
            <div class="w-full h-full bg-white dark:bg-neutral-900 rounded-[15px] flex items-center justify-center">
              <svg class="w-5 h-5 text-lemon-600 dark:text-lemon-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
              </svg>
            </div>
          </div>
          <div class="flex flex-col">
            <div class="flex items-center space-x-1.5">
              <span class="font-black text-lg tracking-tight">Lemon Wallpaper</span>
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-lemon-100 dark:bg-lemon-950 text-lemon-700 dark:text-lemon-400 font-bold border border-lemon-300 dark:border-lemon-800">잠금화면</span>
            </div>
            <span class="text-[10px] text-neutral-500 -mt-0.5">달력 & 디데이 & 위젯 배경화면 메이커</span>
          </div>
        </a>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="downloadWallpaper()" class="px-3.5 py-1.5 rounded-xl bg-lemon-500 hover:bg-lemon-400 text-neutral-950 font-black text-xs shadow-md shadow-lemon-500/20 flex items-center space-x-1.5 btn-tap">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>고화질 다운로드</span>
        </button>
        <button id="darkModeToggle" class="p-2 rounded-xl border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition btn-tap">
          <svg class="w-4 h-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg class="w-4 h-4 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Studio Layout -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- Left: Controls & Customizer -->
    <div class="lg:col-span-7 space-y-6">
      
      <!-- Preset Ratio -->
      <div class="p-5 rounded-3xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-sm space-y-3">
        <label class="text-xs font-bold text-neutral-400 uppercase tracking-wider">1. 스마트폰 기기 규격</label>
        <div class="grid grid-cols-2 gap-2 text-xs font-bold">
          <button onclick="setRatio('galaxy')" id="ratioBtn-galaxy" class="py-2.5 px-3 rounded-xl border border-lemon-500 bg-lemon-50/50 dark:bg-lemon-950/40 text-lemon-700 dark:text-lemon-300">갤럭시 (1080 x 2400 · 20:9)</button>
          <button onclick="setRatio('iphone')" id="ratioBtn-iphone" class="py-2.5 px-3 rounded-xl border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400">아이폰 (1170 x 2532 · 19.5:9)</button>
        </div>
      </div>

      <!-- Widget Modules Selector -->
      <div class="p-5 rounded-3xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-sm space-y-4">
        <label class="text-xs font-bold text-neutral-400 uppercase tracking-wider">2. 잠금화면 위젯 모듈 선택</label>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs font-bold">
          <button onclick="toggleWidget('calendar')" id="wBtn-calendar" class="p-3 rounded-2xl border border-lemon-500 bg-lemon-50 dark:bg-lemon-950/50 text-lemon-700 dark:text-lemon-300 flex items-center space-x-2">
            <svg class="w-4 h-4 text-lemon-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>이달의 달력</span>
          </button>
          <button onclick="toggleWidget('dday')" id="wBtn-dday" class="p-3 rounded-2xl border border-lemon-500 bg-lemon-50 dark:bg-lemon-950/50 text-lemon-700 dark:text-lemon-300 flex items-center space-x-2">
            <svg class="w-4 h-4 text-lemon-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>디데이 카운터</span>
          </button>
          <button onclick="toggleWidget('quote')" id="wBtn-quote" class="p-3 rounded-2xl border border-lemon-500 bg-lemon-50 dark:bg-lemon-950/50 text-lemon-700 dark:text-lemon-300 flex items-center space-x-2">
            <svg class="w-4 h-4 text-lemon-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>다짐 문구</span>
          </button>
        </div>

        <!-- Detail Inputs for Selected Widgets -->
        <div class="space-y-3 pt-2 text-xs border-t border-neutral-100 dark:border-neutral-800">
          
          <!-- D-Day Settings -->
          <div id="ddaySettingsBox" class="space-y-2">
            <div class="font-bold text-neutral-700 dark:text-neutral-300">디데이 설정</div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="inputDdayTitle" value="2027 대학수학능력시험" placeholder="디데이 제목" oninput="renderCanvas()" class="px-3 py-2 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800">
              <input type="date" id="inputDdayDate" value="2026-11-19" oninput="renderCanvas()" class="px-3 py-2 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 font-bold">
            </div>
          </div>

          <!-- Quote Settings -->
          <div id="quoteSettingsBox" class="space-y-2">
            <div class="font-bold text-neutral-700 dark:text-neutral-300">다짐 문구 / 명언</div>
            <input type="text" id="inputQuote" value="오늘 하루도 최선을 다하자" oninput="renderCanvas()" class="w-full px-3 py-2 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800">
          </div>

        </div>

      </div>

      <!-- Theme & Background Color -->
      <div class="p-5 rounded-3xl border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-sm space-y-3">
        <label class="text-xs font-bold text-neutral-400 uppercase tracking-wider">3. 배경 스타일 & 테마</label>
        
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs font-bold">
          <button onclick="setTheme('black')" id="tBtn-black" class="py-2.5 px-3 rounded-xl border border-lemon-500 bg-neutral-950 text-white text-center">딥 블랙 (OLED)</button>
          <button onclick="setTheme('midnight')" id="tBtn-midnight" class="py-2.5 px-3 rounded-xl border border-neutral-800 bg-gradient-to-b from-slate-900 to-indigo-950 text-white text-center">미드나잇 블루</button>
          <button onclick="setTheme('aurora')" id="tBtn-aurora" class="py-2.5 px-3 rounded-xl border border-neutral-800 bg-gradient-to-b from-purple-950 to-neutral-950 text-white text-center">오로라 퍼플</button>
          <button onclick="setTheme('minimal')" id="tBtn-minimal" class="py-2.5 px-3 rounded-xl border border-neutral-800 bg-neutral-900 text-white text-center">소프트 그레이</button>
        </div>
      </div>

    </div>

    <!-- Right: Live Canvas Phone Mockup Preview -->
    <div class="lg:col-span-5 flex flex-col items-center justify-center space-y-4">
      <div class="text-xs font-bold text-neutral-400">실시간 잠금화면 미리보기</div>
      <canvas id="wallpaperCanvas" width="1080" height="2400" class="border border-neutral-800"></canvas>
      <div class="text-[11px] text-neutral-500 text-center">
        다운로드 후 스마트폰 설정에서 [배경화면 > 잠금화면]으로 지정하세요.
      </div>
    </div>

  </main>

  <!-- Global Footer -->
  <footer class="border-t border-neutral-200/80 dark:border-neutral-800/80 py-8 bg-white/50 dark:bg-neutral-950/50 backdrop-blur-md mt-12 transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-neutral-500 dark:text-neutral-400">
      <div class="flex items-center space-x-2">
        <span class="font-bold text-neutral-800 dark:text-neutral-200">Lemon Wallpaper</span>
        <span>·</span>
        <span>Lemon soft 16대 독립 웹 프로덕트</span>
      </div>
      <div class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-[11px]">
        <a href="index.html" class="hover:underline">Developer Hub</a>
        <span>·</span>
        <a href="money.html" class="hover:underline">Lemon Money</a>
        <span>·</span>
        <a href="wallpaper.html" class="hover:underline text-lemon-500 font-bold">Lemon Wallpaper</a>
        <span>·</span>
        <a href="news.html" class="hover:underline">FLUX News</a>
        <span>·</span>
        <a href="habit.html" class="hover:underline">Lemon Habit</a>
        <span>·</span>
        <a href="bio.html" class="hover:underline">Lemon Bio</a>
        <span>·</span>
        <a href="pdf.html" class="hover:underline">Lemon PDF</a>
      </div>
      <div><span>2026 Lemon soft. All rights reserved.</span></div>
    </div>
  </footer>

  <script>
    let currentRatio = 'galaxy'; // galaxy (1080x2400) or iphone (1170x2532)
    let currentTheme = 'black';
    let activeWidgets = { calendar: true, dday: true, quote: true };

    function setRatio(ratio) {
      currentRatio = ratio;
      document.getElementById('ratioBtn-galaxy').className = ratio === 'galaxy' ? 'py-2.5 px-3 rounded-xl border border-lemon-500 bg-lemon-50/50 dark:bg-lemon-950/40 text-lemon-700 dark:text-lemon-300 font-bold' : 'py-2.5 px-3 rounded-xl border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400 font-bold';
      document.getElementById('ratioBtn-iphone').className = ratio === 'iphone' ? 'py-2.5 px-3 rounded-xl border border-lemon-500 bg-lemon-50/50 dark:bg-lemon-950/40 text-lemon-700 dark:text-lemon-300 font-bold' : 'py-2.5 px-3 rounded-xl border border-neutral-200 dark:border-neutral-800 text-neutral-600 dark:text-neutral-400 font-bold';
      
      const canvas = document.getElementById('wallpaperCanvas');
      if (ratio === 'galaxy') {
        canvas.width = 1080;
        canvas.height = 2400;
      } else {
        canvas.width = 1170;
        canvas.height = 2532;
      }
      renderCanvas();
    }

    function toggleWidget(name) {
      activeWidgets[name] = !activeWidgets[name];
      const btn = document.getElementById('wBtn-' + name);
      if (btn) {
        if (activeWidgets[name]) {
          btn.className = 'p-3 rounded-2xl border border-lemon-500 bg-lemon-50 dark:bg-lemon-950/50 text-lemon-700 dark:text-lemon-300 flex items-center space-x-2';
        } else {
          btn.className = 'p-3 rounded-2xl border border-neutral-200 dark:border-neutral-800 text-neutral-500 flex items-center space-x-2';
        }
      }
      renderCanvas();
    }

    function setTheme(theme) {
      currentTheme = theme;
      ['black', 'midnight', 'aurora', 'minimal'].forEach(t => {
        const btn = document.getElementById('tBtn-' + t);
        if (btn) {
          if (t === theme) btn.classList.add('border-lemon-500');
          else btn.classList.remove('border-lemon-500');
        }
      });
      renderCanvas();
    }

    function renderCanvas() {
      const canvas = document.getElementById('wallpaperCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      // 1. Draw Background
      if (currentTheme === 'black') {
        ctx.fillStyle = '#09090b';
        ctx.fillRect(0, 0, w, h);
      } else if (currentTheme === 'midnight') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(1, '#020617');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      } else if (currentTheme === 'aurora') {
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#2e1065');
        grad.addColorStop(1, '#09090b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      } else {
        ctx.fillStyle = '#18181b';
        ctx.fillRect(0, 0, w, h);
      }

      // 2. Mock Lockscreen Clock Area (Leave room for phone lock screen clock, draw faint time guide)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.font = 'bold 140px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('12:30', w / 2, 420);

      ctx.font = '500 36px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fillText('11월 13일 금요일', w / 2, 490);

      let currentY = 750;

      // 3. Draw D-Day Widget
      if (activeWidgets.dday) {
        const title = document.getElementById('inputDdayTitle').value || '디데이';
        const targetDate = new Date(document.getElementById('inputDdayDate').value || '2026-11-19');
        const now = new Date();
        const diffTime = targetDate - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        const ddayText = diffDays === 0 ? 'D-DAY' : (diffDays > 0 ? `D-${diffDays}` : `D+${Math.abs(diffDays)}`);

        // Glass Box
        roundRect(ctx, 100, currentY, w - 200, 220, 40, 'rgba(255, 255, 255, 0.06)', 'rgba(255, 255, 255, 0.12)');
        
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fde047';
        ctx.font = '900 68px -apple-system, sans-serif';
        ctx.fillText(ddayText, 150, currentY + 115);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 38px -apple-system, sans-serif';
        ctx.fillText(title, 150, currentY + 175);

        currentY += 270;
      }

      // 4. Draw Calendar Widget
      if (activeWidgets.calendar) {
        roundRect(ctx, 100, currentY, w - 200, 620, 40, 'rgba(255, 255, 255, 0.05)', 'rgba(255, 255, 255, 0.1)');

        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'black 40px -apple-system, sans-serif';
        ctx.fillText('2026.11', 150, currentY + 70);

        // Days of week
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const startX = 150;
        const colW = (w - 300) / 7;
        let calY = currentY + 130;

        ctx.textAlign = 'center';
        ctx.font = 'bold 26px -apple-system, sans-serif';
        days.forEach((d, idx) => {
          ctx.fillStyle = idx === 0 ? '#f43f5e' : (idx === 6 ? '#60a5fa' : 'rgba(255,255,255,0.4)');
          ctx.fillText(d, startX + idx * colW + colW / 2, calY);
        });

        calY += 45;
        // Dates grid for 2026.11 (starts on Sunday Nov 1)
        const firstDay = 0; // Sun
        const totalDays = 30;
        let cDay = 1;

        ctx.font = 'bold 28px -apple-system, sans-serif';
        for (let row = 0; row < 5; row++) {
          for (let col = 0; col < 7; col++) {
            if (row === 0 && col < firstDay) continue;
            if (cDay > totalDays) break;

            const x = startX + col * colW + colW / 2;
            const y = calY + row * 65;

            // Highlight Today (Nov 13)
            if (cDay === 13) {
              ctx.fillStyle = '#eab308';
              ctx.beginPath();
              ctx.arc(x, y - 10, 24, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#09090b';
            } else {
              ctx.fillStyle = col === 0 ? '#fb7185' : (col === 6 ? '#93c5fd' : '#ffffff');
            }

            ctx.fillText(String(cDay), x, y);
            cDay++;
          }
        }

        currentY += 670;
      }

      // 5. Draw Quote Widget
      if (activeWidgets.quote) {
        const quote = document.getElementById('inputQuote').value || '';
        roundRect(ctx, 100, currentY, w - 200, 140, 40, 'rgba(255, 255, 255, 0.04)', 'rgba(255, 255, 255, 0.08)');
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.font = '500 34px -apple-system, sans-serif';
        ctx.fillText(quote, w / 2, currentY + 82);
      }
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function downloadWallpaper() {
      const canvas = document.getElementById('wallpaperCanvas');
      const a = document.createElement('a');
      a.download = `lemon-lockscreen-${currentRatio}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const darkToggle = document.getElementById('darkModeToggle');
      if (darkToggle) {
        darkToggle.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
        });
      }
      renderCanvas();
    });
  </script>
</body>
</html>
